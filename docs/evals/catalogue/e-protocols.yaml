- id: "diebold_mariano"
  name: "Diebold–Mariano test with HAC variance and the Harvey–Leybourne–Newbold correction"
  category: "stat_test"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical (original Diebold & Mariano 1995, read as its accepted version, NBER TWP 169 of November 1994; page and section references are to that version). The HLN paper was not accessible, so the correction is taken from R's forecast::dm.test source, opened on 2026-11-12 ('forecast dm.test source'). DM-HLN is a pre-registered sensitivity analysis next to the month-cluster bootstrap (G3), never the deciding test."
  priority: "must"
  plain_english: "A standard test of whether two forecasters have the same expected loss, computed from the series of their loss differences with a variance that allows for serial correlation. The small-sample correction makes it less likely to declare a difference with only 88 event origins. Here it is a sensitivity check next to the month-cluster bootstrap."
  formula: '\Delta_t=L_{\mathrm{ref},t}-L_{\mathrm{cand},t},\quad \bar\Delta=\frac1n\sum_{t=1}^{n}\Delta_t,\quad \hat\gamma_\tau=\frac1n\sum_{t=\tau+1}^{n}(\Delta_t-\bar\Delta)(\Delta_{t-\tau}-\bar\Delta);\qquad \text{irregular origins: }\hat\gamma_\tau=\frac1n\sum_{(s,t):\,j(t)-j(s)=\tau}(\Delta_s-\bar\Delta)(\Delta_t-\bar\Delta),\ j(\cdot)=\text{trading-day index};\qquad \widehat V(\bar\Delta)=\frac1n\Big[\hat\gamma_0+2\sum_{\tau=1}^{h-1}w_\tau\hat\gamma_\tau\Big],\ w_\tau=1\ \text{(DM rectangular, pre-registered)}\ \text{or}\ 1-\tau/h\ \text{(Bartlett fallback if }\widehat V\le0);\qquad DM=\frac{\bar\Delta}{\sqrt{\widehat V(\bar\Delta)}},\qquad S^{*}=DM\Big[\frac{n+1-2h+n^{-1}h(h-1)}{n}\Big]^{1/2}\sim t_{n-1},\qquad p_{\text{one-sided}}=1-F_{t_{n-1}}(S^{*})\ (H_A{:}\ E[\Delta]>0),\quad p_{\text{two-sided}}=2F_{t_{n-1}}(-|S^{*}|)'
  computable_form: 'Δ = L_ref − L_cand per origin, ordered by origin date; n = number of origins. Event series: g[τ] = (1/n) Σ_{t>τ} (Δ_t − Δ̄)(Δ_{t−τ} − Δ̄) for τ = 0..h−1. H1 origins: put x = Δ − Δ̄ on the full trading-day grid with zeros on non-origin days and set g[τ] = (1/n) Σ_s x_s x_{s+τ}, τ = 0..h−1 (our derivation; on a regular series it equals the event form). V = (g[0] + 2 Σ_{τ=1}^{h−1} g[τ])/n; if V ≤ 0, recompute with weights 1 − τ/h on g[τ] and flag the fallback. S = Δ̄/√V · √((n + 1 − 2h + h(h − 1)/n)/n); one-sided p = 1 − (Student-t CDF with n − 1 degrees of freedom at S); two-sided p = 2 × CDF(−|S|). With h = 1 this equals the paired t statistic Δ̄/(s_Δ/√n) with s_Δ computed with ddof = 1 (our derivation, checked numerically).'
  conventions: "Orientation (G1): Δ = L_ref − L_cand per origin, positive favours the candidate; H_A: E[Δ] > 0, so the one-sided p is the upper-tail t(n − 1) probability (in forecast::dm.test pass the reference as e1, the candidate as e2 and alternative = 'greater'); also report the two-sided p. Role: a pre-registered sensitivity analysis next to the month-cluster bootstrap (G3), never the deciding test. Unit: one observation per origin, the per-asset NLL of that origin's forecast averaged over seeds, so the cross-sectional average is taken before testing, as in Gu+ 2020's modified DM, never on stock-level errors. n (G2): 88 pooled origins (the 2024-06-12 CPI and FOMC share one origin, forecast and target and are scored once), 36 FOMC-only and 53 CPI-only with that origin in both; the same for the close-of-day −1 origin. Event series are ordered by day-0 date. Event lags (our inference): h = 1 (lag 0) is primary; checks with h = 2 (lag 1 = the previous origin; 9 distinct-origin pairs share day 1–5 trading days) and with a Bartlett HAC using ⌊4(n/100)^{2/9}⌋ = 3 lags (Newey & West 1994's preliminary rule, the statsmodels default). H1 ordinary-day series (the origins of h1_noninferiority_test, with overlapping 5-day targets): h = 5, DM's k − 1 rule, with lags measured in trading days rather than list positions: γ̂_τ sums over pairs of H1 origins exactly τ trading days apart, τ = 1..4, with divisor n = the number of H1 origins (equivalently, demean, put the values on the full trading-day grid with zeros on non-origin days and take ordinary autocovariances; our derivation); HLN factor with h = 5 and that n. Weights (pre-registered): DM's rectangular window w_τ = 1, which is consistent under (h − 1)-dependence (NBER TWP 169); Bartlett weights 1 − τ/h recover only 68% of the long-run variance of a pure 5-day overlap (1 + 2(0.8² + 0.6² + 0.4² + 0.2²) = 3.4 against 5; our arithmetic), so a nominal 5% one-sided test would reject about 9% of the time. Non-positive variance: DM set it to zero and reject, and dm.test stops at h = 1 and otherwise falls back to h = 1; we instead recompute with Bartlett weights 1 − τ/h (equal to Newey–West's 1 − j/(m + 1) with m = h − 1, and non-negative also on the zero-filled trading-day grid), log the fallback and never reject by default. At h = 1 the weights are irrelevant. Autocovariances are demeaned with divisor n. Distribution-free checks: DM's sign and Wilcoxon signed-rank tests on Δ (they assume independent events). Interpretation: a comparison of the two fitted forecasters' forecasts, not of population models (Diebold 2015); under the G6 fallback (frozen encoders) this is the only reading. Nested arms also go through nested_model_tests."
  inputs: ["per-origin losses of the reference and candidate, seed-averaged, ordered by origin date", "each origin's trading-day index (for H1 origins)", "horizon/lag setting h", "weighting rule (rectangular pre-registered, Bartlett fallback)"]
  guards_against: "Judging a loss difference without accounting for its sampling variability and serial correlation, and small-sample over-rejection with normal critical values."
  typical_values: "HLN factor at h = 1: √((n − 1)/n) = √(87/88) ≈ 0.994 for the 88 pooled origins, so the correction mainly replaces N(0,1) by t(n − 1) (our arithmetic; the verification record gives the same 0.994 for n = 90). Newey & West 1994 preliminary lag ⌊4(T/100)^{2/9}⌋ = 3 for T = 88 (our arithmetic). Bartlett weights 1 − τ/5 on a pure 5-day overlap recover 68% of the long-run variance (our arithmetic). Patton & Sheppard 2009 (2007 WP): DMW statistics with a Newey–West variance using ⌈T^{1/3}⌉ lags and N(0,1). S5 Rahimikia+: modified DM tests (after Gu+ 2020) find CatBoost significantly better than every pre-trained TSFM at 5%. Clark & West 2007 (NBER TWP 326): raw MSPE-normal tests of nested models had median size below 1% at nominal 10% over 48 designs."
  pitfalls: "Raw DM is badly undersized for nested models under recursive estimation (Clark & West 2007), and with a model fit once on a fixed window DM/GW can diverge under the method-level null (McCracken 2020). Too small an h understates variance when windows overlap, and Bartlett weights with truncation h − 1 understate it too (68% for a pure 5-day overlap); the rectangular window can give a negative variance, hence the logged Bartlett fallback. forecast::dm.test takes forecast errors and a power, so per-origin losses must be passed through a device (e1 = L_ref + c, e2 = L_cand + c with c > −min(L), power = 1 and alternative = 'greater'; our device) or the statistic coded directly; dm.test also counts lags in list positions, so code the H1 version directly. Heavy tails in per-event NLL differences make single events influential: add a leave-one-month-out check (our suggestion). The event series is irregularly spaced, so lag 1 means the previous origin, not the previous day. N(0,1) is optimistic at n = 88; use t(n − 1)."
