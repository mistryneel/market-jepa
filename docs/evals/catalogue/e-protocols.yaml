- id: "reality_check_spa_stepm"
  name: "White's Reality Check, Hansen's SPA and Romano–Wolf StepM"
  category: "stat_test"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical (originals: White 2000 at abstract level, with its statistic taken from Hansen 2005; Hansen 2005 and Romano & Wolf 2005 read in part). Scope corrected per review finding audit_EFG#0: these tests ask whether any of many alternatives beats one benchmark, and StepM which ones; 'ours beats every baseline' instead needs every pairwise one-sided test to reject."
  priority: "should"
  plain_english: "When the best of many tried configurations is compared with a benchmark, it can look better just because many were tried. These tests correct for that search: the Reality Check and SPA ask whether any alternative truly beats the benchmark, and StepM says which ones do."
  formula: 'd_{k,t}=L_{0,t}-L_{k,t},\ \bar d_k=\frac1n\sum_t d_{k,t},\ H_0{:}\,\max_k\mu_k\le0;\qquad T^{RC}=\max_k n^{1/2}\bar d_k,\ \text{null draws } \max_k n^{1/2}(\bar d^{*}_k-\bar d_k);\qquad T^{SPA}=\max\Big[\max_k\frac{n^{1/2}\bar d_k}{\hat\omega_k},0\Big];\quad Z^{*}_{k,b,t}=d^{*}_{k,b,t}-g_i(\bar d_k),\ g_l(x)=\max(0,x),\ g_c(x)=x\,\mathbb 1\Big\{x\ge-\sqrt{\tfrac{\hat\omega_k^2}{n}2\log\log n}\Big\},\ g_u(x)=x;\quad T^{SPA*}_b=\max\Big\{0,\max_k\frac{n^{1/2}\bar Z^{*}_{k,b}}{\hat\omega_k}\Big\},\ \hat p=\frac1B\sum_b\mathbb 1\{T^{SPA*}_b>T^{SPA}\};\quad \hat\omega_k^2=\hat\gamma_{0,k}+2\sum_{i=1}^{n-1}\kappa(n,i)\hat\gamma_{i,k},\ \kappa(n,i)=\tfrac{n-i}{n}(1-q)^i+\tfrac{i}{n}(1-q)^{n-i};\qquad \text{StepM: reject } H_{0,r_k}\ \text{if } 0\notin[w_{r_k}-\hat c_{K_i+1},\infty),\ \hat c_{\tilde K}=\inf\Big\{x:\Pr^{*}\big\{\max_{\tilde K\le k\le K}(w^{*}_{r_k}-\theta^{*}_{r_k})\le x\big\}\ge1-\alpha\Big\}'
  computable_form: 'd[k, t] = L_bench[t] − L_k[t]. SPA: studentize each mean with ω̂_k, take the max with 0, build B recentred stationary-bootstrap draws for the lower, consistent and upper centrings, report the three p-values. StepM: order the studentized statistics; reject every hypothesis whose lower bound w − ĉ exceeds 0, where ĉ is the bootstrap (1 − α) quantile of the max centred statistic over hypotheses not yet rejected; recompute ĉ and repeat until no new rejection.'
  conventions: "Orientation (G1): d_{k,t} = L_{0,t} − L_{k,t}, the benchmark's (reference's) loss minus alternative k's (candidate's), so positive favours the alternative, as in Hansen 2005. Role: descriptive (G5); no claim of H1–H4 rests on it. Use cases: (a) data-snooping check that the best trial-ledger variant beats the strongest baseline (the benchmark) on the validation period 2017-01-01..2021-12-31 (G8), or on the locked window only as one pre-registered confirmatory run logged in trial_ledger; (b) StepM to list which variants or baselines significantly beat a reference such as EWMA, with FWER control. To list which baselines our model beats, run StepM on d_k = L_{base_k} − L_ours against a zero benchmark (our derivation; with arch, check its benchmark-minus-model sign convention on a toy example first). Not for 'ours beats every baseline', which is the intersection–union of pairwise one-sided tests (block_bootstrap, h1_noninferiority_test); a non-rejection with our model as the benchmark is not evidence that ours is best. Report SPA's lower, consistent and upper p-values; the consistent one is primary (Hansen 2005; arch docs). Bootstrap (G3): the paired month-cluster resampler of block_bootstrap (clusters = calendar month of day 0 for event origins, of the origin date otherwise; our adaptation, custom code), with ω̂_k² = n times the bootstrap variance of d̄*_k (our adaptation of Hansen's closed form); sensitivity: the stationary bootstrap on the time-ordered losses with q = 1/b̂_SB from Politis–White with the 2009 correction (arch). Studentize; B = 10,000 (arch's default reps = 1,000 is too few for final numbers; our recommendation). Fix the alternative set from the trial ledger in advance. The StepM algorithm and notation follow Romano & Wolf's UPF WP 712 (October 2003); White's RC statistic is taken from Hansen 2005."
  inputs: ["loss series of the benchmark and of every alternative on common periods or events", "fixed alternative set (from trial_ledger)", "bootstrap scheme, block length, B and RNG seed"]
  guards_against: "Data snooping: crediting the best of many tried configurations with a superiority that comes from the search itself."
  typical_values: "Laurent+ 2012 (2010 WP): SPA at the 0.10 level with six simple benchmarks over 125 MGARCH models; DCC with leverage (EGARCH marginals) is reported as the hard-to-beat SPA benchmark, though the extracted Table 9 shows some consistent p-values below 0.10 under Stein (check the JAE version). Hansen 2005: theory needs q_n → 0 and n·q_n² → ∞. arch: reps default 1,000."
  pitfalls: "When the benchmark is nested in all alternatives and parameters are estimated recursively, SPA's normality fails (Hansen 2005). RC is sensitive to poor and irrelevant alternatives; SPA's studentization and recentring reduce this. Many near-duplicate variants change power, so fix the alternative set in advance. A stationary bootstrap on irregularly spaced events is an approximation."
  used_by:
    - ref: "White 2000"
      title: "A reality check for data snooping"
      authors: "White, H."
      year: 2000
      venue: "Econometrica, 68(5), 1097–1126"
