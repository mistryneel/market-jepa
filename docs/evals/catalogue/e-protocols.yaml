# Evaluation catalogue for the market world model paper, section E: Protocols and statistical hygiene (16 of 125 entries).
# The catalogue is one file per section of the brief, a-risk.yaml to g-benchmarks.yaml in docs/evals/catalogue/,
# because the repository rejects committed files of 1 MB or more. Concatenate the files in name order for the
# full list; ids are unique across files.
# Generated 2026-11-12 from verified research records; every used_by source was opened on 2026-11-12.
# Defaults approved 2026-11-25: entries follow docs/evals/README.md ("Adopted defaults"); questions still open are in docs/evals/PROGRESS.md.
# Schema: the brief's schema plus the extensions documented in docs/evals/README.md ("Schema extensions"):
#   section (A-G), priority (must/should/nice/drop), status_note, computable_form, conventions, related,
#   status values our_design/reference/gap, categories baseline/dataset,
#   used_by[].ref/source_type/read_depth/version_read/accessed, benchmark fields used_by_papers/fit_for_us.
# Sources are listed in docs/evals/references.md (same labels as used_by[].ref).
- id: "walk_forward"
  name: "Walk-forward evaluation with fixed-length rolling refits (expanding window as a robustness check)"
  category: "protocol"
  section: "E"
  status: "widely_used"
  status_note: "Widely used (G14): rolling-origin evaluation with periodic refits is used by the peer-reviewed 2026 seeds S1 (32 evaluation months, each scored by learned models trained only on the preceding six months; frozen time-series foundation models exempt) and S12 (yearly expanding recalibration), by the preprint S5 (yearly expanding refits) and the blog S16, and in covariance forecasting by Laurent+ 2012, Bollerslev+ 2018, Ledoit & Wolf 2017 and Engle+ 2019 (fixed-length rolling windows). No originating paper was found, so the entry is not canonical; Tashman 2000 is cited as a review (abstract read on 2026-11-12 from the IAOR record https://iaorifors.com/paper/33593; full text not read). Gu+ 2020 is the classic annual-refit split (NBER WP 25398 read). The rule that refits use fixed-length rolling windows for valid conditional tests comes from Giacomini & White 2006 (2003 working paper read). Window length, refit calendar, 5-trading-day cutoff, early-stopping block and fallback are global decisions G6–G8."
  priority: "must"
  plain_english: "Retrain every model twice a year, each time on the most recent ten years of data ending five trading days before the retraining date, and score it only on forecasts made from that date until the next retraining, so every score is a genuine out-of-sample forecast. Keeping the window length fixed is what lets the with/without-event-input comparison be tested formally."
  formula: 'c_j=s_j-5,\qquad w_j=c_j-m+1,\quad m=2520;\qquad \mathcal T_j(H,L)=\{t:\ w_j+L-1\le t\le c_j-H\};\qquad \mathcal T^{\mathrm{es}}_j=\{t\in\mathcal T_j:\ \mathrm{date}(t)>\mathrm{date}(c_j)-6\ \text{months}\},\ e_j=\min\mathcal T^{\mathrm{es}}_j,\ \mathcal T^{\mathrm{fit}}_j=\{t\in\mathcal T_j:\ t+H\le e_j-5\};\qquad \hat\theta_j=\arg\min_{\theta}\sum_{t\in\mathcal T^{\mathrm{fit}}_j}\ell(\theta;t)\ \text{(stopping step chosen on }\mathcal T^{\mathrm{es}}_j\text{)};\qquad \hat\Sigma_{t_e}=f\big(\mathcal I_{t_e};\hat\theta_{j(e)}\big),\ j(e)=\max\{j:\ s_j\le t_e\};\qquad \mathcal T^{\mathrm{exp}}_j=\{t:\ t_{\min}+L-1\le t\le c_j-H\}\ \text{(robustness only)}'
  computable_form: 'for each refit j (s_j by the G6 rule, in the validation and locked periods alike): c = s_j − 5 and w = c − 2,519 (trading-day indices); for each trained arm and seed: build training samples whose every input, label and pretraining-target timestamp lies in [w, c], i.e. origins w + L − 1 ≤ t ≤ c − H; the early-stopping block holds the origins dated after date(c) minus six calendar months, and fitting origins satisfy t + H ≤ e − 5, e = the first block origin; assert from each loader''s manifest that every timestamp read lies in [w, c]; fit, stopping on the block; re-estimate baselines that have estimated parameters on their own windows ending at c; then for each origin t_e with s_j ≤ t_e < s_{j+1}: forecast with refit j''s parameters from inputs up to the close of t_e (estimator baselines from their own lookback ending at that close); save (model, arm, seed, refit_id, origin, w, c, config_hash).'
  conventions: "(1) Time: trading days on one pinned NYSE calendar; s_j − k means k trading days before s_j. Origin t is the close of day t; the target uses days t+1..t+H, H = 5 for the primary design (close of day 0, days 1–5) and H = 6 for the secondary design (close of day −1, days 0–5). (2) Refit dates (G6): s_j = the first trading day on or after 1 January and on or after 1 July of each year, shared by every model and arm. Nine serve the locked window: 2022-01-03, 2022-07-01, 2023-01-03, 2023-07-03, 2024-01-02, 2024-07-01, 2025-01-02, 2025-07-01 and 2026-01-02. The same rule runs through the validation period 2017–2021, whose forecasts are produced by this procedure (G8; baseline_tuning_parity). Refit j serves every origin t with s_j ≤ t < s_{j+1}, by origin date (a day −1 origin uses the refit in force on day −1). (3) Cutoff (G6, G7): every fit reads data only up to the close of c_j = s_j − 5, so all training inputs, labels and pretraining targets end at least 5 trading days before the first origin the fit serves; for s_1 = 2022-01-03, c_1 = 2021-12-27 (our count; the NYSE was closed on 2021-12-24). (4) Window (G6): W_j = the m = 2,520 trading days w_j = c_j − m + 1, …, c_j, identical for every refit and every trained arm (the four arms (pre, v) and (sup, v), v ∈ {0, 1}, of matched_supervised_comparator and the untrained floor). Every training sample of refit j lies inside W_j, so with an input context of L trading days the training origins are w_j + L − 1 ≤ t ≤ c_j − H, that is m − H − L + 1 origins; normalisation statistics are computed on W_j; point-in-time universe membership (G10) may use earlier history. Expanding windows are a labelled robustness check only. (5) Early stopping (G8): the block is the training origins dated after date(c_j) minus six calendar months; fitting samples end at least 5 trading days before the first block origin e_j (t + H ≤ e_j − 5; our reading of G8's 5-trading-day purge, the same gap as the cutoff); for pretraining samples 'label' means the prediction target. Every neural stage that early-stops uses this block and keeps the model at the selected step, without refitting on the block. The rule (block, gap, stopping metric, patience) is fixed on the validation period and applied unchanged at every refit. (6) What is refit (primary, G6): at every s_j, for every trained arm and each of the K = 5 paired seeds (seed_vs_period), the whole method: encoder pretraining, event-input pathway, covariance heads and normalisation statistics; the v = 0 arms are retrained end to end with the null event token (G9). (7) Secondary design: each trained arm has a separate H = 6 covariance head, trained with 6-day labels on top of the arm's own encoder and event pathway (held fixed), with the same window, refits, seeds and early-stopping rule; baselines produce their 6-day-average forecast as their own entries specify (e.g. dcc_family averages r = 1..6). (8) Baselines: those with estimated parameters (e.g. the GARCH and (a, b) stage of DCC-NL, dcc_family) are re-estimated at every s_j on their own pre-registered windows ending at c_j, and between refits their filters run to each origin's close with that refit's parameters; estimator baselines (e.g. EWMA, QIS, the fundamental factor model) are recomputed at every origin from their own lookback ending at the origin close. (9) Frozen choices: hyper-parameters, every model's tuning parameters and the PD-repair ε are fixed on the validation period (G8, G12) and never re-tuned at refits. (10) Fallback (G6), allowed only if written into the plan before unlocking: if encoder pretraining cannot be refit, freeze every arm's encoder and event pathway at the last refit dated before 2022 (2021-07-01) and refit only the covariance heads of all arms at every later s_j; DM and bootstrap results are then comparisons of fitted forecasters and the Giacomini–White method-level claim is dropped (McCracken 2020). (11) Public foundation models with fixed weights are scored only on origins at least 5 trading days after their documented pretraining-data end (Kronos: June 2024), or reported separately (G7; pretraining_overlap_audit). (12) In-window refits are part of the frozen procedure and may use earlier locked-window data; no human decision may depend on locked-window results."
  inputs: ["daily return panel on the point-in-time universe (G10), delisting returns included (G11)", "pinned NYSE trading calendar and event calendar with forecast origins t_e", "refit dates s_j from the G6 rule (first trading day on or after 1 January and 1 July)", "window length m = 2,520 trading days and the 5-trading-day cutoff", "label horizon H (5, or 6 for the day −1 origin) and each model's input context length L", "frozen hyper-parameters and early-stopping rule per model (baseline_tuning_parity)", "shared seed list, K = 5 (seed_vs_period)"]
  guards_against: "Look-ahead from fitting on data after the forecast origin, stale models carried across regimes, and invalid nested-model inference from expanding-window or fit-once estimation."
  typical_values: "Ours (G6): m = 2,520 trading days (about 10 years), refits on the first trading day on or after 1 January and 1 July, data cutoff 5 trading days before each refit; nine refits serve the locked window. Gu+ 2020 (NBER WP): 18 years of training (1957–1974), 12 of validation (1975–1986) and 30 of testing (1987–2016); refit once a year, training grows by one year per refit and the 12-year validation window rolls forward. S1 Market-1T: 32 evaluation months, each learned model trained only on the preceding 6 months (frozen time-series foundation models exempt); volatility-change IC decays by about 20% (spread change about 10%) over five years. S5 Rahimikia+: yearly expanding refits from 1990, out of sample 2001–2023 (23 models); zero-shot public TSFMs keep one checkpoint. S12 Bongiorno+: yearly expanding recalibration, 24 yearly models each trained 10 times. Laurent+ 2012 (2010 WP): rolling 2,740-day window re-estimated every 22 days, 2,486 one-day forecasts (Jan 1999–Dec 2008). Bollerslev+ 2018 (2016 WP): daily re-estimation on a rolling 1,000-day window (N = 10). Ledoit & Wolf 2017: rolling 250-day window re-estimated every 21 trading days, Jan 1973–Dec 2011. Engle+ 2019: rolling 1,250-day window with monthly updating, Jan 1986–Dec 2015."
  pitfalls: "Expanding windows void Giacomini–White's asymptotics, and a model estimated once on a fixed window can make DM/GW statistics diverge under the null (McCracken 2020); this is why the frozen-encoder fallback drops the GW method-level claim. A training label or pretraining target that reaches past c_j breaks the 5-trading-day cutoff (G6, G7), and one that reaches s_j or later leaks forecast-period returns; assert the cutoff from the loaders' manifests, not from configs. Counting m in training origins instead of data days shifts every window by H + L − 1 days; m counts data days. Walk-forward tests one historical path, which repeated design changes can overfit, and its result depends on the order of the data (López de Prado 2018 WP): keep all tuning in the validation period and log it (trial_ledger). With nine locked-window refits, year and refit effects are confounded (regime_reporting). Public foundation-model baselines pretrained into the locked window cannot be refit point in time (G7; pretraining_overlap_audit). In S16 a first-pass single-month backtest showed +102 bps/trade at the 16-hour horizon (model not named); under a 4-month expanding walk-forward the linear baseline netted only about +1 bp/trade and JEPA was negative at most horizons, so one split is not enough. Cost scales with refits × seeds × arms: 19 refits (10 in the validation period, 9 in the locked window) × K = 5 seeds × 5 trained arms in the primary design (our arithmetic)."
