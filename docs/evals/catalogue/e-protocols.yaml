      how_used: "original definition: AFML §12.4 Combinatorial Purged CV (Combinatorial Splits p.164, CPCV algorithm p.165), located from Wiley's table of contents; the book text was not read, so the counts and path assembly are taken from López de Prado 2018 WP."
