- id: "power_mde"
  name: "Power and minimum-detectable-effect analysis from pre-2022 per-event NLL differences"
  category: "protocol"
  section: "E"
  status: "emerging"
  status_note: "Kept emerging: S10 Gençay (2026) recommends sizing evaluation windows by power (t ≈ SR·√years). The MDE recipe below (analytic approximation and month-cluster simulation) and the uniform-scale plausibility bound are our derivations; the inputs are official event counts and the 2017–2021 validation forecasts (G8). S2's event-blind latent result motivates event inputs but is not a power input. The core recipe is our derivation, not a checked source formula; verified = true records only that every cited source was opened."
  priority: "must"
  plain_english: "Before opening the test window, estimate the smallest improvement the primary test could reliably detect with its 88 event origins (89 events), using how much per-origin loss differences vary in the 2017–2021 validation forecasts. If the plausible effect is smaller than that, the design must change or the result be read as underpowered."
  formula: '\Delta_e=L^{(\mathrm{pre},0)}_e-L^{(\mathrm{pre},1)}_e;\qquad \widehat{\mathrm{MDE}}=(z_{1-\alpha}+z_{1-\beta})\,\widehat{SE}_{\mathrm{test}},\quad z_{0.95}+z_{0.80}\approx2.487;\qquad \widehat{SE}_{\mathrm{test}}=\mathrm{sd}_b\Big(\frac{\sum_{g=1}^{C_{\mathrm{test}}}T^{\mathrm{val}}_{c^{*}_{b,g}}}{\sum_{g=1}^{C_{\mathrm{test}}}n^{\mathrm{val}}_{c^{*}_{b,g}}}\Big),\ T^{\mathrm{val}}_c=\sum_{e\in c}\Delta_e,\ c^{*}_{b,g}\overset{iid}{\sim}\mathrm U(\text{validation event-months}),\ C_{\mathrm{test}}=53;\qquad \widehat{\mathrm{Power}}(\delta)=\frac1R\sum_{r=1}^{R}\mathbb 1\{\mathrm{LB}_{95,r}>0\},\ \mathrm{LB}_{95,r}=Q_{0.05}\big(\{\bar\Delta^{*}_{r,b}\}_{b=1}^{B_{\mathrm{inner}}}\big)\ \text{on pseudo-window } r \text{ built from } \tilde\Delta_e+\delta,\ \tilde\Delta_e=\Delta_e-\bar\Delta_{\mathrm{val}};\qquad \Delta_{\mathrm{scale}}(c)=c-1-\log c'
  computable_form: 'From the validation forecasts (day 0 in 2017-01-01..2021-12-31, targets ending by 2021-12-31): Δ[e] = L(pre,0)[e] − L(pre,1)[e] per pooled origin, each arm''s losses averaged over its K = 5 seeds first, and month[e] = calendar month of day 0 → month sums T and counts n. SE_test = SD over b of the origin-weighted mean of 53 months drawn with replacement; MDE_analytic = 2.487·SE_test. For δ > 0 on a grid: build R pseudo-windows of 53 months from Δ − mean(Δ) + δ; on each, run the paired month-cluster bootstrap (B_inner ≥ 2,000) and take LB_95 = the 5th percentile of the bootstrap means; power(δ) = share of windows with LB_95 > 0; MDE = smallest δ with power ≥ 0.8; size check: the share with LB_95 > 0 at δ = 0 should be near 0.05.'
  conventions: "Our derivation and design. Sign (G1): Δ_e = L_ref,e − L_cand,e; for the primary H2 contrast Δ_e = L_e^(pre,0) − L_e^(pre,1) (matched_supervised_comparator), positive favouring event inputs, and δ > 0 is a true mean gain. Inputs (G8): walk-forward forecasts of the validation period (refits by the G6 rule) built exactly like the locked test (origin, target, universe, PD repair, failure rule, K = 5 seeds averaged per arm); validation origins have day 0 in 2017-01-01..2021-12-31 and targets ending on or before 2021-12-31, and a CPI release and an FOMC decision on the same day form one origin (G2). If the event-input arm does not exist yet, use the closest available pair (e.g. (pre, 0) vs the strongest baseline) for the variance only, and label it. Clusters (G3): calendar month of day 0. SE_test comes from pseudo-test windows of C_test = 53 months drawn with replacement from the validation event-months, mirroring the locked window's 88 origins in 53 months (35 months with two origins and 18 with one; our count from the official calendars); FOMC-only runs draw 36 months from the validation FOMC months and CPI-only runs 53 from the validation CPI months (in the locked window every FOMC and every CPI origin has its own month). Simulation power: recentre the validation differences, add δ, run the pre-registered paired month-cluster bootstrap on each pseudo-window (B_inner ≥ 2,000 for speed; the real test uses B = 10,000), R ≥ 1,000 windows per δ; a window detects the effect iff its one-sided 95% percentile lower bound LB_95 > 0 (G1); MDE = smallest δ with power ≥ 0.8; the detection rate at δ = 0 doubles as a size check of the 53-cluster test. Report the MDE in per-asset NLL units (nats per asset), as a percentage of mean |Δ|, and next to a plausibility scale: a forecast blind to a uniform variance increase by factor c loses Δ_scale(c) = c − 1 − log c nats per asset against one that rescales perfectly (our derivation from the per-asset NLL), i.e. 0.0032 for a 4% volatility rise (c = 1.04²) and 0.019 for a 10% rise (c = 1.1²). Repeat for FOMC-only (36 origins), CPI-only (53), and the key secondaries (pre, 1) vs (sup, 1) and pretrained vs untrained floor; their Holm family has four tests (G5), so report their power at the first Holm threshold α/4 = 0.0125 (LB at the 1.25th percentile) and at α = 0.05, which bound the Holm-adjusted power (our derivation). Repeat also for the high- and low-volatility halves of the validation event-months, split at the median of the month-mean v of regime_reporting (our choice). H1 (G4): on validation ordinary-day origins (clusters = calendar month of the origin; pseudo-windows with as many months as the locked window has months with H1 origins, counted from the calendar before unlocking) report, for each strong-set member and each co-primary, the probability that LB_95 > −δ_NLL (or −δ_GMV) when the true mean gain is 0, and the joint probability that all eight bounds pass in the same pseudo-window (intersection–union). Pre-register the MDE and the planned response if the expected gain is below it (e.g. add pre-2017 events, which lie outside the validation period, as a labelled secondary analysis). Never use locked-window data."
  inputs: ["validation-period (2017–2021) per-origin loss differences for the primary contrast (or a labelled proxy pair), seed-averaged", "validation event calendar with day-0 month keys", "α = 0.05, target power 0.8, C_test = 53 (36 FOMC-only, 53 CPI-only)", "grid of effect sizes δ > 0", "validation ordinary-day loss differences against each strong-set member and the H1 margins (H1 power)"]
  guards_against: "Running an underpowered confirmatory test whose non-rejection is uninformative, and post hoc rationalisation of a null result."
  typical_values: "Locked window: 36 FOMC + 53 CPI = 89 events on 88 distinct origins (CPI and FOMC share 2024-06-12) in 53 event-months, 35 with two origins and 18 with one, none in November 2025; 19 CPI–FOMC pairs within 7 calendar days, 10 of which share day 1–5 trading days (FOMC calendar, BLS CPI schedule; our count). Savor & Wilson 2013 (Nov 2011 draft read): realized daily market volatility only about 4% higher on announcement days pooling inflation (CPI to Jan 1971, then PPI), employment and scheduled FOMC releases (1958–2009); a day-0 figure, not specific to CPI or FOMC. Bernanke & Kuttner 2005 (FEDS 2004-16 working paper read): equity returns about 10% more volatile on policy event days (June 1989–Dec 2002). S10 Gençay: t ≈ SR·√years, so a true Sharpe of 0.6 needs about 11 years of out-of-sample data to reach t ≈ 2 and four-year windows cannot certify moderate edges. S15 Li+: size and power of its event-window test set by Monte Carlo (100,000 replications, 1,000 bootstrap draws). z_{0.95} + z_{0.80} = 1.645 + 0.842 = 2.487 (our arithmetic)."
  pitfalls: "Pre-2022 variability may differ from 2022–2026: report MDEs for the high- and low-volatility halves of the validation event-months. Using any locked-window data to size the test breaks the lock. Documented announcement effects on second moments are modest, and those day-0 uplifts need not carry over to days 1–5, so plausible gains may sit below the MDE. S2's event-blind latent effect size is not a power input. Shared event dates break independence (MacKinlay 1997's aggregation formulas assume non-overlapping windows), so simulate with month clusters, not iid events, and count a same-day CPI and FOMC origin once. Subgroup and key-secondary contrasts have less power, and the key secondaries also face Holm; do not pre-register subgroup claims the MDE shows to be underpowered. H1's intersection–union needs all eight bounds to pass, so its joint power is below that of any single comparison."
  used_by:
    - ref: "S10"
      title: "What survives honest evaluation? Leakage-safe, search-aware assessment of LLM-driven trading strategy discovery"
      authors: "Gençay"
      year: 2026
      venue: "arXiv:2608.27734"
