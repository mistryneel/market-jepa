- id: "baseline_tuning_parity"
  name: "Same validation data, logged tuning budget and post-processing for every baseline"
  category: "protocol"
  section: "E"
  status: "our_design"
  status_note: "Our design, added after review finding completeness#18. Precedents: S1 gives every method the same defaults-plus-grid search on tuning months; S16 requires baselines with identical features and tuning budget; S7 matches epochs; S11, S5 and S3 show the asymmetries the rule prevents. The validation period, early-stopping block and ε rule come from global decisions G8 and G12. The protocol itself is ours; verified = true records only that every precedent cited was opened and checked."
  priority: "must"
  plain_english: "Every model is tuned on the same 2017–2021 validation forecasts with a comparable, logged tuning budget, and every baseline gets any post-processing our model gets. Otherwise a win can come from a better-tuned or better-treated model rather than a better idea."
  formula: '\hat c_k=\arg\min_{c\in\mathcal C_k}\bar L^{V}_k(c),\quad \bar L^{V}_k(c)=\frac{1}{|V|}\sum_{t\in V}L_{k,t}(c),\quad V=\{t\ \text{day-0 event or ordinary-day origin}:\ t\ge\text{2017-01-01},\ t+5\le\text{2021-12-31}\};\qquad (\hat\lambda,\hat\varepsilon)=\arg\min_{\lambda\in\Lambda,\ \varepsilon\in\{10^{-4},\,3\cdot10^{-4},\,10^{-3},\,3\cdot10^{-3},\,10^{-2}\}}\bar L^{V}_{\mathrm{EWMA}}(\lambda,\varepsilon);\qquad \rho_k=\frac{N^{\mathrm{cfg}}_k}{N^{\mathrm{cfg}}_{\mathrm{ours}}},\qquad \rho^{\mathrm{GPUh}}_k=\frac{\mathrm{GPUh}_k}{\mathrm{GPUh}_{\mathrm{ours}}}'
  computable_form: 'Step 1: for every (λ, ε) in EWMA''s λ grid × the ε grid, score EWMA''s mean per-asset NLL over V and log it; keep the argmin and freeze ε for every model. Step 2: for each other model k and each configuration c in its declared grid C_k: produce walk-forward forecasts on V (walk_forward; refits by the G6 rule), pass every forecast through the shared post-processing (PD repair with the frozen ε, and any shared blend), score the mean per-asset NLL over V with equal weight per origin and log it to the trial ledger; select the argmin (ties to the configuration listed first; configurations with any failure on V excluded). Step 3: compute the H1 margins from the selected models (h1_noninferiority_test). Step 4: compute the MDE (power_mde). Report N_cfg, GPU-hours and ρ_k per model.'
  conventions: "Our design. Validation set V (G8; the 'pre-2022 validation origins' of every entry): origins dated on or after 2017-01-01 whose target ends on or before 2021-12-31, of the same kinds as the locked test: FOMC/CPI close-of-day-0 origins (a CPI release and an FOMC decision on the same day form one origin, G2) and ordinary-day origins under G4's rule (no FOMC/CPI day 0 in {t−1, …, t+5}; stocks with their own earnings in [t, t+5] dropped from that origin's asset set). Day −1 origins of the secondary design are scored on the same period for reporting; the H = 6 heads reuse the H = 5 selections. Universe, Σ*, asset sets, missing-data rules and PD repair are those of the test (G10–G12). Every model is scored on V out of sample by walk_forward (G6 refit calendar, m = 2,520, 5-trading-day cutoff); estimator baselines are recomputed at each origin from their own lookback. Selection criterion, identical for every model: mean per-asset NLL over V with equal weight per origin (H = 5), GMV variance reported alongside; ties go to the configuration listed first; a configuration that fails (G13) at any origin of V is not selectable and is logged. Freezing order, each step frozen in the plan before the next: (1) EWMA's λ and the shared PD-repair ε, chosen together on V over the λ grid × {1e-4, 3e-4, 1e-3, 3e-3, 1e-2}, so ε is the grid value that minimises EWMA's mean validation NLL at its tuned λ (G12; our operationalisation); ε is then fixed for every model; (2) every other baseline's declared grid and our hyper-parameters, with ε fixed; (3) the H1 margins from the selected models: δ_NLL = half the mean per-asset NLL gap between EWMA and the best member of the strong set on V's ordinary-day origins, δ_GMV = log(1.05) (G4); (4) the MDE (power_mde). Early stopping for every neural arm and seed uses the last six calendar months of each refit window, after a 5-trading-day gap (G8; walk_forward), so it never reads data after the refit's cutoff; its rule (metric, patience) is fixed on V. Search spaces C_k are declared in the plan per model (e.g. EWMA λ; shrinkage target; DCC-NL estimation window; number of factors and factor-covariance half-life; GARCH variant; naive trailing window); every grid is evaluated in full and logged (trial_ledger); report N_cfg, compute and ρ_k, noting where ρ_k < 1 because a small grid was exhausted. Post-processing parity: one shared function applies the PD repair to every forecast; any blend toward a naive or shrinkage target tuned for our model is offered to and tuned for every baseline on V, or removed from ours. Refit parity: all trained arms of the 2×2 and the untrained floor share the refit calendar, window m and cutoff (walk_forward); baselines with estimated parameters (e.g. DCC-NL's GARCH and (a, b) stage) use the same refit calendar and cutoff with their own pre-registered windows, which does not breach parity because no baseline enters a nested Giacomini–White contrast with our arms. H2 comparator parity: the four arms of matched_supervised_comparator match parameter count, data, seeds (K = 5), data order, compute budget and tuning budget, and the v = 0 arms replace every event-derived input with the null token in pretraining and fine-tuning while keeping generic calendar features (G9). Readout parity: baselines are scored in their standard form unless our model gets the same readout (S1's caveat). Publish a parity table: search space, N_cfg, compute, selected configuration and post-processing per method."
  inputs: ["declared search space per model", "validation set V (2017–2021 origins, forecasts from walk_forward)", "trial ledger", "shared post-processing module with the frozen ε", "compute logs"]
  guards_against: "Inflated gains from under-tuned or handicapped baselines, or from post-processing given only to our model."
  typical_values: "S1 Market-1T: each method starts from official defaults, then four one-at-a-time sweeps of four values and a joint grid of up to 3×3 on each of 5 tuning months, up to 125 runs per method. S11 Reis+: network output blended 80/20 with the naive lagged covariance (φ = 0.8 chosen on a 0–1 grid in steps of 0.2 on the training period); benchmarks get no comparable blend. S5 Rahimikia+: benchmark hyper-parameters tuned only in 2000 and reused; TSFMs keep defaults, and their sensitivity study is judged on the out-of-sample period. S7 Feng+: total epochs matched between pretrained and supervised arms (at most 50 epochs, early stopping). S3 STOCK-JEPA: supervised baselines share one schedule of 6 epochs × ≤1,000 updates; under matched inputs and readouts Ordinary-JEPA reaches RankIC 9.17 (CN) and 9.05 (US) against 4.09 and 0.69 for the best JEPA baselines in its Table 1."
  pitfalls: "Equal configuration counts are not equal effort when search spaces differ in size; report counts and compute. Defaults for classical baselines are themselves tuning choices; tune or justify them. Under the per-asset NLL the PD repair largely sets the score of near-singular baselines (EWMA, short windows), so ε is fixed once for all models; choosing it on EWMA (G12) favours a strong-set member, which is conservative for H1. Ordinary-day origins outnumber event origins in V, so the shared criterion is dominated by ordinary days; this holds for every model, so parity is kept, but no model is tuned for events specifically (state it). S11's PSD step clips negative eigenvalues to zero, which leaves singular matrices the NLL cannot score; the shared repair must enforce a strictly positive floor. A blend toward the naive forecast tuned only for our model flatters it (S11). Tuning any model on the test window, as in S5's TSFM sensitivity study, breaks the lock. In S3 much of the gap over JEPA baselines came from readout and input design, so match readouts before attributing gains to pretraining."
