- id: "cpcv"
  name: "Combinatorial purged cross-validation (CPCV)"
  category: "protocol"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical (G14). Original: López de Prado 2018 (AFML §12.4), located from Wiley's table of contents only; the book text was not read. The group sizes, split and path counts and path assembly come from López de Prado 2018 WP (published in The Journal of Portfolio Management 44(6); read as the 27 January 2018 working paper, Exhibits 7–8), as decoded in the verification record. No seed paper uses CPCV. It stays nice-to-have: our claims rest on the walk-forward locked test, and because CPCV fits train on data after their test groups it cannot select configurations under G7–G8."
  priority: "nice"
  plain_english: "Cut the validation data into N blocks, hold out every possible set of k blocks in turn, and stitch the held-out forecasts into several complete backtest paths. This gives a spread of scores per configuration instead of one walk-forward path, as a descriptive check that the configuration chosen on walk-forward validation is robust; it never chooses configurations, because its fits train on data after the blocks they forecast."
  formula: 'n_g=\lfloor T/N\rfloor\ (g=1,\dots,N-1),\quad n_N=T-\lfloor T/N\rfloor(N-1);\qquad \#\text{splits}=\binom{N}{N-k}=\frac{\prod_{i=0}^{k-1}(N-i)}{k!};\qquad \#\text{tested groups}=k\binom{N}{N-k};\qquad \varphi[N,k]=\frac{k}{N}\binom{N}{N-k}=\frac{\prod_{i=1}^{k-1}(N-i)}{(k-1)!}'
  computable_form: 'Enumerate the C(N, k) test-group sets in lexicographic order; for each, fit on the remaining groups after purge and embargo and forecast the k test groups. Keep a counter per group: the p-th time group g is tested (in split order), its forecasts go to path p. Each of the φ paths then holds exactly one out-of-sample segment per group; score each path with the primary loss.'
  conventions: "Observations: the validation-period origins (day-0 event and ordinary-day origins, 2017-01-01 to 2021-12-31; G8) in time order, never shuffled. Group sizes as in the formula (last group takes the remainder). Path assembly follows the white paper's Exhibit 8. Every split uses the shared purge-and-embargo mask (purged_cv_embargo): labels [t+1, t+H], pre-gap g = 5 before each test group and embargo h = max(5, ⌈0.01T⌉) after it, T = number of observations. Fits: baselines and covariance heads are refit on each split's training groups; neural arms use the encoders of the 2017-01-03 walk_forward refit, whose data end before the validation period, so no test group is in any pretraining corpus; per-split pretraining is an optional extension. Role: CPCV fits train on data after their test groups, which G7 rules out for any forecast that enters tuning or a claim, so CPCV scores are descriptive only: they never select configurations (G8) and never enter a test. Metric per path: mean per-asset NLL over the path's origins; summarise each configuration by the median, interquartile range and worst path, and report where the walk-forward-selected configuration ranks on these. Defaults (our suggestion): N = 6, k = 2 (15 splits, 5 paths); N = 10, k = 2 gives 45 splits and 9 paths. Never the locked window."
  inputs: ["time-ordered validation-period origins (2017–2021)", "N and k", "shared purge-and-embargo mask (g = 5, h)", "configurations to compare (from trial_ledger)", "encoders of the 2017-01-03 walk_forward refit"]
  guards_against: "Trusting a configuration that only looks good on the single historical walk-forward path."
  typical_values: "López de Prado 2018 WP: N = 6 groups and k = 2 give 15 splits; each group is tested 5 times, so there are 5 backtest paths (Exhibits 7–8); the number of paths grows as N approaches T and as k approaches N/2. No seed paper reports CPCV."
  pitfalls: "Cost is C(N, k) fits per configuration and seed, prohibitive for full JEPA pretraining: refit heads and baselines on encoders pretrained before the validation period, or pretrain once per split. Training groups that follow a test group make CPCV a validation diagnostic, not an out-of-sample test, and break G7's time order, so it never selects configurations. Paths share training data, so their spread is not a sampling-error estimate. A pretrained encoder whose corpus contains a test group leaks into it. Normalisation statistics come from each split's training groups only."
  used_by:
    - ref: "López de Prado 2018"
      title: "Advances in Financial Machine Learning"
      authors: "López de Prado, M."
      year: 2018
      venue: "Wiley. ISBN 978-1-119-48208-6 (hardcover); 978-1-119-48210-9 (e-book)"
      url: "https://www.wiley.com/en-us/Advances+in+Financial+Machine+Learning-p-9781119482086"
      peer_reviewed: false
      source_type: "book"
      read_depth: "metadata_only"
