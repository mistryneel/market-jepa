- id: "h1_noninferiority_test"
  name: "Non-inferiority (and equivalence) test for H1's 'matches strong risk models'"
  category: "stat_test"
  section: "E"
  status: "our_design"
  status_note: "Our design, added after review finding completeness#9; the decision rule, the strong set and the margins are fixed by global decision G4. The one-sided test against a pre-set margin is the lower-bound half of Lakens' TOST in the gain orientation of G1 (the published article was read in full on 2026-11-12 at PMC5502906). Computing it with the month-cluster bootstrap, the δ_NLL recipe on validation data, the window-closure rule and the earnings day-0 mapping are our choices. Nolde & Ziegel 2017's three-zone comparative backtest (arXiv v2 read) is the closest finance precedent for one-sided hypotheses against a standard model; MCS membership (Hansen+ 2011) supports but does not decide. verified = true records only that every cited source was opened."
  priority: "must"
  plain_english: "Failing to find a difference is not evidence that two models are equally good. H1 is supported only if, on ordinary days away from FOMC and CPI announcements, the data show that our model is worse than each of four strong baselines (DCC-NL, nonlinear shrinkage, a fundamental factor model and EWMA) by less than a margin fixed in advance, both on the likelihood loss and on the realized variance of the minimum-variance portfolio."
  formula: '\Delta^{\mathrm{NLL}}_{k,t}=L_{k,t}-L_{\mathrm{ours},t},\qquad \Delta^{\mathrm{GMV}}_{k,t}=\log V_{k,t}-\log V_{\mathrm{ours},t},\quad V_{\cdot,t}=w_{\cdot,t}''\Sigma^{*}_{U_t}w_{\cdot,t},\quad w_{\cdot,t}=\frac{\hat\Sigma_{\cdot,U_t}^{-1}\mathbf 1}{\mathbf 1''\hat\Sigma_{\cdot,U_t}^{-1}\mathbf 1};\qquad k\in\mathcal S=\{\text{DCC-NL},\ \text{QIS},\ \text{fundamental factor},\ \text{EWMA}\};\qquad H_{0,jk}{:}\ E[\Delta^{j}_{k,t}]\le-\delta_j\ \ \text{vs}\ \ H_{A,jk}{:}\ E[\Delta^{j}_{k,t}]>-\delta_j,\quad j\in\{\mathrm{NLL},\mathrm{GMV}\};\qquad LB_{jk}=\bar\Delta^{j*}_{k,(500)}\ \ (\text{500th smallest of the }B=10{,}000\ \text{month-cluster bootstrap means});\qquad \text{H1 supported}\iff LB_{\mathrm{NLL},k}>-\delta_{\mathrm{NLL}}\ \wedge\ LB_{\mathrm{GMV},k}>-\delta_{\mathrm{GMV}}\quad\forall k\in\mathcal S\ \ (\text{intersection-union of 8 one-sided 5\% tests, no adjustment});\qquad \delta_{\mathrm{NLL}}=\tfrac12\Big(\bar L^{\mathrm{val}}_{\mathrm{EWMA}}-\min_{k\in\mathcal S}\bar L^{\mathrm{val}}_{k}\Big),\qquad \delta_{\mathrm{GMV}}=\log 1.05;\qquad p_{jk}=\frac{1+\#\{b:\ \bar\Delta^{j*}_{k,b}\le-\delta_j\}}{B+1}\ \ (LB_{jk}>-\delta_j\iff p_{jk}\le0.05);\qquad \text{TOST (descriptive): }t_L=\frac{\bar\Delta^{j}_{k}+\delta_j}{s/\sqrt N},\ t_U=\frac{\bar\Delta^{j}_{k}-\delta_j}{s/\sqrt N},\ \text{equivalent iff }t_L\ge t_{0.95,N-1}\wedge t_U\le-t_{0.95,N-1}'
  computable_form: 'For each H1 origin t (conventions) and each k in S = {DCC-NL, QIS, fundamental factor model, EWMA}: dN[k,t] = L_k[t] − L_ours[t], the per-asset NLL on U_t; dG[k,t] = log V_k[t] − log V_ours[t] (natural logs), with V = w''Σ*w on U_t and unconstrained GMV weights w from each model''s repaired forecast restricted to U_t; ours = arm (pre, 0). Cluster key = calendar month of t (54 months in the locked window). Draw one 10,000 × C matrix of month indices with replacement from the recorded H1-analysis seed and use it for all four baselines and both co-primaries; each replicate mean is a ratio estimator (sum over the drawn months of the month sums of d, divided by the sum of their origin counts). LB_N[k] and LB_G[k] = the 500th smallest of the 10,000 replicate means. H1 is supported iff LB_N[k] > −δ_NLL and LB_G[k] > −log(1.05) for all four k (8 checks, no adjustment). Report per k and co-primary: the mean, LB, the two-sided 95% percentile interval, p = (1 + #{b: mean*_b ≤ −δ})/(B + 1), LB_N[k] as a fraction of the validation gap (L̄_EWMA − min_k L̄_k), exp(−LB_G[k]) − 1, and the number of origins removed by reference failures. Any failure of ours at an H1 origin voids H1.'
  conventions: "Decision (G4): H1 is supported only if ours is non-inferior to EVERY member of the pre-registered strong set S on BOTH co-primaries: for each k in S, LB_95(Δ̄_NLL,k) > −δ_NLL and LB_95(Δ̄_GMV,k) > −δ_GMV, each a one-sided test at 5%. This is an intersection–union over 8 tests and needs no multiplicity adjustment (G4, G5); it replaces the earlier 'Holm across co-primaries' wording. S (G4): DCC-NL (dcc_family), QIS nonlinear shrinkage (nonlinear_shrinkage), the fundamental industry + style factor model (factor_risk_models) and EWMA (ewma_riskmetrics with its tuned λ), each in the configuration tuned on the validation period (baseline_tuning_parity; G8). Orientation (G1): Δ = reference minus candidate with ours as the candidate, so Δ_NLL,k,t = L_k,t − L_ours,t and Δ_GMV,k,t = log V_k,t − log V_ours,t; positive favours ours and the margins sit below zero. Candidate: arm (pre, 0) of matched_supervised_comparator, the pretrained encoder with its small covariance head, with every event-derived input replaced by the null token in pretraining and fine-tuning (G9); (pre, 1) on the same origins is reported descriptively. Sample (G4, made exact): an H1 origin is a trading day t of the locked window 2022-01-01..2026-06-30 on the pinned exchange calendar such that no FOMC or CPI day 0 (event_timing_origin; only scheduled FOMC decisions and CPI releases, including any just outside the window) falls on trading days t−1, …, t+5, and whose target days t+1..t+5 end by 2026-06-30 (our closure rule, as in rank_ic and event_vs_nonevent_did, so the locked window stays closed). Our recount on an assumed NYSE holiday calendar including the 2025-01-09 closure, which reproduces the window's 1,126 trading days: 566 origins covering all 54 calendar months (571 without the closure rule). Asset set U_t: the point-in-time universe at t (G10) minus every stock whose own earnings day 0 (d_a(0) of earnings_event_handling, our operationalisation of G4's 'announcement in [t, t+5]') lies on t, …, t+5; identical for all models. Scoring: per-asset Gaussian NLL (stein_loss) from the principal submatrices of each repaired forecast and of Σ* on U_t (a Gaussian marginal uses the principal submatrix, and the shared eigenvalue floor carries over, so there is no second repair; earnings_event_handling); V = w'Σ*w with unconstrained GMV weights w = Σ̂_U⁻¹1/(1'Σ̂_U⁻¹1) and Σ* the 5-day realized covariance target on U_t (realized_covariance_target); natural logs; per-origin log ratios make the GMV metric scale-free. Inference (G3): paired month-cluster bootstrap (block_bootstrap) with clusters = calendar month of the origin date, B = 10,000, and one index matrix for the H1 analysis shared by all four baselines and both co-primaries; LB_95 is block_bootstrap's lower bound (the 500th smallest replicate mean), so LB > −δ exactly when p = (1 + #{b: Δ̄*_b ≤ −δ})/(B + 1) ≤ 0.05. Margins (G4), pre-registered before unlocking from the validation period 2017-01-01..2021-12-31 (G8): δ_GMV = log 1.05 ≈ 0.0488, a 5% realized-variance tolerance; δ_NLL = ½(L̄_EWMA − min_{k∈S} L̄_k), half the gap in mean per-asset NLL between EWMA and the best member of S over the validation H1 origins (same rule, targets ending by 2021-12-31, forecasts from the walk-forward refits of G6), computed after ε (G12) and every baseline's tuning are frozen. If EWMA is itself the best member (gap ≤ 0), δ_NLL is not a usable margin: revise the rule and log the change before unlocking (our guard). Report LB_NLL,k in loss units and as a fraction of the validation gap, and exp(−LB_GMV,k) − 1, the largest variance excess of ours over k that the data do not exclude, so readers can apply other margins. Failures (G13): a forecast that is non-finite or fails Cholesky after the shared repair is a failure; any failure of ours at an H1 origin voids the claim for every contrast containing that origin, and hence H1; an origin where only k fails is removed from both k contrasts and disclosed with counts. Supporting, never decisive (G4, G5): MCS membership of ours per co-primary at α = 0.10 (as in Bollerslev+ 2018) and α = 0.25 (as in Laurent+ 2012), with the model set and bootstrap of model_confidence_set; Nolde & Ziegel's zones (green: significantly better; red: significantly worse; yellow otherwise) as the reporting frame; Ledoit & Wolf 2011's log-variance-ratio test (bootstrap version) on realized GMV returns; the pretraining check D^H1 = L(sup, 0) − L(pre, 0) (matched_supervised_comparator). Descriptive sensitivities: long-only GMV weights; the stationary bootstrap (G3); the strict sample in which neither the origin day nor any target day t+1..t+5 lies in any event's −1..+5 block (281 origins with the closure rule; our recount), which removes post-event tails from the ordinary days; full TOST; and the t-form with N − 1 degrees of freedom on the 144 origins chosen greedily from the first eligible origin, each at least 5 trading days after the previous one (our recount)."
  inputs: ["per-origin per-asset NLL of ours (pre, 0) and of each member of the strong set on the H1 origins, on identical asset sets U_t", "per-origin realized GMV variance per model (unconstrained weights; long-only for the descriptive check)", "calendar-month cluster keys of the H1 origin dates", "pre-registered margins: δ_NLL from the validation period and δ_GMV = log 1.05", "FOMC and CPI day-0 dates (event_timing_origin) and per-stock earnings day 0 (earnings_event_handling)", "failure flags per model, origin and seed", "B = 10,000 and the recorded H1-analysis RNG seed"]
  guards_against: "Claiming a match from a non-significant difference test, which low power alone can produce."
  typical_values: "Lakens 2017: each one-sided test at α = 0.05 corresponds to a 90% (1 − 2α) confidence interval. Our margins (G4): δ_GMV = log 1.05 ≈ 0.0488 (natural log; our arithmetic); δ_NLL is set on validation data. H1 sample on an assumed NYSE calendar (our recount): 566 origins in 54 months with the closure rule, 571 without it; 144 of them at least 5 trading days apart; 281 under the strict descriptive rule. Laurent+ 2012 (2010 WP): 75% MCS (α = 0.25, 10,000 bootstrap draws); out of 125 MGARCH models the Stein MCS kept 10 against 39 for the Euclidean loss (full sample, 1-day forecasts). Bollerslev+ 2018 (2016 WP): 90% MCS. Ledoit & Wolf 2011: with T = 120 in simulations the HAC version was liberal while the studentized bootstrap held size. Nolde & Ziegel 2017 (arXiv v2): zone level fixed in advance, e.g. 0.05. No comparable non-inferiority margins are reported in the sources read."
  pitfalls: "A margin fixed after unlocking invalidates the test, and too wide a margin makes H1 trivial; δ_NLL is half of what the best strong model gains over EWMA on validation, so a small gain gives a small margin, and if EWMA is the best member the rule breaks down (conventions). An intersection–union of 8 tests has less power than any single one: check its power on validation data before unlocking (our suggestion). GMV variance ignores the forecast's scale (pair it with risk_calibration_ratio) and grows with volatility (hence log ratios). The PD repair can dominate the NLL of near-singular forecasts; strong baselines should be PD by construction, but log floored-eigenvalue shares (G12). MCS membership depends on the comparison set and the loss (Stein sets were far smaller than symmetric-loss sets in Laurent+ 2012). Setting bounds by the effect one has power to detect, Lakens' fallback, confuses power with relevance. Earnings exclusions change the asset set per origin, so apply them identically to all models. Under G4's rule an origin two to five trading days after an announcement is ordinary although its targets overlap that event's day 1–5 window; the strict descriptive sample shows whether these post-event tails drive the result. H1 origins come in runs of consecutive days with overlapping 5-day targets, so tests that treat origins as independent overstate precision; the month-cluster bootstrap allows for this."
