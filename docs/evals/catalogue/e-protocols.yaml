- id: "regime_reporting"
  name: "Report results by year and by volatility regime"
  category: "protocol"
  section: "E"
  status: "widely_used"
  status_note: "Kept widely_used: peer-reviewed 2026 seeds S1, S11 and S12 report by period or regime, as do the preprints S3 and S5. Laurent+ 2012 is cited from its 2010 working paper (1-day forecasts); its JAE counts were not read. Ledoit & Wolf 2017 and S15 are added as subperiod precedents."
  priority: "should"
  plain_english: "Model rankings can be driven by one turbulent stretch, so show the primary result separately for each year and for calm, normal and turbulent markets, defined only from information available when the forecast was made."
  formula: '\Delta_e=L_{\mathrm{ref},e}-L_{\mathrm{cand},e},\qquad \bar\Delta_s=\frac{1}{|\mathcal O_s|}\sum_{e\in\mathcal O_s}\Delta_e;\qquad v_t=\sqrt{\frac{252}{21}\sum_{i=0}^{20}r^{2}_{\mathrm{EW},t-i}};\qquad \mathrm{regime}(e)=\text{low if } v_{t_e}\le q_{1/3},\ \text{mid if } q_{1/3}<v_{t_e}\le q_{2/3},\ \text{high if } v_{t_e}>q_{2/3},\quad q_{1/3},q_{2/3}=\text{terciles of }\{v_t:\ t\in[\text{2017-01-01},\text{2021-12-31}]\};\qquad \mathrm{LB}_{95,s}=Q_{0.05}\big(\{\bar\Delta^{*}_{s,b}\}_{b=1}^{B}\big)'
  computable_form: 'v[t] = sqrt(252/21 · sum of squared equal-weighted returns of the G10 universe at t over the 21 trading days ending at the close of t); q1, q2 = terciles of v over all trading days of the validation period 2017-01-01..2021-12-31, frozen in the plan; regime[e] from v at the origin and year[e] from the date of day 0; per stratum: number of origins, mean Δ, the 5th and 95th percentiles of a paired month-cluster bootstrap (B = 10,000) restricted to the stratum''s origins (the 5th is LB_95), and the share of origins with Δ > 0.'
  conventions: "Our design for the regime variable: v_t is the trailing 21-trading-day realized volatility (uncentred, annualised with 252) of the equal-weighted return of the G10 universe at t (before any per-origin earnings exclusion) through the close of the origin day, so it is known at the origin (day 0 for the primary design, day −1 for the secondary). Tercile thresholds come from all trading days of the validation period 2017-01-01..2021-12-31 (G8) and are frozen in the pre-registration (as S3 fixes training-period percentiles). Sign (G1): Δ_e = L_ref − L_cand, positive favouring the candidate. Year strata by the date of day 0: 2022, 2023, 2024, 2025 and 2026 H1 hold 20, 20, 19, 19 and 10 of the 88 pooled origins (20, 20, 20, 19 and 10 events; CPI and FOMC share 2024-06-12; our count from the official calendars). Within each stratum report the number of origins, Δ̄_s, the 5th and 95th percentiles of the paired month-cluster bootstrap restricted to the stratum's origins (clusters = calendar month of day 0, G3; the 5th percentile is G1's LB_95) and the share of origins with Δ_e > 0; also results per refit (nine locked-window refits, walk_forward) and a leave-one-year-out pooled estimate (our suggestion). The same splits apply to H1's ordinary-day origins (G4; clusters = calendar month of the origin). Strata are descriptive (G5): no stratum carries a claim or a multiplicity adjustment; a conditional Giacomini–White test with origin-known regime indicators as test functions (nested_model_tests) may be shown as a descriptive heterogeneity diagnostic. Stratifying by realized post-event volatility conditions on the outcome and must be labelled as such."
  inputs: ["per-origin paired gains Δ_e = L_ref − L_cand (G1)", "equal-weighted returns of the G10 universe for v", "frozen validation-period tercile thresholds", "day-0 dates and refit ids"]
  guards_against: "A pooled result driven by one episode or regime, such as 2022, being presented as general."
  typical_values: "S1 Market-1T: month explains 97.2–99.9% of performance variance, and the paper warns that narrow time slices can bias estimates. S11 Reis+: losses in the bear period (2022-01-03 to 2022-06-12) are roughly twice those of the bull periods, e.g. CAB's L^E ×10^5 of 66.381 in the bear period vs 24.276 (Bull-1) and 39.253 (Bull-2). Laurent+ 2012 (2010 WP; 125 MGARCH models, 75% MCS, 1-day forecasts): MCS sizes (Euclidean / Stein / L_3) full sample 39/10/20, dot-com 38/2/11, calm 2003–07 74/12/74, 2007–08 crisis 39/26/26. S3 STOCK-JEPA: trend states at training-period 33rd/67th percentiles and shock states at the 5th/95th, fixed during testing. S12 Bongiorno+: the network's annual volatility is below the average oracle's every year except 2020. Ledoit & Wolf 2017: robustness over three 160-month subperiods. S15 Li+: the implied rank of FOMC covariance jumps varies across 3-year subsamples (1 before the crisis, 3 in 2007–2009, 1 in 2010–2012, 2 after 2013)."
  pitfalls: "Thresholds set on locked-window data leak. Small strata (2026 H1 has 10 origins) give wide intervals. Year effects are confounded with the refit schedule, so show refit ids. Ex-post regime definitions, such as S11's bull and bear periods dated by a 20% drawdown, condition on the outcome. Many strata invite multiplicity, so strata stay descriptive (G5) and none is promoted to a claim. In Laurent+ 2012 the dot-com L_3 count is 11 in the table but 8 in the text."
  used_by:
    - ref: "S1"
      title: "Towards Financial World Modeling"
      authors: "Merchant, Guthrie, Mahns, Balestriero, Levy"
      year: 2026
      venue: "NeurIPS 2026 (poster); arXiv:2610.09048"
