  implementation:
    libraries: ["numpy", "pandas", "arch"]
    notes: "Precompute per-cluster sums and counts; draw one B × C index matrix per analysis (H2 event origins, H1 origins, DiD) from its own recorded seed and reuse it for every contrast and endpoint within that analysis; compute replicate means as indexed sums over indexed counts; LB = np.sort(Dstar)[r − 1] with r = floor(0.05·(B + 1)). Sensitivity: arch.bootstrap.StationaryBootstrap with block_size = b̂_SB from arch.bootstrap.optimal_block_length on Δ; descriptive: arch.bootstrap.CircularBlockBootstrap with round(b̂_CB); record the arch version. Checks: with iid synthetic Δ in singleton clusters the bootstrap SE matches s/√N; swapping reference and candidate mirrors the distribution; a simulated contrast in which the candidate is truly better gives LB > 0 in most draws; on pre-2022 data at zero true difference the rejection rate is near 0.05; LB > 0 exactly when p ≤ 0.05; the frozen calendar reproduces 53 event-month clusters (35 with two origins, 18 with one)."
  adoption_cost: "low"
