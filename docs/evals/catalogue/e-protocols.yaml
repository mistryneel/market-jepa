- id: "seed_vs_period"
  name: "Uncertainty across time periods vs across training seeds"
  category: "protocol"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical with Bouthillier+ 2021 as the defining source for separating data-split variance from seed variance and for the P(A>B) rule. Treating calendar months as the 'splits' and the two-stage month-then-seed bootstrap are our inference from Bouthillier+ 2021 and Agarwal+ 2021."
  priority: "must"
  plain_english: "Neural models give different results with different random seeds, and results also vary from month to month. Average over several seeds, report how much results move across seeds, and base the headline interval on resampling time, which usually matters more."
  formula: '\Delta_e=\frac1K\sum_{s=1}^{K}\big(L^{(s)}_{\mathrm{ref},e}-L^{(s)}_{\mathrm{cand},e}\big),\qquad \bar\Delta^{(s)}=\frac1E\sum_{e=1}^{E}\big(L^{(s)}_{\mathrm{ref},e}-L^{(s)}_{\mathrm{cand},e}\big),\qquad \widehat{\Pr}_{\mathrm{seed}}(\mathrm{cand}>\mathrm{ref})=\frac1K\sum_{s=1}^{K}\mathbb 1\{\bar\Delta^{(s)}>0\};\qquad \Pr(\mathrm{cand}>\mathrm{ref})=\frac1k\sum_{i=1}^{k}\mathbb 1\{L^{\mathrm{cand}}_i<L^{\mathrm{ref}}_i\}\ (i=\text{calendar month},\ L_i=\text{month-mean seed-averaged loss});\qquad \mathrm{share}_{\mathrm{month}}=\frac{K\sum_c(\bar y_{\cdot c}-\bar y)^2}{\sum_{s,c}(y_{sc}-\bar y)^2},\quad \mathrm{share}_{\mathrm{seed}}=\frac{C\sum_s(\bar y_{s\cdot}-\bar y)^2}{\sum_{s,c}(y_{sc}-\bar y)^2}'
  computable_form: 'Store L[arm, seed, origin] for the 88 pooled origins (and the per-type subsets). Δ[e] = mean over the K paired seeds of (L[ref, s, e] − L[cand, s, e]); Δbar_s = per-seed mean over origins; P_seed = share of seeds with Δbar_s > 0. Headline interval and decision: the paired month-cluster bootstrap on Δ[e] (block_bootstrap; B = 10,000; LB_95 = 5th percentile). Two-stage replicate (secondary report, G3; B = 10,000): draw C months with replacement, then one vector of K seed indices with replacement shared by both arms (paired seeds stay paired), and recompute the origin-weighted mean over the drawn months of the seed-averaged paired differences; only if two arms cannot share seeds, draw seed indices independently per arm and label the interval unpaired; for a contrast with a deterministic baseline resample only the trained arm''s seeds. y_sc = month-c mean of the per-seed paired gain (or of one arm''s per-seed loss) for the variance shares.'
  conventions: "Paired seeds: seed s fixes initialisation, data order and masks and is reused across arms (as S17 does); the v = 0 arms use the same seeds and data order as their v = 1 partners (G9). K = 5 for every trained arm (the four arms (pre, v) and (sup, v) of matched_supervised_comparator and the untrained floor) from one shared seed list, at every refit (walk_forward); deterministic baselines have K = 1 and zero seed variance, and their single loss enters every seed's difference. Sign (G1): every contrast is a gain Δ = L_ref − L_cand, positive favouring the candidate. Primary unit: Δ_e, the seed average of per-seed paired gains, which estimates the expected performance of the training procedure; the loss of a seed-averaged forecast is an ensemble, a different model, registered separately if used. Failures (G13): an arm fails at an origin if any of its K seeds fails there; a candidate failure voids that arm's one-sided claim for the contrast, a reference failure removes the origin from that contrast only, both disclosed with counts. Report per arm and contrast: mean ± SD across seeds (ddof = 1), min–max, IQM (scipy.stats.trim_mean with proportion 0.25, which keeps the middle three of five) and P̂_seed(cand > ref). The headline interval and every decision come from the primary paired month-cluster bootstrap on Δ_e (G3; block_bootstrap), because Bouthillier+ 2021 find data-split variance far larger than initialisation variance. Secondary reports, descriptive and never overriding the pre-registered test: (i) the two-stage month-then-seed bootstrap (G3); (ii) Bouthillier's P(A>B) with calendar months as splits (our adaptation), with a month-cluster percentile interval, read as 'candidate better' only if the lower bound exceeds 0.5 and the upper bound exceeds γ = 0.75. Variance shares are our derivation of a decomposition S1 reports without a printed formula: two-way sums of squares of y_sc in a K × C layout, with the residual share reported too."
  inputs: ["per-seed per-origin losses for every arm", "seed pairing map across arms (one shared list, K = 5)", "calendar month of day 0 for each origin", "failure flags per arm, seed and origin"]
  guards_against: "Mistaking seed noise or a lucky seed for a model effect, and intervals that ignore either seed or time-period variation."
  typical_values: "Ours: K = 5 paired seeds per trained arm. S1 Market-1T: in a 10 × 10 seed × month design, month explains 97.2% (return), 98.9% (volatility change) and 99.9% (spread change) of IC variance. S7 Feng+: 3 seeds, seed SD often as large as the JEPA effect, e.g. STAEformer PEMS07 MAE 30.77 ± 0.18 without JEPA vs 30.46 ± 3.23 with it. Bouthillier+ 2021: γ = 0.75; with k = 50 simulated splits the P(A>B) rule gave about 5% false positives and 30% false negatives, against about 90% false negatives when comparing averages. Agarwal+ 2021 (arXiv v4): 3–10 runs per task; 50,000 bootstrap resamples for aggregate intervals and 2,000 for pointwise bands. Seeds in the seed papers: S12 10 per yearly model; S4 5 (CD-DFM and GKX); S3 3 runs; S2 1."
  pitfalls: "Seed SD alone understates uncertainty: Bouthillier+ 2021 find initialisation variance much smaller than split variance, and S1 finds month dominates. Agarwal+'s stratified bootstrap resamples runs within tasks and never resamples tasks, so it captures run noise only. With K = 5, SDs are coarse and P̂_seed takes only the values 0, 0.2, …, 1. Unpaired seeds across arms waste power, and drawing seed indices separately per arm in the two-stage bootstrap breaks the pairing. Picking the best seed is a trial that must be logged (trial_ledger). Ensembling across seeds changes the model being evaluated."
