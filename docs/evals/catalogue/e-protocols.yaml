- id: "locked_test_preregistration"
  name: "Separate tuning period, locked test window and pre-registration"
  category: "protocol"
  section: "E"
  status: "widely_used"
  status_note: "Kept widely_used: a tuning period disjoint from a held-out test period is used by the peer-reviewed 2026 seeds S1 and S2 and by the 2026 preprints S3 and S10; Gu+ 2020 is the classic three-period design. Formal pre-registration of hypotheses and gates is rarer (S10 preprint, S17 repository)."
  priority: "must"
  plain_english: "Decide and write down every analysis choice first, then score the 2022 to mid-2026 test window once. Because nothing was tuned on that window, the primary test is a single pre-specified comparison."
  formula: '\max_{i\in\mathcal D_{\mathrm{dev}}}t_{i,1}\le\text{2021-12-31}<\min_{e\in\mathcal E_{\mathrm{test}}}t_e,\qquad \mathcal E_{\mathrm{test}}=\{e:\ \text{2022-01-01}\le t_e\le\text{2026-06-30}\}\ (89\ \text{events on }88\ \text{origins}),\qquad V=\{t:\ t\ge\text{2017-01-01},\ t+H\le\text{2021-12-31}\},\qquad N^{\mathrm{test}}_{\mathrm{confirmatory}}=1\ \text{per registered analysis}'
  computable_form: 'assert the maximum label end over all development and tuning samples ≤ 2021-12-31 (in-window walk_forward refits are not development: they run only through the frozen refit path, whose per-refit cutoffs walk_forward asserts); the data loader returns locked-window targets for scoring only with an unlock token held by the final evaluation entry point and appends (time, caller, commit, plan_hash) to the ledger on every call; assert exactly one confirmatory run per registered analysis.'
  conventions: "Development (design choices, tuning, model selection, the PD-repair ε, H1 margins, the MDE) uses only data whose labels end on or before 2021-12-31, and all tuning and selection use the walk-forward forecasts of the validation period 2017-01-01..2021-12-31 (G8; baseline_tuning_parity). Locked window: 2022-01-01 to 2026-06-30 with 36 scheduled FOMC decisions and 53 CPI releases from the official calendars, with release times (CPI 08:30 ET, FOMC 14:00 ET): 89 events on 88 distinct day-0 origins, because CPI and FOMC share 2024-06-12 (G2). Refits inside the window follow the frozen walk_forward procedure on data ending at least 5 trading days before each refit date (G6, G7). Events after 2026-06-30 (3 FOMC decisions and 5 CPI releases up to 12 Nov 2026) are used for nothing and can serve as a later confirmation set (our suggestion). The registered plan fixes: H1–H4 with sidedness and α; the sign convention Δ = L_ref − L_cand (G1); the computable primary loss and the Σ* definition; origin (close of day 0), target (days 1–5) and the secondary origin (close of day −1); the event list and the pooled unit (88 origins; 36 FOMC and 53 CPI per type); universe and missing-data rules (G10, G11); the PD repair with its ε grid and selection rule (G12) and the failure rule (G13); the 2×2 arms including the v = 0 arm (G9), the strong set {DCC-NL, QIS nonlinear shrinkage, fundamental industry+style factor model, EWMA}, other baselines and tuning budgets (baseline_tuning_parity); the deciding test, the one-sided 95% percentile lower bound of the paired month-cluster bootstrap with B = 10,000 and a recorded RNG seed (G1, G3), and its sensitivity tests (stationary bootstrap with the Politis–White block length and the Patton–Politis–White correction, DM-HLN, GW); the H1 intersection–union rule and margins (G4); the multiplicity families (G5: H2 primary, one unadjusted test; H2 key secondaries, Holm at 5%; H1, intersection–union; H3, Holm; H4, Benjamini–Hochberg at 10%; everything else descriptive); the MDE (power_mde); the seeds (K = 5); the refit calendar, window m = 2,520, cutoff and whether the frozen-encoder fallback is used (G6); exploratory labels; the analysis-code commit. Freeze by committing plan and code under a tag whose hash and timestamp are recorded before any locked-window loss is computed for any model, baselines included. Enforce the lock in code and log every access (trial_ledger). Run the confirmatory analysis once; later analyses are labelled post hoc, and deviations are logged with reasons and both results. Pre-2022 events used as a secondary analysis must lie before 2017: validation-period events are tuning-exposed and are labelled so."
  inputs: ["written analysis plan with hash", "frozen code commit", "hashed data snapshot", "official event calendars with release times", "access log"]
  guards_against: "Garden-of-forking-paths inflation and test-set reuse: tuning, model selection or analysis choices made after seeing test-window results."
  typical_values: "S1 Market-1T: 5 tuning months (evaluation months 2009-02, 2011-04, 2014-06, 2020-06, 2022-03) disjoint from 32 evaluation months; up to 125 tuning runs plus 32 final runs per method. S2 Mahns+: train 2018–2022 (1,309 days), validation 2023 (250 days), test 2024 to Oct 2025 (451 days), checkpoint by lowest validation loss. S3 STOCK-JEPA: validation 2022–2023, test Jan 2024 to Jun 2026 (621 US test dates), evaluated after both checkpoints were fixed. S10 Gençay: design 2017–2021 and a 2022–2025 evaluation window never shown to the search; pre-registered arms enter with N = 1. Gu+ 2020 (NBER WP): 18, 12 and 30 years of training, validation and testing. Ours: validation period 2017-01-01 to 2021-12-31 (G8); locked window 2022-01-01 to 2026-06-30 with 36 FOMC decisions and 53 CPI releases on 88 distinct origins in 53 event-months (our count from the official calendars)."
  pitfalls: "The 2022–2026 window is already history, so design choices informed by knowing it (for example the 2022 tightening) are soft leakage: record them in the plan. A lock that is not enforced in code fails silently. Scoring any baseline on the test window before the freeze breaks the lock. Deciding after unlocking whether to use the frozen-encoder fallback, or whether a same-day CPI and FOMC pair counts once or twice, is a forking path: fix both in the plan (G2, G6). S17 corrected mis-specified gates in place; keep the originals and report deviations. Only live data are truly out of sample, and iterating on a hold-out destroys it (Arnott+ 2019). Vendors revise history: snapshot and hash the test data at freeze time. A single locked window has limited power (power_mde)."
