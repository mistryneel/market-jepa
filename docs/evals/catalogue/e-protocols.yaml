- id: "nested_model_tests"
  name: "Giacomini–White test for nested comparisons (Clark–West for squared-error scalar secondaries)"
  category: "stat_test"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical (original Giacomini & White 2006, read as the 2003 UCSD working paper, whose theorem and equation numbers differ from the article; formulas here follow that working paper). Per review findings audit_EFG#1 and completeness#0, Clark–West (read as NBER TWP 326) is kept only for squared-error scalar secondaries, and McCracken's fixed-window result is stated separately from our reading of it. The month-cluster bootstrap decides the primary H2 contrast (G3, G5); GW fixes the estimation scheme under which that nested contrast has a valid method-level null and is its sensitivity test; under the G6 fallback (frozen encoders) the method-level claim is dropped."
  priority: "must"
  plain_english: "Comparing a model with and without event inputs is a comparison of nested models, where ordinary tests can mislead. The Giacomini–White test stays valid if both versions are re-estimated on fixed-length rolling windows, and it can also check whether the gain differs between FOMC and CPI events."
  formula: '\Delta_e=L_{P,e}-L_{P+E,e},\quad Z_e=h_e\,\Delta_e,\quad \bar Z=\frac1n\sum_{e}Z_e;\qquad T^{h}=n\,\bar Z''\hat\Omega^{-1}\bar Z\ \xrightarrow{d}\ \chi^2_q\ \text{under } H_0{:}\ E[h_e\Delta_e]=0;\qquad \tau=1{:}\ \hat\Omega=\frac1n\sum_e Z_eZ_e''\ \ (T^h=nR^2_{\mathrm{uncentred}}\ \text{of }1\text{ on }Z_e'');\qquad \tau>1{:}\ \hat\Omega=\frac1n\sum_t Z_tZ_t''+\frac1n\sum_{j=1}^{\tau-1}w_{n,j}\sum_t\big(Z_tZ_{t-j}''+Z_{t-j}Z_t''\big);\qquad h_e=1{:}\ t^{GW}=\sqrt n\,\bar Z/\sqrt{\hat\Omega},\ \text{support }H_A{:}\ E[\Delta_e]>0\ \text{at 5\% iff } t^{GW}>1.645;\qquad \text{CW: }\hat f_{t+\tau}=(y_{t+\tau}-\hat y_{1})^2-\big[(y_{t+\tau}-\hat y_{2})^2-(\hat y_{1}-\hat y_{2})^2\big],\ \text{reject if } t(\bar{\hat f})>1.645\ (5\%)'
  computable_form: 'dL[e] = L[P, e] − L[P+E, e] (positive favours event inputs; G1); Z[e] = h[e]·dL[e] with h[e] = 1 or (1, isFOMC[e]), where the merged 2024-06-12 origin has isFOMC = 1; Zbar = mean of Z over the n = 88 pooled origins; Omega = mean of Z Z'' (uncentred), or the month-sum variant Σ_months (Σ_{e in month} Z_e)(Σ_{e in month} Z_e)''/n; T = n·Zbar'' Omega⁻¹ Zbar compared with the χ²_q 0.95 quantile; one-sided q = 1 version t = √n·Zbar/√Omega compared with +1.645.'
  conventions: "H2 design (matched_supervised_comparator; G9): 2×2 arms P+E = (pre, 1) and P = (pre, 0), pretrained with and without event inputs, and S+E = (sup, 1) and S = (sup, 0), the equal-size supervised arms. P and S are the v = 0 arms of G9: every event-derived input is replaced by a fixed null token in pretraining and fine-tuning, generic calendar features are kept, and the arm is retrained end to end with identical architecture, data, seeds, data order and compute. Primary contrast (G5): the pretrained model's event-input gain Δ_e = L_{P,e} − L_{P+E,e} (G1: reference P, candidate P+E; positive favours event inputs), nested because P+E contains P; the month-cluster bootstrap decides it (block_bootstrap) and GW is its sensitivity test. The key secondary P+E vs S+E is non-nested (block_bootstrap, with diebold_mariano as sensitivity); the 2×2 interaction (L_P − L_{P+E}) − (L_S − L_{S+E}) is descriptive (G5). Unit (G2): the 88 pooled origins; the merged 2024-06-12 origin carries 1{FOMC} = 1 (our convention), so it counts as FOMC in the conditional test. GW validity (G6, G7): every arm is re-estimated at every refit on a fixed-length rolling window of m = 2,520 trading days; refits fall on the first trading day on or after 1 January and 1 July, and each re-runs the whole method (encoder pretraining, heads, event pathway, normalisation statistics) on data ending at least 5 trading days before both the refit date and the first origin the fit serves; asymptotics take n → ∞ with m fixed; expanding windows are excluded; the null concerns the forecasting methods including their estimation windows. Fallback (G6): if encoder pretraining cannot be refit, the encoders of all arms are frozen at the last pre-2022 fit and only heads are refit for all arms; GW's method-level claim is then dropped and DM and bootstrap results are presented as comparisons of fitted forecasters (McCracken 2020). One-sided test: the signed root t^GW of the q = 1 statistic against N(0,1), supporting event inputs at 5% when t^GW > 1.645 (our convention, since the χ² form is two-sided). Lag: event-indexed losses are treated as τ = 1 with the uncentred Ω̂ (martingale-difference null); because 10 CPI–FOMC pairs share day 1–5 trading days (9 once the same-day pair is one origin; G2), also report Ω̂ built from month sums of Z_e (our adaptation, matching block_bootstrap's clusters). Conditional test (descriptive, G5): h_e = (1, 1{FOMC_e})', q = 2, against the χ²_2 0.95 quantile (5.99), asks whether the gain differs by event type; every element of h_e must be known at the origin (event_input_availability), so realized surprises are admissible only with the close-of-day-0 origin; if it rejects, GW suggest Benjamini–Hochberg across the elements of h_e to see which drive it. Clark–West: only for scalar squared-error secondaries (e.g. one portfolio's variance forecast scored by MSE), one-sided against 1.282 (10%) or 1.645 (5%), OLS SE for one-step and HAC SE for overlapping multi-step forecasts; no analogue exists for the Stein/NLL loss (our inference recorded in verification). Under the fixed-length rolling refits Clark & West's own caveat applies (Sec. 4 of NBER TWP 326): with the window held fixed and the number of forecasts growing, the mean of the MSPE-adjusted differential converges to a generally non-zero value even under the nested null, so read the CW t as interval coverage for that mean, as they do, and keep GW as the test whose null matches the rolling scheme."
  inputs: ["per-origin losses of P and P+E, seed-averaged, from the G6 rolling refits", "origin-known test functions (event type, regime indicators)", "refit metadata for every arm: refit dates, window start and end (m = 2,520 trading days) and data cutoff"]
  guards_against: "Invalid inference for nested comparisons: undersized raw DM tests under recursive estimation and diverging statistics for fit-once models."
  typical_values: "Clark & West 2007 (NBER TWP 326): raw MSPE-normal tests of nested models had median size below 1% at nominal 10% over 48 designs; MSPE-adjusted tests had median size about 0.08 at 10% and 0.04 at 5%; rolling-window forecasts were better sized than recursive ones. Giacomini & White 2006 (2003 working paper): n = T − τ − m + 1 forecasts from a rolling window of m observations, χ²_q critical values. Our setting: m = 2,520 trading days with semiannual refits (G6), n = 88 pooled origins, χ²_2 0.95 quantile 5.99."
  pitfalls: "Expanding-window refits void GW's asymptotics. A frozen encoder with only heads refit is not a full rolling refit: under the G6 fallback the method-level claim is dropped (McCracken 2020). CW's adjustment is quadratic-loss algebra and does not transfer to Stein/NLL. SPA's asymptotic normality also fails when the benchmark is nested in all alternatives under recursive estimation (Hansen 2005). Test functions built from post-origin information leak. The q = 1 χ² test is two-sided; one-sided claims use its signed root. Passing L_{P+E} − L_P instead of the gain flips the tail (G1). An event-input gain can be a generic improvement on all days: report the matched non-event-day gain (event_vs_nonevent_did) and the shuffled-input placebo (event_placebo)."
