- id: "purged_cv_embargo"
  name: "Purging and embargo of overlapping labels (walk-forward edges, early-stopping blocks, CPCV)"
  category: "protocol"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical (G14). Original: López de Prado 2018 (AFML Ch. 7, §7.4), located from Wiley's table of contents only; the book text was not read. The overlap and embargo rules and the h ≈ 0.01T suggestion come from López de Prado 2018 WP (published in The Journal of Portfolio Management 44(6); read as the 27 January 2018 working paper), whose Solution 8 text and equation glyphs were decoded from the PDF; the formulas below follow that version. The pre-gap g = 5 generalises global decisions G6 and G8 (a 5-trading-day gap before every refit and every early-stopping block)."
  priority: "must"
  plain_english: "If a training example's 5-day target window overlaps the period being forecast, the model has partly seen the answer. Purging removes those training examples, a 5-trading-day gap keeps all training data clear of the first forecast, and an embargo also removes training examples that start right after a held-out block."
  formula: '\text{purge } i\iff\exists j:\ t_{j,0}\le t_{i,0}\le t_{j,1}\ \lor\ t_{j,0}\le t_{i,1}\le t_{j,1}\ \lor\ t_{i,0}\le t_{j,0}\le t_{j,1}\le t_{i,1};\qquad \text{embargo } i\iff\exists j:\ t_{j,1}\le t_{i,0}\le t_{j,1}+h;\qquad \text{gap } i\iff\exists j:\ t_{j,0}-g\le t_{i,1}<t_{j,0};\qquad \text{keep } i\iff\forall j:\ t_{i,1}<t_{j,0}-g\ \lor\ t_{i,0}>t_{j,1}+h;\qquad [t_{i,0},t_{i,1}]=[t_i+1,\ t_i+H];\qquad g=5;\quad h=0\ \text{(walk-forward edge, early-stopping block)},\quad h=\max(5,\lceil0.01T\rceil)\ \text{(CPCV)}'
  computable_form: 'drop[i] = OR over held-out label intervals j of (a_i ≤ d_j + h AND b_i ≥ c_j − g), with training bounds (a_i, b_i) = (t_i + 1, t_i + H) (for a pretraining sample, the first and last day it reads) and held-out bounds (c_j, d_j) in trading-day indices; for one contiguous held-out block use c = its first label start and d = its last label end. Walk-forward edge and early-stopping block: g = 5, h = 0; CPCV: g = 5, h = max(5, ⌈0.01T⌉).'
  conventions: "Label interval of a sample with origin t: [t+1, t+H] in trading days, H = 5 (H = 6 for the day −1 origin, so day 0 is covered); for a pretraining sample, t_{i,0} and t_{i,1} are the first and last day its context or prediction target reads. One mask function implements the keep-rule: López de Prado's three overlap conditions plus the embargo (the white paper implements the embargo by extending each test label to t_{j,1} + h before purging), plus a pre-gap g, so training samples end more than g trading days before the first label day of a later held-out block; g = 0 recovers his rule and g = 5 is our generalisation of G6. Where it applies: (1) walk_forward's leading edge, g = 5, h = 0: every training sample of refit j ends at or before c_j = s_j − 5 (G6, G7), and nothing trains on data after the served origins; (2) the early-stopping block of every refit (G8: last six calendar months of the window), g = 5, h = 0 (our reading of G8's 5-trading-day purge, so the inner split mirrors the outer one); (3) cpcv on validation data, where training groups follow test groups: g = 5 and h = max(5, ⌈0.01T⌉), T = number of observations, plus a sensitivity run at h = L_max for the final configuration, because only h ≥ L removes training samples whose input lookback L covers the held-out block's returns (our inference; S4 used a 252-day embargo with a 252-day lookback and horizon). Purged K-fold CV is not used: all tuning uses walk-forward validation forecasts (G8), and cpcv covers the multi-split diagnostic. Event-level samples use the event's own label interval, so a CPI–FOMC pair whose intervals overlap is handled by the same rule: if one is held out, the other is purged from training; under the secondary origin (label days 0–5) pairs exactly 7 calendar days apart (9 of the 19 locked-window pairs, G2) also overlap, on the later announcement day. Normalisation statistics are fitted on the kept training data only. Every model and baseline uses identical splits, purge and embargo. The locked 2022–2026 window is never a fold."
  inputs: ["sample origins and label intervals [t+1, t+H], or the first and last day read by each pretraining sample", "input lookback length per model", "held-out blocks: the origins served by a refit, the early-stopping block, CPCV test groups", "pre-gap g = 5 and embargo h"]
  guards_against: "Leakage through overlapping 5-day targets and through post-block training inputs that contain held-out returns, which inflates validation scores and misguides tuning."
  typical_values: "López de Prado 2018 WP (Solution 8, working paper of 27 January 2018): a small h ≈ 0.01T often suffices to prevent all leakage. Ours: g = 5 trading days before every held-out block (G6, G8); h = max(5, ⌈0.01T⌉) after a block only where training data follow it (cpcv). S4 CD-DFM: 252-day embargo between chronological splits (252-day lookback and horizon). S2 Mahns+: 21-day purge buffer between splits for transition tasks. S3 STOCK-JEPA: samples whose 21-day targets cross split boundaries are dropped; no separate embargo in the main experiments (21-session embargoes only in its synthetic study). S12 Bongiorno+: one-day gap between input and out-of-sample windows. S17 causal-jepa: splits by event because consecutive 24-minute windows share 20 minutes, but at random with no embargo. S10 Gençay: one held-out window and a one-day execution lag, no purging."
  pitfalls: "Shuffled K-fold is not licensed here: Bergmeir+ 2018 (abstract) show standard K-fold CV is valid for purely autoregressive models with uncorrelated errors, which our exogenous event inputs and overlapping targets do not satisfy. Purging on feature windows instead of label windows misses label overlap, and a 5-day embargo does not remove long input lookbacks covering the held-out block. Forgetting H = 6 for the day −1 origin leaves day-0 overlap. Normalisation statistics fitted on all data leak. Any split with training data after the held-out block (cpcv) serves diagnostics only, never selection (G8) or performance claims. A pretraining sample whose context or target crosses the cutoff leaks even when supervised labels are purged; mask on the full span each sample reads. S16 states purging and embargo as a rule without an implementation: implement and unit-test it."
