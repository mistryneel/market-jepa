    libraries: ["numpy", "pandas", "arch"]
    notes: "Generate the H1 origins and the asset sets U_t once from the pinned calendar and freeze them before unlocking; on an NYSE calendar with the 2025-01-09 closure the generator must give 566 origins in 54 months. Compute per-origin Δ_NLL and Δ_GMV for each member of S; run the month-cluster bootstrap once with one shared index matrix; decide from LB > −δ for all eight checks; compute MCS membership as model_confidence_set specifies, passing size, block_size and reps = 10,000 explicitly when arch.bootstrap.MCS is used. Checks: a baseline compared with itself gives Δ = 0 and passes any positive margin; in pre-2022 simulation, shifting ours' loss up by exactly the margin gives rejection rates near 5% per check; swapping roles mirrors the bootstrap distribution."
