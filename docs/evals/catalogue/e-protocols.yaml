- id: "block_bootstrap"
  name: "Paired month-cluster bootstrap (deciding test) with a stationary-bootstrap sensitivity (Politis–White block length)"
  category: "stat_test"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical for the block bootstrap: originals Künsch 1989 (moving blocks; metadata only, definition via Politis & White 2004) and Politis & Romano 1994 (stationary bootstrap; abstract only), with the automatic block length of Politis & White 2004 and its correction, opened on 2026-11-12 as 'Patton+ 2009'. Using calendar months as resampling clusters for the primary test is our design, grounded in S1's per-month paired differences and S10's paired block bootstrap."
  priority: "must"
  plain_english: "To decide whether a candidate model beats a reference, compute each origin's gain (the reference's loss minus the candidate's), then resample whole calendar months of origins 10,000 times, keeping both models' losses for each origin together. The candidate is supported if the lower 5% bound of the resampled mean gain is above zero. Resampling months respects the correlation between nearby events and their overlapping windows."
  formula: '\Delta_o=L_{\mathrm{ref},o}-L_{\mathrm{cand},o},\quad \bar\Delta=\frac1N\sum_{o=1}^{N}\Delta_o;\qquad T_c=\sum_{o\in S_c}\Delta_o,\ n_c=|S_c|,\ c=1,\dots,C;\qquad \bar\Delta^{*}_b=\frac{\sum_{g=1}^{C}T_{c^{*}_{b,g}}}{\sum_{g=1}^{C}n_{c^{*}_{b,g}}},\ c^{*}_{b,g}\overset{iid}{\sim}\mathrm U\{1,\dots,C\},\ b=1,\dots,B;\qquad LB=\bar\Delta^{*}_{(r)},\ r=\lfloor0.05(B+1)\rfloor\ (=500\ \text{for}\ B=10{,}000);\qquad \text{superiority: support the candidate iff } LB>0;\quad \text{non-inferiority with margin }\delta>0\text{: iff } LB>-\delta;\qquad p_{x}=\frac{1+\#\{b:\bar\Delta^{*}_b\le x\}}{B+1},\ x\in\{0,-\delta\},\quad LB>x\iff p_{x}\le0.05;\qquad b_{\mathrm{opt,SB}}=\Big(\frac{2G^2}{D_{SB}}\Big)^{1/3}N^{1/3},\ D_{SB}=2g^2(0);\quad b_{\mathrm{opt,CB}}=\Big(\frac{2G^2}{D_{CB}}\Big)^{1/3}N^{1/3},\ D_{CB}=\tfrac43g^2(0);\quad \hat G=\sum_{k=-M}^{M}\lambda(k/M)|k|\hat R(k),\ \hat g(0)=\sum_{k=-M}^{M}\lambda(k/M)\hat R(k),\ \hat R(k)=\frac1N\sum_{i=1}^{N-|k|}(X_i-\bar X)(X_{i+|k|}-\bar X),\ \lambda(t)=1\ (|t|\le\tfrac12),\ 2(1-|t|)\ (\tfrac12\le|t|\le1),\ 0\ \text{otherwise}'
  computable_form: 'Inputs Δ[o] = L_ref[o] − L_cand[o] (each arm seed-averaged) and cluster[o]. T[c] = sum of Δ over cluster c; n[c] = number of origins in c (C clusters). Draw a B × C matrix of cluster indices uniformly with replacement from the analysis''s recorded RNG seed (B = 10,000). Dstar[b] = (sum of T over row b)/(sum of n over row b). LB = the r-th smallest Dstar with r = floor(0.05·(B + 1)) = 500 (0-based index 499 of the sorted array). Two-sided 95% interval = 2.5th and 97.5th percentiles of Dstar. p = (1 + count of Dstar ≤ 0)/(B + 1), with ≤ −δ for non-inferiority. Support the candidate iff LB > 0 (non-inferiority: LB > −δ); this holds exactly when p ≤ 0.05. Reuse the analysis''s index matrix for every contrast and endpoint within that analysis.'
  conventions: "Orientation (G1; the input contract for every entry that calls this routine): each contrast names a reference R and a candidate C, the arm claimed better or non-inferior, and the routine receives the gain Δ_o = L_R,o − L_C,o per origin (for GMV Δ = log V_R − log V_C; for a difference-in-differences Δ_DiD = Δ_event − Δ_matched-nonevent); positive favours the candidate. Superiority: H_0: E[Δ] ≤ 0 against H_A: E[Δ] > 0, one-sided at 5%, decided by LB > 0, where LB is the one-sided 95% percentile lower bound of the bootstrap distribution of Δ̄, taken as the ⌊0.05(B + 1)⌋-th smallest replicate mean (the 500th of B = 10,000; our convention, which makes LB > 0 exactly equivalent to p ≤ 0.05). Non-inferiority with margin δ > 0: support iff LB > −δ (p counts replicates ≤ −δ). Contrasts written elsewhere as loss differences (L_C − L_R) are negated before entering. Hypotheses are labelled H_0 and H_A; H1 always means the project hypothesis. Loss: per-asset NLL of the origin's forecast over its target window (days 1–5 at the close-of-day-0 origin, days 0–5 at the close-of-day −1 origin; stein_loss, event_timing_origin), both arms scored on the identical asset set (G10), each arm's per-origin losses averaged over its K pre-registered seeds first (seed_vs_period); the two-stage months-then-seeds bootstrap is a secondary report (G3, seed_vs_period). Unit (G2): the origin, not the event: 88 pooled origins in the locked window from 36 FOMC decisions and 53 CPI releases (the 2024-06-12 CPI and FOMC share one origin, forecast and target and count once), 36 in FOMC-only and 53 in CPI-only runs with that origin in both; the same holds for the close-of-day −1 origin. Clusters (G3): calendar month (ET) of the event's day 0, also for the close-of-day −1 origin when day −1 falls in the previous month (FOMC 2023-02-01, 2023-11-01 and 2024-05-01; our recount). The locked window has C = 53 event-months, 35 with two origins and 18 with one (by event, 36 and 17); November 2025 has none (no FOMC meeting, and the October 2025 CPI was cancelled). All 19 CPI–FOMC pairs within 7 calendar days fall inside one month: 10 share trading days in their day 1–5 windows, and in the other 9, exactly 7 days apart, the earlier window ends on the later announcement day (G2; our recount from the official calendars with an assumed NYSE holiday list); assert in code that no pair with overlapping windows straddles a month boundary. Each month holds at most one event of each type, so per-type runs are i.i.d. bootstraps over events (event_level_inference). Algorithm: the event-weighted ratio estimator above with B = 10,000. Separate draws per analysis (G3): one B × C index matrix with its own recorded seed for the H2 event origins (C = 53), one for the H1 ordinary-day origins (clusters = calendar month of the origin date; h1_noninferiority_test) and one for the DiD (event months with their matched non-event origins inside the same month; event_vs_nonevent_did); within an analysis the same matrix is reused for every contrast and endpoint, which keeps intersection–union and Holm statements coherent. Report Δ̄, LB, the two-sided 95% percentile interval, p, B, C and N, plus FOMC-only and CPI-only runs. The Monte Carlo SE of p near 0.05 is about 0.002 (our arithmetic). Failures (G13): a forecast that is non-finite or fails Cholesky after the shared PD repair (G12) is a failure; a failure in any seed counts for that arm and origin (our convention). Any failure of the candidate on an origin of the analysis voids its one-sided claim for that contrast (reported; it enters multiple_testing with p = 1); an origin where only the reference fails is removed from that contrast only and disclosed with counts. Failures are never dropped or replaced silently. Pre-registered sensitivity (G3): stationary bootstrap on the origin series ordered by day 0, with expected block length b̂_SB from Politis–White applied to Δ with the Patton–Politis–White 2009 correction (new-block probability q = 1/b̂_SB, Hansen 2005's index recursion with wrap-around) and the same LB rule. Descriptive checks, never decisive: circular block bootstrap with block length round(b̂_CB); blocks of two consecutive calendar months (for cross-month volatility persistence); a studentized month-cluster bootstrap with t_obs = Δ̄/SE_CR, t*_b = (Δ̄*_b − Δ̄)/SE*_CR,b, SE_CR the cluster-robust SE of event_level_inference recomputed on each replicate, and p_t = (1 + #{b: t*_b ≥ t_obs})/(B + 1), the kind of bootstrap Ledoit & Wolf 2011 prefer in small samples. Politis–White details: R̂(k) demeaned with divisor N; M = 2m̂, where m̂ is the smallest positive integer with |ρ̂(m̂ + k)| < 2√(log10 N / N) for k = 1..K_N, K_N = max(5, √log10 N); if ĝ(0) ≤ 0 or Ĝ = 0 use block length 1 and log it (our convention). Name the implementation: arch's optimal_block_length uses K_N = max(5, ⌊log10 N⌋), caps M at ⌈√N⌉ + K_N, caps both block sizes at ⌈min(3√N, N/3)⌉ and needs N ≥ 11."
  inputs: ["per-origin losses of the reference and candidate arms on identical asset sets, seed-averaged", "origin dates, event types and day-0 dates", "cluster keys: calendar month (ET) of day 0 for event origins, of the origin date for H1 origins", "B = 10,000 and one recorded RNG seed per analysis", "failure flags (non-finite or failed Cholesky after the shared repair) per arm, origin and seed", "margin δ for non-inferiority contrasts"]
  guards_against: "Overstated significance from treating events or overlapping windows as independent, and broken pairing between the two models' losses."
  typical_values: "Locked window (G2; our recount from the FOMC calendar and BLS CPI schedule with an assumed NYSE holiday list): 88 pooled origins (89 events) in 53 event-month clusters, 35 with two origins and 18 with one; per type, 36 FOMC origins in 36 months and 53 CPI origins in 53 months; H1: 566 ordinary-day origins in 54 origin months (h1_noninferiority_test). Patton+ 2009 corrected Table 1: for an AR(1) with coefficient 0.7, b_opt,SB = 11.47 and b_opt,CB = 13.12 at N = 200, and 18.20 and 20.83 at N = 800; across corrected Tables 2–3 the mean ratio of estimated to optimal size lies between 0.86 and 1.14. Hansen+ 2011: block length 2 in simulations (n = 250, B = 1,000) and 12 in the monthly application (similar with 6 and 9). Laurent+ 2012 (2010 WP): 10,000 bootstrap samples. Ledoit & Wolf 2011: simulations with T = 120 and 499 resamples, block size chosen from {1, 2, 4, 6, 8, 10}. S10 Gençay: stationary-bootstrap 95% CI for an evaluation-window Sharpe of 0.18 was [−0.80, +1.14] (2022–2025). For N = 88 origins arch caps block sizes at ⌈min(3√88, 88/3)⌉ = 29 (our arithmetic)."
  pitfalls: "About 53 clusters is few: percentile intervals can be miscalibrated, so check size by simulation on pre-2022 data (power_mde) and report the studentized check, the kind of bootstrap Ledoit & Wolf 2011 prefer in small samples. A contrast fed in the loss-difference orientation tests the wrong tail: every caller passes Δ = L_ref − L_cand (G1). Resampling events independently ignores overlapping CPI–FOMC windows, and resampling each model's losses separately destroys pairing. Politis & White 2004's D_SB is wrong; use the 2009 correction. arch's implementation differs from the paper's constants, so pin the version and name it. Stationary and block bootstraps assume an evenly spaced series, but events are irregular, one reason months are primary (our reasoning). arch's documentation advises against the moving-block bootstrap because it under-samples the series ends; use the circular version. S1 treats months as independent (SE = s_d/√M), S10 gives no block settings and S2 does not state its scheme, so none of them fixes our parameters."
