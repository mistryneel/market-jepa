  status_note: "Kept canonical (original Bailey+ 2017; eScholarship version read). It measures overfitting of the selection among the trial ledger's configurations on development data, not significance against baselines."
  priority: "nice"
  plain_english: "Split the development period into blocks, pick the best configuration on half of them and see where it ranks on the other half, for every way of halving. The probability of backtest overfitting is how often the in-sample winner lands in the bottom half out of sample."
  formula: 'M\in\mathbb R^{T\times N},\ \#C_S=\binom{S}{S/2};\quad n^{*}_c=\arg\max_n R^{c}_n,\ \bar\omega_c=\frac{\bar r^{c}_{n^{*}_c}}{N+1},\ \lambda_c=\ln\frac{\bar\omega_c}{1-\bar\omega_c};\quad \widehat{PBO}=\frac{1}{\#C_S}\sum_{c\in C_S}\mathbb 1\{\lambda_c\le0\};\qquad PBO=\sum_{n=1}^{N}\Pr\big[\bar r_n<N/2\mid r\in\Omega^{*}_n\big]\Pr\big[r\in\Omega^{*}_n\big]'
  computable_form: 'M (T × N): per-period performance, higher is better. Split rows into S contiguous blocks. For each of the C(S, S/2) choices J of half the blocks (kept in time order): n* = argmax of the mean over J; r = rank of n* in the mean over the complement (1 = worst, N = best, average ranks for ties); ω = r/(N + 1); λ = ln(ω/(1 − ω)). PBO = share of choices with λ ≤ 0.'
  conventions: "Rows of M: the 60 calendar months of the validation period 2017-01-01..2021-12-31 (G8), scored by the walk-forward refits of G6; never test-window data. Entry = performance with higher better: −(mean per-asset NLL of configuration n over that month's validation origins, the selection criterion of baseline_tuning_parity). Columns: every configuration in the trial ledger evaluated on those rows (cols(M) = N). S = 20 contiguous blocks of three months (calendar quarters), so no row is dropped and there are C(20, 10) = 184,756 combinations (our choice and arithmetic: Bailey+'s default S = 16 does not divide 60 months, and quarter-length blocks are what their S = 16 gives on four years of daily data). For each combination, R^c_n and R̄^c_n are mean performance on the chosen and complementary blocks. Ranks ascend with N = best; ties get average ranks and λ = 0 counts as overfit (our conventions; the paper asks that the tie rule be documented). Report PBO, the histogram of λ_c and the out-of-sample against in-sample performance of the selected configuration (performance degradation). Bailey+ mention rejecting configurations with PBO > 0.05 as a Neyman–Pearson-style convention. Definitions follow the eScholarship version of Bailey+ 2017 (revised February 2015)."
  inputs: ["T × N matrix of per-period validation performance from the trial ledger", "S"]
  guards_against: "Selection overfitting: choosing a configuration whose in-sample rank does not carry over out of sample."
  typical_values: "Bailey+ 2017 (eScholarship version): S = 16 gives C(16, 8) = 12,870 combinations (the version read prints 12,780, an arithmetic slip); with four years of daily data each block is about a quarter. Our setting: 60 validation months in S = 20 quarterly blocks, C(20, 10) = 184,756 combinations (our arithmetic). S10 Gençay: PBO 0.83 (E2 factor search, N = 9), 0.01 (E3 gpt-4.1, N = 102), 0.11 (E3 grid variant, N = 21), 0.51 (E3 claude-sonnet-5), 0.91 (E4 top-300 universe variant), 0.80 (E5 39-ETF search, N = 20)."
  pitfalls: "PBO is coarse when N is small, since N must be large enough for rank granularity (Bailey+ 2017). Rows must be synchronous across configurations (same periods and assets). 'In-sample' means the selection sample, not the training sample. Blocks must be contiguous; shuffling breaks serial dependence. PBO says nothing about leakage or superiority over baselines. Building M from test-window data turns PBO into test-set selection."
  used_by:
    - ref: "Bailey+ 2017"
      title: "The probability of backtest overfitting"
      authors: "Bailey, D.H., Borwein, J.M., López de Prado, M. & Zhu, Q.J."
      year: 2017
      venue: "Journal of Computational Finance, 20(4), 39–69"
      url: "https://doi.org/10.21314/JCF.2016.322"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "eScholarship version (revised Feb 2015) read; Journal of Computational Finance version not read"
      accessed: "2026-11-12"
      how_used: "original definition: defines PBO and its CSCV estimator, with S = 16 as the suggested default."
