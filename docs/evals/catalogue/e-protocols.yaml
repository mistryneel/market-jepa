- id: "trial_ledger"
  name: "Ledger of every configuration evaluated"
  category: "protocol"
  section: "E"
  status: "emerging"
  status_note: "Kept emerging: introduced in this form by S10 Gençay (2026 preprint), which ties ledger size to its deflation and PBO; Arnott+ 2019 and S17 give logging precedents."
  priority: "should"
  plain_english: "Keep an append-only record of every model configuration ever scored, including failures, so the amount of searching is auditable. The record also supplies the trial counts that overfitting checks need."
  formula: 'N=\#\{\text{distinct configurations evaluated on selection data}\},\qquad M\in\mathbb R^{T\times N},\ \mathrm{cols}(M)=N;\qquad \bar\rho=\frac{2\sum_{i=1}^{N}\sum_{j=i+1}^{N}\rho_{ij}}{N(N-1)},\qquad \hat N_{\mathrm{eff}}=\bar\rho+(1-\bar\rho)N'
  computable_form: 'row = {run_id, utc_time, git_commit, config_sha256, arm, seed, data_sha256, refits: [{refit_id, train_start, train_end, data_cutoff, first_origin}], val_window, metrics, n_failed_forecasts, loss_vector_path, status, reason, planted_flag}; N = number of distinct config_sha256 with status completed and planted_flag false; M = per-month validation performance with one column per such configuration (pbo_cscv); ρ_ij = correlation of columns i and j.'
  conventions: "One append-only row per evaluation of a configuration on development data, which is the validation period 2017-01-01..2021-12-31 scored through the walk-forward refits of G6 (G8): run id, UTC timestamp, git commit, canonical-JSON configuration and its SHA-256, arm (2×2 cell or baseline), seed, data-snapshot hash, for every refit its id, training-window start and end, data cutoff and first origin served (the cutoff at least 5 trading days before that origin; G6, G7), validation window, scalar validation metrics, the count of failed forecasts (non-finite or failed Cholesky after the shared repair; G13), a pointer to the per-month loss vector (for pbo_cscv and reality_check_spa_stepm), status (completed, failed or aborted) with reason, and a flag for planted or demonstration runs, which are logged but excluded from N (as S10 does). Written only by the run driver. Counting (our convention): N counts distinct configurations; the K seeds of one configuration count once, and the run count is reported too. Locked-window accesses are logged separately and should be exactly one confirmatory run per registered analysis. Report N per family: our variants, each baseline, event-encoding variants. ρ_ij is the correlation between two configurations' per-month validation losses; report N̂_eff (Bailey & López de Prado 2014, App. A.3, eqs. 8–9 of the 31 July 2014 author copy read) next to N. The PBO matrix takes its columns from the ledger, with cols(M) = N enforced (as in S10)."
  inputs: ["run driver hooks", "configuration objects", "data-snapshot hashes", "per-period validation losses"]
  guards_against: "Hidden search intensity: unreported configurations that inflate apparent significance and make deflation, PBO or data-snooping corrections impossible to compute."
  typical_values: "S10 Gençay ledger sizes: E2 N = 9; E3 gpt-4.1 N = 102 (100 composed, 99 valid, 22 distinct feature combinations); E3 grid variant N = 21; E4 N = 18 per seed; E5 N = 20; E6b N = 1. Over its 102 trials the best design Sharpe rose from −0.07 to 1.69 while the deflation threshold reached 1.21 (final DSR 0.86 < 0.95), and a 10,000-candidate search faces a bar about 1.5× that of a ~100-candidate one. S1 Market-1T: up to 125 tuning runs plus 32 final runs per method. Bailey & López de Prado 2014 worked example (31 July 2014 author copy; variance of trial Sharpes 1/2 annualised, 1,250 daily observations, skewness −3, kurtosis 10, annualised SR 2.5): DSR 0.9004 with N = 100 trials and 0.9505 with N = 46."
  pitfalls: "Trials are correlated, so N overstates independent trials; N̂_eff needs a trial-correlation matrix that is ill-conditioned when trials outnumber periods (Bailey & López de Prado 2014). Interactions multiply the effective number of tests (Arnott+ 2019). S16 deflates Sharpe ratios without stating the number of trials, which a ledger prevents. Deflation does not detect leakage: S10's planted look-ahead oracle passed the DSR (planted_leak_test). Hand-edited or selectively logged ledgers lose their audit value; log failures too."
