- id: "multiple_testing"
  name: "Holm (FWER) and Benjamini–Hochberg (FDR) corrections with pre-registered families"
  category: "stat_test"
  section: "E"
  status: "canonical"
  status_note: "Kept canonical (originals Holm 1979 and Benjamini & Hochberg 1995, read only at metadata level; formulas checked against R's p.adjust source and statsmodels' multipletests documentation, both opened on 2026-11-12, and against Harvey+ 2016, read as NBER WP 20592). Priority must: the global decisions pre-register Holm for H2's key secondaries and for H3's transfer contrasts and BH for H4 (G5), and fix H1 as an intersection–union without adjustment (G4)."
  priority: "must"
  plain_english: "When many hypotheses, endpoints or subgroups are tested, some will look significant by chance. Holm's method keeps the chance of any false claim at 5%; Benjamini–Hochberg keeps the expected share of false claims low, which suits exploratory lists."
  formula: '\text{Holm: }p_{(1)}\le\dots\le p_{(m)},\ \text{reject }H_{(k)}\ \text{for } k=1,2,\dots\ \text{while } p_{(k)}\le\frac{\alpha}{m+1-k};\quad \tilde p_{(i)}=\min\Big\{1,\ \max_{j\le i}(m-j+1)p_{(j)}\Big\};\qquad \text{BH: } k^{*}=\max\{k:\ p_{(k)}\le\tfrac{k}{m}q\},\ \text{reject }H_{(1)},\dots,H_{(k^{*})};\quad \tilde p_{(i)}=\min\Big\{1,\ \min_{j\ge i}\tfrac{m}{j}p_{(j)}\Big\};\qquad \text{BY: } c(m)=\sum_{j=1}^{m}\tfrac1j,\ \tilde p_{(i)}=\min\Big\{1,\ \min_{j\ge i}\tfrac{c(m)\,m}{j}p_{(j)}\Big\}'
  computable_form: 'Holm: sort p ascending; adj_(i) = min(1, running maximum of (m − i + 1)·p_(i)). BH: adj_(i) = min(1, running minimum from the largest index down of (m/i)·p_(i)). BY: as BH with the factor c(m) = Σ_{j=1}^{m} 1/j. Restore the original order; reject where adj ≤ α (FWER) or ≤ q (FDR).'
  conventions: "Families (pre-registered; G5). Inputs are one-sided p-values in the G1 orientation (gain Δ = L_ref − L_cand, H_A: E[Δ] > 0), normally the month-cluster bootstrap p = (1 + #{b: Δ̄*_b ≤ 0})/(B + 1) of block_bootstrap, each computed on its own analysis's index matrix (G3). H1–H4 are separate pre-registered hypotheses; no adjustment is made across them. F0, H2 primary: one test, P+E vs P (Δ = L_P − L_{P+E}) on per-asset NLL at the close-of-day-0 origin over the 88 pooled origins, decided by LB > 0 at 5% without adjustment (block_bootstrap, nested_model_tests). F1, H1 (G4): intersection–union without adjustment; H1 is supported only if all 8 one-sided 5% non-inferiority checks pass (NLL and GMV against each of DCC-NL, QIS, the fundamental factor model and EWMA; h1_noninferiority_test). Holm across the co-primaries is not used. F2, H2 key secondaries: Holm at familywise 5% across m = 4 hypotheses: (i) P+E vs S+E, non-nested (Δ = L_{S+E} − L_{P+E}; matched_supervised_comparator), bootstrap p; (ii) the difference-in-differences of the primary contrast, Δ_DiD = Δ_event − Δ_matched-nonevent (event_vs_nonevent_did), bootstrap p; (iii) the event placebo, p = max(p_perm, p of G − G^plac > 0), because event_placebo's pre-registered reading needs both (intersection–union; our convention), with p = 1 if its availability check fails (V ≠ 0); (iv) the untrained-encoder floor contrast on the 88 pooled origins (untrained_encoder_floor), bootstrap p. Holm thresholds are 0.0125, 0.0167, 0.025 and 0.05 (our arithmetic); a member is claimed iff its Holm-adjusted p ≤ 0.05. F3, H4 (exploratory): Benjamini–Hochberg at q = 0.10 across every pre-registered lag and outcome of surprise_leads_vol; results are labelled exploratory; BY-adjusted p-values (Harvey+ 2016's choice under arbitrary dependence) may be shown as a robustness column but do not decide. F4, H3: Holm at 5% across the transfer contrasts pre-registered in transfer_protocol. Everything else is descriptive (G5) and reported with raw p-values or intervals, never as claims: breakdowns by event type, day 1..5, year or regime and sector; the 2×2 interaction; the close-of-day −1 origin; endpoints other than H1's co-primaries and the family members above; sensitivity analyses (stationary bootstrap, DM-HLN, GW, MCS, sample variants). m counts every hypothesis in the family and is fixed before unlocking; a hypothesis whose claim is voided by the failure rule (G13) or whose p-value cannot be computed enters with p = 1. In R call p.adjust(p, method, n = m) explicitly: the default n = length(p) is evaluated only after NA p-values are dropped, so it counts the non-missing ones only. statsmodels' multipletests has no n argument and does not document NaN handling, so pass the full vector with 1.0 for every void or missing hypothesis, which reproduces R's treatment of unobserved p-values under Holm, BH and BY. In statsmodels pass method='holm' or 'fdr_bh' explicitly, because the default 'hs' is Holm–Šidák. Report raw and adjusted p-values."
  inputs: ["one-sided p-values per hypothesis in the G1 orientation", "pre-registered family membership and m per family", "void or missing flags (entered as p = 1)", "α (FWER) and q (FDR)"]
  guards_against: "Inflated false positives when many hypotheses, endpoints, subgroups or lags are tested."
  typical_values: "Harvey+ 2016 (NBER WP 20592): after multiple-testing adjustment a new factor needs a t-ratio above 3.0 rather than 2. S15 Li+: six non-overlapping subsample tests at 1% give a joint level of 1 − 0.99^6 ≈ 5.85%. Ledoit & Wolf 2017 computed a p-value for one pair only, to avoid 55 multiple comparisons. Holm with m = 4 (the H2 key-secondary family) at α = 0.05: thresholds 0.0125, 0.0167, 0.025 and 0.05 (our arithmetic)."
  pitfalls: "The BH paper was not read, so its exact dependence conditions are unverified here; statsmodels says its procedures control FWER/FDR under independence and are mostly robust to positive correlation, and Harvey+ 2016 give BY for arbitrary dependence. Families defined after seeing results defeat the purpose. Holm is valid but conservative under dependence; StepM uses the joint bootstrap distribution instead (reality_check_spa_stepm). Intersection–union claims need no adjustment but have lower power. Every member of a family must use the G1 orientation; a loss difference fed where a gain is expected turns small p-values into large ones. R's default n silently shrinks m when a p-value is NA. The seeds show what happens without control: S5 reports none across hundreds of configurations, S17 none across many targets and readouts, S2 none across many tests."
