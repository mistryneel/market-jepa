- id: "label_efficiency"
  name: "Label-efficiency (training-sample) curve for the covariance head and its comparators"
  category: "protocol"
  section: "C"
  status: "emerging"
  status_note: "Kept emerging. S16 and S1 use sample-size curves on market data; the classic 1%/10% vision results (Chen+ 2020, Hénaff+ 2020, Assran+ 2023) are fine-tuning or deep-classifier results, so a frozen-head curve on our endpoint with block-sampled training months is our protocol."
  priority: "should"
  plain_english: "Train the covariance head and the comparators on 1%, 2%, 5% ... 100% of the training period and plot test loss against the fraction. If pretraining helps, the pretrained model should reach a given loss with less training data; this matters most for scarce event days and for crypto."
  formula: '\bar L(\phi;a)=\frac{1}{R}\sum_{r=1}^{R}\frac{1}{|E_{\mathrm{test}}|}\sum_{e\in E_{\mathrm{test}}}L_e\big(\hat\Sigma^{(a)}_{e;\phi,r}\big),\qquad G(\phi)=\bar L(\phi;\mathrm{sup})-\bar L(\phi;\mathrm{pre}),\qquad \phi^{\dagger}=\min\big\{\phi:\ \bar L(\phi;\mathrm{pre})\le\bar L(1;\mathrm{sup})\big\},\qquad \phi\in\{0.01,0.02,0.05,0.1,0.2,0.5,1\}'
  computable_form: '\mathcal{D}_{\phi,r}=\text{a set of }\max\big(1,\lceil\phi M_{\mathrm{tr}}\rceil\big)\text{ whole training months drawn without replacement with seed }r;\quad \mathcal{D}_{\phi_1,r}\subset\mathcal{D}_{\phi_2,r}\ \text{for}\ \phi_1<\phi_2;\quad \text{identical subsets for every arm}'
  conventions: "Arms, all trained on the same subsets D_{φ,r}: pre = the encoder of arm (pre, 0) of matched_supervised_comparator, frozen, with only the covariance head trained (the H1 head); sup = arm (sup, 0) trained end to end on D_{φ,r}; floor = untrained encoder + head (untrained_encoder_floor); base = head B of incremental_value_test, the same covariance probe on the pre-registered control features only, refitted on D_{φ,r} (our choice, the analogue of S16's linear baseline, which beat both deep arms at every label count). The members of the strong set S (G4) are drawn as horizontal reference lines at their full-data losses, because they are not trained on labelled windows. The encoder's self-supervised pretraining keeps its full unlabelled window in every case; only the label-using stages are subsampled, and the write-up must say so. Fractions follow Hénaff+ 2020's 1–100% grid. Subsampling (our design): at every walk_forward refit (G6), M_tr is the number of whole calendar months in that refit's training window before its early-stopping block; subsample whole months so every fraction keeps intact 5-day label windows, drawn uniformly across training years to cover regimes; subsets are nested; R = 5 repeats; identical subsets for every arm. The recipe is fixed across fractions (same head, optimiser, maximum steps and the hyper-parameters chosen on the pre-2022 validation period; no per-fraction re-tuning), and early stopping for every fraction uses the same block, the last 6 months of the refit's training window after a 5-trading-day purge, which is never subsampled (G8). Test sets: H1 ordinary-day origins (G4) and the 88 pooled H2 event origins (G2), scored with the v = 0 arms above; for H3, the crypto test origins with fractions of the crypto training months (arms FT, SC, LP, RF of transfer_protocol). H2 variant (our design): the number of training events N_ev ∈ {10, 20, 40, all} available to the event pathway, events drawn whole, with arms (pre, 1) and (sup, 1) scored on the 88 event origins. Report the curves with month-cluster bootstrap bands (block_bootstrap; B = 10,000; G3) and the spread over r; G(φ) is a gain, so G(φ) > 0 means pretraining helps at fraction φ (G1); report φ† as 'not reached' if no fraction qualifies; all of this is descriptive (G5). Count failures per fraction: non-convergence, and forecasts that are non-finite or fail Cholesky after the shared PD repair (G12, G13)."
  inputs: ["list of whole training months per walk_forward refit and the fraction grid", "R = 5 repeat seeds for month draws", "training recipes of the four arms (pretrained head, supervised comparator, untrained floor, controls-only head B of incremental_value_test)", "the G8 early-stopping block (last 6 months of each training window after a 5-trading-day purge) and the test sets (H1 ordinary-day origins, the 88 pooled H2 event origins, crypto origins)", "training event list for the H2 variant"]
  guards_against: "Over-claiming 'a small head suffices' from a single full-data comparison, and missing that pretraining may help only when training data are scarce (events, crypto)."
  typical_values: "S16 jepa-trader (blog; SPY+QQQ order book, IC at 0.1 s): at 1% of labels the frozen JEPA scores 0.067 vs 0.038 for the deep supervised model; the JEPA saturates by about 10%; a linear baseline beats both at every label count. S1 Market-1T: probe IC improves substantially with probe-training sample size (Fig. 4, no numbers), so its headline results use the full probe pool. Hénaff+ 2020 (ImageNet; deep classifier on CPC features, frozen then fine-tuned): 78.3% top-5 with 1% of labels vs 44.1% for a supervised ResNet-200, roughly 5× fewer labels in the low-data regime and 2× at high data. Chen+ 2020: the 1% and 10% ImageNet subsets hold about 12.8 and 128 images per class."
  pitfalls: "Vision label-efficiency results are fine-tuning or deep-classifier results, not frozen linear probes (Chen+ 2020, Hénaff+ 2020; Assran+ 2023 is internally inconsistent about its 1% protocol), so do not cite them as frozen-probe evidence. In our data labels are not scarce (future returns exist for every day): the curve measures sample efficiency over time and is confounded with regime coverage (S1: the evaluation month explains 97.2–99.9% of metric variance), so random month draws and repeats are essential. Tiny fractions can make heads fail or hit the PD repair; report failures. At small φ the supervised arm may early-stop very early, and a fixed recipe can disadvantage one arm; log the steps used. S16's curve comes from a single split with no confidence intervals."
  used_by:
