# Evaluation catalogue for the market world model paper, section C: Representation quality (14 of 125 entries).
# The catalogue is one file per section of the brief, a-risk.yaml to g-benchmarks.yaml in docs/evals/catalogue/,
# because the repository rejects committed files of 1 MB or more. Concatenate the files in name order for the
# full list; ids are unique across files.
# Generated 2026-11-12 from verified research records; every used_by source was opened on 2026-11-12.
# Defaults approved 2026-11-25: entries follow docs/evals/README.md ("Adopted defaults"); questions still open are in docs/evals/PROGRESS.md.
# Schema: the brief's schema plus the extensions documented in docs/evals/README.md ("Schema extensions"):
#   section (A-G), priority (must/should/nice/drop), status_note, computable_form, conventions, related,
#   status values our_design/reference/gap, categories baseline/dataset,
#   used_by[].ref/source_type/read_depth/version_read/accessed, benchmark fields used_by_papers/fit_for_us.
# Sources are listed in docs/evals/references.md (same labels as used_by[].ref).
- id: "untrained_encoder_floor"
  name: "Untrained (random-initialisation) encoder floor read out with the same head"
  category: "baseline"
  section: "C"
  status: "emerging"
  status_note: "Kept emerging as in the candidate list. Recent directly relevant precedents: S1 (Random ViT floor, NeurIPS 2026) and S17 (untrained-encoder control, code repository). Major+ 2026 (opened in this pass; time-series SSL preprint) pairs every pretrained model with a random frozen encoder as its probing control, so the entry may qualify as widely used at the next review. Hewitt & Liang 2019 is a conceptual precedent (control tasks), not a user of random encoders."
  priority: "must"
  plain_english: "Fit the same small covariance head on top of an encoder that was never trained (random weights, frozen). If the pretrained encoder cannot beat this floor, the head, the inputs or the architecture are doing the work, not pretraining."
  formula: '\Delta^{\mathrm{floor}}_e=\frac{1}{S}\sum_{s=1}^{S}\Big[L_e\big(g_{\hat\psi_0^{(s)}}\circ f_{\theta_0^{(s)}}\big)-L_e\big(g_{\hat\psi^{(s)}}\circ f_{\hat\theta^{(s)}}\big)\Big],\qquad L_e=\frac{1}{n_e}\Big[\log\det\hat\Sigma_e+\mathrm{tr}\big(\hat\Sigma_e^{-1}\Sigma^*_e\big)\Big],\qquad \Sigma^*_e=\frac{1}{5}\sum_{d=1}^{5}r_{e,d}\,r_{e,d}^{\top}'
  computable_form: '\bar\Delta^{\mathrm{floor}}=\frac{1}{|E|}\sum_{e\in E}\Delta^{\mathrm{floor}}_e;\qquad d_m=\frac{1}{|E_m|}\sum_{e\in E_m}\Delta^{\mathrm{floor}}_e,\quad \bar d=\frac{1}{M}\sum_{m=1}^{M}d_m,\quad \widehat{\mathrm{SE}}=\frac{s_d}{\sqrt{M}},\quad s_d^2=\frac{1}{M-1}\sum_{m=1}^{M}(d_m-\bar d)^2'
  conventions: "Notation: f_{θ0^(s)} is the encoder at its random initialisation with seed s (frozen), ψ̂0^(s) the head fitted on it; f_{θ̂^(s)} and ψ̂^(s) are the pretrained encoder and its head. L_e is the primary per-asset Gaussian NLL (forecast inverted), in nats per asset; Σ*_e uses uncentred daily returns over days 1–5 after the origin (close of announcement day 0), with overnight moves, the delisting return on the delisting day and 0 afterwards, and halted days as 0 (realized_covariance_target; G11). Contrast and orientation (G1): candidate = the pretrained arm, reference = the floor arm with the same event-input setting (v = 0 for H1 and v = 1 for H2; matched_supervised_comparator, G9); Δ^floor_e = L_e(floor) − L_e(pretrained) is a gain, so Δ^floor_e > 0 means the pretrained encoder beats the floor. Floor arm: the identical module graph (width, depth, tokenizer, input normalisation with training-window statistics, event-input pathway, readout/pooling) with the same initialiser; modules trained only during self-supervised pretraining stay at their random initial weights, and modules trained in the pretrained arm's head stage are trained in the floor arm too. For a JEPA, read out the same encoder module the pretrained arm uses (context or target encoder), never the predictor. Head and refits: identical architecture, loss (per-asset NLL on training origins), optimiser, step budget, early-stopping rule and logged tuning budget; the head is refit at every walk_forward refit date (first trading day on or after 1 January and 1 July) on the same rolling window of m = 2,520 trading days as the pretrained arm's head, with all training data ending at least 5 trading days before the refit date (G6, G7); the floor encoder is the seed-s initialisation at every refit. Tuning only on the pre-2022 validation period 2017-01-01 to 2021-12-31; early stopping on the last 6 months of each training window after a 5-trading-day purge (G8). Standardise head inputs per feature with training-window mean and SD in both arms, so the random encoder's arbitrary output scale does not matter. Seeds: S = 5, the shared paired seed list of seed_vs_period (K = 5), i.e. the same list as the pretrained arm (S17 pairs seeds; S1 averages five random seeds); average per-origin losses over seeds (not forecasts) and report the seed SD. Evaluation sets: (i) H1 ordinary-day origins (G4: no FOMC or CPI day 0 in {t−1, …, t+5}; stocks with their own earnings announcement in [t, t+5] dropped from that origin's asset set for both arms); (ii) the 88 pooled H2 event origins (36 FOMC and 53 CPI in the per-type runs, the 2024-06-12 origin once; G2); (iii) the H3 crypto origins, where the floor is arm RF of transfer_protocol. PD repair and failures: every forecast of both arms passes the shared repair (symmetrise, eigendecompose, floor eigenvalues at ε·tr(Σ̂)/n with the single ε of G12); a forecast that is non-finite or fails Cholesky after the repair is a failure, and an arm fails at an origin if any of its seeds fails; a pretrained-arm failure voids that contrast's one-sided claim (reported) and a floor-arm failure removes that origin from the contrast only, with counts (G13). Inference: paired month-cluster bootstrap of Δ̄^floor (block_bootstrap; B = 10,000; cluster = calendar month of day 0 for event origins and of the origin date for H1 origins; G3); the pretrained arm is supported iff the one-sided 95% percentile lower bound is above 0 (G1). Multiplicity (G5): the H2 floor contrast is one of the H2 key secondaries, Holm at 5% within that family (multiple_testing); the H1 floor contrast is descriptive; the H3 contrast (LP vs RF) is one of transfer_protocol's Holm-adjusted contrasts. S1's per-month SE (computable_form; ddof = 1, months treated as independent) is descriptive only. Print the floor beside every section-C representation metric (S1's repository asks that decode numbers never be quoted without it)."
  inputs: ["frozen pretrained encoder checkpoints per seed and per walk_forward fit, the encoder's module definition and its initialiser", "the shared list of K = 5 seeds (seed_vs_period) for random initialisation", "covariance-head architecture and training recipe (loss, optimiser, steps, early stopping, tuning budget)", "walk_forward refit dates and training windows (G6, G7) and the early-stopping block (G8)", "evaluation origins: H1 ordinary-day origins (G4), the 88 pooled FOMC/CPI origins (H2), crypto origins (H3)", "point-in-time universe per origin with daily returns over days 1–5, overnight and delisting returns included (G10, G11)", "event inputs with available-at timestamps (H2 arms)", "the shared PD repair rule (G12)"]
  guards_against: "Crediting pretraining with gains that come from head capacity, the input features, the architecture's inductive bias or the event-input pathway; random features read by a well-fitted head can be a strong baseline."
  typical_values: "S1 Market-1T (ridge probe, 15-minute cross-sectional rank IC, mean over 32 evaluation months drawn from 2008–2023 in the code, US equities): Random ViT floor 0.0170 / 0.0694 / 0.1692 (return / volatility change / spread change) vs I-JEPA 0.0103 / 0.0256 / 0.0646, LeJEPA time warping 0.0204 / 0.0721 / 0.1691 and supervised multihead 0.0311 / 0.0941 / 0.2455; latent floor (arXiv v2 Tables 3 and 5) RankMe 43.2 ± 0.1 (width 384), F1 0.495, F2 0.151. Caveat on the latent floor values: S1's plots/latent_eval/README.md (read 2026-11-12) states that every latent result before 2026-09-14 was read at the wrong token, with the random-init floor read at cls while SSL arms were read at the mean and supervised arms at the last token, and that the reported tables are being rebuilt; whether the v2 (13 Oct 2026) latent values are post-fix is unconfirmed (the notice concerns latent evaluations, not the rank-IC values). S17 causal-jepa (Kalshi BTC strike ladders; ridge / MLP probe R²): untrained encoder of the same width +0.4423 / +0.4102 vs best JEPA readout +0.4529 / +0.4213 vs raw full-window features +0.5091 / +0.5586; with the mean_all readout the trained-minus-random lift is ridge +0.0463 (t = 9.09) and MLP −0.0005 (t = −0.12). Major+ 2026 (ETT, Weather, Electricity, Traffic): a diffusion-pretrained encoder loses to the random frozen encoder under a linear head but has the lowest MSE on about 90% of forecasting datasets with a shallow MLP head."
  pitfalls: "A random encoder plus a well-fitted head is often hard to beat: in S1 many SSL objectives (DINO, BYOL, I-JEPA, CoST, TF-C) fall below it on all three targets and every SSL method falls below it on spread change. The floor moves with the readout and with the probe. In S17 the trained-minus-untrained lift in MLP-probe R² is +0.0545 (t = 7.73) with last_patch pooling but −0.0005 (t = −0.12) with mean_all. With mean_all the ridge-probe lift is +0.0463 (t = 9.09). Major+ 2026 likewise find the comparison flips between linear and MLP heads. Fix the readout and the head before unlocking and repeat the floor under each readout (readout_sensitivity). Higher-capacity heads memorise more (Hewitt & Liang 2019), which flatters random features; keep the head small. A single random seed is noisy. The floor is not a raw-feature control: most of S17's lifts over the untrained encoder dissolved once raw features were partialled out, with one 5-minute realised-volatility effect surviving (incremental_value_test). For H2 the floor must receive the same event inputs through the same pathway, or the event effect is confounded with the encoder. Never re-tune either arm's head on the test window."
