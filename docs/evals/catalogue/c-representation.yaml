- id: "transfer_protocol"
  name: "Equities-to-crypto transfer protocol: zero-shot vs frozen transfer vs fine-tuned vs from scratch, equal budgets"
  category: "protocol"
  section: "C"
  status: "widely_used"
  status_note: "Kept widely used. Peer-reviewed 2023–2026 users: S6 (AAAI-26; zero-shot pretrained model vs full-shot models trained on the task) and Nie+ 2023 (ICLR 2023, opened now; self-supervised pretraining with linear probing or fine-tuning vs supervised training, plus cross-dataset transfer). Preprints S5, S7 and Major+ 2026 (opened now) compare zero-shot, fine-tuned and from-scratch regimes with matched budgets. The equities-to-crypto arms, the exclusion of crypto from pretraining and the per-fit time cutoff (G7) are our design. Priority raised to must: H3 is a project hypothesis and no other must entry defines its arms, budgets or inference."
  priority: "must"
  plain_english: "To test whether pretraining on US stocks helps for crypto, compare models that differ only in where their starting weights came from: used as is, frozen with a new head, fine-tuned, or trained from scratch on crypto with the same budget. Crypto must be absent from pretraining, and the crypto test period must come after the equity pretraining data."
  formula: '\Delta^{\mathrm{FT}}_e=L_e(A_{\mathrm{SC}})-L_e(A_{\mathrm{FT}}),\quad \Delta^{\mathrm{LP}}_e=L_e(A_{\mathrm{RF}})-L_e(A_{\mathrm{LP}}),\quad \Delta^{\mathrm{ZS}}_e=L_e(A_{\mathrm{SC}})-L_e(A_{\mathrm{ZS}}),\quad L_e(A)=\frac{1}{n_e}\Big[\log\det\hat\Sigma^{(A)}_e+\mathrm{tr}\big((\hat\Sigma^{(A)}_e)^{-1}\Sigma^*_e\big)\Big];\qquad \text{Major+ 2026: }\Delta=s_{\mathcal{T}}\big[M(\theta_{\mathrm{SSL}})-M(\theta_{\mathrm{baseline}})\big],\ s_{\mathcal{T}}=-1\text{ for lower-is-better metrics},\ \text{relative gain }100\,\Delta/M(\theta_{\mathrm{baseline}})'
  computable_form: '\bar\Delta^{c}=\frac{1}{|E_{\mathrm{crypto}}|}\sum_{e\in E_{\mathrm{crypto}}}\Delta^{c}_e,\ c\in\{\mathrm{FT},\mathrm{LP},\mathrm{ZS}\},\quad \bar\Delta^{c}>0\Rightarrow\text{transfer helps};\quad \Sigma^*_e=\frac{1}{5}\sum_{d=1}^{5}r_{e,d}\,r_{e,d}^{\top}\ (\text{five consecutive UTC days})'
  conventions: "Arms share one module graph and parameter count: ZS = encoder and head trained on US equities only, applied to crypto inputs unchanged (only if the architecture accepts an arbitrary asset set; otherwise report 'not defined'); LP = US-pretrained encoder frozen, covariance head trained on crypto; FT = US-pretrained encoder and head fine-tuned on crypto; SC = the same graph from random initialisation trained on crypto only; RF = random frozen encoder with a head trained on crypto (the floor for LP; untrained_encoder_floor). The US-pretrained encoder is that of arm (pre, 0) of matched_supervised_comparator (event-derived inputs replaced by the null token, G9), and no crypto arm receives event inputs (our convention). Optional reference ID = the same SSL objective pretrained on crypto training data only, then LP/FT, which separates transfer from in-domain pretraining (Nie+ 2023 found transferred fine-tuning slightly worse than in-domain pretraining). Budgets: FT and SC get the same number of crypto optimiser steps, tuning budget and early-stopping rule; LP and RF the same head budget (S5: regimes differ only in initialisation; S7 matches total epochs; Major+ 2026 match backbone, parameter count and downstream budget, and re-run under strict matching). Pretraining: US equities only, with no crypto series or crypto-derived features anywhere in pretraining. Refits and cutoff (G6, G7): every arm is refit at every walk_forward refit date (first trading day on or after 1 January and 1 July); for each fit, all training data, the US pretraining corpus and the crypto training data included, end at least 5 NYSE trading days before the refit date, which also covers the 5-UTC-day crypto targets, because correlated series over the same calendar period leak even without shared assets (Meyer+ 2025's global, model-aware cutoff). US pretraining uses G6's rolling window of m = 2,520 trading days; crypto training uses every crypto day from the start of the panel to the cutoff, capped at the last 2,520 UTC days (our convention, since the crypto history is shorter than m at the early refits). Tuning only on the pre-2022 validation period 2017-01-01 to 2021-12-31 (crypto validation origins cover only the part of it for which the panel and a training history exist), with early stopping on the last 6 months of each training window after a 5-trading-day purge (G8). Crypto data (our design; the candidate list leaves the universe open): Binance Vision spot daily klines (CC BY-NC-SA 4.0); a point-in-time top-N USDT-pair universe ranked monthly by prior-month quote volume that keeps pairs which later delist, excludes stablecoin-vs-stablecoin pairs (binance_vision) and fixes N before unlocking; daily returns on UTC days (00:00–24:00 UTC) with the missing-data rules of G11 (delisting: last return, then 0 for the rest of the window; missing days 0 and flagged); Σ* over 5 consecutive UTC days; an origin at every UTC close of the locked window (2022-01-01 to 2026-06-30) whose target ends by 2026-06-30, with FOMC/CPI windows mapped to UTC days reported separately; inputs normalised with crypto training-window statistics. PD repair and failures: the shared repair with the single ε of G12 for every arm; a forecast that is non-finite or fails Cholesky after it is a failure, and an arm fails at an origin if any of its seeds fails; a failure of the transferred arm voids that contrast's one-sided claim (reported) and a control-arm failure removes the origin from that contrast only, with counts (G13). Seeds: S = 5, the shared list of seed_vs_period; per-origin losses averaged over seeds. Signs (G1): each Δ^c is a gain, the control's loss minus the transferred model's, so Δ^c > 0 means the transferred model beats its control. Inference: paired month-cluster bootstrap of each Δ̄^c (block_bootstrap; B = 10,000; cluster = calendar month (UTC) of the origin date; G3), one-sided with H_A: E[Δ^c] > 0; Holm at 5% across the pre-registered H3 contrasts that are defined (Δ^FT, Δ^LP and Δ^ZS, or the first two if ZS is not defined), using block_bootstrap's one-sided p-values (G5; multiple_testing). Foundation-model baselines whose pretraining includes crypto (Kronos: Binance data through June 2024) are in-distribution: score them only on origins at least 5 trading days after their documented pretraining-data end, or report them separately, and label them so (G7)."
  inputs: ["US-equity pretraining corpus per walk_forward fit and its end date", "crypto universe rule and Binance Vision spot daily klines with a pinned download date", "walk_forward refit dates with each fit's US and crypto training windows and cutoffs (G6, G7) and the early-stopping block (G8)", "arm initialisations (the US-pretrained (pre, 0) encoder, random) and matched budgets", "FOMC/CPI dates mapped to UTC days", "the shared list of K = 5 seeds and the PD repair rule (G12)"]
  guards_against: "Reporting in-distribution performance as transfer (as with Kronos's crypto results), confounding transfer with extra compute or tuning, and temporal-overlap leakage between correlated equity and crypto series."
  typical_values: "S5 Rahimikia+ (CRSP US stocks, next-day excess returns, 2001–2023): best zero-shot TSFM R²_OOS −1.27% vs CatBoost −0.03% (512-day context); Chronos-small Sharpe 0.94 zero-shot vs 5.42 when pretrained from scratch on finance data (512-day context); average change from zero-shot to from-scratch Chronos +20.57% R²_OOS. S6 Kronos (Binance spot volatility, test from July 2024; in-distribution because Binance data were in pretraining): Kronos-large MAE 0.0145 and R² 0.2658 vs GARCH 0.0292 and 0.1575. S7 Feng+: the pretraining effect ranges from −15.54% to +12.31% MAE across backbones. Major+ 2026: training from scratch beats pretrained backbones in over 90% of forecasting runs under full fine-tuning. Meyer+ 2025: a model trained with seven stock indices through December 2020, the S&P 500 held out, won 8 of 10 seeds with gains up to about 37% in the COVID window."
  pitfalls: "Pretraining sets that contain the target domain make 'transfer' in-distribution: Kronos's crypto test sets come from markets in its pretraining, and its 'out-of-distribution' exchanges appear in its pretraining table. Temporal overlap of correlated series leaks even without shared assets (Meyer+ 2025). Unequal budgets or tuning bias the comparison; S5 tuned benchmark hyperparameters once and judged TSFM sensitivity on the out-of-sample period itself. Zero-shot may be undefined for a head with asset-specific parameters. Crypto trades 24/7 while equity features assume sessions, so the mapping of events to UTC days must be pre-registered. Binance spot timestamps switch to microseconds from 2025-01-01 (milliseconds before) and the kline archive was fixed on 2022-08-08: normalise units and pin the download date. The licence (CC BY-NC-SA 4.0) restricts redistribution of derived targets. Small crypto universes make n_e small; report n_e per origin. Transfer can be negative (S7, Major+ 2026), so pre-register a one-sided test and report a non-significant result as such."
