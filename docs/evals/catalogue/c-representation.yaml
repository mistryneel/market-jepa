    notes: "1) Cache per-layer token outputs once per encoder fit. 2) Implement each pooling as a pure function of the cached tensor with a pooling id; assert that all arms in a table share the pooling id. 3) Per readout and arm, at every walk_forward refit, fit the linear covariance probe and the MLP covariance head (one shared per-stock 2 × 256 GELU MLP outputting b_{i,t} ∈ R^k and c_{i,t}, Σ̂_t = B_tB_t' + diag(e^{c_t}); AdamW, lr 10^-3, weight decay 10^-4; mean per-asset NLL; early stopping on the G8 block), then apply the shared PD repair. 4) Score per-asset NLL; compute Range_a, Δ^floor_{a,r} and the signed Kendall τ against r_0. 5) Mark r_0 as confirmatory in every table. Checks: a unit test feeds a known tensor and verifies the last, mean and max pooling outputs; a regression test fails if any arm's pooling id differs from its table's; the MLP head's Σ̂_t is PD before the repair."
