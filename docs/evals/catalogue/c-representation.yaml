    primary_endpoint: false
    why: "Attribution control for H1 and H2 (and the frozen-transfer arm of H3): it shows whether pretraining, rather than the head or inputs, produces the measured gains; it is not itself the primary contrast."
  implementation:
    libraries: ["numpy", "pandas", "scipy", "tfwm (S1 code: plots/metrics/metrics.py, floor-adjusted per-month SE)", "causal-jepa (S17 code: scripts/residual_probe.py, lift and survival rule)"]
    notes: "1) Instantiate the encoder S = 5 times with the pretrained arm's initialiser and the shared seed list; freeze it and never run the pretraining loop. 2) Extract readout features at every origin exactly as for the pretrained encoder (same pooling and token). 3) At every walk_forward refit, standardise features with training-window statistics and fit the head with the identical recipe and budget on the same window as the pretrained arm's head; log both arms' tuning runs (baseline_tuning_parity). 4) Produce Σ̂ per origin, apply the shared PD repair, score L_e and log failures (an arm fails at an origin if any of its seeds fails). 5) Compute Δ^floor_e from seed-averaged losses and run the paired month-cluster bootstrap (B = 10,000); also report per-seed results and the per-month d_m. 6) Checks: the floor arm's parameter count equals the pretrained arm's; the floor encoder's weights are bitwise unchanged after head training; if the seed-to-seed spread of the floor's mean loss is not smaller than the claimed effect, report the effect as within seed noise (the seed count is pre-registered and is not raised after unlocking). tfwm (MIT) and causal-jepa (Apache-2.0) are reference implementations of the floor and the lift."
