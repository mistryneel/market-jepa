    H4: "none"
    primary_endpoint: false
    why: "Supplies the supervised arms of H2's 2×2 (key secondary pretrained+events vs supervised+events, and the interaction) and an H1 pretraining check; the primary H2 contrast, the pretrained model's event-input gain, does not need it."
  implementation:
    libraries: ["numpy", "pandas", "scipy", "statsmodels"]
    notes: "1) Build the 2×2 × 5 grid of runs (the shared seed list) on the walk_forward refit calendar; a config diff between arms may differ only in initialisation, the pretraining stage and the event-input switch; assert equal parameter counts (pretraining-only modules excluded) and identical training-date sets, features, seeds and data order. 2) v = 0 arms replace every event-derived input by the fixed null token in pretraining and fine-tuning and are retrained end to end (G9); never null inputs only at test time. 3) Store per-origin forecasts with arm, seed and refit id; apply the shared PD repair and log failures. 4) Compute seed-averaged per-origin losses and the gains D^prim, D^sec, D^int and D^H1. 5) Paired month-cluster bootstrap per contrast (block_bootstrap; B = 10,000), passing the gains unchanged; sensitivity: GW on the rolling refits for D^prim (nested_model_tests), DM-HLN for D^sec (diebold_mariano). 6) Report seed SDs per arm and the compute (steps, GPU-hours) each arm used. Check: in a simulation where the event input is pure noise, D^prim and D^int must centre on 0."
