- id: "incremental_value_test"
  name: "Incremental value of the latent over raw features, trailing volatility and the strongest baseline"
  category: "protocol"
  section: "C"
  status: "emerging"
  status_note: "Kept emerging. Recommended by recent directly relevant sources: S17's residual probe and survival rule, S2's incremental logistic tests against a handcrafted baseline and a risk bundle, S16's combined energy-plus-trailing-volatility model, and S3's capacity-matched readout ablation. The nested covariance-head version and the forecast-combination check are our design."
  priority: "should"
  plain_english: "Give a model the strongest simple information first (trailing volatility, the best baseline's forecast, the raw input features), then add the latent and see whether the loss still falls. In several market studies most apparent latent gains disappeared under this control."
  formula: '\Delta^{\mathrm{inc}}_e=L_e\big(\hat\Sigma^{(B)}_e\big)-L_e\big(\hat\Sigma^{(B+Z)}_e\big);\qquad \tilde y=y-\hat y^{\mathrm{raw}},\quad R^2_{\mathrm{res}}=1-\frac{\sum_{\mathrm{test}}\big(\tilde y-\hat{\tilde y}\big)^2}{\sum_{\mathrm{test}}\big(\tilde y-\bar{\tilde y}_{\mathrm{tr}}\big)^2};\qquad \Delta\mathrm{AUC}=\mathrm{AUC}(\text{controls}+s)-\mathrm{AUC}(\text{controls}),\quad \Delta\mathrm{AP}=\mathrm{AP}(\text{controls}+s)-\mathrm{AP}(\text{controls})'
  computable_form: '\hat\Sigma^{c}_e(w)=w\,\hat\Sigma^{\mathrm{ours}}_e+(1-w)\,\hat\Sigma^{\mathrm{base}}_e,\ w\in\{0,0.05,\dots,1\},\quad \hat w=\arg\min_{w}\sum_{e\in\mathrm{val}}L_e\big(\hat\Sigma^{c}_e(w)\big),\quad \Delta^{\mathrm{comb}}_e=L_e\big(\hat\Sigma^{\mathrm{base}}_e\big)-L_e\big(\hat\Sigma^{c}_e(\hat w)\big);\qquad t=\frac{\overline{R^2_{\mathrm{res}}}}{s/\sqrt{n_{\mathrm{seed}}}}\ (\text{S17})'
  conventions: "(a) Matrix version (H1; primary use, our design). Two heads of the same family and training recipe (default: the covariance probe of linear_probe): head B receives only the pre-registered control features x_{i,t}; head B+Z receives [x_{i,t}, z_{i,t}], where z_{i,t} is the frozen latent of arm (pre, 0) at the origin (the H1 model; matched_supervised_comparator). Minimal control set, fixed before unlocking: log trailing realised variance over 5, 21 and 63 trading days; the per-stock outputs of the strongest baseline, defined as the member of the strong set S of G4 (DCC-NL, QIS nonlinear shrinkage, the fundamental industry+style factor model, EWMA) with the lowest mean per-asset NLL on the pre-2022 validation origins (its factor loadings and log residual variances, or its log diagonal variances); and the raw input features the encoder itself sees at the origin, so that pass-through of inputs is not credited to the latent (S2 retrained without its volatility channels for this reason). Both heads use the same penalty grid with the penalty chosen on the pre-2022 validation period (G8), the same PD repair (G12) and the same walk_forward refits on rolling windows of m = 2,520 trading days (G6). Δ^inc_e is a gain, head B's loss minus head B+Z's (G1), so Δ^inc_e > 0 means the latent adds value. Evaluation sets: H1 ordinary-day origins (G4) and, as a secondary, the 88 pooled H2 event origins (G2). Inference (descriptive, G5): the heads are nested; the paired month-cluster bootstrap of Δ̄^inc (block_bootstrap; B = 10,000; G3) is the main interval, the latent's added value is supported iff its one-sided 95% percentile lower bound is above 0 (G1), and Giacomini–White is the sensitivity analysis (nested_model_tests). Both are valid only because both heads are refit on the same fixed-length rolling windows (walk_forward), under which the null concerns the forecasting methods and the loss difference keeps a non-degenerate variance (Giacomini & White 2006). Under that scheme a DM-type t on the per-origin differences is GW's unconditional test, so it is equally valid as a check; what fails for nested heads is any mean-loss-difference test (DM, the bootstrap or GW) under expanding-window or fit-once estimation (Clark & West 2007; McCracken 2020). (b) Combination check (our design): convex combination of our forecast and the strongest baseline's, both PD after repair, so every combination is PD; ŵ is chosen on the pre-2022 validation period only (G8); ŵ = 0 means the baseline encompasses our forecast. (c) Scalar residual probe (S17): fit ridge raw features → y on train (λ chosen on the pre-2022 validation period, G8; S17 chose it on the last 20% of training rows, positional), residualise y on train and test with the train-fitted coefficients, probe the residual with the embedding; the R² denominator uses the training-residual mean (S17 used the evaluation-set mean; we do not). S17's survival rule: best matched-width lift > 2 'pooled SD' with at least 2 seeds; best trained arm's residual R² > 0 by a one-sample t across seeds against two-sided 5% critical values for n − 1 degrees of freedom; and the best trained arm beats the best untrained arm on the residual. (d) Event classification (H4, with surprise_leads_vol): logistic regression on the control bundle vs the bundle plus the model's surprise s_t; ΔAUC and ΔAP (AP preferred for rare events, as in S2) with paired month-cluster bootstrap CIs (B = 10,000; S2 did not state its bootstrap scheme); as H4 tests they belong to H4's Benjamini–Hochberg family at 10% (G5)."
  inputs: ["frozen latent z_{i,t} of arm (pre, 0) at each origin", "pre-registered control features: trailing log realised variances (5, 21, 63 days), the strongest baseline's per-stock outputs, the encoder's raw input features at the origin", "the strongest baseline's covariance forecasts Σ̂^base (the member of G4's strong set S with the lowest validation per-asset NLL)", "scalar probe targets and raw-feature matrices (residual version)", "binary volatility-jump labels, the control bundle and the surprise series (H4 version)", "the pre-2022 validation period (G8) and the walk_forward refit calendar (G6)"]
  guards_against: "Mistaking pass-through of raw inputs or trailing volatility, or a re-description of the strongest baseline, for new information in the latent."
  typical_values: "S17 causal-jepa (Kalshi BTC ladders): on volatility-forecast error the best raw features reach R² +0.1747 and the best JEPA +0.1206, but the JEPA's residual R² after raw features is +0.0038 (t = 1.68); one effect survives: 5-minute forward realised volatility, trained 0.1528 vs untrained 0.1251, lift +0.0278 (3.40 pooled SD). S2 Mahns+ (US equities, test 2024–Oct 2025, 18-feature handcrafted base): effective-rank recovery AUC/AP 0.690/0.139 → 0.800/0.324 with the latent, but pc1-share recovery 0.972/0.837 → 0.754/0.360 (the latent hurts); latent displacement vs an SPX/VIX/high-yield risk bundle on crash+VIX days: ΔAUC −0.002 [−0.006, 0.003]. S16 jepa-trader (SPY+QQQ order book): JEPA energy IC vs forward realised volatility +0.032 to +0.060 vs trailing RV +0.332 to +0.793; the combined model scores +0.332 / +0.612 / +0.724 / +0.792 at 0.1 / 1 / 3 / 10 s, essentially the trailing-volatility term."
  pitfalls: "The answer depends on the control set, so pre-register it and include the encoder's own inputs. Adding inputs raises head capacity; tune regularisation for both heads on validation only. R² against the evaluation-set mean (S17) is not an out-of-sample R²; use the training mean. Nested comparisons break the asymptotics of every mean-loss-difference test (DM, the paired bootstrap, GW) under expanding-window or fit-once estimation, and Clark & West's adjustment exists only for squared-error scalar forecasts; refit both heads on fixed-length rolling windows, then use the month-cluster bootstrap with GW (equivalently a DM-type t) as sensitivity. S17's one-sample t across a handful of seeds ignores time dependence; prefer the month-cluster bootstrap over dates. Many targets × readouts × controls invite multiple testing (S17 applied no correction). Results can differ by target: S2's latent helped one transition task and hurt another, so report every pre-registered target. A latent can be 'complementary' (S2's own wording) without beating the controls."
  used_by:
    - ref: "S17"
      title: "Causal-axis JEPAs on prediction-market strike ladders: a negative result and the diagnostics that failed to predict it"
