  implementation:
    libraries: ["numpy", "pandas", "scipy"]
    notes: "1) Download Binance Vision spot daily klines for candidate pairs, verify the SHA-256 checksums, normalise timestamps (microseconds from 2025-01-01, milliseconds before) and pin the download date. 2) Build the point-in-time top-N universe monthly from prior-month quote volume, keeping pairs that later delist; compute UTC-day returns. 3) For every fit, assert that the US pretraining corpus contains no crypto series and that all training data end at least 5 NYSE trading days before that fit's refit date (G7). 4) At every walk_forward refit train arms LP, FT, SC and RF (and ZS and ID where defined) with matched budgets on that fit's crypto training window, with early stopping on its last 6 months after a 5-trading-day purge (G8). 5) Score per-asset NLL on every crypto test origin and on FOMC/CPI windows mapped to UTC days; compute the gains Δ^FT, Δ^LP and Δ^ZS; paired month-cluster bootstrap (B = 10,000) with Holm over the defined contrasts. 6) Report n_e per origin and the CKA between the fine-tuned and the original US-pretrained encoder (cka). Check: giving FT and SC the same initialisation must yield Δ^FT = 0 up to seed noise."
