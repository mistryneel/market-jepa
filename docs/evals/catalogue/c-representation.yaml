- id: "linear_probe"
  name: "Frozen linear (ridge) probe protocol with a covariance-valued probe and control-task selectivity"
  category: "protocol"
  section: "C"
  status: "canonical"
  status_note: "Kept canonical. Original: Alain & Bengio 2016 (arXiv; the ICLR 2017 listing could not be confirmed). No single probe protocol is standard (Kolesnikov+ 2019, Chen+ 2020, S1 and S17 all differ), so the ridge protocol fixed here is our synthesis of verified choices; the covariance-valued probe is our design built on IPCA's linear loading map (Kelly+ 2019); the stock-level control task is our adaptation of Hewitt & Liang 2019."
  priority: "should"
  plain_english: "Freeze the encoder, compute its embeddings once, and fit only a linear map from embeddings to a target, choosing the penalty on a later validation period and scoring once on the test period. A control task with random but fixed per-stock targets shows how much a probe could score by memorising stocks rather than reading information out."
  formula: '\tilde z=\frac{z-\mu_{\mathrm{tr}}}{\sigma_{\mathrm{tr}}+10^{-6}},\quad \hat w_\lambda=\big(\tilde Z_{\mathrm{tr}}^{\top}\tilde Z_{\mathrm{tr}}+\lambda I\big)^{-1}\tilde Z_{\mathrm{tr}}^{\top}\big(y_{\mathrm{tr}}-\bar y_{\mathrm{tr}}\big),\quad \hat y=\bar y_{\mathrm{tr}}+\tilde z^{\top}\hat w_{\lambda^*},\quad R^2_{\mathrm{OOS}}=1-\frac{\sum_{\mathrm{test}}(y-\hat y)^2}{\sum_{\mathrm{test}}(y-\bar y_{\mathrm{tr}})^2},\quad \mathrm{Sel}=\mathrm{Score}_{\mathrm{task}}-\mathrm{Score}_{\mathrm{control}};\qquad \hat\Sigma_t=B_tB_t^{\top}+\mathrm{diag}\big(e^{c_t}\big),\ B_t=\tilde Z_t\Gamma,\ c_t=\tilde Z_t\gamma+\gamma_0\mathbf{1};\qquad \text{Alain \& Bengio: }f_k(h_k)=\mathrm{softmax}(Wh_k+b)'
  computable_form: '\lambda^*=\arg\min_{\lambda\in\Lambda}\sum_{\mathrm{val}}\big(y-\hat y_\lambda\big)^2,\ \Lambda=\{10^{-6+11j/44}\}_{j=0}^{44},\ \text{val = the walk-forward forecasts for 2017-01-01 to 2021-12-31 (G8); }\lambda^*\text{ is then frozen and the probe refit at every walk-forward refit on its training window (G6)};\qquad (\hat\Gamma,\hat\gamma,\hat\gamma_0)=\arg\min\frac{1}{|T_{\mathrm{tr}}|}\sum_{t\in T_{\mathrm{tr}}}L_t\big(\hat\Sigma_t\big)+\lambda\big(\|\Gamma\|_F^2+\|\gamma\|_2^2\big);\qquad \mathrm{IC}_t=\rho_{\mathrm{S}}\big(\hat y_{\cdot,t},y_{\cdot,t}\big),\ \overline{\mathrm{IC}}=\frac{1}{T}\sum_{t=1}^{T}\mathrm{IC}_t'
  conventions: "Embeddings: frozen encoder in inference mode (no dropout; no gradient reaches the encoder, as Alain & Bengio require), the readout pre-registered in readout_sensitivity, computed once per (stock, origin) from information available at the origin, by the encoder fit that serves that origin (walk_forward). Splits and refits (G6–G8): the probe is refit at every walk_forward refit date on that refit's rolling window of m = 2,520 trading days, whose inputs and 5-day labels end at least 5 trading days before the refit date, and it serves the origins up to the next refit; never shuffle across time. Hyper-parameters (λ, and k for the covariance probe) are chosen once on the pre-2022 validation period 2017-01-01 to 2021-12-31 from forecasts produced by the same walk-forward procedure and then frozen for the locked window (G8; Chen+ 2020 likewise choose on validation and then refit on all training data; S17 used the last 20% of training rows, positional). Standardisation: features with training-window mean and SD (+10^-6, as S17), applied unchanged to the origins served; scalar targets standardised with training statistics for fitting and reported in original units. Scalar probe: closed-form ridge with an unpenalised intercept; λ grid = 45 log-spaced values in [10^-6, 10^5] (Chen+ 2020's transfer protocol), chosen by mean validation MSE; if λ* sits at a grid edge, extend the grid by 3 decades and report it. Minimal scalar target (our choice): per-stock log realised variance over days 1–5, log((1/5) Σ_d r_{i,t+d}^2), i.e. the log diagonal of Σ*; scored by R²_OOS against the training mean and by the mean cross-sectional Spearman IC (dates with fewer than 20 valid stocks skipped, as in S1's code). Covariance probe (our design): Z̃_t is the n_t × d matrix of standardised per-stock embeddings at origin t; Γ ∈ R^{d×k}, γ ∈ R^d, γ_0 ∈ R; k is fixed on the pre-2022 validation period before unlocking (G8) as the validation-selected factor count of the factor_risk_models variant with the lowest mean validation per-asset NLL; fit by minimising the mean per-asset NLL over training origins plus the ridge penalty, with λ from {10^-6, 10^-5, ..., 10^6} chosen on mean validation NLL; the output is PD by construction but still passes the shared PD repair (G12), and a forecast that is non-finite or fails Cholesky after it is a failure (G13). It is the common readout for comparing representations on the primary loss (untrained_encoder_floor, ssl_objective_ablation, label_efficiency). Control task (our adaptation of Hewitt & Liang 2019): draw C(i) once per stock, independently, from the empirical training distribution of per-stock mean targets; the control target is y^ctrl_{i,t} = C(i) for all t; fit and score the identical probe on held-out dates; report Sel = Score_task − Score_control beside every probe score. Report the probe-training sample size (S1 found probe scores rise with it)."
  inputs: ["frozen encoder and the pre-registered readout", "per-(stock, origin) embeddings with origin timestamps", "chronological train / validation / test split with at least a 5-trading-day embargo", "probe targets: per-stock log realised variance over days 1–5; Σ*_t for the covariance probe", "stock identifiers and a fixed seed for the control task", "λ grids and the factor count k"]
  guards_against: "Conflating representation quality with adaptation (fine-tuning), probe overfitting or memorisation of stock identity, and choosing probe hyperparameters on the test window."
  typical_values: "S1 Market-1T (15-minute rank IC): the ridge probe on frozen embeddings nearly matches the supervised models' own heads, e.g. multihead on returns 0.0311 (probe) vs 0.0317 (head), volatility model on volatility change 0.0883 vs 0.0891. S2 Mahns+ (ridge level decoding, test 2024–2025, n_test = 365): R² 0.415 (mean correlation), 0.447 (PC1 share), 0.361 (effective rank). S17 causal-jepa (Kalshi BTC ladders): ridge R² raw full window +0.5091, best JEPA readout +0.4529, untrained encoder +0.4423. Hewitt & Liang 2019 (ELMo, part-of-speech tagging): linear probe 97.2 vs control 71.2 (selectivity 26.0); default MLP probe 97.3 vs 92.8 (selectivity 4.5)."
  pitfalls: "There is no standard protocol: SGD probes kept improving for about 500 epochs in Kolesnikov+ 2019, so a closed-form ridge or L-BFGS avoids schedule sensitivity. High-dimensional features let probes memorise (Alain & Bengio reduce dimension; Hewitt & Liang's MLP probes were barely selective). Probe-training size changes measured quality (S1), so compare encoders at the same size. S17's R² uses the evaluation-set mean, which is not an out-of-sample R². Linear-probe rankings may not predict MLP or fine-tuning rankings (Major+ 2026; readout_sensitivity). Read the encoder representation, not a projector or predictor output (Chen+ 2020 found the pre-projection h far better than z). Per-stock targets with persistent stock-level means can be scored by identifying stocks: report the control-task selectivity and a within-stock demeaned variant. The covariance probe's k and penalty grid change NLL levels: fix them before unlocking and use the same values for every encoder."
  used_by:
