- id: "matched_supervised_comparator"
  name: "Equal-capacity supervised comparator with matched inputs, readout and budget (the supervised arms of the H2 2×2)"
  category: "baseline"
  section: "C"
  status: "widely_used"
  status_note: "Candidate list: widely used (provisional). Confirmed in this pass: peer-reviewed 2023–2026 users are S1 (NeurIPS 2026: supervised ViT-S arms on the shared backbone and probe) and Nie+ 2023 (ICLR 2023, opened now: supervised PatchTST vs self-supervised pretraining with linear probing or fine-tuning); preprints S7, S5 and Major+ 2026 (opened now) use same-architecture from-scratch comparators with matched epochs or budgets; S16 (blog) and S3 add further examples. Role aligned with the adopted H2 design: it supplies the supervised arms of the 2×2 (key secondary contrast and interaction); the primary H2 contrast stays inside the pretrained model."
  priority: "must"
  plain_english: "Train a model with exactly the same architecture and size, on the same dates and inputs, from random weights and with only the covariance loss (no self-supervised pretraining). Crossing pretrained-vs-supervised with event-inputs-on-vs-off shows whether pretraining, rather than model size or the event inputs, lowers post-event loss."
  formula: 'L_e^{(p,v)}=\frac{1}{n_e}\Big[\log\det\hat\Sigma_e^{(p,v)}+\mathrm{tr}\big((\hat\Sigma_e^{(p,v)})^{-1}\Sigma^*_e\big)\Big],\ p\in\{\mathrm{pre},\mathrm{sup}\},\ v\in\{0,1\};\qquad D^{\mathrm{prim}}_e=L_e^{(\mathrm{pre},0)}-L_e^{(\mathrm{pre},1)},\qquad D^{\mathrm{sec}}_e=L_e^{(\mathrm{sup},1)}-L_e^{(\mathrm{pre},1)},\qquad D^{\mathrm{int}}_e=\big(L_e^{(\mathrm{pre},0)}-L_e^{(\mathrm{pre},1)}\big)-\big(L_e^{(\mathrm{sup},0)}-L_e^{(\mathrm{sup},1)}\big),\qquad D^{\mathrm{H1}}_t=L_t^{(\mathrm{sup},0)}-L_t^{(\mathrm{pre},0)}'
  computable_form: 'L_e^{(p,v)}=\frac{1}{S}\sum_{s=1}^{S}L_e^{(p,v,s)};\qquad \bar D^{c}=\frac{1}{|E|}\sum_{e\in E}D^{c}_e,\ c\in\{\mathrm{prim},\mathrm{sec},\mathrm{int}\};\qquad H_0:\ \mathbb{E}[D^{c}_e]\le 0\ \text{vs}\ H_A:\ \mathbb{E}[D^{c}_e]>0'
  conventions: "Arms: (pre, v) = pretrained encoder + covariance head; (sup, v) = the identical module graph (encoder, event-input pathway, covariance head) initialised at random and trained end to end on the per-asset NLL only. Event inputs (G9): every event-derived input, i.e. event type, time to and since events, surprise and consensus features, statement- or press-conference-derived features and event text, each available at or before the origin (event_input_availability). v = 1 feeds them. v = 0 replaces every one of them by a fixed null token in both pretraining and fine-tuning (default: a constant, non-learned input equal to zeros in the event pathway's standardised input space, with the event-present flag 0, the same encoding as event_placebo's zero-out pass), keeps the generic calendar features (day of week, month) as in v = 1, and is retrained end to end with identical architecture, data, seeds, data order and compute budget (G9); never null the inputs only at test time. 'Equally sized' = identical total parameter count of the deployed graph; pretraining-only modules (JEPA predictor and EMA target, MAE decoder, projector) are excluded from the count and reported separately. Data and refits (G6, G7): every arm is refit at every walk_forward refit date (first trading day on or after 1 January and 1 July) on a rolling window of m = 2,520 trading days whose data, pretraining corpus included, end at least 5 trading days before the refit date; the supervised arm trains on every origin the pretrained arm used for pretraining and head fitting (labels exist for all historical dates because the target is future returns); same universe (G10), features, training-window normalisation and logged tuning budget (baseline_tuning_parity). Tuning only on the pre-2022 validation period 2017-01-01 to 2021-12-31; early stopping on the last 6 months of each training window after a 5-trading-day purge (G8). Budget: primary = a total-compute cap equal to pretraining plus head steps (S7 matches total epochs); sensitivity = downstream-budget match, i.e. the same steps as the pretrained arm's head or fine-tuning stage (Major+ 2026). Seeds: S = 5 paired seeds, the shared list of seed_vs_period (K = 5), also used by untrained_encoder_floor; average per-origin losses over seeds and report the seed SD. PD repair and failures: the shared repair of G12 for every arm; a forecast that is non-finite or fails Cholesky after the repair is a failure, and an arm fails at an origin if any of its seeds fails; a candidate-arm failure voids that contrast's one-sided claim (reported) and a reference-arm failure removes the origin from that contrast only, with counts (G13). Signs (G1): every D in formula is a gain, reference loss minus candidate loss, so D > 0 favours the candidate: D^prim is P+E vs P (candidate (pre, 1), reference (pre, 0)); D^sec is P+E vs S+E (candidate (pre, 1), reference (sup, 1)); D^int > 0 means pretraining enlarges the event-input gain; D^H1 is (pre, 0) vs (sup, 0). The test routines (block_bootstrap, diebold_mariano, nested_model_tests) receive these gains unchanged. Inference: paired month-cluster bootstrap of the mean gain over the 88 pooled event origins at the close of day 0 (B = 10,000; cluster = calendar month of day 0; G2, G3); the candidate is supported iff the one-sided 95% percentile lower bound is above 0 (G1). D^prim is the H2 primary test, one pre-registered test without adjustment (G5); it is nested, so Giacomini–White on the fixed-length rolling refits is its sensitivity analysis (nested_model_tests). D^sec is an H2 key secondary, Holm at 5% within the H2-secondary family (G5; multiple_testing); it is non-nested, with DM-HLN as sensitivity (diebold_mariano). D^int is descriptive (G5). H1: 'ours' in h1_noninferiority_test is arm (pre, 0); (pre, 1) on the same origins is a pre-registered secondary. D^H1 on the H1 ordinary-day origins (G4) is a descriptive pretraining check reported beside h1_noninferiority_test (month-cluster bootstrap interval, no decision): the supervised arm is not a member of H1's strong set S (G4). Under G6's fallback (encoders of all arms frozen at the last pre-2022 fit, heads refit), the results are comparisons of fitted forecasters and the GW method-level reading is dropped (walk_forward)."
  inputs: ["module graph of the deployed model (encoder, event-input pathway, covariance head) and its parameter count", "each walk_forward fit's training window (m = 2,520 trading days, data ending at least 5 trading days before the refit date; G6, G7) and early-stopping block (G8)", "daily return panel on the point-in-time universe (overnight and delisting returns; G10, G11) for the Σ* labels", "event-derived inputs with available-at timestamps, and the fixed null token of the v = 0 arms (G9)", "the shared list of K = 5 seeds and the logged tuning budget per arm", "evaluation origins: the 88 pooled FOMC/CPI origins (H2) and the H1 ordinary-day origins (G4)", "the shared PD repair rule (G12)"]
  guards_against: "Crediting self-supervised pretraining for gains due to capacity, architecture, extra inputs or the event features, and confusing 'event inputs help' with 'pretraining helps'."
  typical_values: "S1 Market-1T (15-minute rank IC, 32 months, same ViT-S backbone and ridge probe): supervised multihead 0.0311 / 0.0941 / 0.2455 (return / volatility change / spread change) vs the best non-supervised trained arm, LeJEPA time warping, 0.0204 / 0.0721 / 0.1691. S7 Feng+ (non-finance benchmarks, T = L = 128, 3 seeds, total epochs matched): JEPA-pretrained vs the same backbone from scratch ranges from −15.54% MAE (Autoformer, Weather) to +12.31% (STTN, PEMS07). S16 jepa-trader (blog; SPY+QQQ order book, test 11–19 Dec 2025): frozen JEPA probe IC at 0.1 s +0.158 vs the identical encoder trained end to end +0.162. Major+ 2026 (ETT, Weather, Electricity, Traffic): under full fine-tuning, training from scratch beats pretrained backbones in over 90% of forecasting runs."
  pitfalls: "Under-trained or under-tuned supervised baselines inflate pretraining gains: S3's supervised baselines share one short schedule (6 epochs × at most 1,000 updates), and its JEPA baselines got a linear readout while its own model's MLP readout also saw extra inputs, so much of its gap reflects readout and input design; match readout and inputs exactly. The pretraining effect can flip sign by backbone (S7), and with 3 seeds the seed SD is often as large as the effect. S7's pretraining reused the supervised pairs (no extra data); if our pretrained arm sees a longer history than the supervised arm, data quantity is confounded with the objective. When the comparator also receives event inputs, the pretrained-vs-supervised contrast is non-nested; only the within-arm with/without contrast is nested. Supervised models were the strongest forecasters in S1 and from-scratch training won most fine-tuning comparisons in Major+ 2026, so plan for D^sec ≤ 0. Neither arm's early stopping or tuning may touch the locked test window."
