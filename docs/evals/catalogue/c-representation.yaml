    notes: "1) Build the point-in-time industry map; draw 10 panels per month (3 industries × 2 firms with full presence) with fixed seeds. 2) Using per-(firm, day) embeddings at the readout, implement T1–T4 as in S1's code (squared Euclidean on raw embeddings; centroids exclude the focal firm or day). 3) Compute hit ratio to chance and percentile ranks; average within month, then across months; t-statistics across months. 4) Sector metrics on month-mean embeddings: silhouette, separation ratio, separation AUC, Jaccard overlap (k = 10) with backward and forward 63-day correlation neighbours, far-tail ordering. 5) Classification variant with firm-grouped folds. 6) Run identical code on the untrained floor; compute the Spearman correlation of arm rankings between organisation and forecasting metrics. Check: with shuffled sector labels the silhouette is near 0 (slightly negative) and the separation AUC near 0.5."
