- id: "knn_probe"
  name: "k-NN retrieval probe with temporal exclusion"
  category: "representation_metric"
  section: "C"
  status: "canonical"
  status_note: "Kept canonical. Original: Wu+ 2018 (weighted k-NN evaluation of frozen features); Caron+ 2021 fixes the common k = 20, τ = 0.07 setting; S2 applies it to daily market-state embeddings with a ±21-day exclusion. The past-only candidate set for forward-looking targets is our design. Wording follows the review: training-free, not label-free."
  priority: "nice"
  plain_english: "For each day, find the most similar other days in embedding space and average their outcomes; nothing is fitted. If similar embeddings share outcomes such as volatility, the latent has organised that information."
  formula: 's_{tj}=\frac{z_t^{\top}z_j}{\|z_t\|_2\,\|z_j\|_2},\quad N_k(t)=\{\text{the }k\text{ indices }j\in\mathcal{C}(t)\text{ with the largest }s_{tj}\},\quad \hat y_t=\frac{1}{k}\sum_{j\in N_k(t)}y_j,\quad \hat y^{w}_t=\frac{\sum_{j\in N_k(t)}\alpha_j y_j}{\sum_{j\in N_k(t)}\alpha_j},\ \alpha_j=\exp(s_{tj}/\tau);\quad \rho=\rho_{\mathrm{S}}\big(\{y_t\},\{\hat y_t\}\big),\quad R^2=1-\frac{\sum_t(y_t-\hat y_t)^2}{\sum_t(y_t-\bar y_t)^2},\ \ \bar y_t=\frac{1}{|\mathcal{C}_{\mathrm{causal}}(t)|}\sum_{j\in\mathcal{C}_{\mathrm{causal}}(t)}y_j\ \text{(forward targets; for S2-comparable contemporaneous descriptors }\bar y_t\text{ is the mean over query days)};\qquad \text{Wu+ 2018: }w_c=\sum_{i\in N_k}\alpha_i\,\mathbb{1}(c_i=c)'
  computable_form: '\mathcal{C}_{\mathrm{S2}}(t)=\{j:\ |t-j|>21\ \text{trading days}\}\ (\text{contemporaneous descriptors});\qquad \mathcal{C}_{\mathrm{causal}}(t)=\{j:\ j+h\le t\},\ h=5\ (\text{forward targets})'
  conventions: "Unit of retrieval: the date-level market-state embedding z_t (the pooled readout fixed in readout_sensitivity); a per-stock variant retrieves (stock, date) tokens under the same candidate rules. Embedding fit: the query and all its candidates are embedded by the same encoder fit, the one serving the query origin under walk_forward (G6); never mix fits within one retrieval. Similarity: cosine on raw (unstandardised) embeddings, as in S2 and Wu+ 2018. Default k = 20 (S2; Caron+ 2021 found k = 20 consistently best) with the unweighted mean ŷ_t used by S2; the weighted vote with τ = 0.07 (Wu+ 2018 and Caron+ 2021, untuned) is a sensitivity. Sensitivity grid (S2): k ∈ {1, 5, 10, 20} and exclusion ±{0, 21, 63} trading days. Candidate sets: S2's symmetric exclusion is valid only for contemporaneous descriptors; any forward-looking target, e.g. log market realised variance over days 1–5, must use the causal set C_causal(t) = {j: j + 5 ≤ t} in trading-day indices, so every neighbour's target is fully realised by the close of the query origin day t (a window ending exactly at the close of t is allowed). Targets: S2-comparable descriptors (log RV21, PC1 variance share and effective rank of the trailing 21-day correlation matrix, market return) and our forward target. Scores: Spearman ρ across query days and R² = 1 − Σ_t(y_t − ŷ_t)²/Σ_t(y_t − ȳ_t)². For forward targets ȳ_t is the mean target over the causal candidate set C_causal(t), a prevailing mean known at the origin, as the catalogue's out-of-sample R² rule requires (r2_oos, linear_probe: never the evaluated test-set mean). The query-day mean (S2 does not state its reference mean) is used only for S2-comparable contemporaneous descriptors and labelled 'R² against the evaluation-set mean'. Either R² can be negative. Baselines reported alongside (S2): lag-1 persistence, time-neighbour retrieval (the k allowed dates nearest in time), random Gaussian embeddings of the same width, and the untrained-encoder floor. Ties are broken by the earlier date. Develop on the pre-2022 validation period 2017-01-01 to 2021-12-31 (G8); report the locked window only after the confirmatory analysis is frozen; all results are descriptive (G5)."
  inputs: ["frozen embeddings per date (and per stock-date for the per-stock variant)", "descriptor or target series per date", "trading calendar for the exclusion window", "k, τ and exclusion settings", "random-embedding and untrained-encoder baselines"]
  guards_against: "Over-reading what a fitted probe extracts (k-NN fits nothing) and temporal-adjacency confounds (neighbours that are simply nearby dates)."
  typical_values: "S2 Mahns+ (daily 128-d market-state embedding, US top-512 stocks, May 2018–Oct 2025, k = 20, ±21-day exclusion): Spearman ρ 0.78 for 21-day realised volatility, 0.68 for PC1 variance share, 0.11 for market return; R² JEPA vs MAE: log RV21 0.62 vs 0.54, PC1 share 0.29 vs 0.12; lag-1 persistence R² 0.97 for RV21; random embeddings −0.29; time-neighbour retrieval −1.55; JEPA R² for RV21 at k = 5 / 10 / 20: 0.52 / 0.57 / 0.62; median query-to-neighbour gap 924 days. Wu+ 2018: k = 200, τ = 0.07 (ImageNet). Caron+ 2021: k = 20 best, τ = 0.07."
  pitfalls: "Training-free but not label-free: the neighbours' targets are used. S2's ±21-day exclusion admits neighbours from the future, which is fine for describing contemporaneous structure but leaks for forecasting claims. Persistence can dominate: lag-1 R² 0.97 vs 0.62 for RV21 in S2, so k-NN success on persistent descriptors says little. k matters (Wu+ 2018 use 200, Caron+ 2021 20; S2's PC1-share R² rises from 0.03 at k = 5 to 0.29 at k = 20), and S2 itself mixes k = 10 and k = 20 across tables. Cosine on raw embeddings is dominated by a large common mean direction if one exists; then also report a centred variant. ρ across consecutive days is serially dependent; use month-block bootstrap intervals."
  used_by:
    - ref: "Wu+ 2018"
      title: "Unsupervised Feature Learning via Non-parametric Instance Discrimination"
      authors: "Wu, Z., Xiong, Y., Yu, S. X., & Lin, D."
      year: 2018
      venue: "In 2018 IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR), pp. 3733-3742. arXiv:1805.01978"
      url: "https://doi.org/10.1109/CVPR.2018.00393"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "original definition: weighted k-NN evaluation of frozen L2-normalised features by cosine similarity with α_i = exp(s_i/τ), τ = 0.07 and k = 200."
    - ref: "Caron+ 2021"
      title: "Emerging Properties in Self-Supervised Vision Transformers"
      authors: "Caron, M., Touvron, H., Misra, I., Jegou, H., Mairal, J., Bojanowski, P., & Joulin, A."
      year: 2021
      venue: "In 2021 IEEE/CVF International Conference on Computer Vision (ICCV), pp. 9630-9640. arXiv:2104.14294"
      url: "https://doi.org/10.1109/ICCV48922.2021.00951"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Evaluates frozen DINO features with the same weighted k-NN (τ = 0.07, untuned) and reports k = 20 as consistently best after a sweep."
    - ref: "S2"
      title: "Joint-Embedding Predictive Learning of Latent Market States in U.S. Equities"
      authors: "Mahns, Balestriero, Assran"
      year: 2026
      venue: "ICML 2026, PMLR 306:85699–85720"
      url: "https://icml.cc/virtual/2026/poster/65643"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Retrieves the k = 20 nearest days by cosine similarity of the market-state embedding, excluding ±21 trading days, and scores neighbour-mean estimates of risk and direction descriptors by Spearman ρ and R² against MAE, persistence, time-neighbour and random baselines."
  relevance:
    H1: "medium"
    H2: "low"
    H3: "low"
    H4: "low"
    primary_endpoint: false
    why: "Descriptive check that the latent organises risk-relevant information (context for H1); not used for confirmatory tests."
  implementation:
    libraries: ["numpy", "pandas", "scipy"]
    notes: "1) L2-normalise the embeddings (query and candidates from the same encoder fit) and compute the query × candidate cosine matrix in blocks. 2) Mask candidates outside C(t): symmetric ±21 days for contemporaneous descriptors, j + 5 ≤ t (trading-day indices) for forward targets. 3) Take the top-k per query (k = 20; sweep 1, 5, 10, 20) and compute the unweighted ŷ, plus the weighted version with τ = 0.07. 4) Score Spearman ρ and R² (forward targets against the causal-set mean ȳ_t) with month-cluster bootstrap CIs (B = 10,000). 5) Run identical code on lag-1 persistence, time-neighbour retrieval, random Gaussian embeddings of the same width and the untrained floor. Check: assert that under the causal set every neighbour's target window, days j + 1 to j + 5, ends on or before the query origin day t (j + 5 ≤ t), so it is fully realised at the close of t; j + 5 = t is allowed and no neighbour target uses a return after the close of day t."
  adoption_cost: "low"
  verified: true
  related: ["linear_probe", "latent_organization_probes", "untrained_encoder_floor", "readout_sensitivity", "ssl_objective_ablation"]
- id: "rankme_effective_rank"
  name: "Effective rank (RankMe) and collapse diagnostics (per-dimension spread, off-diagonal covariance, spectrum)"
  category: "representation_metric"
  section: "C"
  status: "canonical"
  status_note: "Kept canonical. Originals: Roy & Vetterli 2007 (effective rank) and Garrido+ 2023 (RankMe for SSL embeddings). Restricted to within-method collapse monitoring, as Garrido+ 2023 advise and as S1 and S17 show is necessary; S16 is the counter-example that reads RankMe as a health signal."
  priority: "should"
  plain_english: "Measure how many directions the embeddings actually use (the exponential of the entropy of their normalised singular values), plus simple checks for dead or redundant dimensions. It flags collapse during training, but a higher rank is not a better model."
  formula: '\mathrm{erank}(A)=\exp\Big(-\sum_{k=1}^{Q}p_k\log p_k\Big),\ p_k=\frac{\sigma_k(A)}{\|\sigma(A)\|_1},\ Q=\min(M,N),\ 0\log 0=0;\qquad \mathrm{RankMe}(Z)=\exp\Big(-\sum_{k=1}^{\min(N,K)}p_k\log p_k\Big),\ p_k=\frac{\sigma_k(Z)}{\|\sigma(Z)\|_1}+\epsilon;\qquad v(Z)=\frac{1}{d}\sum_{j=1}^{d}\max\big(0,\gamma-S(z^j,\epsilon_v)\big),\ S(x,\epsilon_v)=\sqrt{\mathrm{Var}(x)+\epsilon_v};\qquad c(Z)=\frac{1}{d}\sum_{i\ne j}[C(Z)]_{ij}^2,\ C(Z)=\frac{1}{n-1}\sum_{i=1}^{n}(z_i-\bar z)(z_i-\bar z)^{\top}'
  computable_form: 'Z_c=Z-\mathbf{1}\bar z^{\top};\ G=Z_c^{\top}Z_c\ (\text{or }Z_cZ_c^{\top}\text{, whichever is smaller; float64});\ \sigma_k=\sqrt{\max(\lambda_k(G),0)};\ p_k=\frac{\sigma_k}{\sum_j\sigma_j}+10^{-5};\ \mathrm{RankMe}=\exp\Big(-\sum_k p_k\log p_k\Big);\qquad \text{Jing+ 2022: sorted }\log\sigma_k\big(\tfrac{1}{N}Z_c^{\top}Z_c\big);\qquad \text{alpha-ReQ: }\hat\alpha=-\text{slope of }\log\lambda_j\text{ on }\log j'
  conventions: "Matrix: the N × K matrix Z of encoder outputs at the readout the head uses (per (stock, date) tokens; also the date-level pooled state), never the JEPA predictor's output (Thilak+ 2024 found RankMe on I-JEPA's conditional predictor not meaningful and scored encoder outputs, student and teacher). Use singular values of the data matrix, not eigenvalues of its covariance: the effective rank of the covariance (eigenvalues ∝ σ²) is a different number; S4's 'effective rank' is a participation ratio of loading-covariance eigenvalues and is not comparable either. Centring: primary = column-centred Z (as S17 and S3); secondary = uncentred (S1's code path) for comparison with S1's published values; Garrido+ 2023 do not specify. ε = 10^-5 added to each p_k (S1's code value; Garrido+ 2023 give no value, and the 10^-7 in their Sec. 3.1 belongs to the thresholded classical rank). Sample: N = 25,600 rows (Garrido+ 2023) drawn uniformly with a fixed seed, the same rows for every checkpoint of a method; when the value informs a training, checkpoint or tuning decision the rows come from the pre-2022 validation period 2017-01-01 to 2021-12-31 (G8), and locked-window values are computed only after unlocking and are descriptive; float64; report N, K, ε, centring and RankMe/K (as S16 does). Collapse diagnostics on the same rows: per-dimension S(z^j, 10^-4) and the VICReg hinge v(Z) with γ = 1 (Bardes+ 2022 defaults; meaningful as a level only for embeddings trained toward unit spread, otherwise report the min / median / max of S and the count of dimensions with S < 10^-3 × median S, our threshold); c(Z) with the 1/(n − 1) covariance (VICReg); the sorted log singular-value spectrum of the 1/N centred covariance (Jing+ 2022), plotted. Optional: alpha-ReQ's decay α̂ fitted in log-log space on the centred covariance spectrum (Agrawal+ 2022; state the fit range, which their main paper does not give). Use: track over checkpoints and hyperparameters within one method; never rank objectives, encoders, or our model against baselines by rank."
  inputs: ["encoder-output embeddings at the head's readout (per stock-date and pooled per date) for a fixed sample of rows", "checkpoint list per method", "row-sampling seed, N, ε and the centring choice"]
  guards_against: "Undetected dimensional or complete collapse of the latent during pretraining (a broken encoder that later looks merely weak)."
  typical_values: "S1 Market-1T (arXiv v2 Table 5, mean ± SE over evaluation months; mean-pooled full-day embeddings; code: uncentred, ε = 10^-5, N = 14,144 rows per arm-month): supervised arms 2.8–3.7 (width 384); LeJEPA arms 11.1–15.3; I-JEPA 5.5, MAE 10.6, DINO 11.2, CoST 17.3, TimeMAE 61.7, TF-C 81.4 (width 256); Random ViT 43.2; Chronos-2 107.1 (width 768), Kronos 77.3 (832), TimesFM 3.0 111.9 (1280). Caveat: S1's plots/latent_eval/README.md (read 2026-11-12) states that every latent result before 2026-09-14 was read at the wrong token (supervised arms at the last token, SSL arms at the mean, the random-init floor at cls) and that the reported tables are being rebuilt; whether these v2 (13 Oct 2026) Table 5 values are post-fix is unconfirmed, so treat them as orders of magnitude, not reproduction targets. S16 jepa-trader (blog): 65.0–88.1 of 128–192 dimensions (RankMe/D 0.40–0.69). S17 causal-jepa (centred, at most 4,096 rows): 36.4 → 93.8 from 600 to 19,200 training steps while the MLP-probe R² fell from +0.3966 to +0.3055. S3 STOCK-JEPA (US_ALL, Jan 2024–Nov 2025, centred daily matrices): average daily effective rank 21.1 of 128."
  pitfalls: "Rank is not a quality score: S1's best forecasters (supervised) have the lowest RankMe (2.8–3.7) and the Random ViT 43.2 (S1's latent values carry its pooling-bug caveat, see typical_values, so this cross-arm contrast may partly reflect different tokens); S17's rank rose while utility fell; Garrido+ 2023 report that the highest-rank VICReg run is not the best on StanfordCars and limit RankMe to runs of one method. S16 reads 65–88 as 'no collapse', the only use we allow (a floor check), not as 'good'. ε placement differs across codes (Garrido+ 2023 and S1 add ε to p_k; S17 adds it to the denominator), centring differs (S1 none; S17 and S3 centred), and N differs (25,600 / 14,144 / 4,096): fix all three and compare only within one convention. Width bounds rank (Q = min(N, K)), so compare RankMe/K across widths. Uncentred RankMe is pulled down by a large common mean direction. alpha-ReQ's power-law assumption fails under collapse (Garrido+ 2023)."
