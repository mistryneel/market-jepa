- id: "lidar"
  name: "LiDAR: effective rank of the whitened between-class scatter over views"
  category: "representation_metric"
  section: "C"
  status: "emerging"
  status_note: "Kept emerging: introduced by Thilak+ 2024 (ICLR 2024) for joint-embedding SSL and tested on I-JEPA, data2vec, DINO, SimCLR and VICReg; no finance use was found. The market-data definitions of surrogate classes and views, the unbiased-estimate normalisations and the values of δ and ε are our design."
  priority: "nice"
  plain_english: "Treat each market date as its own 'class' and the model's own masked versions of that date as its members; LiDAR counts how many directions separate dates relative to the spread within each date's versions. It is a label-free rank score meant to track probe performance better than RankMe, but only within one method."
  formula: '\mu_x=\mathbb{E}_{\tilde x\sim\mathcal{D}_x}\big[e(\tilde x)\big],\ \mu=\mathbb{E}_{x\sim\mathcal{D}}[\mu_x],\ \Sigma_b=\mathbb{E}_{x}\big[(\mu_x-\mu)(\mu_x-\mu)^{\top}\big],\ \Sigma_w=\mathbb{E}_{x}\mathbb{E}_{\tilde x\sim\mathcal{D}_x}\big[(e(\tilde x)-\mu_x)(e(\tilde x)-\mu_x)^{\top}\big]+\delta I_p,\ \Sigma_{\mathrm{lidar}}=\Sigma_w^{-1/2}\Sigma_b\Sigma_w^{-1/2},\ p_i=\frac{\lambda_i(\Sigma_{\mathrm{lidar}})}{\|\lambda\|_1}+\varepsilon,\ \mathrm{LiDAR}(e)=\exp\Big(-\sum_{i=1}^{p}p_i\log p_i\Big)'
  computable_form: '\hat\mu_x=\frac{1}{q}\sum_{v=1}^{q}e(\tilde x_v),\ \hat\mu=\frac{1}{n}\sum_{x}\hat\mu_x,\ \hat\Sigma_b=\frac{1}{n-1}\sum_{x}(\hat\mu_x-\hat\mu)(\hat\mu_x-\hat\mu)^{\top},\ \hat\Sigma_w=\frac{1}{n(q-1)}\sum_{x}\sum_{v=1}^{q}\big(e(\tilde x_v)-\hat\mu_x\big)\big(e(\tilde x_v)-\hat\mu_x\big)^{\top}+\delta I_p;\ \hat\Sigma_w=U\,\mathrm{diag}(\omega)\,U^{\top}\Rightarrow\hat\Sigma_w^{-1/2}=U\,\mathrm{diag}(\omega^{-1/2})\,U^{\top}'
  conventions: "Surrogate class x (our design): one forecast date t, i.e. the model's input window ending at the close of t. Views x̃: q independent draws of the model's own pretraining transformation of that input (for a JEPA, the context mask over the stock × time token grid), following Thilak+ 2024's rule that each method uses its own input transformations unchanged. e(x̃): the encoder output pooled to a vector with the readout fixed in readout_sensitivity; compute it for the context (student) and target (teacher) encoders, never the predictor. n = 1,000 dates sampled with a fixed seed from the pre-2022 validation period 2017-01-01 to 2021-12-31 (G8), q = 50 views (Thilak+ 2024's I-JEPA setting; they used n = 5,000–10,000 and q = 10 for longer embeddings). The 1/(n − 1) and 1/(n(q − 1)) normalisations are our reading of the paper's 'unbiased estimates'. δ = 10^-4 × tr(Σ̂_b + Σ̂_w without the ridge)/p, i.e. relative to the total scatter, and ε = 10^-5 (our choices; the paper gives no values); report both and a ×10 / ×0.1 sensitivity. Do not scale δ by tr(Σ̂_w) alone: it vanishes as the views stop moving the embedding, exactly the near-invariant case, and Σ̂_w^{-1/2} then amplifies rounding noise (with identical views it is undefined; in our check it returned 15.03 instead of the exact 15.46). If p > n, first project onto the top-n principal directions of the pooled embeddings (Thilak+ 2024: rank Σ_lidar ≤ min(rank Σ_w, rank Σ_b) and rank Σ_b ≤ n). Symmetrise Σ_lidar before the eigen-decomposition and clip tiny negative eigenvalues to 0. Validation within one method: across checkpoints or hyperparameter configurations, Spearman ρ and signed Kendall τ between LiDAR and an oracle, the validation per-asset NLL of linear_probe's covariance probe negated so that higher is better; use the signed τ because the paper prints |C − D|/(C + D). Optional per-(stock, date) variant: class = (stock i, date t), views = masks, e = that stock's token. Develop and validate on the pre-2022 validation period only (G8); LiDAR is a descriptive diagnostic and never evidence for H1–H4 (G5)."
  inputs: ["encoder checkpoints (context and target encoders) for one method", "the pretraining mask sampler or other view transformation", "n sampled dates with q views each, fixed seeds", "readout pooling", "oracle scores per checkpoint (validation NLL of the covariance probe)"]
  guards_against: "Choosing checkpoints or hyperparameters by an unsupervised score that ignores the SSL task; LiDAR discounts embedding directions that do not separate samples under the model's own views, which RankMe counts."
  typical_values: "Thilak+ 2024 (I-JEPA on ImageNet-1K, hyperparameters sampled at random; linear-probe top-1 accuracy of the configuration each criterion selects, Table 4 read from the source text): oracle 68.98%, RankMe 53.37%, LiDAR on the student 61.18%, LiDAR on the teacher 66.89%. No finance values reported in the sources read."
  pitfalls: "The score depends on how views are sampled, so LiDAR is not comparable across methods with different transformations; on market data the view definition is ours and must be pre-registered. It can correlate negatively with probe accuracy (VICReg with high-dimensional embeddings in Thilak+ 2024). High rank is necessary but not sufficient, as for RankMe and alpha-ReQ. Inverting Σ_w is costly and ill-conditioned without δ, and results move with δ. Only linear probes were studied as the oracle. Computing it on a JEPA predictor's output is ill-posed. It is not evidence for H1–H4."
  used_by:
    - ref: "Thilak+ 2024"
      title: "LiDAR: Sensing Linear Probing Performance in Joint Embedding SSL Architectures"
      authors: "Thilak, V., Huang, C., Saremi, O., Dinh, L., Goh, H., Nakkiran, P., Susskind, J. M., & Littwin, E."
      year: 2024
      venue: "In The Twelfth International Conference on Learning Representations (ICLR 2024), spotlight poster. OpenReview id f3g5XpL9Kb. arXiv:2312.04000"
      url: "https://proceedings.iclr.cc/paper_files/paper/2024/hash/fb0b57dfb8686c357f96e41b880ce7ed-Abstract-Conference.html"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Introduces LiDAR (an LDA-based smooth rank over surrogate classes and their views) and shows it tracks linear-probe accuracy better than RankMe for I-JEPA, data2vec, DINO, SimCLR and VICReg."
    - ref: "Roy & Vetterli 2007"
      title: "The effective rank: A measure of effective dimensionality"
      authors: "Roy, O., & Vetterli, M."
      year: 2007
      venue: "In Proceedings of the 15th European Signal Processing Conference (EUSIPCO 2007), Poznan, Poland, 3-7 September 2007, pp. 606-610. EURASIP"
      url: "https://doi.org/10.5281/zenodo.40328"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Provides the smooth (effective) rank measure that LiDAR applies to the eigenvalues of Σ_lidar."
    - ref: "Garrido+ 2023"
      title: "RankMe: Assessing the Downstream Performance of Pretrained Self-Supervised Representations by Their Rank"
      authors: "Garrido, Q., Balestriero, R., Najman, L., & LeCun, Y."
      year: 2023
      venue: "In Proceedings of the 40th International Conference on Machine Learning (ICML 2023), PMLR 202, 10929-10974. arXiv:2210.02885"
      url: "https://proceedings.mlr.press/v202/garrido23a.html"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "RankMe is the label-free baseline LiDAR is compared against, with the same ε-smoothed entropy form."
    - ref: "Agrawal+ 2022"
      title: "alpha-ReQ: Assessing Representation Quality in Self-Supervised Learning by measuring eigenspectrum decay"
      authors: "Agrawal, K. K., Mondal, A. K., Ghosh, A., & Richards, B. A."
      year: 2022
      venue: "In Advances in Neural Information Processing Systems 35 (NeurIPS 2022), 17626-17638"
      url: "https://doi.org/10.52202/068431-1281"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Proposes alpha-ReQ, an alternative label-free spectral criterion its authors call necessary but not sufficient for downstream accuracy."
  relevance:
    H1: "low"
    H2: "none"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Optional label-free checkpoint-selection diagnostic for the encoder; never evidence for a hypothesis."
  implementation:
    libraries: ["numpy", "scipy"]
    notes: "1) Sample n = 1,000 dates from the pre-2022 validation period with a fixed seed; for each, draw q = 50 masks from the pretraining mask sampler and run the context and target encoders in inference mode; pool with the pre-registered readout. 2) Compute μ̂_x, μ̂, Σ̂_b (1/(n − 1)) and Σ̂_w (1/(n(q − 1))); add δI with δ = 10^-4 · tr(Σ̂_b + Σ̂_w)/p, using the raw Σ̂_w before the ridge; if tr(Σ̂_b + Σ̂_w) = 0 (every embedding identical) stop with an error instead of returning a value. 3) Form Σ̂_w^-1/2 by eigen-decomposition, then Σ_lidar; symmetrise; eigenvalues; clip negatives; p_i = λ_i/Σλ + 10^-5; LiDAR = exp(entropy). 4) Validate within one method by Spearman ρ and signed Kendall τ against the negated validation NLL of the covariance probe across checkpoints. Checks: if all views of a date are identical, Σ̂_w = δI with δ > 0 (from tr Σ̂_b) and LiDAR equals the ε-smoothed effective rank of Σ̂_b's eigenvalues exactly; if the only within-date variation is i.i.d. isotropic noise N(0, s²I) added to the pooled embeddings, LiDAR is close to that effective rank of Σ̂_b; LiDAR is unchanged by an orthogonal rotation of the embedding space."
  adoption_cost: "medium"
  verified: true
  related: ["rankme_effective_rank", "linear_probe", "readout_sensitivity"]
- id: "latent_organization_probes"
  name: "Latent-organisation probes (same day, same firm, same industry; sector separation and co-movement neighbours)"
  category: "representation_metric"
  section: "C"
  status: "emerging"
  status_note: "Kept emerging: introduced for market encoders by S1 (tasks T1–T4); S4 and Dolphin+ 2024 provide sector-separation variants on stock embeddings. Point-in-time sector labels, the grouped-fold classification probe and the forward-correlation neighbour variant are our design."
  priority: "nice"
  plain_english: "Check whether embeddings of the same day, the same firm or the same industry sit close together, and whether stocks that move together are neighbours. This describes how the latent organises the cross-section; in S1 it was unrelated to forecasting skill."
  formula: 'd_{ij}=\|e_i-e_j\|_2^2,\quad h_i=\mathbb{1}\Big\{\arg\min_{j\in\mathcal{P}_i}d_{ij}\in\mathcal{T}_i\Big\},\quad \mathrm{Ratio}=\frac{\frac{1}{|Q|}\sum_{i\in Q}h_i}{\frac{1}{|Q|}\sum_{i\in Q}c_i},\quad r_i=1+\#\{j\in\mathcal{P}_i:\ d_{ij}<d_{i,\mathrm{tgt}(i)}\},\quad q_i=\frac{r_i-1}{n_i-1};\qquad \mathrm{sil}(i)=\frac{b(i)-a(i)}{\max\{a(i),b(i)\}},\quad \mathrm{SepRatio}=\frac{\bar\delta_{\mathrm{inter}}}{\bar\delta_{\mathrm{intra}}},\quad \mathrm{AUC}_{\mathrm{sep}}=\Pr\big(-\delta_{ij}>-\delta_{kl}\mid g(i)=g(j),\ g(k)\ne g(l)\big),\quad J_i=\frac{|N^{\mathrm{lat}}_k(i)\cap N^{\mathrm{corr}}_k(i)|}{|N^{\mathrm{lat}}_k(i)\cup N^{\mathrm{corr}}_k(i)|}'
  computable_form: 'c^{T1}_i=\frac{|\mathcal{T}_i|}{|\mathcal{P}_i|},\ c^{T2}_i=\frac{1}{n_{\mathrm{days}}},\ c^{T3}=\frac{1}{6},\ c^{T4}=\frac{S-1}{PS-1}=\frac{1}{5}\ (P=3,\ S=2);\quad q^{T4}_f=\frac{r_f-1}{PS-2};\quad \delta_{ij}=\|\bar e_i-\bar e_j\|_2,\ a(i)=\frac{1}{|g(i)|-1}\sum_{j\in g(i),\,j\ne i}\delta_{ij},\ b(i)=\min_{G\ne g(i)}\frac{1}{|G|}\sum_{j\in G}\delta_{ij}'
  conventions: "S1 retrieval tasks (definitions from S1's code): a panel is P = 3 randomly drawn industries × S = 2 firms present all month, with one embedding per (firm, day); distances are squared Euclidean on raw embeddings (not normalised, not centred). T1: a firm-day view against all views of the other panel firms; hit if the nearest is the same-day view of its same-industry partner (chance |T_i|/|P_i|; S1's pool is about 103). T2: against day centroids built without the focal firm; hit if the nearest is its own day (chance mean 1/n_days). T3: against the six firm centroids built without the focal day; hit if the nearest is its own firm (chance 1/6). T4: each firm's month-mean against the other firms' month-means; hit if the nearest is its industry partner (chance 1/5). Report Ratio (hit rate ÷ chance) and the mean percentile rank (chance 0.5, lower is better); aggregate 10 seeded panels per month, then across months, with t-statistics across months (S1). Our embeddings: the per-stock token at the head's readout on each day. Sector metrics (S4): each stock's embedding averaged over the evaluation month (ē_i), Euclidean distance δ; silhouette as defined above (the standard definition, our statement; S4 does not print it); separation ratio = mean inter-sector ÷ mean intra-sector distance; separation AUC = ROC AUC of pairwise similarity (negative distance) for same-sector pairs; neighbour overlap J_i with k = 10 (our choice; S4 does not state k) between latent neighbours and return-correlation neighbours, the latter from (a) the 63 trading days ending at the embedding month's end (S4-like) and (b) the 63 trading days after it (forward; our design); far-tail ordering = Spearman between latent distance and 1 − return correlation over the 10% most distant latent pairs (S4). Classification variant (Dolphin+ 2024 used an SVM with 5-fold CV): multinomial logistic probe on ē_i with 5 folds grouped by firm, macro-F1 and accuracy (our choice). Labels: point-in-time GICS sector or Fama–French 49 industry (S1 uses FF49) as of the embedding date. Report the untrained-encoder floor beside every number, and the Spearman correlation between organisation and forecasting rankings across arms (S1)."
  inputs: ["per-stock embeddings per day at the readout", "point-in-time sector or industry labels", "daily returns for correlation neighbours (backward and forward windows)", "panel-sampling seeds", "untrained-encoder embeddings"]
  guards_against: "Over-claiming from qualitative plots that a latent 'understands' market structure; gives reproducible numbers with chance levels and a floor."
  typical_values: "S1 Market-1T (arXiv v2 Table 3; ratio to chance / mean percentile rank for T1, T2, T3, T4): Random ViT 1.82×/45.6%, 1.48×/44.4%, 1.81×/36.2%, 1.16×/46.6%; I-JEPA 2.24×/40.5%, 1.89×/39.5%, 1.06×/49.0%, 1.24×/45.1%; supervised multihead 2.25×/44.4%, 1.70×/43.6%, 2.35×/28.6%, 1.38×/43.8%; LeJEPA same-stock views 5.36×/2.5% on T3; forecasting and organisation rankings correlate at ρ = −0.19. Caveat: S1's plots/latent_eval/README.md (read 2026-11-12) states that every latent result before 2026-09-14 was read at the wrong token (supervised arms at the last token, SSL arms at the mean, the random-init floor at cls) and that the reported tables are being rebuilt; whether these v2 (13 Oct 2026) values are post-fix is unconfirmed, so treat them as orders of magnitude. S4 CD-DFM vs GKX (239 S&P 500 stocks, test 2022–2024, 5 seeds): sector silhouette 0.38 vs 0.28, separation AUC 0.98 vs 0.98, separation ratio 3.0 vs 2.5, neighbour overlap 0.27 vs 0.30, far-tail ordering 0.03 vs −0.02. Dolphin+ 2024 (611 US stocks, 2000–2018, 11 GICS sectors, SVM with 5-fold CV): F1 0.69 / accuracy 69% vs 0.53 / 58% for the best time-series baseline."
  pitfalls: "Organisation is not forecasting skill (S1: ρ = −0.19; its own-firm and own-day rankings were strongly negatively correlated). If sector or firm identity is a model input, sector separation is circular: S4's encoder receives GICS sector as a categorical feature. Embeddings that encode firm identity win T3 without forecasting (LeJEPA same-stock views 5.36×). Raw squared-Euclidean distances depend on embedding scale and width, so compare arms only with the floor beside them. Small panels (6 firms) are noisy, hence 10 panels per month. Labels must be point-in-time. Metrics can disagree: S4's GKX beat CD-DFM on neighbour overlap. Dolphin+ 2024's embeddings are per-asset lookups, not an encoder, and its SVM kernel is unspecified."
  used_by:
