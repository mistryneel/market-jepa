      url: "https://doi.org/10.1016/j.jeconom.2018.09.004"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "abstract_only"
      accessed: "2026-11-12"
      how_used: "Estimates latent factors and loadings by PCA of high-frequency realised covariation, with a perturbed-eigenvalue-ratio estimator of the number of factors and a continuous/jump split (read at abstract level)."
    - ref: "Kelly+ 2019"
      title: "Characteristics are covariances: A unified model of risk and return"
      authors: "Kelly, B. T., Pruitt, S., & Su, Y."
      year: 2019
      venue: "Journal of Financial Economics, 134(3), 501-524. (Earlier version: NBER Working Paper 24540, April 2018.)"
      url: "https://doi.org/10.1016/j.jfineco.2019.05.001"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      version_read: "formulas from the NBER working paper"
      accessed: "2026-11-12"
      how_used: "Models factor loadings as linear functions of firm characteristics (β = z'Γ_β), the linear map our decoder applies to embeddings in place of characteristics."
  relevance:
    H1: "high"
    H2: "low"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Checks that the pretrained latent carries the cross-asset dependence structure that H1's small covariance head must read out."
  implementation:
    libraries: ["numpy", "scipy", "pandas", "scikit-learn", "tfwm (S1 code: plots/latent_eval/factors/subspace_alignment.py, plots/core/fixed_panel_table.py)"]
    notes: "1) For each month estimate loadings from 5-minute returns with S1's estimator (verify against Pelger 2019's full text first) or use the pre-registered daily fallback; record K̂_m and eigenvalue gaps. 2) Average each firm's embeddings over month m (for the predictive variant, pair them with loadings from month m + 1). 3) F1: 5-fold CV grouped by firm; standardise with training-fold statistics; ridge with intercept, α by inner grouped CV; Pearson r per loading column on out-of-fold predictions; average. 4) F2: centre, SVD, top-10 PC scores; centre Λ; thin QR of both; the singular values of Q_P'Q_Λ are the canonical correlations; mean of squares over K̂; permutation z from 200 row permutations of Λ. 5) Report F1, F2, the floor and the permutation reference for each variant. Check: replacing the embeddings with the loadings plus small noise gives F1 and F2 close to 1."
  adoption_cost: "medium"
  verified: true
  related: ["latent_organization_probes", "linear_probe", "untrained_encoder_floor", "realized_covariance_target"]
- id: "cka"
  name: "Linear CKA representation similarity, debiased estimator primary"
  category: "representation_metric"
  section: "C"
  status: "canonical"
  status_note: "Kept canonical. Original: Kornblith+ 2019 (linear and RBF CKA with the biased HSIC estimator); its paper text defines no debiased CKA. The debiased form uses the unbiased HSIC_1 of Nguyen+ 2021 (attributed there to Song et al. 2012; equation numbers from its arXiv version) and the U-centring of Murphy+ 2024, both opened in this pass; Davari+ 2022 (published at ICLR 2023; read as arXiv v2, abstract only) documents sensitivity and manipulability."
  priority: "nice"
  plain_english: "A number between 0 and 1 (debiased: roughly −1 to 1) saying how similar two sets of embeddings of the same examples are, ignoring rotations and overall scale. Use it to describe how encoders differ, for example how much crypto fine-tuning changes the US-pretrained encoder; it says nothing about forecasting quality."
  formula: '\mathrm{CKA}_{\mathrm{lin}}(X,Y)=\frac{\|Y^{\top}X\|_F^2}{\|X^{\top}X\|_F\,\|Y^{\top}Y\|_F}\ (\text{columns centred});\quad \mathrm{HSIC}_0(K,L)=\frac{\mathrm{tr}(KHLH)}{(n-1)^2},\ H=I_n-\tfrac{1}{n}\mathbf{1}\mathbf{1}^{\top},\quad \mathrm{CKA}(K,L)=\frac{\mathrm{HSIC}(K,L)}{\sqrt{\mathrm{HSIC}(K,K)\,\mathrm{HSIC}(L,L)}};\quad \mathrm{HSIC}_1(K,L)=\frac{1}{n(n-3)}\Big[\mathrm{tr}(\tilde K\tilde L)+\frac{\mathbf{1}^{\top}\tilde K\mathbf{1}\,\mathbf{1}^{\top}\tilde L\mathbf{1}}{(n-1)(n-2)}-\frac{2}{n-2}\mathbf{1}^{\top}\tilde K\tilde L\mathbf{1}\Big];\quad \mathrm{dCKA}(X,Y)=\frac{\mathrm{HSIC}_1(XX^{\top},YY^{\top})}{\sqrt{\mathrm{HSIC}_1(XX^{\top},XX^{\top})\,\mathrm{HSIC}_1(YY^{\top},YY^{\top})}}'
  computable_form: '\breve A_{ij}=a_{ij}-\frac{1}{n-2}\sum_{l=1}^{n}a_{il}-\frac{1}{n-2}\sum_{k=1}^{n}a_{kj}+\frac{1}{(n-1)(n-2)}\sum_{k,l=1}^{n}a_{kl}\ (i\ne j),\ \breve A_{ii}=0\ (\text{applied to }A\text{ with its diagonal set to }0);\quad \mathrm{HSIC}_1(K,L)=\frac{\langle\breve K,\breve L\rangle_F}{n(n-3)},\quad \mathrm{dCKA}=\frac{\langle\breve K,\breve L\rangle_F}{\|\breve K\|_F\,\|\breve L\|_F};\quad \mathrm{CKA}_{\mathrm{mb}}=\frac{\frac{1}{k}\sum_{b=1}^{k}\mathrm{HSIC}_1(K_b,L_b)}{\sqrt{\frac{1}{k}\sum_{b}\mathrm{HSIC}_1(K_b,K_b)}\,\sqrt{\frac{1}{k}\sum_{b}\mathrm{HSIC}_1(L_b,L_b)}}'
  conventions: "Rows: the same n examples in the same order for both representations, e.g. (stock, date) tokens or dates sampled with one fixed seed. In HSIC_1, K̃ and L̃ are K and L with their diagonals set to 0 (Nguyen+ 2021); n must exceed 3 (the factor 1/(n(n − 3)); Murphy+ 2024's U-centring needs n > 2); in practice n = 5,000 rows, or minibatches of 256 averaged over 10 passes as in Nguyen+ 2021, averaging the HSIC_1 terms before forming the ratio. Columns: centre only; do not rescale individual features, because CKA is invariant to orthogonal transforms and isotropic scaling but not to per-feature rescaling (Kornblith+ 2019); if a comparison needs standardised features, apply the same standardisation to every model and say so. Kernel: linear (Kornblith+ 2019 found linear and RBF CKA similar); RBF optional with bandwidth a pre-registered fraction of the median pairwise distance. Primary estimator: debiased (dCKA); also report biased linear CKA for comparability with the literature. Uses: (i) between encoders on identical inputs (JEPA vs MAE vs supervised vs untrained, per layer); (ii) H3: the US-pretrained encoder before vs after crypto fine-tuning, and the US-pretrained vs the crypto-from-scratch encoder, both on the same crypto inputs. CKA between equity embeddings and crypto embeddings of different examples is undefined (different rows). Our numerical check of these formulas: dCKA via HSIC_1 equals the U-centred inner-product form to machine precision, dCKA is unchanged by adding constants to columns, and for independent random matrices biased CKA rises with feature width while dCKA stays near 0."
  inputs: ["two embedding matrices for the same n examples, in the same order", "row-sampling seed or minibatch plan", "the layer or readout to compare"]
  guards_against: "Over-interpreting raw similarity between models; the debiased form avoids biased CKA's drift toward high values when there are few samples and many features (e.g. about 500 stocks on one date with long embeddings)."
  typical_values: "No comparable values reported in the sources read. Settings only: Nguyen+ 2021 compute minibatch CKA with minibatches of 256 over 10 passes through the test set."
  pitfalls: "Biased CKA gives high similarity even for pairs of random matrices in low-sample, high-dimensional settings and depends on the feature-to-sample ratio (Murphy+ 2024), so never use it on a single date's ~500 stocks with long embeddings. CKA responds to simple transformations, is sensitive to outliers, can change under transformations that preserve linear separability, and can be manipulated while model behaviour stays largely the same (Davari+ 2022): treat it as descriptive. It is not invariant to per-feature rescaling. Indices invariant to every invertible linear map give the same value whenever width ≥ n (Kornblith+ 2019, Theorem 1), one reason to prefer CKA, but small n still hurts. Debiased CKA can be negative; report it as is. High CKA does not mean equal forecasting quality."
  used_by:
    - ref: "Kornblith+ 2019"
      title: "Similarity of Neural Network Representations Revisited"
      authors: "Kornblith, S., Norouzi, M., Lee, H., & Hinton, G."
      year: 2019
      venue: "In Proceedings of the 36th International Conference on Machine Learning (ICML 2019), PMLR 97, 3519-3529. arXiv:1905.00414"
      url: "https://proceedings.mlr.press/v97/kornblith19a.html"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "original definition: CKA as normalised HSIC with linear and RBF kernels (biased estimator), its invariance properties and the linear closed form ||Y'X||_F^2/(||X'X||_F ||Y'Y||_F)."
    - ref: "Nguyen+ 2021"
      title: "Do Wide and Deep Networks Learn the Same Things? Uncovering How Neural Network Representations Vary with Width and Depth"
      authors: "Nguyen, T., Raghu, M., & Kornblith, S."
      year: 2021
      venue: "ICLR 2021 (per the arXiv comments field); arXiv:2010.15327"
      url: "https://arxiv.org/abs/2010.15327"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Defines minibatch CKA from the unbiased estimator HSIC_1 (Eq. 3, Gram matrices with zeroed diagonals) so that the value does not depend on the batch size."
    - ref: "Murphy+ 2024"
      title: "Correcting Biased Centered Kernel Alignment Measures in Biological and Artificial Neural Networks"
      authors: "Murphy, A., Zylberberg, J., & Fyshe, A."
      year: 2024
      venue: "ICLR 2024 Re-Align Workshop (per the arXiv comments field); arXiv:2405.01012"
      url: "https://arxiv.org/abs/2405.01012"
      peer_reviewed: false
      source_type: "preprint"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Gives the U-centring form of the debiased estimator (App. A.5, Eq. 4) and shows that biased CKA scores random matrices as similar in low-sample, high-dimensional data."
    - ref: "Davari+ 2022"
      title: "Reliability of CKA as a Similarity Measure in Deep Learning"
      authors: "Davari, M., Horoi, S., Natik, A., Lajoie, G., Wolf, G., & Belilovsky, E."
      year: 2023
      venue: "International Conference on Learning Representations (ICLR 2023), poster; OpenReview 8HRvyxc606"
      url: "https://arxiv.org/abs/2210.16156"
      peer_reviewed: true
