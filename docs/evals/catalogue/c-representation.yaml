  implementation:
    libraries: ["numpy", "pandas", "scipy", "scikit-learn", "statsmodels", "causal-jepa (S17 code: scripts/residual_probe.py)"]
    notes: "1) Freeze the control-feature list and the strongest baseline (G4's best member of S on validation) before unlocking. 2) Matrix version: at every walk_forward refit fit heads B and B+Z (inputs concatenated and standardised with training statistics) with the same penalty grid and the validation-selected penalty; compute the gains Δ^inc_e; paired month-cluster bootstrap (B = 10,000); GW sensitivity on the rolling refits. 3) Combination check: evaluate the 21-point w grid on the pre-2022 validation period only, freeze ŵ, report Δ^comb on the locked window. 4) Residual version: ridge raw → y on train with λ chosen on the pre-2022 validation period (S17 used the last 20% of train), residualise train and test with the train coefficients, probe the residual with the embedding and with the untrained encoder using linear_probe's protocol; R² against the training-residual mean. 5) H4 version: logistic regressions with and without s_t on identical rows; ΔAUC and ΔAP; month-cluster bootstrap CIs that resample months and recompute both metrics on the same resampled rows. Check: adding a column of pure noise as the 'latent' must give Δ near 0 and a non-significant test."
