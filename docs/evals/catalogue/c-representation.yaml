- id: "factor_loading_recovery"
  name: "Recovery of statistical-factor loadings and of the factor subspace from stock embeddings (S1's F1 and F2)"
  category: "representation_metric"
  section: "C"
  status: "emerging"
  status_note: "Kept emerging: introduced for market encoders by S1 (F1, F2). Pelger 2019 was read at abstract level only, so S1's code is the reference for the loading estimator. The predictive variant (loadings from returns after the embedding month), the daily-data fallback and the inner-CV ridge penalty are our design."
  priority: "should"
  plain_english: "Estimate each stock's exposures to the main statistical return factors from realised returns, then test whether those exposures can be read off the stock's embedding for stocks the probe never saw, and whether the embeddings' main directions span the same subspace. A covariance head needs exactly this cross-asset structure."
  formula: 'F1=\frac{1}{M}\sum_{m=1}^{M}\frac{1}{4}\sum_{k=1}^{4}\mathrm{corr}\big(\hat\lambda^{\mathrm{OOS}}_{\cdot k,m},\hat\lambda_{\cdot k,m}\big),\qquad F2=\frac{1}{M}\sum_{m=1}^{M}\bar\rho_m,\quad \bar\rho_m=\frac{1}{\hat K_m}\sum_{j=1}^{\hat K_m}\rho_{j,m}^2,\quad \rho_{j,m}=\mathrm{CC}_j\big(P_m,\Lambda_m\big),\quad P_m=U_{:,1:10}S_{1:10}'
  computable_form: '\bar e_{i,m}=\frac{1}{|D_{i,m}|}\sum_{t\in D_{i,m}}e_{i,t};\quad \hat\lambda^{\mathrm{OOS}}_{i\cdot,m}=\hat b_{-g(i)}+\tilde{\bar e}_{i,m}^{\top}\hat W_{-g(i)},\quad (\hat b_{-g},\hat W_{-g})=\arg\min_{b,W}\sum_{i\notin g}\big\|\hat\lambda_{i\cdot,m}-b-\tilde{\bar e}_{i,m}^{\top}W\big\|_2^2+\alpha\|W\|_F^2\ (5\text{ folds grouped by firm});\quad \rho_{j,m}=\sigma_j\big(Q_P^{\top}Q_\Lambda\big),\ Q_P,Q_\Lambda\text{ orthonormal bases of the column-centred }P_m,\Lambda_m'
  conventions: "Loadings (S1's code, after Pelger): for evaluation month m, PCA of the realised correlation matrix of 5-minute log mid-quote returns over the month; the factor count K̂_m from the perturbed eigenvalue ratio with ε = 0.08; F1 uses the total-factor loadings (S1's estimator also splits continuous and jump factors). Loadings are the leading eigenvectors with any per-column scale: F1 (Pearson r per column) and F2 (canonical correlations) are invariant to column scaling and sign, and F2 also to rotation. Embeddings: each firm's mean over the month of its per-stock embedding at the head's readout (S1 averages full-day embeddings), standardised with training-fold statistics inside F1. F1: decode loadings 1–4 by ridge with an unpenalised intercept under 5-fold cross-validation grouped by firm (S1 groups by gvkey), so every scored loading belongs to a firm excluded from probe fitting; α by inner grouped CV over 45 log-spaced values in [10^-6, 10^5] (our choice; S1's α is not stated); Pearson r per column on out-of-fold predictions, averaged over the 4 columns, then over months. F2: centre the firm-mean embeddings, take the top-10 principal-component scores P = U_{:,1:10}S_{1:10}, centre the N × K̂ loading matrix, compute canonical correlations, average their squares over K̂ (if K̂ > 10, use min(10, K̂) and report it), then over months. S1 tabulates the raw mean; it also computes a 200-permutation z-score that is not tabulated; report both, permuting the rows of Λ. Variants: (i) contemporaneous, S1-comparable (embeddings and loadings from the same month); (ii) predictive, our design: embeddings averaged over month m, loadings estimated from month m + 1 returns, so the decoder cannot reuse the returns the embeddings summarised; (iii) daily fallback without intraday data: loadings from the correlation matrix of daily returns over 126 trading days ending at (contemporaneous) or starting after (predictive) the embedding month (our choice; noisier, not comparable with S1's values). Universe: stocks in the point-in-time universe of the embedding month (G10) with at least 90% valid return observations in the loading window (our threshold); report attrition by variant. In the predictive variant the threshold looks at month m + 1 returns, a forward-looking completeness filter that G11 rules out for forecast targets; it is kept here only because F1 and F2 are descriptive and never enter a forecast comparison. Always print the untrained-encoder floor beside F1 and F2 (S1's repository rule)."
  inputs: ["5-minute (or daily) returns for the universe", "per-stock embeddings per day at the readout", "firm identifiers for grouped folds (e.g. PERMCO or gvkey)", "loading-estimator settings (4 decoded columns, ε = 0.08, window)", "untrained-encoder embeddings", "permutation seed"]
  guards_against: "Claiming that a latent supports covariance modelling without showing that it carries the cross-asset factor exposures a covariance head needs; the predictive variant also guards against decoding returns the embeddings already summarised."
  typical_values: "S1 Market-1T (arXiv v2 Table 3; F1 = mean out-of-sample Pearson r on loadings 1–4, F2 = mean squared canonical correlation; Pelger loadings from 5-minute returns): Random ViT 0.495 / 0.151; I-JEPA 0.608 / 0.203; MAE 0.547 / 0.178; CoST 0.711 / 0.181; TS2Vec 0.464 / 0.245; supervised return 0.633 / 0.202; supervised multihead 0.582 / 0.243; Chronos-2 0.674 / 0.221; TimesFM 3.0 0.716 / 0.194. Caveat: S1's plots/latent_eval/README.md (read 2026-11-12) states that every latent result before 2026-09-14 was read at the wrong token (supervised arms at the last token, SSL arms at the mean, the random-init floor at cls) and that the reported tables are being rebuilt; whether these v2 (13 Oct 2026) values are post-fix is unconfirmed, so use them as orders of magnitude, not as targets to reproduce or as floor margins. Pelger 2019 (abstract): four stable continuous systematic factors for S&P 500 firms, close to market and industry portfolios."
  pitfalls: "Same-data leakage: S1's repository warns that the loadings are functions of the same month's returns that the embeddings summarise; report the predictive variant. Pelger 2019 was read at abstract level only, so check its estimator before relying on the continuous/jump split. PCA eigenvectors are sign- and rotation-ambiguous: per-column F1 is meaningful only within a month and becomes unstable when eigenvalues k and k + 1 are close (report eigenvalue gaps); F2 is rotation-invariant. Canonical correlations between 10 PCs and K̂ loadings are positive by chance with a few hundred firms, so compare with the floor and the permutation z. Daily windows give at most window-length non-zero eigenvalues and noisy loadings. Firm-grouped folds are required: random stock-day folds let the probe see the same firm. A high F1 does not imply a good covariance forecast; the metric is descriptive."
  used_by:
    - ref: "S1"
      title: "Towards Financial World Modeling"
      authors: "Merchant, Guthrie, Mahns, Balestriero, Levy"
      year: 2026
      venue: "NeurIPS 2026 (poster); arXiv:2610.09048"
      url: "https://arxiv.org/abs/2610.09048"
