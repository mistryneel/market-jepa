    notes: "1) Extract and cache embeddings with their origin timestamps and the id of the encoder fit that produced them; assert that no input timestamp is after the origin. 2) Scalar ridge: for each λ solve (Z̃'Z̃ + λI)w = Z̃'(y − ȳ) by Cholesky; select λ on the pre-2022 walk-forward validation forecasts (G8) and freeze it; then refit at every walk_forward refit on that refit's training window and score the origins it serves. 3) Covariance probe: with D = diag(e^c), compute log det Σ̂ = Σ_i c_i + log det(I_k + B'D^-1 B) and Σ̂^-1 = D^-1 − D^-1 B (I_k + B'D^-1 B)^-1 B'D^-1 (Woodbury); with Σ* = (1/5)RR' (R the n × 5 return matrix), tr(Σ̂^-1 Σ*) = (1/5) Σ_d r_d'Σ̂^-1 r_d, all in O(n k²) without forming n × n matrices. Gradients (our derivation): G = (1/n)(Σ̂^-1 − Σ̂^-1 Σ* Σ̂^-1), ∂L/∂Γ = 2 Z̃'GB, ∂L/∂γ = Z̃'(diag(G) ⊙ e^c), ∂L/∂γ_0 = 1'(diag(G) ⊙ e^c), plus the penalty terms; optimise with scipy's L-BFGS. 4) Control task: draw C(i) with a fixed seed, fit and score the identical probe, report selectivity. 5) Report λ*, k, sample sizes and scores per refit. Checks: on synthetic data generated from Σ = BB' + D with known Γ, the probe's NLL approaches the true-Σ NLL as samples grow; with λ → 0 and full column rank the ridge equals OLS."
