- id: "readout_sensitivity"
  name: "Readout sensitivity: pooling, token, layer and head capacity (linear vs small MLP)"
  category: "protocol"
  section: "C"
  status: "emerging"
  status_note: "Kept emerging and widened, as the review asked, to cover head capacity. S1, S16 and S17 document readout effects on market data (including S1's pooling bug); Major+ 2026 (opened now) shows linear and MLP heads rank time-series SSL methods differently; Kolesnikov+ 2019, Caron+ 2021, Assran+ 2023 and Chen+ 2020 document readout choices in vision. The readout grid is our design assembled from these precedents."
  priority: "should"
  plain_english: "How a fixed encoder is read out (which token, how tokens are averaged, which layer, linear or small non-linear head) can change results more than the encoder does. Fix one readout in advance, then report how the conclusions change under the alternatives."
  formula: '\bar L_{a,r}=\frac{1}{|E|}\sum_{e\in E}L_e\big(\hat\Sigma^{(a,r)}_e\big),\qquad \mathrm{Range}_a=\max_{r\in\mathcal{R}}\bar L_{a,r}-\min_{r\in\mathcal{R}}\bar L_{a,r},\qquad \Delta^{\mathrm{floor}}_{a,r}=\bar L_{\mathrm{rand},r}-\bar L_{a,r},\qquad \tau_r=\frac{C_r-D_r}{A(A-1)/2}'
  computable_form: '\mathcal{R}=\{\text{last},\ \text{mean},\ \text{mean}\oplus\text{max},\ \text{concat last 4 layers}\}\times\{\text{linear covariance probe},\ \text{MLP }2\times256\ \text{GELU}\};\quad C_r,D_r=\text{numbers of concordant and discordant arm pairs between the ranking by }\bar L_{\cdot,r}\text{ and by }\bar L_{\cdot,r_0}'
  conventions: "Pre-register the primary readout r_0 (pooling, token, layer, head) on the pre-2022 validation period 2017-01-01 to 2021-12-31 before unlocking (G8); every confirmatory H1/H2 result uses r_0, and every other readout is a descriptive sensitivity analysis (G5). Readout grid (our default; each item has a precedent): token/pooling = the last time-step token (S16's and S17's best; S1's forecasting readout, pool = last), mean over tokens (S1's latent evaluations), mean ⊕ max concatenation (S17's mean_max), concatenation of the last 4 layers (DINO ViT-S; one of I-JEPA's two feature choices); layer = last vs the best layer chosen on the pre-2022 validation period (S1 swept layers for frozen foundation models); head = the linear covariance probe of linear_probe vs a small MLP covariance head with the same output form (our design): Σ̂_t = B_tB_t' + diag(e^{c_t}) with the same factor count k as the linear probe, where one shared per-stock MLP with two hidden layers of 256 GELU units (S17's 2 × 256 GELU probe architecture) maps each stock's standardised embedding z̃_{i,t} to its loading row b_{i,t} ∈ R^k and its log idiosyncratic variance c_{i,t}; it is trained on the mean per-asset NLL over training origins with AdamW (learning rate 10^-3, weight decay 10^-4, S17's settings), with early stopping on the last 6 months of each training window after a 5-trading-day purge (G8) and refits on the walk_forward calendar (G6), and its output passes the shared PD repair (G12). Apply the identical readout to every arm in a comparison, including the untrained floor and the supervised comparator, and report Δ^floor per readout. Rank arms by mean test loss; τ_r is the signed Kendall τ against the r_0 ranking over A arms (ties broken by a fixed arm order, reported). Also report MLP-vs-linear selectivity with linear_probe's control task, since MLP probes are less selective (Hewitt & Liang 2019). Orientation: Range_a is in nats per asset; Δ^floor_{a,r} is a gain, the floor's loss minus arm a's, so Δ^floor_{a,r} > 0 means arm a beats the floor under readout r (G1)."
  inputs: ["frozen encoders for every arm with per-layer token outputs", "the readout grid R and the pre-registered r_0", "linear covariance probe and MLP head recipes", "evaluation sets and the untrained floor"]
  guards_against: "Readout choice silently driving conclusions, inconsistent readouts across arms (S1's documented bug), and post hoc selection of the readout that favours our model."
  typical_values: "S16 jepa-trader: last-token pooling IC about 0.162 vs about 0.03 with mean pooling (about 5×). S17 causal-jepa (trained-minus-untrained lift in MLP-probe R², t; FINDINGS.md finding 9): last_patch 128-d +0.0545 (7.73), mean_max 256-d +0.0726 (6.02), concat_patches 768-d +0.0389 (2.41), concat_strikes 3072-d +0.0111 (1.17), mean_all 128-d −0.0005 (−0.12). With the same mean_all readout the ridge-probe lift is +0.0463 (t = 9.09) (finding 2), so whether a readout 'hides' the lift depends on the probe as well as the pooling. S1 Market-1T: its repository documents a pooling bug (supervised arms read at the last token, SSL arms at the mean, the floor at cls) and says its tables were being rebuilt (2026-09-14); for frozen foundation models the last layer was nearly uniformly optimal for forecasting. Major+ 2026 (forecasting MSE, SSL vs matched control): SSL win rates 18% with a linear head, 31% with an MLP head, 9% under fine-tuning. Kolesnikov+ 2019: an MLP probe adds little and leaves rankings largely unchanged (vision)."
  pitfalls: "Selecting the readout on the test window, or separately per arm, is a forking path; only r_0 is confirmatory. Mixed readouts across arms invalidate comparisons (S1's bug). Pooling can hide or create effects, and the effect depends on the probe: in S17 mean pooling hid a lift in MLP-probe R² that last-patch pooling shows, while the ridge probe shows a lift under mean pooling; S16 found a 5× IC gap between last-token and mean pooling. Larger heads make random features competitive and reduce selectivity (Hewitt & Liang 2019), and linear-probe rankings may not predict MLP or fine-tuning rankings (Major+ 2026). Sweeping layers for some arms but not others is 'not an entirely fair comparison' (S1's words about its foundation-model sweep). Multiple readouts multiply comparisons: report all of them; only r_0 enters the confirmatory families of G5 (multiple_testing), and every other readout is descriptive, with no claim made from it."
