- id: "ssl_objective_ablation"
  name: "SSL-objective ablation: JEPA vs masked reconstruction vs a contrastive objective on a fixed backbone, data, budget and head"
  category: "protocol"
  section: "C"
  status: "widely_used"
  status_note: "Widely used (emerging in the candidate list): two peer-reviewed 2026 papers in our space compare SSL objectives on a fixed backbone and data, S1 (NeurIPS 2026; 18 encoder-training strategies including I-JEPA, MAE, DINO, BYOL and CPC on one ViT-S backbone under a common protocol and probe) and S2 (ICML 2026; JEPA against a capacity-matched masked autoencoder). S3 and S16 run narrower objective controls, and Major+ 2026 (preprint) compares several SSL paradigms on a shared backbone under matched budgets. The contrastive arm's view definition is our design."
  priority: "should"
  plain_english: "Pretrain the same network three times, changing only the self-supervised objective (JEPA latent prediction, masked reconstruction, contrastive), then read each out with the same covariance head. If JEPA beats no pretraining but not the other objectives, the gain comes from pretraining in general, not from JEPA."
  formula: 'D^{(o)}_e=L_e\big(\hat\Sigma^{(o)}_e\big)-L_e\big(\hat\Sigma^{(\mathrm{JEPA})}_e\big),\ o\in\{\mathrm{MAE},\mathrm{CON}\};\qquad \mathcal{L}_{\mathrm{MAE}}=\frac{1}{|M|}\sum_{u\in M}\big\|\hat X_u-X_u\big\|_2^2;\qquad \mathcal{L}_{\mathrm{CON}}=-\frac{1}{B}\sum_{i=1}^{B}\log\frac{\exp\big(v_i^{\top}v_i^{+}/\tau\big)}{\sum_{j=1}^{B}\exp\big(v_i^{\top}v_j^{+}/\tau\big)},\ \|v_i\|_2=\|v_i^{+}\|_2=1;\qquad \text{S2 reference: }\mathcal{L}_{\mathrm{JEPA}}=\frac{1}{|M|}\sum_{u\in M}\big\|\hat Y_u-\mathrm{sg}(Y_u)\big\|_1'
  computable_form: '\bar D^{(o)}=\frac{1}{|E|}\sum_{e\in E}D^{(o)}_e,\quad \bar D^{(o)}>0\Rightarrow\text{the JEPA arm has lower per-asset NLL};\quad \mathrm{LB}^{(o)}=q_{0.05}\big(\{\bar D^{(o)*}_b\}_{b=1}^{B}\big),\ B=10{,}000\ \text{(paired month-cluster bootstrap; descriptive, no multiplicity adjustment)}'
  conventions: "Held fixed across arms: encoder architecture and width, tokenizer, input features and training-window normalisation, pretraining universe and walk_forward refit windows (m = 2,520 trading days, data ending at least 5 trading days before each refit date; G6, G7), masking distribution (shared by JEPA and MAE), optimiser, schedule and number of pretraining steps (compute matched), the shared list of K = 5 seeds (seed_vs_period), readout/pooling, and the covariance head with its training recipe. Event-input setting (our convention): each objective arm is trained in both deployed configurations of the pretrained model, v = 0 (scored on H1 ordinary-day origins, like (pre, 0)) and v = 1 (scored on the 88 pooled H2 event origins, like (pre, 1)), with the v = 0 rule of G9 (matched_supervised_comparator). Arm-specific modules are discarded after pretraining and excluded from the parameter count: the JEPA predictor and EMA target encoder, the MAE decoder (S2 used a 4-layer decoder), the contrastive projector. L_JEPA is our model's own latent-prediction loss; S2's L1 form with an EMA target and stop-gradient (sg) is shown for reference. L_MAE: MSE on the masked input-token features X_u, with the same masks as JEPA (S2's MAE ablation). L_CON: InfoNCE form, our adaptation of Wu+ 2018's non-parametric softmax (their Eq. 2, τ = 0.07) to two views: v_i and v_i^+ are L2-normalised projector outputs of two independent draws of the pretraining mask over the same date's cross-section; the other dates in the batch are negatives; τ = 0.07; batch size B fixed and reported. Each arm gets the same logged tuning budget on the pre-2022 validation period 2017-01-01 to 2021-12-31, with early stopping on the last 6 months of each training window after a 5-trading-day purge (G8; S1 used a two-stage search of up to 125 runs per method on 5 separate months); no tuning on the locked window. Evaluate (1) the primary metric through the same head: per-asset NLL on H1 ordinary-day origins (G4) and on the 88 pooled H2 event origins (G2); (2) descriptive diagnostics (knn_probe, factor_loading_recovery, latent_organization_probes; RankMe only within an arm). Report each arm beside the supervised comparator and the untrained floor. PD repair and failures follow G12 and G13 (an arm fails at an origin if any of its seeds fails). Orientation: D^(o)_e is a gain, objective o's loss minus the JEPA arm's, so D^(o)_e > 0 favours JEPA (G1). Inference: descriptive (G5): paired month-cluster bootstrap of D̄^(o) per contrast (block_bootstrap; B = 10,000; cluster = calendar month of day 0 for event origins and of the origin date for H1 origins; G3), reporting the mean and the one-sided 95% percentile lower bound, with no multiplicity adjustment and no confirmatory claim."
  inputs: ["pretraining data, universe and features per walk_forward fit (identical across arms)", "encoder architecture and masking distribution", "objective-specific modules: JEPA predictor and EMA target, MAE decoder, contrastive projector", "fixed pretraining compute budget (steps) and the shared list of K = 5 seeds", "equal tuning budget per arm on the pre-2022 validation period (G8)", "covariance head and its training recipe", "evaluation origins (H1 ordinary-day origins and the 88 pooled H2 event origins) with Σ*_e"]
  guards_against: "Attributing to the JEPA objective what any self-supervised pretraining, or simply more training, would deliver; it tells reviewers whether the world-model framing matters."
  typical_values: "S2 Mahns+ (US top-512 stocks; kNN k = 20, ±21-day exclusion): kNN R² JEPA vs capacity-matched MAE: log RV21 0.62 vs 0.54, PC1 share 0.29 vs 0.12, effective rank 0.24 vs 0.15, mean over structure descriptors 0.34 vs 0.25; adding the latent to an 18-feature baseline for 21-day effective-rank recovery (test 2024–Oct 2025): AUC 0.690 → 0.800 with JEPA vs 0.723 with MAE. S1 Market-1T (15-minute rank IC, return / volatility change / spread change, 32 months): I-JEPA 0.0103 / 0.0256 / 0.0646, MAE 0.0181 / 0.0684 / 0.1435, CPC 0.0184 / 0.0697 / 0.1519, DINO 0.0097 / 0.0310 / 0.0626, LeJEPA time warping 0.0204 / 0.0721 / 0.1691, Random ViT 0.0170 / 0.0694 / 0.1692. S3 STOCK-JEPA (matched readouts, 21-day RankIC ×100): ordinary JEPA without prior conditioning 9.17 (CN) / 9.05 (US) vs 11.11 / 12.45 for its prior-anchored Separate-EMA variant."
  pitfalls: "'Only the objective differs' is easy to violate: S2's MAE ablation used a frozen shared pretrained tokenizer and a cosine schedule, unlike the main model's jointly trained tokenizer and WSD schedule (its App. D.7). Hyperparameters tuned for JEPA handicap the other arms; give each the same tuning budget. Single-seed ablations (S2) cannot separate objective from seed noise. Effective rank is not comparable across objectives (Garrido+ 2023 restrict RankMe to runs of one method; in S1 the best forecasters have the lowest RankMe). Many SSL objectives fall below a random encoder in S1, so report the floor. Contrastive learning needs a definition of views for market data, and S1's five LeJEPA positive-pair strategies give different results (RankMe 11.1–15.3), so pre-register the view definition. The probe protocol can reorder objectives (Major+ 2026; readout_sensitivity)."
  used_by:
    - ref: "S2"
      title: "Joint-Embedding Predictive Learning of Latent Market States in U.S. Equities"
      authors: "Mahns, Balestriero, Assran"
      year: 2026
