- id: "two_year_yield_change"
  name: "Change in the 2-year Treasury yield around FOMC"
  category: "event_metric"
  section: "D"
  status: "canonical"
  status_note: "Canonical; original definition Hanson & Stein 2015 (two-day change in the 2-year zero-coupon yield), read in its FEDS 2012-46 working-paper version. For 2022-2026 the default is the intraday USMPD UST2Y change, because Nakamura & Steinsson 2018 (NBER WP 19260 version read) show one-day windows on longer rates carry background noise; the daily H.15 series (FRED DGS2, opened for this entry) is the always-available fallback. Status and priority unchanged."
  priority: "should"
  plain_english: "A simple, always-available measure of FOMC news: how much the 2-year Treasury yield moved around the announcement, which reflects news about the path of policy rates over the next couple of years."
  formula: '\Delta y^{2Y}_e(w)=y^{2Y}_{\mathrm{end}(w)}-y^{2Y}_{\mathrm{start}(w)}\ \ (\text{percentage points}),\quad w\in\{\text{USMPD monetary event (default)},\ \text{USMPD statement},\ \text{USMPD press conference}\};\qquad \Delta y^{2Y,1d}_e=\mathrm{DGS2}\big(d_e(0)\big)-\mathrm{DGS2}\big(d_e(-1)\big);\qquad \text{Hanson-Stein (replication only): }\Delta y^{HS}_e=y^{2Y,\mathrm{GSW}}_{t+1}-y^{2Y,\mathrm{GSW}}_{t-1},\ t=d_e(0)'
  computable_form: 'Read UST2Y (and OIS2Y) changes for the three USMPD windows per scheduled FOMC event; compute the one-day DGS2 change from the close of day -1 to day 0. Strata: \mathrm{sign}(\Delta y) and |\Delta y| above vs below the median of |\Delta y| over 1994-2021 scheduled FOMC events (fixed before unlocking).'
  conventions: "(1) Default for 2022-2026: the USMPD UST2Y change over the 100-minute monetary-event window, in percentage points; the statement-only window and the one-day DGS2 change are sensitivities; OIS2Y is an alternative instrument. (2) The Hanson-Stein two-day change (t-1 to t+1, Gurkaynak-Sack-Wright fitted zero-coupon yields in their paper) is used only to replicate their analysis, never as a stratifier or input for our endpoints, because its end point, the close of day +1, lies inside both scored windows. (3) Sign: positive = yield up (hawkish). (4) DGS2 is the H.15 2-year constant-maturity yield, quoted on an investment basis, in percent, daily. Hanson-Stein use fitted zero-coupon yields instead; never splice series. (5) Legality: the monetary-event change is known about 15:30 ET for a 14:00 statement (our arithmetic), so it is a legal input at the close-of-day-0 origin. DGS2 for day 0 is published after day 0 (on 2026-11-12 FRED's latest observation was 10 Nov with the next release on 13 Nov), so treat it as unavailable at the close of day 0 and use it only to stratify (our inference). (6) Size thresholds come from pre-2022 events and are frozen. (7) Report the Spearman correlation and sign agreement with mp_surprise_hf over the 36 locked-window FOMC events. (8) The same daily change around CPI releases is a market-implied CPI news proxy only under cpi_surprise's disclosure rules."
  inputs: ["USMPD UST2Y and OIS2Y changes by window (statement, press conference, monetary event)", "Daily 2-year constant-maturity yields (FRED DGS2, H.15)", "FOMC event table from event_timing_origin"]
  guards_against: "Results that hinge on one futures-based surprise construction, and stratifiers whose window already contains post-event market reactions that the forecast is scored on."
  typical_values: "A 100 bp two-day move in the 2-year yield on FOMC dates went with about a 42 bp rise in 10-year forward real rates; one-day changes gave similar but somewhat smaller effects (Hanson & Stein 2015; FOMC dates 1999-Feb 2012 excluding five dates with large asset-purchase news). USMPD provides UST2Y and OIS2Y changes for 30-, 70- and 100-minute windows, 1994-2026. Kroencke+ 2021's short-rate surprise factor loads on 3-month and 2-year yields."
  pitfalls: "(a) Daily and two-day windows carry background noise and other same-day news, and can greatly overstate precision (Nakamura & Steinsson 2018). (b) The Hanson-Stein two-day window ends at the close of day +1, inside both scored windows, so stratifying on it selects on part of the outcome. (c) Statement-only windows miss press-conference news, now the main source of policy news (Acosta+ 2025). (d) Dates with large asset-purchase news move long rates for other reasons; Hanson & Stein exclude five such dates (relevant to pre-2022 walk-forward events). (e) DGS2's day-0 value is not public at the day-0 close. (f) FRED marks DGS2 'Public Domain: Citation Requested' but its page also says the graph data are copyrighted; cite H.15 as the source."
