- id: "abnormal_volatility"
  name: "Event-study abnormal returns, volatility and correlation"
  category: "event_metric"
  section: "D"
  status: "canonical"
  status_note: "Canonical event-study method: Fama+ 1969 (event-study design) and Beaver 1968 (announcement-period return variance) are the originals, both read at metadata level only, so their exact statistics are not used here; the modern daily implementation follows MacKinlay 1997 and Brown & Warner 1985 (read). The ratio and co-movement formulas below are our specification and do not depend on Beaver's unverified statistic."
  priority: "should"
  plain_english: "Before claiming the model forecasts post-announcement risk better, check that in our own sample FOMC and CPI announcements really bring higher volatility and stronger co-movement than ordinary days, and by how much."
  formula: '\mathcal B_e=\{t\in[d_e(-63),d_e(-6)]:\ t\notin\mathcal A\};\qquad \mathrm{AVR}_e(\tau_1,\tau_2)=\frac{\frac{1}{\tau_2-\tau_1+1}\sum_{\tau=\tau_1}^{\tau_2}r_{m,d_e(\tau)}^2}{\frac{1}{|\mathcal B_e|}\sum_{t\in\mathcal B_e}r_{m,t}^2},\quad \overline{\mathrm{AVR}}(\tau_1,\tau_2)=\frac{1}{N_E}\sum_{e}\mathrm{AVR}_e(\tau_1,\tau_2);\qquad \mathrm{VR}(T)=\frac{\sum_{t\in T}\bar r_t^{\,2}}{\sum_{t\in T}\frac{1}{n}\sum_{i=1}^{n}r_{i,t}^2},\ \ \bar r_t=\frac{1}{n}\sum_{i=1}^{n}r_{i,t},\quad \mathbb E[\mathrm{VR}]\approx\frac1n+\Big(1-\frac1n\Big)\bar\rho,\quad \mathrm{ACR}_e(\tau_1,\tau_2)=\frac{\mathrm{VR}(\{d_e(\tau)\}_{\tau=\tau_1}^{\tau_2})}{\mathrm{VR}(\mathcal B_e)};\qquad AR_{m,e,\tau}=r_{m,d_e(\tau)}-\hat\mu_{m,e},\ \hat\mu_{m,e}=\frac{1}{|\mathcal B_e|}\sum_{t\in\mathcal B_e}r_{m,t},\ \ CAR_{m,e}(\tau_1,\tau_2)=\sum_{\tau=\tau_1}^{\tau_2}AR_{m,e,\tau};\qquad AR_{i\tau}=R_{i\tau}-\hat\alpha_i-\hat\beta_iR_{m\tau}\ \ (\text{MacKinlay eq. 7, OLS on }\mathcal B_e)'
  computable_form: 'Per event: \mathrm{AVR}_e and \mathrm{ACR}_e for the windows [-1,-1], [0,0], [1,1], [1,5] (primary scored days) and [0,5] (secondary scored days); CAR_{m,e} for the same windows; stock level, \mathrm{median}_i\,\mathrm{AVR}_{i,e} for the five- and six-day windows only. Across events: mean and median of \mathrm{AVR}_e, with month-cluster bootstrap intervals; one-sided tests of \mathbb E[\mathrm{AVR}_e]>1 for [0,0] and [1,5].'
  conventions: "(1) r_m is the value-weighted return of the origin's asset set N_e (forward_looking_panel_filter; universe rule G10; weights from the previous close's market caps); r-bar_t is its equal-weighted mean return (our convention). All returns are daily close-to-close simple returns including overnight and delisting returns. (2) Benchmark B_e: the trading days -63..-6 that are not in A (A = all FOMC/CPI days -1..+5); require at least 20 days, otherwise extend back to -126. The benchmark ends at day -6, as Brown & Warner's estimation period does, and never contains day -1 or other events' windows. (3) AVR is a ratio of mean squared returns (uncentred), not of sample variances; 1 means no abnormal volatility. Logs are taken only of multi-day ratios, never of single-day squared returns (a near-zero return sends the log to minus infinity). (4) VR and ACR are our derivation: with equal variances sigma^2 and common correlation rho, E[r-bar^2] = sigma^2[1/n + (1 - 1/n) rho] while the mean square is about sigma^2, so VR tracks the average pairwise correlation; with unequal variances it is a variance-weighted analogue. (5) Abnormal market returns use the constant-mean model (mu-hat from B_e), because a market model fitted to the market itself returns zero abnormal return (our reasoning); stock-level abnormal returns, if reported, use MacKinlay's market model estimated by OLS on B_e. (6) Stocks missing more than 10% of B_e are dropped from stock-level statistics. (7) Report FOMC (36), CPI (53) and pooled (88 origins, G2) results and results by year; intervals across origins use month clusters of day 0 (event_level_inference). The one-sided tests for [0,0] and [1,5] are pre-registered descriptive checks of H2's premise, outside every confirmatory family (G5); the other windows are descriptive. (8) With intraday data, replace r_t^2 by realized variance (intraday squared returns plus the squared overnight return) as a sensitivity."
  inputs: ["Daily close-to-close returns and previous-close market caps for each event's point-in-time universe", "Event table and the event-affected day set A", "Pinned exchange calendar", "Optional: intraday returns for realized variance"]
  guards_against: "Claiming H2 when the sample's announcements do not move second moments at all, and measuring abnormal risk against benchmarks contaminated by the pre-FOMC lull or by other events' windows."
  typical_values: "Realized daily market volatility was only about 4% higher on scheduled inflation, employment and FOMC announcement days, while market excess returns averaged 11.4 bp vs 1.1 bp, 1958-2009; their inflation announcement is the PPI after Feb 1971 (Savor & Wilson 2013). Equity returns were about 10% more volatile on Fed policy event days, June 1989-Dec 2002 (Bernanke & Kuttner 2005). Risk shifts account for about 70% of equity variance in 90-minute FOMC windows, 2006-2019 (Kroencke+ 2021). The S&P 500 rose about 49 bp on average in the 24 hours before scheduled FOMC announcements (Lucca & Moench 2015). The no-volatility-jump null (rank 0) was overwhelmingly rejected for FOMC announcements in interest-rate futures (S15). Doubling day-0 variance raised the null rejection rate of a time-series event test from 4.4% to 12.0% (Brown & Warner 1985 simulations). Our count: about 47% of the locked window's weekdays lie in FOMC/CPI -1..+5 blocks."
  pitfalls: "(a) A market-model abnormal return of the market itself is zero by construction; use the constant-mean model for the market. (b) Event-induced variance makes time-series t-tests of mean abnormal returns over-reject (Brown & Warner 1985: 4.4% to 12.0%); test across events instead. (c) Pre-event days are not neutral before FOMC (Lucca & Moench 2015 drift; Bomfim 2003 lull, abstract only), so the benchmark ends at day -6. (d) About half of the window's weekdays lie inside event blocks, so a benchmark that does not skip other events' windows understates the abnormal ratio. (e) Squared daily returns are noisy; average ratios across events and prefer intraday realized variance where available. (f) The documented uplift is modest (about 4-10% in volatility), so a null result here would weaken H2's premise; pre-register that it is reported either way. (g) Beaver's statistic was not verified (JSTOR only); do not label AVR as Beaver's U statistic."
