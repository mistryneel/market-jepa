- id: "cpi_surprise"
  name: "CPI surprise measure"
  category: "event_metric"
  section: "D"
  status: "gap"
  status_note: "Gap kept: the definition is standard (Andersen+ 2003), but no free, redistributable per-release CPI consensus series was found, and the standard survey (MMS) is now owned by a commercial vendor. Opened for this entry: Diercks+ 2026 show a free market-implied alternative, Kalshi CPI contracts, whose implied forecasts matched or beat the Bloomberg consensus for headline CPI since 2022 (data terms not checked); Knotek & Zaman 2023 document the Cleveland Fed nowcast's real-time record. Until a source is fixed, use a disclosed proxy and label it."
  priority: "should"
  plain_english: "How much a CPI release differed from what was expected just before it. The standard version needs paid economist-survey data, so until that is licensed we use a clearly labelled stand-in: a prediction-market or nowcast expectation, or, failing both, the size of the change from the previous month."
  formula: '\text{Andersen et al.: }S_{kt}=\frac{A_{kt}-E_{kt}}{\hat\sigma_k};\qquad \text{ours: }S^{(j)}_e=\frac{A_e-E^{(j)}_e}{\hat\sigma^{(j)}},\ \ \hat\sigma^{(j)}=\mathrm{SD}_{\text{pre-2022 releases}}\big(A-E^{(j)}\big)\ (\mathrm{ddof}=1),\ \ j\in\{\mathrm{CONS},\ \mathrm{NC}\};\qquad U^{\mathrm{KAL}}_e=A_e-E^{\mathrm{KAL}}_e\ \ (\text{pp, unstandardised});\qquad E^{\mathrm{KAL}}_e=\sum_k p_k\,x_k,\ \ p_k=P_{\mathrm{yes}}(>s_{k-1})-P_{\mathrm{yes}}(>s_k)\ \text{for adjacent strikes }s_{k-1}<s_k,\ x_k\ \text{the bin''s representative value};\qquad M_e=\big|A_e-A_{e-1}\big|\ \ (\text{fallback stratifier, not a surprise})'
  computable_form: 'A_e: first-release headline CPI-U month-over-month % change (seasonally adjusted, as published at 08:30 ET). E^{CONS}: licensed survey median. E^{KAL}: mean of the Kalshi-implied distribution from the last trades before 08:30 ET on the release day (bin probabilities from adjacent ''above strike'' prices and a CDF made monotone outward from the mode, as in Diercks+ 2026; representing each bin by its midpoint x_k and each open tail bin by its finite edge is our convention). E^{NC}: the Cleveland Fed nowcast of the same month''s CPI published at its last update before the release (about 10:00 ET on the previous business day). Kalshi has almost no pre-2022 history, so U^{KAL} stays in percentage points; never estimate a scale or threshold on test-period releases.'
  conventions: "(1) A_e is the first-release value from the BLS release text, never a later vintage: seasonally adjusted CPI is revised through seasonal factors while unadjusted CPI is not (Croushore & Stark 2001); do not recompute percent changes from ALFRED index levels, which are stored rounded. Core CPI is a second indicator handled the same way (our convention). (2) Pre-registered order: CONS if licensed; else KAL; else NC if a point-in-time archive of past nowcasts can be obtained; else the fallback M_e. Report which measure every table uses. (3) Standardisation never uses later releases (Andersen+ 2003 use the full sample, which is look-ahead out of sample): as a stratifier, sigma-hat comes from pre-2022 releases; as a model input, it is re-estimated at each walk_forward refit on the releases in that fit's training window (G6). Kalshi CPI month-over-month contracts start in June 2021 (Diercks+ 2026), so KAL has almost no pre-2022 history: use it unstandardised, in percentage points, both as input and as stratifier. Its size threshold u^KAL for surprise_stratification is an absolute value in percentage points written into the pre-registration before unlocking (our suggested default: 0.1 pp, one reporting unit of the published month-over-month change), never a test-period quantile (our design). (4) KAL follows Diercks+ 2026: last-trade 'Yes' prices as risk-neutral probabilities, differences of adjacent 'above' strikes as bin probabilities, a strike with no trade carries its last earlier price, monotone CDF built outward from the mode; values are risk-neutral, not physical, probabilities. (5) NC: the nowcast page is updated each business day around 10:00 ET, after an 08:30 release, so the last value before the release is the previous business day's; the page offers no historical download, so NC is usable only with an archive obtained from the Cleveland Fed or saved going forward. (6) Fallback M_e is the absolute change of the first-release monthly rate from the previous release's; it trends with the inflation regime and is labelled 'realized move, not a surprise'. (7) Edge cases: the 18 Dec 2025 release (November 2025 CPI) has no October 2025 index and omits one-month changes where October data are missing, so A_e (month over month) is missing there: keep the event unstratified and flag it. No CPI came out in calendar November 2025; the September 2025 CPI came on 24 Oct 2025 and the January 2026 CPI on 13 Feb 2026. (8) Legality: at the close-of-day-0 origin A_e and S_e are legal inputs; at the close-of-day -1 origin only E_e (consensus, Kalshi or nowcast as of that close) is. In the v = 0 arm every CPI surprise, actual and expectation input is the fixed null token (G9). (9) If A and E are both rounded to 0.1 pp, many surprises are exactly zero; give zero its own stratum (our inference)."
  inputs: ["First-release CPI values from the BLS release texts, with release timestamps (pit_event_calendar)", "Licensed consensus medians with survey dates (if obtained)", "Kalshi CPI contract trade histories with timestamps (if used; terms to be checked)", "Archived Cleveland Fed nowcasts with publication dates (if obtainable)", "CPI event table from event_timing_origin"]
  guards_against: "Reporting a CPI surprise series that does not exist; mixing revised CPI with first releases; look-ahead from full-sample standardisation; silently treating the realized move size as news."
  typical_values: "Headline CPI forecast errors on the release day, Bloomberg consensus vs Kalshi-implied mean/median/mode: MAE 0.081 vs 0.069/0.063/0.063 and RMSE 0.100 vs 0.080/0.083/0.087 (percentage points; by Diebold-Mariano tests the median and mode MAE are smaller only at p < 0.10 and the mean RMSE at p < 0.05, the other differences are not significant); core CPI MAE 0.070 vs 0.070/0.080/0.070 and RMSE 0.100 vs 0.090/0.110/0.100, none significant (Diercks+ 2026, Table 3, releases since 2022). The Cleveland Fed nowcasts have been published daily since early 2014; for 1999:Q2-2022:Q4 their RMSE advantage over the SPF for headline CPI is 0.41 pp (0.74 pp for 2020:Q1-2022:Q4), on quarterly and year-over-year, not monthly, measures (Knotek & Zaman 2023). Andersen+ 2003 used the MMS survey, a Friday telephone survey of about 40 money managers. The locked window holds 53 CPI releases (BLS CPI schedule)."
  pitfalls: "(a) A full-sample sigma-hat (as in Andersen+ 2003) uses future releases. (b) Current-vintage seasonally adjusted CPI differs from the first release. (c) Kalshi prices are risk-neutral and thin in the tails (Diercks+ 2026), and their data terms were not checked; do not redistribute raw trades. (d) Without a point-in-time archive, the nowcast error cannot be reconstructed after the fact; the Cleveland page shows a chart but no download. (e) M_e trends with the inflation regime (2022 prints were large), so stratifying on it confounds news with regime; report by year. (f) The October 2025 CPI was never published. (g) Licensed consensus data (Bloomberg, Haver/Action Economics, LSEG) are usually not redistributable; ship code, not data. (h) A daily market-implied proxy such as the CPI-day 2-year yield change mixes in other same-day news (Nakamura & Steinsson's critique of one-day windows) and needs its own disclosure."
  used_by:
    - ref: "Andersen+ 2003"
      title: "Micro Effects of Macro Announcements: Real-Time Price Discovery in Foreign Exchange"
      authors: "Andersen, T. G., Bollerslev, T., Diebold, F. X., & Vega, C."
      year: 2003
      venue: "American Economic Review, 93(1), 38-62"
      url: "https://doi.org/10.1257/000282803321455151"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "original definition: standardized announcement surprise, actual minus the MMS median forecast divided by the full-sample SD of that difference; lists the BLS CPI release at 8:30 a.m."
