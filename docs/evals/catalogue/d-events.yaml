    H1: "medium"
    H2: "high"
    H3: "low"
    H4: "medium"
    primary_endpoint: true
    why: "It fixes the primary endpoint's origin, scored days and input legality, dates every day 0 from which H1's ordinary-day origins are defined (no FOMC/CPI day 0 in t-1..t+5; G4), and splits the endpoint exactly into a day-by-day profile."
  implementation:
    libraries: ["numpy", "pandas"]
    notes: "1) Build the event table from official sources only (pit_event_calendar); assert 36 FOMC, 53 CPI, 88 distinct day-0 dates and 19 near pairs in the locked window. 2) Pin and version the exchange calendar; compute d_e(tau) by trading-day index. 3) For each event and origin, cut every model's input snapshot at the origin close; log the latest input timestamp and assert it is not after the origin. 4) Apply the shared PD repair, factor each forecast once by Cholesky and compute ell for every scored day. 5) Assert that the mean over tau of ell equals the per-asset NLL computed with Sigma* (relative tolerance 1e-10). 6) Report FOMC, CPI and pooled profiles with month-cluster bootstrap intervals. 7) Unit tests: 08:30 and 14:00 releases on a trading day map to that day; a release on a holiday maps to the next trading day; shifting an event by one day changes its scores."
