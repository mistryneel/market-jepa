- id: "mp_surprise_hf"
  name: "High-frequency monetary-policy surprises (FOMC only)"
  category: "event_metric"
  section: "D"
  status: "canonical"
  status_note: "Canonical: Kuttner 2001 (one-day fed funds futures surprise) and Gürkaynak+ 2005 (30-minute window; target and path factors) are the original definitions. Public series covering the locked window were verified: USMPD to 28 Oct 2026 and JK shocks to 16 Sep 2026; the Bauer-Swanson file stops at 13 Dec 2023 and no public Swanson 2021 factor series was found."
  priority: "should"
  plain_english: "Measures how much an FOMC announcement surprised markets from the move in interest-rate futures in a short window around the statement and press conference, so FOMC events can be sorted into hawkish or dovish and large or small surprises, and used as a model input once they are public."
  formula: '\text{Kuttner (one day): }\Delta\tilde r^{u}_{\tau}=\frac{m_s}{m_s-\tau}\big(f^{0}_{s,\tau}-f^{0}_{s,\tau-1}\big),\ \ f=100-\text{price};\qquad \text{GSS (intraday): }mp1_t=\big(ff1_t-ff1_{t-\Delta t}\big)\frac{D_1}{D_1-d_1},\quad mp2_t=\Big[\big(ff2_t-ff2_{t-\Delta t}\big)-\frac{d_2}{D_2}mp1_t\Big]\frac{D_2}{D_2-d_2};\qquad \text{USMPD: }s_e=c_e\cdot PC_1\big(\Delta MP1,\Delta MP2,\Delta ED2,\Delta ED3,\Delta ED4\big)_e;\qquad \text{Bauer-Swanson: }mps_t=PC_1(\Delta ED1,\dots,\Delta ED4)\ \text{(inputs de-meaned; 1 unit = 1 pp in ED4)};\qquad \text{JK update: }\Delta x_e=\mathrm{med}_{[t_e+15,\,t_e+25)}x-\mathrm{med}_{(t_e-15,\,t_e-5]}x,\ \ pc1_e=PC_1(MP1,FF4,ED2,ED3,ED4)_e,\ \ MP^{pm}_e=pc1_e\,\mathbf 1\{pc1_e\,\Delta SP500_e<0\},\ \ CBI^{pm}_e=pc1_e-MP^{pm}_e'
  computable_form: 'Stratifier (default): the published USMPD monetary-event surprise s_e (positive = hawkish), used as is. Model input at the close-of-day-0 origin: z_{e,k} = (Delta x_{e,k} - mu-hat_{k,j}) / sigma-hat_{k,j} for x_k in {MP1, MP2, ED2/SOFR2, ED3, ED4, UST2Y} over the monetary-event window, where mu-hat_{k,j} and sigma-hat_{k,j} (ddof = 1) are re-estimated at every walk_forward refit j on the scheduled FOMC events inside that fit''s training window (data ending at least 5 trading days before the refit date; G6, G7); or PC_1 loadings and scale refitted on the same events at each refit. In the v = 0 arm every surprise input is the fixed null token (G9).'
  conventions: "(1) Default window for 2022-2026: the USMPD monetary event, from 10 min before the statement to 60 min after the press conference starts (100 min), because every meeting since 2019 has had a press conference and press conferences are now the main source of policy news (Acosta+ 2025); the statement-only window (-10/+20 min) is a sensitivity. (2) Sign and units: positive = rates up (hawkish). USMPD's c_e scales each surprise to a 1 pp effect on the daily change in the 1-year Treasury yield, on average over the sample; Nakamura & Steinsson scale theirs to a one-for-one effect on the 1-year yield; JK scale pc1 to the SD of the ED4 surprise (% p.a.). USMPD rate changes are in percentage points and stock returns in percent. (3) Windows by source: GSS tight -10/+20 min, wide -15/+45 min, and daily close-to-close (if no trade at the window start use the latest earlier price; at the end, the next trade); Nakamura & Steinsson and Bauer-Swanson -10/+20 min; JK update, medians as in the formula, windows widened to at least 3 observations and up to 24 h, else missing; Kroencke+ 2021 -15/+75 min, extended to the 16:15 close on press-conference days. (4) Instruments: MP1 and MP2 are scaled fed funds futures surprises (GSS: ff2 is the contract for the month of the second FOMC meeting ahead, typically 3 months out); ED2-ED4 are Eurodollar futures through 2021 and SOFR futures from 2022 in USMPD and JK (from January 2023 in the Bauer-Swanson update); FF4 is the 3-month fed funds future. (5) Day-of-month rules for scaled fed funds surprises: Kuttner and Bernanke & Kuttner use the unscaled change in the one-month (next-month) contract when the event falls in the last 3 days of the month, GSS in the last 7 days; for one-day windows on the first day of a month the previous month's one-month contract at its last day replaces the prior-day current-month price. In the locked window 10 of 36 decisions fall in the last 7 days of a month, 6 in the last 3, and 3 on the 1st (our count from the FOMC calendar). USMPD ships MP1/MP2 already scaled (its month-end rule was not verified here); if recomputing, pick one rule and document it. (6) Legality: the monetary-event window ends about 15:30 ET for a 14:00 statement (our arithmetic), before the equity close, so USMPD window changes are legal inputs at the close-of-day-0 origin and stratifiers only at the close-of-day -1 origin. A JK update value is legal at the close-of-day-0 origin only if the end of the window actually used (widened up to 24 h when quotes are sparse) is at or before that close; a value whose window end is unknown is illegal there (event_input_availability). As inputs, never use full-sample PCA loadings or full-sample scaling (USMPD's c_e is set over the whole sample, and JK's pc1 is a principal component that can change as the series is re-estimated; our reading): standardise raw changes, or refit loadings and scale, at each walk_forward refit on that fit's training events (G6). As stratifiers the published series may be used as is. (7) Scheduled decisions only; flag unscheduled meetings. For pre-2022 walk-forward events: before 1994 decisions became known the day after the vote, 18 Dec 1990 and 15 Oct 1998 came after the futures close, and 17 Sep 2001 is excluded (Kuttner 2001; Bernanke & Kuttner 2005; Bauer & Swanson 2023). (8) JK's MP/CBI split is transcribed from the repository README; use the published MP_pm, CBI_pm, MP_median and CBI_median columns rather than recomputing. (9) Versions read (G15): the Kuttner, Bernanke & Kuttner, Nakamura & Steinsson, Bauer & Swanson and Jarociński & Karadi formulas, windows and numbers in this entry come from working-paper versions (FRBNY Staff Report 99; FEDS 2004-16; NBER WP 19260; NBER WP 29939; the authors' May 2019 version); GSS is from the IJCB article and the JK update from its repository README."
  inputs: ["USMPD.xlsx: Statements, Press Conferences and Monetary Events sheets (date_time in ET, SEP, Unscheduled, PC flags, MP1, MP2, FF1-FF6, ED1-ED8, OIS1Y/OIS2Y, UST3M-UST30Y, TIPS, SP500, SPFUT, FX)", "JK shocks file shocks_fed_jk_t.csv (start, pc1, SP500, MP_pm, CBI_pm, MP_median, CBI_median)", "Bauer-Swanson workbook (pre-2022 walk-forward events only; ends 13 Dec 2023)", "FOMC event table from event_timing_origin"]
  guards_against: "Pooling FOMC events whose news differs in sign and size; daily windows contaminated by other news; look-ahead through full-sample PCA or normalisation when surprises are inputs; silent instrument breaks (Eurodollar to SOFR)."
  typical_values: "Bill, note and bond yields respond strongly to the surprise component of target changes and hardly at all to the anticipated part; the 3-month bill moved about 50 bp per 100 bp surprise vs 24 bp per 100 bp raw change (Kuttner 2001; 42 target changes, June 1989-Feb 2000). An unanticipated 25 bp cut came with about a 1% rise in broad stock indexes (Bernanke & Kuttner 2005, 1989-2002). Two factors suffice for 1990-2004 futures surprises (Cragg-Donald Wald 1.06, df 1, p = .304 for k = 2; Gürkaynak+ 2005); three factors explain about 94% of 30-minute responses across 241 announcements, Jul 1991-Jun 2019 (Swanson 2021). Surprises are predictable ex post from pre-announcement data with R^2 = 0.161 (N = 322, 1988-2019; Bauer & Swanson 2023). A 1-SD risk shift is about a 0.70% initial equity excess return (Kroencke+ 2021, 2006-2019). Coverage: USMPD statements 4 Feb 1994-28 Oct 2026 (280 rows) and press conferences 27 Apr 2011-28 Oct 2026; JK 334 announcements, 8 Feb 1990-16 Sep 2026 (CC BY 4.0); Bauer-Swanson FOMC sheet 4 Feb 1988-13 Dec 2023."
  pitfalls: "(a) Daily windows mix in other news (Gürkaynak+ 2005; Nakamura & Steinsson 2018); a daily stock-based leg would also carry the pre-FOMC equity drift, which Lucca & Moench 2015 do not find in Treasuries or money-market futures. (b) Information effects: hawkish rate surprises can come with rising stocks (Jarociński & Karadi 2020), so the rate surprise's sign mixes policy and information shocks; use the MP/CBI split as a sensitivity. (c) Surprises are partly predictable ex post (Bauer & Swanson 2023); the authors say orthogonalisation is unnecessary for high-frequency asset-price regressions, but report it if surprises enter the model. (d) Month-end scaling noise: a 1 bp premium becomes a 15 bp error with two days left (Kuttner 2001). (e) The Eurodollar-to-SOFR switch (2022 in USMPD and JK) sits inside the locked window; check for a shift in surprise SD. (f) The Bauer-Swanson file cannot cover 2024-2026, and JK lacks the 28 Oct 2026 meeting. (g) Licences: JK data CC BY 4.0; USMPD and the Bauer-Swanson file state no dataset licence (FRBSF Site Policies: reuse with credit, not for private gain). (h) The USMPD README mislabels UST30Y as a 10-year bond. (i) FOMC only: CPI needs cpi_surprise."
