  implementation:
    libraries: ["numpy", "pandas", "statsmodels", "scikit-learn"]
    notes: "1) Export s_t daily from the walk_forward fit serving each day, with the exact training loss, plus the two sensitivity signals. 2) Build RV_t, both jump labels (thresholds frozen on the 2017-2021 validation days), X_t and the event indicator. 3) Fit the logistic and OLS readouts with statsmodels on the 2017-2021 validation days only; score test days and compute AUC and average precision with scikit-learn. 4) For each l in -5..5 compute Delta AUC, Delta AP and incremental IC with the paired month-block bootstrap (B = 10,000); apply Benjamini-Hochberg at q = 0.10 to the 15 lead tests (statsmodels multipletests, method='fdr_bh'). 5) If 1-minute data exist, compute JV_e for FOMC events and its correlation with the day -1 surprise. 6) Plot the lag profile with intervals."
