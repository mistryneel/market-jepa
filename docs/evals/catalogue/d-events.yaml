- id: "earnings_event_handling"
  name: "Earnings events: point-in-time announcement timestamps, own-stock earnings windows, results with and without them"
  category: "protocol"
  section: "D"
  status: "our_design"
  status_note: "Our design (added after review finding completeness#3); status and priority unchanged. The H1 exclusion rule is the adopted default G4. Precedents: betas rise on earnings days and revert within two to five days (Patton & Verardo 2012, abstract); after-hours announcements, whose share had risen to more than 40% in recent years of the authors' sample, move prices on the trading day after the database date (Berkman & Truong 2009, opened for this entry, abstract); MacKinlay 1997's window rule for after-close releases; look-ahead in accounting databases (Banz & Breen 1986, abstract)."
  priority: "must"
  plain_english: "Each stock's own earnings release changes its risk for a few days. We date every release by its actual time (before the open or after the close), mark the days it affects for that stock, and report the event results and H1 with and without those stocks, and with and without earnings inputs."
  formula: 'd_a(0)=\min\{d\in\mathcal D:\ \mathrm{close}(d)>t_a\};\qquad \mathcal D_a=\{\mathrm{date}(a),\ d_a(0)\}\ \ (d_a(0):=\text{next trading day after date}(a)\ \text{if the time is unknown});\qquad X_{i,t,h}=\mathbf 1\big\{\exists a\in\mathcal A_i:\ \mathcal D_a\cap[t,\,t+h]\neq\emptyset\big\};\qquad \mathcal S_{t,h}=\{i\in\mathcal N_t:\ X_{i,t,h}=0\},\quad \pi_{t,h}=1-\frac{|\mathcal S_{t,h}|}{|\mathcal N_t|};\qquad L^{\mathcal S}_{t}(M)=\frac{1}{|\mathcal S_{t,h}|}\Big[\log\det\hat\Sigma_{\mathcal S}+\mathrm{tr}\big(\hat\Sigma_{\mathcal S}^{-1}\Sigma^*_{\mathcal S}\big)\Big],\quad \hat\Sigma_{\mathcal S}=\big[\hat\Sigma_{t}(M)\big]_{\mathcal S_{t,h},\mathcal S_{t,h}},\ \ \Sigma^*_{\mathcal S}=\big[\Sigma^*_{t}\big]_{\mathcal S_{t,h},\mathcal S_{t,h}}'
  computable_form: 'Index the already repaired full forecast and Sigma* with one integer array for S_{t,h}. By Cauchy interlacing lambda_min(Sigma-hat_S) >= lambda_min(Sigma-hat_t), so the shared eigenvalue floor carries over and no second repair is applied (our derivation). L^S is the Gaussian NLL of the forecast''s marginal on S (our derivation); compute it with a Cholesky factor of Sigma-hat_S. Here t is the origin date and [t, t+h] the calendar dates from the origin day to the last scored day: h = 5 at H1 origins and at the close-of-day-0 event origin, h = 6 at the close-of-day -1 origin.'
  conventions: "(1) t_a is the earnings release timestamp in ET from a point-in-time source with a time of day. Day 0 uses the macro rule (first trading day whose close is strictly after t_a): before-open and intraday releases map to the release date; releases stamped at or after the close, and weekend and holiday releases, map to the next trading day, where Berkman & Truong 2009 find the price and volume reaction. (2) A record with a date but no time is flagged 'time unknown': its reaction day is taken to be the next trading day, so both the recorded date and that day count, and the outcome is treated as public only from the close of that next trading day (our conservative rule, after MacKinlay 1997's days 0 and +1 for uncertain dates). (3) Exclusion rule (adopted default G4, identical for every model): at an origin dated t with h scored days, stock i is removed if any of its own announcements has its date or its day 0 in the calendar span from t to the last scored day (the set D_a in the formula). At H1 ordinary-day origins h = 5, which is G4's 'own earnings announcement in [t, t+5]' under either reading of the announcement day: a release after the close of t-1 (day 0 = t) and a release on t+5 (by date) are both removed. (4) H2 is reported three ways, all pre-registered: (i) primary, the full asset set N_e (forward_looking_panel_filter); (ii) sensitivity, the earnings-free set S at the event origin (t = day 0, h = 5 at the primary origin; t = day -1, h = 6 at the secondary origin), with pi and |S| reported for every event; (iii) if the event inputs include earnings, the event-input gain recomputed with a variant whose only event inputs are FOMC/CPI ones (pre-register whether this extra model is trained). In the v = 0 arm every event-derived input, earnings inputs included, is the fixed null token (G9). (5) H1 ordinary days: S_{t,5} is H1's asset set at origin t (G4); score the submatrix NLL and the GMV variance, with weights from Sigma-hat_S, on S_{t,5}. Sensitivity (descriptive): the wider window of the earlier draft, removing i if an announcement's day 0 lies in trading days t-4..t+h+1 (its days -1..+5 touch a scored day), which also catches the two-to-five-day beta reversion after recent announcements (Patton & Verardo 2012). (6) Point in time: an earnings outcome (EPS, revenue, surprise, call text) is a legal input only if its available-at time is at or before the origin (event_input_availability; a release stamped exactly at a session close counts as after that close); a scheduled earnings date is legal only from the time it was first known; values are as reported, not restated (Banz & Breen 1986). The exclusion in (3) uses realized announcement dates: it defines the evaluation set, is applied after every model has forecast the full N_t, and is never a model input (forward_looking_panel_filter (1)). (7) Within an origin every model is scored on the same asset set; losses are per asset (divide by |S|). (8) DiD balance (event_vs_nonevent_did): report mean pi for events and for their controls; if they differ by more than 5 percentage points, the earnings-free DiD becomes a required sensitivity (our threshold)."
  inputs: ["Earnings release records per stock: ET timestamp, time-of-day code (before open, intraday, after close, unknown) and the first-known timestamp of each scheduled date (vendor not yet chosen)", "Pinned exchange calendar with session closes", "Point-in-time universe U_e and daily returns for Sigma*", "Repaired full-universe forecasts from every model (submatrices only, no refit)", "Event windows W_o from event_timing_origin"]
  guards_against: "Crediting macro-event inputs with gains that come from own-stock earnings risk; after-hours earnings dated a day early; look-ahead from earnings information not yet public at the origin; earnings windows contaminating H1's ordinary days."
  typical_values: "Betas increase on earnings announcement days and revert to their average levels two to five days later (Patton & Verardo 2012, abstract; magnitudes not read). After-hours announcements rose to more than 40% of earnings announcements, and their volume and price reaction appears on the trading day after the Compustat or I/B/E/S date (Berkman & Truong 2009, abstract; sample period not stated there). MacKinlay 1997's worked example uses 600 quarterly earnings announcements of 30 DJIA firms (1989-1993), a 41-day window (-20..+20) and a 250-day estimation window. No covariance-loss results with and without earnings windows were found in the sources read."
  pitfalls: "(a) Vendor dates without times put day 0 a day early for after-hours releases (Berkman & Truong 2009), and turn an earnings input dated D into look-ahead at the close-of-D origin when the release came after that close. (b) Drop a stock for the whole scored window, never single stock-days: a Sigma* built from partial rows is not the target of the remaining forecast. (c) Never refit, rescale or re-repair forecasts on the subset; take submatrices of the same forecast. (d) pi varies across events and between events and controls, so earnings exposure can masquerade as an event effect; report it. (e) Vendors revise expected earnings dates; using the final date as if known in advance is look-ahead. (f) Accounting databases can carry look-ahead and ex-post-selection bias (Banz & Breen 1986). (g) If the with-events model receives earnings inputs and its comparator does not, the H2 contrast mixes earnings and macro inputs; change one factor at a time. (h) The source with before-open/after-close times is still open (CANDIDATES open question 6)."
