  relevance:
    H1: "none"
    H2: "high"
    H3: "none"
    H4: "none"
    primary_endpoint: false
    why: "It is the falsification check that H2's gain comes from event content rather than from dates, capacity or leakage."
  implementation:
    libraries: ["numpy", "pandas"]
    notes: "1) Use the walk_forward fits as trained; define kappa, xi and the null token in one schema shared with event_input_availability. 2) Generate 999 within-type permutations with a recorded seed and rerun M+ inference at all event origins (cache encoder outputs that do not depend on event inputs). 3) Build placebo inputs for every (e, c in C_e) pair with timing re-expressed; run M+. 4) Run the zero-out pass. 5) Run the availability perturbation at both origins in a deterministic environment and assert V = 0. 6) Compute G, the permutation distribution and p_perm; D^plac_e, G - G^plac with LB and p_plac (month-cluster bootstrap, B = 10,000); p_EP; and G - G^zero with its interval. 7) Report next to the H2 primary result and pass p_EP to the H2 key-secondary Holm family (multiple_testing)."
  adoption_cost: "medium"
