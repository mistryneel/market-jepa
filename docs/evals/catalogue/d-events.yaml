- id: "surprise_leads_vol"
  name: "Model 'surprise' as a leading indicator of volatility jumps"
  category: "event_metric"
  section: "D"
  status: "emerging"
  status_note: "Emerging: S2 (ICML 2026) tests latent displacement against a standard risk bundle with incremental AUC and a lead/lag check, and S16 (2026 blog, not peer-reviewed) tests latent prediction error against forward realized volatility. The outcomes follow Bollerslev, Li & Xue 2018 and the reviewed list; the exact outcome definitions, controls and lead test below are our design. H4 is exploratory."
  priority: "should"
  plain_english: "Checks whether days on which the model's own prediction misses badly come before, not at the same time as, jumps in market volatility, after allowing for what recent volatility, the VIX and the event calendar already tell us."
  formula: 's_t=\frac{1}{|\mathcal M_t|}\sum_{u\in\mathcal M_t}\ell_{\mathrm{train}}\big(\hat y_{u,t},\ \mathrm{sg}(y_{u,t})\big),\ \ z_t=\frac{s_t-\hat\mu_s}{\hat\sigma_s};\qquad RV_t=\sum_{j=1}^{N_t}r^2_{m,t,j}+r^2_{m,t,\mathrm{on}}\ \ (\text{fallback }r^2_{m,t});\qquad J^{\mathrm{lvl}}_t=\mathbf 1\{RV_t>\hat q_{0.90}\},\quad J^{\mathrm{chg}}_t=\mathbf 1\Big\{\log RV_t-\log\Big(\tfrac{1}{22}\sum_{j=1}^{22}RV_{t-j}\Big)>\hat q^{\mathrm{chg}}_{0.90}\Big\};\qquad X_t=\Big(\log RV_t,\ \log\tfrac15\sum_{j=0}^{4}RV_{t-j},\ \log\tfrac{1}{22}\sum_{j=0}^{21}RV_{t-j},\ \log VIX_t,\ |r_{m,t}|,\ \mathbf 1\{t+\ell\ \text{is a scheduled FOMC/CPI day 0}\}\Big);\qquad \Delta\mathrm{AUC}_\ell=\mathrm{AUC}\big(J_{t+\ell};\,f(X_t,z_t)\big)-\mathrm{AUC}\big(J_{t+\ell};\,f(X_t)\big),\ \ \ell\in\{-5,\dots,5\};\qquad \mathrm{IC}^{\mathrm{inc}}_\ell=\rho_S\big(z_t,\ \log RV_{t+\ell}-\widehat{\log RV}_{t+\ell}(X_t)\big);\qquad JV_e=\big[\log\hat\sigma_{\tau}-\log\hat\sigma_{\tau-}\big]_e-\frac{1}{22}\sum_{c=1}^{22}\big[\log\hat\sigma_{\tau}-\log\hat\sigma_{\tau-}\big]_c,\ \ \hat\sigma_{\tau\pm}=\sqrt{\frac{1}{k_n\Delta_n}\sum_{j=1}^{k_n}r^2_{i(\tau)\pm j}}'
  computable_form: 'Fit f (logistic for J, OLS for log RV) on the validation days 2017-01-01..2021-12-31 (G8), with surprises from the walk_forward fits serving each day; score 2022-01-01..2026-06-30 test days; Delta AUC_l and Delta AP_l (average precision) from the two fixed prediction vectors. Paired month-block bootstrap: resample calendar months of test days with replacement (B = 10,000, recorded seed) and recompute both AUCs, and IC^inc_l, on the same resampled days; one-sided p_l = (1 + #{b: stat*_b <= 0}) / (B + 1). Decision family (G5): the 15 lead tests, lags l = 1..5 times {Delta AUC for J^lvl, Delta AUC for J^chg, IC^inc for log RV}, Benjamini-Hochberg at q = 0.10; lags l <= 0, Delta AP, the sensitivity signals and JV_e are descriptive.'
  conventions: "(1) Surprise s_t: the model's own training prediction loss (same loss, norm and target normalisation as in training; S2's JEPA uses an L1 loss on LayerNormed targets) for the latent targets M_t of day t, predicted from context ending at day t-1, computed with the walk_forward fit that serves day t (trained on data ending at least 5 trading days before its refit date; G6, G7), so every s_t is out of sample; it is known at the close of day t. z_t standardises s_t by its mean and SD over the validation days 2017-01-01..2021-12-31 (G8). Sensitivity signals: the return-space surprise (per-asset NLL of day t's returns under the forecast issued at close(t-1)) and S2's displacement ||z_t - z_{t-1}||_2. (2) RV_t: realized variance of the value-weighted point-in-time universe portfolio, the sum of squared 5-minute log returns over the regular session plus the squared overnight return (our convention); if constituent intraday data are missing, an S&P 500 ETF or futures series is the stated proxy (Bollerslev, Li & Xue use SPY from TAQ); daily-only fallback r_{m,t}^2. Pre-register which is used, and floor RV at 1e-12 before taking logs (our convention). (3) Outcomes: J^lvl (primary daily outcome, as in the reviewed list) with q-hat_0.90 the 90th percentile of RV over the validation days 2017-01-01..2021-12-31, fixed; J^chg (secondary) with its own 90th percentile over the same days; report test-period base rates. (4) Controls X_t use only information at the close of day t; the scheduled-event indicator for t+l is known from the calendar in advance. log VIX_t is the Cboe close. (5) 'Leads' means l >= 1; l = 0 is synchrony (S2 found the best alignment at lag 0). (6) Announcement-level outcome (FOMC only; needs 1-minute data): JV_e with k_n = 30 one-minute returns on each side of the statement time (Bollerslev, Li & Xue eq. 4.1); the control term averages the same clock-time quantity over the past 22 non-announcement days (their difference-in-differences correction; the exact form of the correction is our transcription). Report the Spearman correlation of z at day -1 with JV_e across FOMC events, after residualising JV_e on log VIX and log RV at day -1, with an i.i.d. event bootstrap (one FOMC per month). CPI would need a market that trades at 08:30 ET. (7) H4 is exploratory (G5): Benjamini-Hochberg at q = 0.10 across the 15 lead tests (lags l = 1..5 times the outcomes J^lvl, J^chg and the log RV residual); H4 is reported as supported, exploratorily, for the lag-outcome cells BH rejects. l = 1 with J^lvl is the pre-registered headline cell for reporting, not a separate decisive test; lags l <= 0 are reported for synchrony, with estimates and intervals for every lag and outcome."
  inputs: ["Daily surprise series s_t from the frozen model, plus the two sensitivity signals", "Value-weighted universe returns; intraday returns (or an index proxy) for RV", "Daily VIX closes (download script only; Cboe terms bar redistribution)", "Event calendar for the scheduled-event indicator", "For JV_e: 1-minute index prices around FOMC statements"]
  guards_against: "Claiming that model surprise leads volatility when it is only synchronous with it, or when its signal is already explained by volatility persistence, the VIX and the scheduled event calendar."
  typical_values: "JEPA latent prediction error ('energy') had IC +0.032/+0.058/+0.061/+0.060 with forward realized volatility versus +0.332/+0.612/+0.724/+0.793 for trailing realized volatility at 0.1/1/3/10-second horizons, and a combined model collapsed onto trailing volatility (S16, SPY+QQQ order book, December 2025 test, blog). Adding latent displacement to an SPX/VIX/high-yield risk bundle changed AUC by -0.002 [-0.006, 0.003] for crash and VIX-spike days and by -0.001 [-0.011, 0.009] for all systematic days; top-5% displacement days were regime changes 39% of the time against a 6.4% base rate, best aligned at lag 0 (S2, test 2024-2025). With k_n = 30 one-minute returns, log sigma-hat has a standard error of about 1/sqrt(2 k_n), about 0.13 (Bollerslev, Li & Xue 2018; our arithmetic)."
  pitfalls: "(a) Volatility clustering: a large surprise on a big-move day predicts tomorrow's high volatility through persistence alone, so control for RV_t and |r_{m,t}|. (b) Jumps on scheduled event days are predictable from the calendar; include the event indicator. (c) Lag 0 is mechanical; only l >= 1 supports a lead. (d) Surprise is biased low on the encoder's own training days, so fit f on days the encoder never saw. (e) Re-estimating the 90th percentile on test data leaks. (f) 2022 was a high-volatility year, so J^lvl fires often there; report base rates by year. (g) Squared daily returns are a noisy RV proxy; prefer intraday RV. (h) S16's horizons are seconds, not days, and it is a blog: treat it as a prior, not evidence. (i) Cboe changed the VIX methodology in February and August 2025, inside the test window. (j) Eleven lags times several outcomes need multiplicity control."
