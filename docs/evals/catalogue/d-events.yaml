- id: "covariance_jump_rank_test"
  name: "Rank test for announcement covariance jumps"
  category: "stat_test"
  section: "D"
  status: "emerging"
  status_note: "Emerging: introduced by S15 (Li, Todorov & Zhang, REStat 2024) for four interest-rate futures; untested on equities. S15 was read in its 2021 manuscript version, so the table and algorithm numbers cited here are the manuscript's (G15). For about 500 stocks it applies only to a few factor or sector portfolios with intraday data, and in equities only to FOMC, because CPI comes out at 08:30 ET before the equity open. Priority unchanged (nice)."
  priority: "nice"
  plain_english: "Uses minute-level prices just before and just after an announcement to test how many independent directions of risk the announcement shifted: one common shock or several."
  formula: '\hat c_{n,\tau\pm}=\frac{1}{k_n\Delta_n}\sum_{i\in\mathcal I_{n,\tau\pm}}R_{n,i}R_{n,i}^{\top}\mathbf 1_{\{\|R_{n,i}\|\le u_n\}},\quad \mathcal I_{n,\tau-}=\{i_\tau-k_n,\dots,i_\tau-1\},\ \mathcal I_{n,\tau+}=\{i_\tau+1,\dots,i_\tau+k_n\};\qquad \Delta\hat c_\tau=\hat c_{n,\tau+}-\hat c_{n,\tau-};\qquad \hat S_{n,r}=\sum_{\tau\in\mathcal T}\sum_{j=r+1}^{d}\hat\lambda^2_{n,j,\tau},\ \ \hat\lambda^2_{n,1,\tau}\ge\dots\ge\hat\lambda^2_{n,d,\tau}\ \text{(squared eigenvalues of }\Delta\hat c_\tau);\qquad H_{0,r}:\ \mathrm{Rank}(\Delta c_\tau)=r\ \forall\tau\in\mathcal T\ \ \text{vs}\ \ H_{a,r}:\ \mathrm{Rank}(\Delta c_\tau)>r\ \text{for some }\tau;\qquad \text{reject if }k_n\hat S_{n,r}\ge cv_{n,\alpha},\ \ cv_{n,\alpha}=q_{1-\alpha}\Big(\sum_{\tau}\big\|\hat V_{n,\tau}^{\top}(\zeta^*_{n,\tau+}-\zeta^*_{n,\tau-})\hat V_{n,\tau}\big\|^2\Big),\ \ \zeta^*_{n,\tau\pm}=k_n^{1/2}\big(\hat c^*_{n,\tau\pm}-\hat c_{n,\tau\pm}\big)'
  computable_form: 'Per event: two d\times d local covariance matrices from k_n returns each; eigendecompose the symmetric jump \Delta\hat c_\tau, order eigenvalues by absolute value, \hat V_{n,\tau} = eigenvectors of the d-r smallest. Bootstrap (S15 Algorithm 1): resample returns i.i.d. with replacement separately within each pre and post window, recompute \hat c^*, form \zeta^*, accumulate the statistic over events; cv = its (1-\alpha) quantile. \|\cdot\| is the Frobenius norm, which makes \hat S_{n,r}=\sum_\tau\|\hat V^{\top}\Delta\hat c_\tau\hat V\|^2 (our derivation).'
  conventions: "(1) R_{n,i} are log-return vectors of d portfolios over grid intervals of length Delta_n; i_tau is the interval containing the release, and it is excluded from both windows. (2) S15's empirical settings: Delta_n = 3 minutes (chosen from a volatility signature plot), k_n = 30 (90-minute windows on each side), returns in the 5 minutes before and after the release dropped (a 10-minute gap), then u_n = infinity; the optional adaptive threshold is u_n = 3 sigma-hat Delta_n^{1/3}. Findings were qualitatively unaltered with 8- and 12-minute gaps. (3) The estimate is per unit time; the unit does not affect the test. (4) Bootstrap draws: S15 used 100,000 empirically and 1,000 in its Monte Carlo; we use at least 10,000 with a recorded seed (our choice). (5) Sequential estimation: test r = 0 (no jump), 1, 2, ... and stop at the first non-rejection. (6) Each subsample is tested at level alpha; with K disjoint subsamples the joint level is 1-(1-alpha)^K (S15: six 3-year subsamples at 1%, about 5.85%). (7) Our application (our design): d at most about 10 portfolios of the point-in-time universe (market plus sector or style portfolios), weights fixed at the prior close and synchronised prices. For a 14:00 ET statement the pre-window is 12:25-13:55 ET and the post-window 14:05-15:35 ET (our arithmetic), which spans the press conference. CPI at 08:30 ET falls before the regular equity session, so equities cannot supply its pre/post windows; index futures would be needed. (8) Use it as a diagnostic: compare the rank and leading eigenvectors of realized jumps with the change between the model's pre- and post-event forecasts (eigen_spectrum_errors)."
  inputs: ["Synchronised 3-minute (or finer) prices of d portfolios around each FOMC statement", "Exact release timestamps from USMPD or the FOMC statement pages", "Portfolio weights fixed before each event"]
  guards_against: "Assuming an announcement's effect is one common shock (or a full-rank change) without evidence; it tests directly how many risk directions an announcement moves, which motivates and checks a low-rank event head."
  typical_values: "Interest-rate futures (12-month Eurodollar, 2- and 10-year notes, 30-year bond), Oct 2001-Aug 2018, 135 scheduled FOMC announcements: the no-jump null (r = 0) is overwhelmingly rejected; at 1%, r = 1 and r = 2 are rejected but r = 3 is not for the full sample, giving rank 1 in 2001-2006, 3 in 2007-2009, 1 in 2010-2012 and 2 from 2013 (Table 3). Pooled CPI, initial-claims and payroll releases (1,248 events at 8:30) never reject r = 1, 2 or 3 (Table 4). Finite-sample size at a 5% nominal level ranged from 0.034 to 0.053 across designs (Table 1). A next-day same-time control window gave identical decisions (S15)."
  pitfalls: "(a) No equity evidence: S15 uses d = 4 interest-rate futures. (b) The theory assumes no microstructure noise; S15 relies on sparse 3-minute sampling. (c) Longer windows add power but also bias from time-varying volatility. (d) The test is slightly conservative at 3- and 5-minute sampling. (e) Not rejecting rank r means no evidence of a rank above r, not proof of rank r. (f) Asynchronous trading of portfolio constituents at 3-minute frequency needs synchronised prices. (g) Keep d well below k_n = 30, or the local covariance estimates are singular (our inference). (h) S15 tests CPI only pooled with claims and payroll releases. (i) The second eigenvector is not identified for one-dimensional shocks."
  used_by:
    - ref: "S15"
      title: "Testing the Dimensionality of Policy Shocks"
      authors: "Li, Todorov, Zhang"
      year: 2024
      venue: "Review of Economics and Statistics 106(2):470–482 (2024)"
      url: "https://www.kellogg.northwestern.edu/faculty/todorov/htm/papers/vjr.pdf"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      version_read: "2021 manuscript (author PDF on the Kellogg faculty page) read; REStat 2024 version not read"
      accessed: "2026-11-12"
      how_used: "Introduces the local-window truncated spot-covariance jump, the squared-trailing-eigenvalue rank statistic and the local i.i.d. bootstrap, and applies them to 135 FOMC announcements and 1,248 macro releases in interest-rate futures."
    - ref: "Bollerslev, Li & Xue 2018"
      title: "Volume, Volatility, and Public News Announcements"
      authors: "Bollerslev, T., Li, J., & Xue, Y."
      year: 2018
      venue: "Review of Economic Studies, 85(4), 2005-2041"
      url: "https://doi.org/10.1093/restud/rdy003"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Supplies the announcement-time local-window spot-volatility estimators and the within-window resampling scheme that S15's bootstrap follows."
  relevance:
    H1: "none"
    H2: "low"
    H3: "none"
    H4: "low"
    primary_endpoint: false
    why: "It is a diagnostic of how many risk directions FOMC announcements move, informing the event head but not entering the endpoint."
  implementation:
    libraries: ["numpy"]
    notes: "1) Build d portfolios with weights fixed at the prior close and synchronised 3-minute log returns around each FOMC statement. 2) Drop the 5 minutes on each side of the release; take k_n = 30 returns per side. 3) Compute c-hat for both windows, the jump matrix and its symmetric eigendecomposition, ordered by absolute eigenvalue. 4) Implement Algorithm 1 with a fixed seed (at least 10,000 draws). 5) Test r = 0, 1, 2, ... sequentially, per event and pooled by year. 6) Validate first on S15-style simulated data (3 assets, one or two jumping factors) and check size near the nominal level."
  adoption_cost: "high"
  verified: true
  related: ["eigen_spectrum_errors", "event_timing_origin", "surprise_stratification", "realized_covariance_target"]
- id: "event_placebo"
  name: "Event-input permutation and placebo-date test"
  category: "protocol"
  section: "D"
  status: "our_design"
  status_note: "Our design; priority must as in the reviewed list. Precedents: S15's matched control window (same time of day, next day), Sarkar & Vafa 2024's placebo-year and natural-experiment negative controls, S8's counterfactual input perturbations, and Fonseca 2026's oracle that perturbs every datum available after the decision time. No source applies these to event-conditioned covariance forecasts."
  priority: "must"
  plain_english: "If the model's post-announcement advantage really comes from what happened at the announcement, it should shrink when the model is given another event's information, should not appear when it is told an event happened on a quiet day, and its forecasts must not change at all when information that was not yet public is altered."
  formula: 'g_e=L_e(M^-)-L_e\big(M^+\mid\kappa_e,\xi_e\big),\quad G=\frac{1}{N_E}\sum_{e}g_e;\qquad G^{\mathrm{perm}}_b=\frac{1}{N_E}\sum_{e}\Big[L_e(M^-)-L_e\big(M^+\mid\kappa_e,\xi_{\pi_b(e)}\big)\Big],\ \ \pi_b\ \text{a uniform random permutation within event type};\qquad p_{\mathrm{perm}}=\frac{1+\sum_{b=1}^{999}\mathbf 1\{G^{\mathrm{perm}}_b\ge G\}}{1000};\qquad g^{\mathrm{plac}}_{c,e}=L_c(M^-)-L_c\big(M^+\mid x_{e\to c}\big),\ \ c\in\mathcal C_e;\qquad D^{\mathrm{plac}}_e=g_e-\frac{1}{|\mathcal C_e|}\sum_{c\in\mathcal C_e}g^{\mathrm{plac}}_{c,e},\quad G-G^{\mathrm{plac}}=\frac{1}{N_E}\sum_{e}D^{\mathrm{plac}}_e,\quad p_{\mathrm{plac}}=\frac{1+\sum_{b=1}^{B}\mathbf 1\{\bar D^{\mathrm{plac}*}_b\le0\}}{B+1};\qquad p_{\mathrm{EP}}=\max\big(p_{\mathrm{perm}},\,p_{\mathrm{plac}}\big);\qquad G^{\mathrm{zero}}=\frac{1}{N_E}\sum_{e}\Big[L_e(M^-)-L_e\big(M^+\mid\varnothing\big)\Big];\qquad V=\max_{e,o}\big\|\hat\Sigma_{e,o}(x)-\hat\Sigma_{e,o}(\tilde x)\big\|_F\ \ \text{for }\tilde x\ \text{that changes only inputs with }t_{\mathrm{avail}}>o;\ \text{require }V=0'
  computable_form: 'With the trained weights of the walk_forward fit serving each origin left unchanged: (i) 999 within-type permutations of the raw content inputs xi from a recorded seed (each fit applies its own normalisation), rerunning M+ inference at every event origin; (ii) M+ at every control c in C_e of event_vs_nonevent_did with event e''s inputs transplanted (a control in a two-event month runs once per event); (iii) M+ with the G9 null token for every event-derived input at every event origin; (iv) the availability check, run at both origins with x-tilde drawn by shuffling or adding noise to every input whose available-at time is after the origin. Inference for G - G^plac and G - G^zero: the month-cluster bootstrap of event_level_inference applied to D^plac_e and to g_e - g^zero_e over the 53 event months (B = 10,000, own recorded seed). The event-placebo member of the H2 key-secondary family (G5) is the intersection-union p-value p_EP = max(p_perm, p_plac), entered in Holm at 5%.'
  conventions: "(1) Arms (G1, G9): M+ is arm (pre,1) of matched_supervised_comparator, the pretrained model with event inputs, and M- is arm (pre,0), its v = 0 arm with every event-derived input replaced by the fixed null token in pretraining and fine-tuning (the adopted primary H2 contrast). g_e = L(ref) - L(cand), so G is the primary H2 gain. L is the primary per-asset NLL at the close-of-day-0 origin with the shared PD repair and asset sets; N_E = 88 pooled origins. Only inputs change; the weights stay those of the fit serving each origin (G6). (2) Event-derived inputs are split into an event-calendar part kappa_e (event type, time to and since the event, SEP flag) and a content part xi_e (CPI print or surprise, FOMC surprises, statement- or press-conference-derived features). Generic calendar features (day of week, month) are in every arm and are never altered; per-stock earnings inputs, if any, keep their true values in the permutation and placebo-date passes. Permutation acts on xi only and within type (FOMC among FOMC, CPI among CPI), as one joint draw per replicate; the 2024-06-12 origin has its FOMC and CPI parts permuted separately. It therefore tests event-specific content, not the calendar. (3) Placebo dates: the controls are the C_e of event_vs_nonevent_did (G4 ordinary-day origins in the event's calendar month, frozen before unlocking); x_{e->c} is event e's FOMC/CPI input vector with its timing features re-expressed relative to c (e.g. 'event today' at c). (4) Zero-out: M+ with the G9 null token for every event-derived input at the true event origins; if G^zero is close to G, the gain comes from the weights, not from the event inputs. (5) Availability check (after Fonseca 2026): any change in forecasts when only not-yet-available inputs are altered is a leak; tolerance exactly 0 in the same numerical environment. (6) Pre-registered reading (G5): the event-placebo test of the H2 key-secondary Holm family is the intersection-union test p_EP = max(p_perm, p_plac); it rejects only if both the content effect (p_perm) and the placebo-date contrast G - G^plac > 0 (p_plac, one-sided month-cluster bootstrap) reject at the Holm-adjusted level. V = 0 is a required assertion, not a test. G^plac clearly above 0 is a red flag (calendar artefact or date leakage); G - G^zero is reported with its interval (descriptive). (7) Failures (G13): a non-finite or Cholesky-failing forecast of M+ under any input variant voids the event-placebo claim (p_EP = 1, reported); a failure of M- removes that origin or control from this check, with counts. (8) At the close-of-day -1 origin, content inputs are only pre-release expectations; if there are none, within-type permutation is vacuous and only the placebo-date and availability checks apply there (descriptive). (9) Optional retraining placebo (costly; pre-register whether it is run): retrain M+ with every event's inputs moved to a control date of its month and evaluate at the true events; the gain should vanish."
  inputs: ["Trained arms M+ = (pre,1) and M- = (pre,0) with the weights of the walk_forward fit serving each origin", "Event input vectors split into event-calendar and content parts, and the G9 null token", "Frozen control sets C_e (event_vs_nonevent_did)", "Available-at timestamps of every input (event_input_availability)", "Per-origin losses, failure flags and the calendar month of every origin"]
  guards_against: "H2 gains that come from calendar artefacts, extra capacity, training differences or date leakage rather than from the content of the event inputs, and pipelines whose forecasts react to information that was not yet public."
  typical_values: "Replacing the pre-event control window with the next day's same-time window gave exactly the same rank-test decisions (S15). Pandemic terms appeared in 2.2% of Llama-2-70B risk predictions for the placebo year 2019 vs 8.0% for 2020, and prompting the model not to use future information cut COVID mentions only from 12.2% to 6.8% (Sarkar & Vafa 2024). GPT-4o trading agents left 69-82% of predictions unchanged under counterfactual input perturbations (S8, Prediction Consistency 0.6903-0.8213, Jan 2022-Jun 2023). Among simpler leak detectors, a differential two-run detector missed 18 of 33 planted leaks and a window-tiling detector missed all 33 (Fonseca 2026). No placebo results for covariance forecasts were found in the sources read."
  pitfalls: "(a) Permuted content can be out of distribution (a large surprise placed on a calm event), so G^perm below zero is expected and is not evidence of skill: the test is G against the permutation distribution. (b) Calendar-only inputs make within-type permutation vacuous. (c) Placebo inputs must be re-expressed relative to the placebo origin, or the model sees inconsistent timing. (d) Placebo tests are one-sided: they can miss leakage, and similar performance inside and outside a window does not prove its absence (Sarkar & Vafa 2024). (e) S8's sensitivity metrics reward any change in predictions, even to irrelevant noise; judge by loss, not by sensitivity alone. (f) Events in near pairs share scored days, so permuting them is not fully exchangeable; permute within type and report this. (g) Non-determinism (GPU kernels, data-loader order) can make V > 0 without a leak; run the availability check deterministically. (h) Retraining placebos are expensive; decide before unlocking whether they are run."
  used_by:
    - ref: "S15"
      title: "Testing the Dimensionality of Policy Shocks"
      authors: "Li, Todorov, Zhang"
      year: 2024
      venue: "Review of Economics and Statistics 106(2):470–482 (2024)"
      url: "https://www.kellogg.northwestern.edu/faculty/todorov/htm/papers/vjr.pdf"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      version_read: "2021 manuscript (author PDF on the Kellogg faculty page) read; REStat 2024 version not read"
      accessed: "2026-11-12"
      how_used: "Uses a matched control window (the next day, same time of day) as a robustness check and obtains identical rank-test decisions."
    - ref: "Sarkar & Vafa 2024"
      title: "Lookahead bias in pretrained language models"
      authors: "Sarkar, S. K., & Vafa, K."
      year: 2024
      venue: "SSRN Working Paper No. 4754678 (first version 11 March 2024; working copy dated 28 June 2024)"
      url: "https://doi.org/10.2139/ssrn.4754678"
      peer_reviewed: false
      source_type: "working_paper"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Uses placebo-year comparisons and natural experiments with unpredictable outcomes as one-sided negative controls for lookahead bias."
    - ref: "S8"
      title: "Profit Mirage: Revisiting Information Leakage in LLM-based Financial Agents"
      authors: "Li, Zeng, Xing, Xu, Xu"
      year: 2025
      venue: "arXiv:2510.07920"
