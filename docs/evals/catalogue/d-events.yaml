- id: "surprise_stratification"
  name: "Stratify by event type and surprise sign/size"
  category: "protocol"
  section: "D"
  status: "emerging"
  status_note: "Emerging: S14 (2025, abstract only) conditions risk-forecast failures on the type of FOMC surprise, and S15 (2024) argues against pooling FOMC with data releases and finds their covariance jumps differ. The strata, thresholds and multiplicity rule below are our design. Status and priority unchanged."
  priority: "should"
  plain_english: "Reports the H2 result separately for FOMC and CPI, for hawkish and dovish surprises, and for large and small surprises, because pooling them can average away effects that differ."
  formula: '\bar d_k=\frac{1}{|\mathcal E_k|}\sum_{e\in\mathcal E_k}d_e,\quad \hat\theta_{k,k''}=\bar d_k-\bar d_{k''};\qquad \mathcal E^{F}_{\pm}=\{e\in\mathrm{FOMC}:\ \pm s_e>0\};\qquad \mathcal E^{F}_{\mathrm{large}}=\{e\in\mathrm{FOMC}:\ |s_e|>\tilde q\},\ \ \tilde q=\mathrm{median}\{|s_f|:\ f\ \text{scheduled},\ 1994\text{-}2021\};\qquad Y_e=\mathbf 1\Big\{\tfrac12\big(\Delta UST5Y_e+\Delta UST10Y_e\big)>0\Big\};\qquad \mathcal E^{MP}=\{e:\ MP^{pm}_e\ne0\},\ \ \mathcal E^{CBI}=\{e:\ CBI^{pm}_e\ne0\};\qquad \mathcal E^{C}_{\mathrm{large}}=\{e\in\mathrm{CPI}:\ |S_e|>\tilde q_C\}'
  computable_form: 'Join per-event d_e with the stratifying variables; compute \bar d_k and \hat\theta_{k,k''}; bootstrap by resampling events (FOMC-only and CPI-only strata: one event per month, so i.i.d.; pooled: calendar months), recomputing both stratum means in each draw, B = 10,000. Equivalent regression check: d_e=a+b\,\mathbf 1\{e\in\mathcal E_k\}+u_e with month-clustered standard errors.'
  conventions: "(1) d_e is the gain Delta_e = L_e(ref) - L_e(cand) (G1): the primary per-asset NLL gain at the close-of-day-0 origin for the H2 contrast under study, positive favouring the candidate; origins removed from that contrast under G13 are removed from every stratum. (2) Pre-registered stratifications: (i) type: FOMC (36) vs CPI (53), the 2024-06-12 origin entering both; (ii) FOMC sign of the USMPD monetary-event surprise s_e (positive = hawkish); (iii) FOMC size: |s_e| above vs below the median |s| of 1994-2021 scheduled FOMC monetary events in USMPD; (iv) FOMC yield-raising: Y_e from the monetary-event changes in the 5- and 10-year Treasury yields (our proxy for S14's surprises that raise medium- and long-term yields; S14's own construction was not read); (v) JK split: MP_pm non-zero vs CBI_pm non-zero; (vi) CPI size, using the measure chosen in cpi_surprise's pre-registered order: for a standardised consensus or nowcast surprise S_e (CONS, NC), |S_e| above vs below its pre-2022 median; for the Kalshi-implied surprise U^KAL_e, which has almost no pre-2022 history (contracts start in June 2021), |U^KAL_e| above vs below the absolute threshold u^KAL in percentage points pre-registered in cpi_surprise before unlocking, never a test-period quantile; for the fallback M_e (labelled 'realized move, not a surprise'), M_e above vs below its pre-2022 median; a release with no measurable surprise (the 18 Dec 2025 release, which has no month-over-month headline change) forms a separate 'missing' stratum that is reported but not compared; (vii) near-pair vs isolated events. (3) All thresholds are fixed before unlocking, from pre-2022 data or, for U^KAL, as the pre-registered absolute value; a surprise of exactly zero goes to its own stratum. (4) Stratifiers are realized, ex-post quantities; they may be used at any origin because they never enter the model (event_input_availability). (5) Stratum results are descriptive (G5: no stratification belongs to a confirmatory family): report means, differences, intervals and unadjusted p-values, and make no confirmatory claim about a stratum difference. (6) Report N for every stratum, and every stratum by year (regime_reporting)."
  inputs: ["Per-event differences d_e (event_level_inference)", "USMPD monetary-event surprises and 5- and 10-year Treasury yield changes", "JK MP_pm/CBI_pm columns", "CPI surprise or its labelled proxy (cpi_surprise)", "Event table with near-pair flags"]
  guards_against: "Averaging away effects that differ across event types and surprise directions, and post-hoc subgroup mining (thresholds are fixed in advance and multiplicity is controlled)."
  typical_values: "In interest-rate futures the FOMC covariance-jump rank was 1 before 2007, 3 in 2007-2009, 1 in 2010-2012 and 2 from 2013, while pooled CPI, claims and payroll releases never rejected rank 1 (S15, 2001-2018). Risk shifts account for about 70% of FOMC event-window equity variance (Kroencke+ 2021, 2006-2019). Surprises that raise the funds-rate target more than expected raise short-run stock volatility more than negative ones (Bomfim 2003, abstract). The locked window has 36 FOMC and 53 CPI events, so a binary FOMC split leaves about 18 events per stratum (FOMC calendar; BLS CPI schedule). S14 reports no numbers in its abstract."
  pitfalls: "(a) Small strata: about 18 FOMC events per binary split gives a large minimum detectable effect; strata are descriptive (G5), and power_mde shows how large a stratum effect would need to be. (b) Information effects: the sign of the rate surprise and of the stock reaction can disagree (Jarociński & Karadi 2020). (c) Thresholds from test-period quantiles invite tuning; fix them on pre-2022 data. (d) Many strata invite selective reading; report every pre-registered stratum and make no significance claims (G5). (e) S14 was read at abstract level only and its surprise source is not stated there; Y_e is our proxy. (f) Kroencke+ 2021's risk-shift factor needs VIX and CDX credit-spread changes in the event window, which USMPD does not carry (it has the dollar index), so that stratum is not reproducible from the free data. (g) Hawkish 2022 surprises coincided with high volatility; report by year as well."
  used_by:
    - ref: "S15"
      title: "Testing the Dimensionality of Policy Shocks"
      authors: "Li, Todorov, Zhang"
      year: 2024
      venue: "Review of Economics and Statistics 106(2):470–482 (2024)"
