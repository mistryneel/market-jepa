- id: "event_level_inference"
  name: "Event-level (calendar-time) inference for clustered events"
  category: "stat_test"
  section: "D"
  status: "canonical"
  status_note: "Kept canonical. Brown & Warner 1985 is the original definition of the daily event-study test that uses the time series of the event portfolio's mean abnormal return as a dependence adjustment, with simulations of event-date clustering; MacKinlay 1997 states the clustering problem and its remedies. Kolari & Pynnönen 2010 (opened for this entry, abstract only) shows over-rejection under event-date clustering even at low cross-correlation. The earlier Brown & Warner 1980 article could not be read (no abstract on EconPapers). Month-cluster resampling is the adopted default (block_bootstrap)."
  priority: "must"
  plain_english: "All 500 or so stocks react to the same announcement at the same moment, so they are not 500 independent observations. Each event is reduced to one loss difference per pair of models, and all statistics run across events, with events from the same month kept together."
  formula: '\text{Brown-Warner (daily; eqs. 5-8): }\ t=\frac{\bar A_t}{\hat S(\bar A_t)},\ \ \bar A_t=\frac{1}{N_t}\sum_{i=1}^{N_t}A_{i,t},\ \ \hat S(\bar A_t)=\sqrt{\frac{1}{238}\sum_{s=-244}^{-6}\big(\bar A_s-\bar{\bar A}\big)^2},\ \ \bar{\bar A}=\frac{1}{239}\sum_{s=-244}^{-6}\bar A_s;\qquad \text{ours: }d_e=L_e(B)-L_e(M),\ \ \bar d=\frac{1}{N_E}\sum_{e=1}^{N_E}d_e;\qquad T_g=\sum_{e\in g}d_e,\ n_g=|g|,\ \ \bar d^{*}_b=\frac{\sum_{k=1}^{G}T_{g^*_{b,k}}}{\sum_{k=1}^{G}n_{g^*_{b,k}}},\ g^*_{b,k}\overset{iid}{\sim}\mathrm U\{1,\dots,G\};\qquad p=\frac{1+\sum_{b=1}^{B}\mathbf 1\{\bar d^{*}_b\le 0\}}{B+1};\qquad \widehat{\mathrm{SE}}^2_{\mathrm{CR}}=\frac{G}{G-1}\,\frac{1}{N_E^2}\sum_{g=1}^{G}\Big(\sum_{e\in g}(d_e-\bar d)\Big)^2,\ \ t_{\mathrm{CR}}=\frac{\bar d}{\widehat{\mathrm{SE}}_{\mathrm{CR}}}\ \text{vs}\ t_{G-1}'
  computable_form: 'g(e) = calendar month (ET) of d_e(0), at both origins (G3); the G clusters are the months that contain at least one origin (G = 53 pooled). Draw a B x G integer matrix of cluster indices from a recorded seed (B = 10,000 draws), compute each bootstrap mean d-bar*_b by indexed sums of T_g and n_g, then LB = the 5th percentile of the B bootstrap means, and p as in the formula. One-sided superiority, H_0: E[d_e] <= 0 against H_A: E[d_e] > 0: support the candidate iff LB > 0 (G1); p <= 0.05 agrees up to one replicate, and p is the input to Holm or Benjamini-Hochberg where a family applies (G5). Non-inferiority with margin delta > 0: support iff LB > -delta. Reuse the same index matrix for every model pair and endpoint on the event origins; H1 and DiD analyses draw their own matrices (G3).'
  conventions: "(1) Unit of inference: the event origin, never a stock-by-event panel. Matrix losses (per-asset NLL, GMV variance) are already one number per origin and model; per-stock metrics (per-stock QLIKE, abnormal variance) are first averaged within the origin with pre-specified weights (equal unless stated). (2) Orientation (G1): in the formula B is the reference arm and M the candidate (the arm claimed to be better), so d_e = L_e(B) - L_e(M) is the gain Delta = L(ref) - L(cand) and d_e > 0 favours the candidate; the B in the p-value is the number of bootstrap draws. Hypotheses are written H_0 and H_A, and 'H1' always means project hypothesis H1. Superiority: H_A: E[d_e] > 0, decided by LB > 0, where LB is the 5th percentile of the bootstrap means d-bar*_b; non-inferiority with margin delta > 0: LB > -delta; GMV contrasts use d_e = log V(B) - log V(M). Gains are formed before resampling and never negated inside a test routine. (3) Origins are equally weighted. Pooled analyses use N_E = 88 origins: the 2024-06-12 CPI+FOMC origin has one forecast per model and one loss and counts once; per-type analyses use 36 FOMC and 53 CPI with that origin in both (G2). The same holds at the close-of-day -1 origin. (4) Clusters (G3): calendar months of day 0, also at the close-of-day -1 origin, where FOMC 2023-02-01, 2023-11-01 and 2024-05-01 have day -1 in the previous month. In the locked window 53 of 54 months contain an origin: 35 months hold two distinct origins and 18 hold one; November 2025 has none (our count). Every pair of events whose windows overlap lies in one calendar month: 9 distinct-origin pairs overlap in days 1-5, 18 in days 0-5 and 23 in their -1..+5 blocks, none across a month boundary (our weekday count; the reviewers found no month-crossing pair on an NYSE holiday calendar either). Each month holds at most one FOMC and one CPI event, so per-type month bootstraps reduce to i.i.d. bootstraps over events. (5) Pairing: d_e is formed before resampling, so both models' losses for an origin always travel together; the bootstrap mean is a ratio estimator because a drawn month contributes one or two origins. (6) Draws (G3): B = 10,000 with a recorded seed; one index matrix for every contrast and endpoint on the event origins (common random numbers); H1 ordinary-day origins (clustered by the month of the origin date) and the DiD (event months with their same-month controls) use separate draws. (7) Failures (G13): a forecast that is non-finite or fails Cholesky after the shared repair is a failure; any candidate-arm failure on an origin of the analysis voids that one-sided claim (reported; it enters a multiplicity family with p = 1); a reference-arm failure removes that origin from that contrast only, with counts disclosed. (8) t_CR is an analytic cross-check (our derivation: the standard cluster-robust variance of a mean with G clusters, referred to t with G-1 degrees of freedom); the naive i.i.d. t, d-bar/(s_d/sqrt(N_E)), is reported only as a contrast. (9) Sensitivity analyses, never extra hypotheses: the stationary bootstrap on the time-ordered origin series with the Politis-White expected block length and the Patton-Politis-White (2009) correction (block_bootstrap; G3), and DM-HLN and Giacomini-White on the date-ordered series (diebold_mariano, nested_model_tests). (10) MacKinlay's cross-sectional variance estimator (eq. 21) is built from the dispersion of per-firm CARs, which on a shared event date does not contain the common shock (our reasoning); do not use it for stock-level statistics on FOMC/CPI dates. If stock-level tests are unavoidable, use a test adjusted for cross-correlation (Kolari & Pynnönen 2010). (11) Pre-2022 walk-forward events are analysed separately and never pooled into the locked-window test. (12) Report N_E, G, failures and the per-type counts in every table."
  inputs: ["Per-event losses L_e(M) and L_e(B) computed on the same asset set and the same Sigma*", "Day-0 dates and event types (event_timing_origin)", "Number of bootstrap draws B and the RNG seed (pre-registered)"]
  guards_against: "Pseudo-replication: treating about 500 stocks per event as independent observations when they share the event date, and treating FOMC and CPI events whose windows overlap as independent."
  typical_values: "With event dates clustered, a daily mean-adjusted test that assumed independence rejected a true null 25.2% of the time against 7.2% with the dependence adjustment (Brown & Warner 1985 simulations on CRSP stocks, one-tailed 5% tests). Doubling day-0 variance raised the null rejection rate of the time-series test from 4.4% to 12.0% (Brown & Warner 1985). Under event-date clustering even relatively low cross-correlation causes serious over-rejection, and the portfolio approach is less powerful than the alternatives studied (Kolari & Pynnönen 2010, abstract). Locked window: 89 events (36 FOMC, 53 CPI) on 88 origins in 53 month clusters (FOMC calendar; BLS CPI schedule; our count). S1 computes standard errors across its 32 evaluation months as s_d/sqrt(M), treating months as independent."
  pitfalls: "(a) Stock-by-event t-statistics or bootstraps overstate precision enormously: the effective sample is about 88 origins, not about 44,000 stock-events. (b) Per-stock cross-sectional dispersion misses the common shock of a shared event date. (c) With 53 clusters the bootstrap is coarse; check its size by simulation on pre-2022 events (power_mde) and report the number of clusters. (d) Weighting events by universe size or volatility changes the estimand; keep equal weights. (e) Even after collapsing to events, near pairs are dependent; an i.i.d. event bootstrap is acceptable only within a single event type. (f) Paired NLL differences are scale-free across events, but GMV-variance differences grow with event volatility; pool log ratios for GMV (gmv_realized_variance). (g) Like S1, month clustering assumes little dependence between months; check with the stationary-bootstrap sensitivity in block_bootstrap."
  used_by:
    - ref: "Brown & Warner 1985"
      title: "Using daily stock returns: The case of event studies"
      authors: "Brown, S. J., & Warner, J. B."
      year: 1985
      venue: "Journal of Financial Economics, 14(1), 3-31"
      url: "https://doi.org/10.1016/0304-405X(85)90042-X"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "original definition: the daily event-study test that divides the event-day mean abnormal return of the event portfolio by that mean's time-series SD over days -244..-6 (eqs. 5-8), a crude adjustment for cross-sectional dependence; its simulations show independence-based tests over-reject when event dates cluster."
    - ref: "MacKinlay 1997"
      title: "Event Studies in Economics and Finance"
      authors: "MacKinlay, A. C."
      year: 1997
      venue: "Journal of Economic Literature, 35(1), 13-39. (March 1997; no DOI found.)"
      url: "https://ideas.repec.org/a/aea/jeclit/v35y1997i1p13-39.html"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "States that standard aggregation assumes event windows do not overlap in calendar time, and gives the remedies when firms share an event date: an event-time portfolio, or multivariate regressions with event-date dummies (sec. 5E)."
    - ref: "Kolari & Pynnönen 2010"
      title: "Event Study Testing with Cross-sectional Correlation of Abnormal Returns"
      authors: "Kolari, J. W., & Pynnönen, S."
      year: 2010
      venue: "The Review of Financial Studies, 23(11), 3996-4025 (November 2010)"
      url: "https://doi.org/10.1093/rfs/hhq072"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "abstract_only"
      accessed: "2026-11-12"
      how_used: "Shows that with event-date clustering even low cross-correlation of abnormal returns makes standard tests over-reject, and proposes a cross-correlation-adjusted BMP statistic (abstract only)."
    - ref: "S1"
      title: "Towards Financial World Modeling"
      authors: "Merchant, Guthrie, Mahns, Balestriero, Levy"
      year: 2026
      venue: "NeurIPS 2026 (poster); arXiv:2610.09048"
      url: "https://arxiv.org/abs/2610.09048"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Aggregates model-minus-floor differences to calendar months and computes standard errors across months (SE = s_d/sqrt(M)), treating months as the independent unit."
  relevance:
    H1: "medium"
    H2: "high"
    H3: "low"
    H4: "medium"
    primary_endpoint: true
    why: "The primary test is valid only if events, not stock-events, form the sample and events with overlapping windows stay in one cluster."
  implementation:
    libraries: ["numpy", "pandas", "scipy"]
    notes: "1) Compute d_e per event and model pair; store it with event id, type and day-0 month. 2) Implement the month-cluster bootstrap with a fixed seed and B = 10,000; draw the month indices once and reuse them for every model pair and endpoint. 3) Report d-bar, the one-sided p, a two-sided 90% percentile interval, t_CR with a t(G-1) reference (scipy) and the naive t as a contrast. 4) Simulation check: with 500 perfectly correlated stocks and independent events, the event-level test must hold nominal size while a stock-level test over-rejects; with one event per cluster the cluster bootstrap must match an i.i.d. bootstrap in distribution. 5) Print N_E and G in every table."
  adoption_cost: "low"
  verified: true
  related: ["block_bootstrap", "diebold_mariano", "nested_model_tests", "power_mde", "multiple_testing", "seed_vs_period", "event_timing_origin", "gmv_realized_variance"]
- id: "event_vs_nonevent_did"
  name: "Event vs matched non-event gain (difference-in-differences)"
  category: "event_metric"
  section: "D"
  status: "our_design"
  status_note: "Our design, as in the reviewed candidate list (review finding audit_BCD#10: no cited source introduces this estimand). Precedents for event versus non-event contrasts: S2 (latent displacement, weekday-adjusted), S14 (coverage around FOMC versus overall; abstract only), Savor & Wilson 2014 (announcement versus other days) and Lucca & Moench 2015 (FOMC 2pm-to-2pm windows versus all other such windows); for non-announcement controls: Bollerslev, Li & Xue 2018 (past 22 non-announcement days) and S15 (next-day same-time control window). The control rule and inference below are ours."
  priority: "must"
  plain_english: "A model can look better after announcements simply because it is better every day. We subtract its advantage on nearby quiet days that look like event windows but contain no announcement, so only the extra advantage after events counts as an event effect."
  formula: '\Delta_t=L_t(\mathrm{ref})-L_t(\mathrm{cand})\ \ (\text{per-asset NLL of the forecast issued at }\mathrm{close}(t)\text{ for days }t+1..t+5\text{ on the full asset set }\mathcal N_t);\qquad \mathcal Z=\{d_f(0):\ f\ \text{any scheduled FOMC decision or CPI release}\};\qquad \mathcal O=\big\{t\in\mathcal D:\ t\ge\text{2022-01-01},\ t+5\le\text{2026-06-30},\ \{t-1,\dots,t+5\}\cap\mathcal Z=\emptyset\big\};\qquad \mathcal C_e=\{c\in\mathcal O:\ \mathrm{month}(c)=\mathrm{month}(d_e(0))\};\qquad D_e=\Delta_{d_e(0)}-\frac{1}{|\mathcal C_e|}\sum_{c\in\mathcal C_e}\Delta_c;\qquad \Delta_{\mathrm{DiD}}=\frac{1}{N_E}\sum_{e=1}^{N_E}D_e,\ \ N_E=88;\qquad T_g=\sum_{e\in g}D_e,\ n_g=|g|,\ \ \Delta^*_b=\frac{\sum_{k=1}^{G}T_{g^*_{b,k}}}{\sum_{k=1}^{G}n_{g^*_{b,k}}};\qquad \mathrm{LB}=q_{0.05}\big(\{\Delta^*_b\}_{b=1}^{B}\big),\ \ p=\frac{1+\sum_b\mathbf 1\{\Delta^*_b\le0\}}{B+1};\qquad \widehat{\mathrm{SE}}^2_{\mathrm{CR}}=\frac{G}{G-1}\,\frac{1}{N_E^2}\sum_{g=1}^{G}\Big(\sum_{e\in g}(D_e-\Delta_{\mathrm{DiD}})\Big)^2'
  computable_form: 'Compute Delta_t at every event origin and every control origin; build C_e for each of the 88 origins (both events of a month share one C_e); then D_e and Delta_DiD. Month-cluster bootstrap over the G = 53 event months (G3): draw a B x G matrix of month indices from a recorded seed (B = 10,000), separate from the H2 event-origin and H1 draws; each drawn month brings its events with their same-month controls; Delta*_b by indexed sums of T_g and n_g. Decision (G1): the event-specific gain is supported iff LB > 0; inside the H2 key-secondary family (G5) Holm at 5% uses p. Per-type DiDs (FOMC, CPI) and the per-origin D_e are reported as descriptive checks.'
  conventions: "(1) Sign (G1): Delta_t = L_t(ref) - L_t(cand) and Delta_DiD = Delta_event - Delta_matched-nonevent; positive means an event-specific advantage of the candidate. Contrasts (adopted 2x2 design, arms as in matched_supervised_comparator): the H2 key-secondary DiD has cand = (pre,1), the pretrained model with event inputs, and ref = (pre,0), its v = 0 arm (G9); descriptive DiDs: cand = (pre,1) vs ref = (sup,1), and the interaction Delta^int_t = [L_t(pre,0) - L_t(pre,1)] - [L_t(sup,0) - L_t(sup,1)]. (2) Delta_t uses exactly the primary endpoint's loss, shared PD repair, origin rule (close of day t), scored days t+1..t+5 and full asset set N_t (forward_looking_panel_filter) at event and control origins alike; controls are not scored on H1's earnings-reduced sets here. Forecasts at every origin come from the walk_forward fit serving it (G6). (3) Control pool O (G4): trading days of the locked window with no scheduled FOMC or CPI day 0 in t-1..t+5, counting events just outside the window, and with t+5 on or before 2026-06-30 so every control target lies inside the locked window. Every control is therefore an H1 ordinary-day origin, and never an event's day 0, day -1 or day +1. (4) Matching (G3): C_e = the members of O in the calendar month of d_e(0); both events of a two-event month share the same controls. Weekday is not matched for the five-day loss, because five consecutive trading days cover each weekday once when no holiday intervenes (our reasoning); for a descriptive day-by-day DiD use only the members of C_e with the same weekday as d_e(0). (5) No fallback window is needed: on an NYSE holiday calendar every event month has at least 4 controls (our count); if the pinned calendar ever leaves C_e empty, drop e from the DiD and report it. (6) Forecasts at control origins use the real inputs as of close(c), including event-calendar inputs for upcoming events; no event input is fabricated. (7) Weights: each origin counts 1/N_E; the 2024-06-12 origin counts once (N_E = 88). (8) Inference (G3): month-cluster bootstrap of D_e over the 53 event months (ratio estimator), B = 10,000, with its own index matrix; the analytic SE is a cross-check (our derivation). (9) Failures (G13): a candidate-arm failure at any event or control origin used here voids the one-sided DiD claim (reported; p = 1 in the Holm family); a reference-arm failure removes that origin from this contrast only (an event drops out; a control leaves C_e), with counts disclosed. (10) Earnings balance: report mean pi (earnings_event_handling) for events and for controls; if they differ by more than 5 percentage points, the earnings-free DiD (both sides on their earnings-free sets) is required. (11) Sensitivity (descriptive): strict controls, the members of C_e whose seven days c-1..c+5 avoid every event's -1..+5 block (the earlier draft's rule); events whose month has no strict control drop out of this sensitivity and are counted. (12) Under the adopted defaults the raw post-event paired difference stays the primary endpoint; the DiD of the primary contrast is an H2 key secondary, tested with Holm at 5% within that family (G5). (13) O and every C_e are generated and frozen before the test set is unlocked."
  inputs: ["Per-origin losses L_t(cand) and L_t(ref) for both arms of each contrast at every event day-0 origin and every control origin, on the full asset set (H1 daily forecasts can be reused when re-scored on N_t)", "Every scheduled FOMC and CPI day 0, including events just outside the locked window (pit_event_calendar)", "Pinned exchange calendar and the locked-window bounds", "Earnings exposure pi per origin (earnings_event_handling)", "Failure flags per model and origin (G13)"]
  guards_against: "Attributing a generic improvement (a model that is better on every day) to event conditioning; comparison windows that contain other announcements or the pre-FOMC day; regime mismatch between event and comparison windows."
  typical_values: "Locked window, our count on an NYSE holiday calendar (including the 2025-01-09 closure) from the official FOMC and CPI dates: 547 distinct control origins in the 53 event months, 4-16 per event (median 10); strict-control sensitivity: 219 controls, none in January 2022, July 2023 and April 2026, so 6 events drop out of it. Distinct event origins per year: 20, 20, 19, 19 and 10 in 2022, 2023, 2024, 2025 and 2026H1. Latent displacement on event vs non-event days (weekday-adjusted): FOMC Cohen's d = 0.06 (N = 66, p = .63), CPI d = 0.03 (N = 89, p = .79), crash days d = 0.92, VIX spikes d = 1.47 (S2; period not stated, N consistent with May 2018-Oct 2025). The cross-sectional beta-return slope was about 10.3 bp higher on announcement days than on other days (Savor & Wilson 2014, 1964-2011; June 2013 working draft). No DiD of covariance-loss gains was found in the sources read."
  pitfalls: "(a) Under G4 a control's target window never contains a day 0 but can contain an event's day -1 or days +2..+5 (for example the origin two trading days after an announcement); if the event gain persists past day +1 this pulls Delta_DiD toward zero, and the strict-control sensitivity removes it. (b) Day -1 is not a neutral day before FOMC (Lucca & Moench 2015; Bomfim 2003, abstract only): G4 never uses it as a control origin, but a control's target window can end on it. (c) The two events of a month share their controls, so their D_e are dependent; month-cluster resampling keeps them together, a naive bootstrap of D_e does not. (d) The DiD adds control-day noise, so its minimum detectable effect is larger than the raw contrast's; include it in power_mde. (e) In the nested contrast a non-zero control-day gain means training with event inputs changed the model in general; report it, it is a finding. (f) Events and controls are spread fairly evenly over the years (20, 20, 19, 19 and 10 event origins in 2022-2026H1, and the controls follow the event months), but 2022's high volatility can dominate pooled loss differences; report by year (regime_reporting). (g) Holidays change the control set and the counts differ on weekdays; build it on the pinned exchange calendar. (h) Choosing controls after seeing losses is a forking path; freeze the list first. (i) Same-month matching gives two-event months fewer controls lying closer to the events; the strict-control sensitivity and the per-type DiDs show whether this matters."
  used_by:
    - ref: "S2"
      title: "Joint-Embedding Predictive Learning of Latent Market States in U.S. Equities"
