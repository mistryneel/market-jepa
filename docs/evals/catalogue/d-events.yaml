# Evaluation catalogue for the market world model paper, section D: Event and announcement evaluation (12 of 125 entries).
# The catalogue is one file per section of the brief, a-risk.yaml to g-benchmarks.yaml in docs/evals/catalogue/,
# because the repository rejects committed files of 1 MB or more. Concatenate the files in name order for the
# full list; ids are unique across files.
# Generated 2026-11-12 from verified research records; every used_by source was opened on 2026-11-12.
# Defaults approved 2026-11-25: entries follow docs/evals/README.md ("Adopted defaults"); questions still open are in docs/evals/PROGRESS.md.
# Schema: the brief's schema plus the extensions documented in docs/evals/README.md ("Schema extensions"):
#   section (A-G), priority (must/should/nice/drop), status_note, computable_form, conventions, related,
#   status values our_design/reference/gap, categories baseline/dataset,
#   used_by[].ref/source_type/read_depth/version_read/accessed, benchmark fields used_by_papers/fit_for_us.
# Sources are listed in docs/evals/references.md (same labels as used_by[].ref).
- id: "event_timing_origin"
  name: "Event window, forecast origin and day-by-day loss profile"
  category: "protocol"
  section: "D"
  status: "our_design"
  status_note: "Our design (emerging in the candidate list; changed after review finding dod_status#4): no source read defines a daily covariance-loss event window, so the day-0 rule, the two origins (the adopted defaults) and the exact day-by-day decomposition are ours. Precedents: S15 (REStat 2024; its 2021 manuscript was read) identifies announcement covariance jumps from 90-minute intraday windows around exact release times; S14 (2025, abstract only) locates risk-model failures on the day after FOMC announcements; MacKinlay 1997 recommends event windows that include the announcement day and the day after; Lucca & Moench 2015 (Staff Report version read) and Bomfim 2003 (abstract only) show that day -1 is not a clean pre-FOMC baseline. Priority unchanged (must)."
  priority: "must"
  plain_english: "Before any results are seen, this fixes which trading day counts as an announcement's day 0, when each forecast is issued and which days it is scored on. The loss is then also shown day by day, so an effect on the announcement day or the day after cannot hide inside a five-day average."
  formula: 'd_e(0)=\min\{d\in\mathcal D:\ \mathrm{close}(d)>t_e\},\qquad d_e(\tau)=\mathcal D\big[\iota(d_e(0))+\tau\big];\qquad (o,W_o)\in\big\{(\mathrm{close}\,d_e(0),\{1,\dots,5\}),\ (\mathrm{close}\,d_e(-1),\{0,\dots,5\})\big\},\ h_o=|W_o|;\qquad \Sigma^*_{e,o}=\frac{1}{h_o}\sum_{\tau\in W_o}r_{e,\tau}r_{e,\tau}^{\top};\qquad \ell_{e,o,\tau}(M)=\frac{1}{n_e}\Big[\log\det\hat\Sigma_{e,o}(M)+r_{e,\tau}^{\top}\hat\Sigma_{e,o}(M)^{-1}r_{e,\tau}\Big];\qquad L_{e,o}(M)=\frac{1}{h_o}\sum_{\tau\in W_o}\ell_{e,o,\tau}(M)=\frac{1}{n_e}\Big[\log\det\hat\Sigma_{e,o}(M)+\mathrm{tr}\big(\hat\Sigma_{e,o}(M)^{-1}\Sigma^*_{e,o}\big)\Big];\qquad \bar\delta_{o,\tau}=\frac{1}{N_E}\sum_{e=1}^{N_E}\big[\ell_{e,o,\tau}(B)-\ell_{e,o,\tau}(M)\big]'
  computable_form: 'Factor each repaired forecast once, \hat\Sigma=CC^{\top} (Cholesky); \log\det\hat\Sigma=2\sum_k\log C_{kk}; r^{\top}\hat\Sigma^{-1}r=\|C^{-1}r\|_2^2 by a triangular solve. Compute \ell_{e,o,\tau} for every scored day, then L_{e,o}=\mathrm{mean}_{\tau\in W_o}\ell_{e,o,\tau}. Day -1 diagnostic: \ell_{e,-2,-1}, the \tau=-1 term of the daily forecast issued at \mathrm{close}\,d_e(-2) (its own window \{-1,\dots,3\}).'
  conventions: "(1) Clock: all timestamps are tz-aware America/New_York. CPI is released at 08:30 ET (BLS CPI schedule); every scheduled 2022-2026 FOMC statement was released at 14:00 ET (USMPD and JK timestamps; each statement reads 'For release at 2:00 p.m.' in the calendar pass). close(d) is the regular-session close of trading day d from one pinned exchange calendar, early closes included; D is that calendar's ordered list of trading days and iota(d) a day's index. (2) Day-0 rule: the first trading day whose close is strictly after the release time, so a release time-stamped exactly at a close belongs to the next trading day (the same rule as pit_event_calendar). CPI and FOMC day 0 is therefore the release date; a release on a non-trading day maps to the next trading day (none in the locked window by our weekday check; assert it with the exchange calendar). FOMC day 0 is the statement date, the last day of a two-day meeting (the 2024 decision came on Thursday 7 Nov). Only scheduled rate decisions count; the 22 Aug 2025 notation vote (10:00 ET, longer-run strategy statement) is excluded. (3) Dates come from official archives, never from a rule: September 2025 CPI on 24 Oct 2025; the October 2025 CPI was cancelled, so no CPI came out in calendar November 2025; November 2025 CPI on 18 Dec 2025; January 2026 CPI on 13 Feb 2026. (4) Unit (G2): an event belongs to the locked test set if its day 0 lies in 2022-01-01..2026-06-30: 36 FOMC + 53 CPI = 89 events on 88 distinct origins. The 2024-06-12 CPI (08:30) and FOMC (14:00) share one origin, one forecast per model, one Sigma* and one loss: pooled analyses count it once (88 origins) and per-type analyses use 36 FOMC and 53 CPI with this origin in both. The same holds at the secondary origin. (5) Primary origin (adopted default): inputs time-stamped at or before close(d_e(0)); scored days 1-5 (h = 5); the forecast is the average daily covariance over days 1-5. Secondary origin: inputs at or before close(d_e(-1)); scored days 0-5 (h = 6); the forecast is the average daily covariance over days 0-5. The two endpoints have different targets and are never compared with each other. Every forecast comes from the walk_forward fit that serves its origin: the latest refit dated on or before the origin, trained on data ending at least 5 trading days before that refit date (G6, G7). (6) Input legality (event_input_availability): at the primary origin the CPI print, FOMC statement and press-conference information and day-0 returns are legal (the USMPD monetary-event window ends 60 min after the press conference starts, about 15:30 ET for a 14:00 statement by our arithmetic from its 100-minute length); at the secondary origin only ex-ante inputs are legal (calendar, event type, SEP flag, pre-release expectations), and realized surprises may only stratify results. (7) r_{e,tau}: uncentred daily close-to-close simple returns including overnight and delisting returns (realized_covariance_target); a delisting return enters on its delisting day, later target days are 0, and halted days are 0 and flagged (G11; pit_universe_survivorship). A pre-open CPI reaction sits in day 0's return and a 14:00 FOMC reaction in day 0's last two trading hours (our inference). (8) n_e = |N_e|, the origin's asset set (forward_looking_panel_filter: members of the point-in-time universe of the origin's month, G10), identical for every model; losses are per asset. (9) Every forecast first passes the shared PD repair (G12; stein_loss): symmetrise, eigendecompose and floor eigenvalues at eps*tr(Sigma-hat)/n, with one eps for every model chosen on the 2017-2021 validation period. A forecast that is non-finite or fails Cholesky after the repair is a failure (G13): a candidate-arm failure at any origin voids that arm's one-sided claim for that contrast (reported); a reference-arm failure removes that origin from that contrast only, with counts disclosed. (10) Sign (G1): in the formula B is the reference arm and M the candidate, so delta-bar_{o,tau}, the mean over the 88 pooled origins of ell(B) - ell(M), is the gain Delta = L(ref) - L(cand), positive favouring the candidate. Profile: report delta-bar_{o,tau} for every tau in W_o and the cumulative L, for FOMC, CPI and pooled, with month-cluster bootstrap intervals (event_level_inference; clusters = calendar month of day 0 at both origins, although FOMC 2023-02-01, 2023-11-01 and 2024-05-01 have day -1 in the previous month; G3). The per-day profile is descriptive (G5). It uses the same averaged forecast, so its mean over tau equals the endpoint exactly (our derivation: tr(Sigma-hat^{-1} r r') = r' Sigma-hat^{-1} r). (11) Day -1 is descriptive only, scored from the daily forecast issued at close(d_e(-2)); it is never a baseline. (12) tau counts trading days; holidays shift calendar dates, not tau. (13) Near pairs (G2): 19 CPI-FOMC pairs lie within 7 calendar days. In 10 of them the day 1-5 windows share trading days (all five on 2024-06-12); in the other 9, exactly 7 calendar days apart, the earlier event's day 5 is the later event's day 0. So in all 18 distinct-origin pairs the earlier event's days 1-5 contain the later event's day 0. These events stay in the primary analysis, are flagged, and an isolated-events-only sensitivity is reported."
  inputs: ["Event table: id, type (FOMC/CPI), release timestamp in ET, scheduled flag, SEP and press-conference flags, near-pair id (pit_event_calendar)", "Pinned exchange trading calendar with regular-session close times, including early closes", "Daily close-to-close returns of each event's point-in-time universe, including overnight and delisting returns", "Forecasts from every model issued at the close of day 0 and of day -1 for each event, and the daily forecast issued at the close of day -2, all after the shared PD repair", "Available-at timestamps of every model input (event_input_availability)"]
  guards_against: "Choosing the window or origin after seeing results; an endpoint that silently drops the announcement-day reaction or dilutes a day +1 failure in a five-day average; FOMC events misdated by one day; realized surprises used before they were public; treating day -1 as a clean pre-event baseline."
  typical_values: "Locked window: 36 scheduled FOMC decisions and 53 CPI releases on 88 distinct day-0 dates (FOMC calendar; BLS CPI schedule). 19 CPI-FOMC pairs fall within 7 calendar days: in 10 the day 1-5 windows share 1-5 trading days (all five on 2024-06-12), and in 18 the earlier event's days 1-5 contain the later event's day 0 (our count on weekdays, exchange holidays not applied). FOMC/CPI days -1..+5 cover 555 of the window's 1,172 weekdays, 47% (our count). Release times: CPI 08:30 ET, FOMC statements 14:00 ET. USMPD windows: statement 30 min (-10/+20), press conference 70 min (-10/+60 from its start), monetary event 100 min (Acosta+ 2025). S15 identifies FOMC covariance jumps with 90-minute pre/post windows of 3-minute returns and a 10-minute gap (interest-rate futures, 2001-2018). The S&P 500 rose about 49 bp on average in the 24 hours before scheduled FOMC announcements (Sep 1994-Mar 2011), with no similar effect before other major US macro releases (Lucca & Moench 2015). No day-by-day covariance-loss profiles were reported in the sources read."
  pitfalls: "(a) The primary origin leaves day 0 out of the target. In S15 the covariance jump is identified within about 90 minutes of the release, so with daily data much of it lands on day 0 (our inference): the primary endpoint measures post-announcement risk, and only the secondary origin scores the reaction day; state this in the paper. MacKinlay 1997's rule that an event window include the announcement day and the day after is met by the secondary origin only, by design. (b) VaR violations around FOMC cluster on the day after the announcement (S14, abstract only); a five-day average can dilute a day +1 failure, so always show the profile. (c) Day -1 is not a clean pre-FOMC baseline: the pre-FOMC equity drift (Lucca & Moench 2015) and unusually low volatility before scheduled FOMC announcements (Bomfim 2003, abstract only). Keep every event's days -1..+5 out of abnormal-volatility benchmark windows (abnormal_volatility). H1 ordinary-day origins and the DiD controls follow G4 instead (no FOMC/CPI day 0 in t-1..t+5): their target windows never contain a day 0 but can contain an event's day -1 or days +2..+5, and event_vs_nonevent_did reports a sensitivity with controls clear of every -1..+5 block. (d) Dating FOMC by the first meeting day shifts every FOMC window by a day. (e) For pre-2022 walk-forward events use per-event timestamps from USMPD or JK: statements came at about 2:15 pm in Lucca & Moench's 1994-2011 sample, and before February 1994 decisions became known only the day after the vote (Kuttner 2001). (f) Near pairs make per-event losses dependent (event_level_inference). (g) A feature computed from day-0 data is legal at the primary origin and look-ahead at the secondary one: check timestamps, not dates. (h) Rule-based dates ('second Wednesday') break: the 2025 and 2026 appropriation lapses moved and cancelled CPI releases."
