- id: "pit_universe_survivorship"
  name: "Survivorship-free, point-in-time universe with delisting returns"
  category: "leakage_test"
  section: "F"
  status: "canonical"
  status_note: "Canonical as a principle, from its originals: survivorship bias (Brown+ 1992) and the CRSP delisting bias (Shumway 1997), both read at abstract level only. The top-500 construction and the daily delisting conventions are our synthesis of verified sources (CRSP CIZ documentation, Schwarz+ 2026, Shumway & Warther 1999, French Data Library), not a published procedure. Priority unchanged (must)."
  priority: "must"
  plain_english: "Each month, choose the roughly 500 stocks using only information available before that month, from a database that still contains companies that later disappeared, and count the final return of any stock that is delisted, which is often a large loss. Using today's survivors, or dropping delisting losses, makes risk forecasts and backtests look better than they are."
  formula: '\tau_m=\text{last trading day of month } m-1;\quad \mathcal H_m=\text{the 1,260 trading days ending at }\tau_m;\quad \mathcal E_m=\Big\{i:\ \text{common share (legacy SHRCD}\in\{10,11\}\text{) on NYSE, AMEX or NASDAQ (legacy EXCHCD}\in\{1,2,3\}\text{) at }\tau_m,\ |P_{i,\tau_m}|>5,\ \#\{d\in\mathcal H_m:\ r_{i,d}\ \text{non-missing}\}\ge1229\Big\};\quad \mathrm{ADV}_{i,m-1}=\frac{1}{|\mathcal D_{i,m-1}|}\sum_{d\in\mathcal D_{i,m-1}}|P_{i,d}|\,\mathrm{Vol}_{i,d};\quad \mathcal E''_m=\big\{\arg\max_{i\in\mathcal E_m:\ \mathrm{PERMCO}(i)=c}\mathrm{ADV}_{i,m-1}\big\}_{c}\ (\text{ties: lowest PERMNO});\quad \mathcal U_m=\operatorname{Top}_{500}\{\mathrm{ADV}_{i,m-1}:\ i\in\mathcal E''_m\}\ (\text{ties: ascending PERMNO});\quad r_{i,d}=\mathrm{DlyRet}_{i,d}\ \text{on every CIZ row, including the delisting row (DlyDelFlg = Y)};\quad r_{i,d}:=0\ \text{on target days after the delisting row and on missing days (flagged)};\quad \mathrm{DlyRet}_{i,\mathrm{del}}:=-0.30\ (\text{NYSE/AMEX})\ \text{or}\ -0.55\ (\text{NASDAQ})\ \text{if missing and the delisting code}\in[400,591]'
  computable_form: 'Assertions; any failure stops the run. (A1) Point-in-time rebuild: for every formation month m, rebuild U_m from a database view truncated to rows dated <= tau_m and attributes valid at tau_m; the PERMNO set must equal the production U_m exactly. (A2) Inactive coverage: report N_del, the number of distinct PERMNOs in the union of test-month universes that are delisted by the snapshot date, broken down by delisting-code range; N_del = 0 flags a survivor-only source. (A3) Target completeness: for every origin and every stock in its panel (forward_looking_panel_filter), every target return (5 or 6 days) exists after conventions (6)-(9) and is finite; report imputation and zero-fill counts. (A4) No double counting: no legacy delisting table is joined, each PERMNO has at most one DlyDelFlg = ''Y'' row, and the Lehman rows (PERMNO 80599) reproduce DlyRet -0.566667 on 2008-09-17 and -0.6 on 2008-09-18. (A5) The snapshot manifest (format, extraction date, checksums) is unchanged before every run. (A6) Universe rules: every member of U_m has |price| > 5 on tau_m, at least 1,229 non-missing returns among the 1,260 trading days ending at tau_m, and a PERMCO no other member shares; |U_m| = 500 unless fewer stocks are eligible (logged). Failure looks like an A1 mismatch (look-ahead in membership), N_del = 0, NaNs, or two delisting returns for one stock.'
  conventions: "(1) Formation (our synthesis of the F_leakage verification record; G10): tau_m is the last trading day of month m-1, and U_m serves every origin dated in calendar month m (for the close-of-day -1 origin, the month of day -1; its bootstrap cluster stays the month of day 0, G3). Eligibility, history, price and dollar volume use only rows dated <= tau_m and attributes valid at tau_m. The asset set is fixed at each origin and identical for every model. (2) Eligible set: CRSP's full history of active and inactive securities (CRSP), never a current constituent list; common shares (legacy SHRCD 10 or 11) on NYSE, AMEX or NASDAQ (legacy EXCHCD 1, 2 or 3), matching the French Data Library market definition (share code 10 or 11 at the beginning of the month). In CIZ, translate both filters through the crsp.metasiztociz table: EXCHCD maps to StkSecurityInfoHist.PrimaryExch and ConditionalType (CRSP webinar); read the share-code mapping from the same table. (3) History (G10, as in De Nard+ 2021; backward-looking, admissible under forward_looking_panel_filter): a non-missing DlyRet on at least 1,229 of the 1,260 trading days ending at tau_m (at most 2.5% missing); days before listing count as missing. (4) One share class per issuer (G10): among eligible PERMNOs with the same PERMCO keep the one with the largest month m-1 ADV (ties: lowest PERMNO). (5) Price and dollar volume (G10): unadjusted |DlyPrc| on tau_m above $5 (a missing price on tau_m makes the stock ineligible); ADV is the mean of |unadjusted price| x share volume over the trading days of month m-1 on which the stock has both; keep the top 500 by ADV after (2)-(4) and the price filter, ties by ascending PERMNO (our choice). (6) Returns are CIZ DlyRet, close-to-close total returns, so overnight moves are included. In the CRSP example, CIZ keeps the last trading day's return on its own row and adds a separate, later row flagged DlyDelFlg = 'Y' that carries the delisting return (Lehman, PERMNO 80599, DlyRet -0.566667 on 2008-09-17 and -0.6 on 2008-09-18 with DlyPrcFlg 'DP', equal to legacy DLRET; legacy DLSTDT 2008-09-17, NEXTDT and DLPDT 2008-09-18). Use DlyRet row by row: do not compound, and never join the legacy dsedelist/msedelist tables. (7) Delisting in a target window (G11): the delisting return enters on the delisting day, the date of the flag-Y row, and r = 0 on the remaining target days (proceeds held as cash), so Sigma* keeps all n names. If the flag-Y row is dated after the target window while the last trading day is inside it, the delisting return enters on the first target day after the last trading day and the case is logged (our convention; sensitivity: omit it). (8) Missing delisting return (a flag-Y row without DlyRet, or a stkDelists record without a flag-Y row): CRSP does not impute (Schwarz+ 2026). Impute -0.30 (NYSE/AMEX) or -0.55 (NASDAQ) when the delisting code is in 400-591 (the -30% value and code range as applied by Schwarz+ 2026 after Shumway; -55% from Shumway & Warther 1999); other codes get 0. Log every imputation; sensitivities: no imputation, and -0.30 for every missing delisting return (S5's rule). (9) Missing non-delisting days inside a target window (halts; G11): r = 0 on the missing day, flagged in the data log, and the resumption-day DlyRet is used as reported. No forward-looking completeness filter is applied (forward_looking_panel_filter). (10) One format and one snapshot: legacy SIZ stopped with December 2024 data (CRSP), so all data, pre-2022 included, come from CIZ; never splice SIZ and CIZ (Schwarz+ 2026). Record format, extraction date, tables (DSF_V2 / stkDlySecurityData, stkDelists, stkSecurityInfoHist / StockNames_V2), row counts and SHA-256 checksums. (11) H3 (our rule): build a point-in-time top-N Binance pair universe from prior-period data that keeps pairs delisted later; spot timestamps are in microseconds from 2025-01-01 (Binance Vision). (12) Missing data in estimation (one rule for every model): any day without a return inside a lookback (halts; at most 2.5% of the 1,260-day history) is set to 0 before estimation, identically for every model, and the shared PD repair follows; dropping a member of U_m, shortening one stock's window, pairwise-complete estimation or any model-specific imputation is not allowed (forward_looking_panel_filter (2)). (13) Robustness universe (G10, after De Nard+ 2021): among the stocks that pass (2)-(4) and the price filter of (5), repeatedly take the remaining pair with the highest sample correlation over the 1,260-day history (missing returns set to 0) and, while it exceeds 0.95, drop the member with the smaller market capitalisation at tau_m (processing order our convention); then take the top 500 by ADV. Every model is run on this universe as a labelled robustness analysis."
  inputs: ["CRSP CIZ daily security data (WRDS DSF_V2 = stkDlySecurityData): PERMNO, PERMCO, DlyCalDt, DlyRet, DlyPrc, DlyPrcFlg, DlyDelFlg, daily volume and shares outstanding", "CRSP stkDelists (delisting date, code, return) and stkSecurityInfoHist (PrimaryExch, ConditionalType and share type valid at tau_m)", "crsp.metasiztociz mapping table (legacy SHRCD, EXCHCD and DLSTCD to CIZ fields)", "Exchange trading calendar (formation dates, 1,260-day histories and target days)", "Snapshot manifest: CRSP format version, extraction date, row counts, SHA-256 checksums", "Event list with forecast origins (pit_event_calendar)", "H3 only: Binance Vision klines and symbol listing history"]
  guards_against: "Survivorship bias (scoring only firms that survived to the data pull), look-ahead in membership (selecting on future liquidity, index membership or survival), delisting bias (omitting large negative delisting returns from Sigma* and from realized GMV variance), and silent return changes from mixing CRSP formats."
  typical_values: "S16 (15-minute US bars, 2025-2026): a survivorship-selected 82-name universe gave DSR 0.76-0.95 at horizon h64 over 22 non-overlapping rebalances, and the result did not reappear on the survivorship-free 449-name panel. S1: its prior-month threshold rule yields about 700 eligible US stocks per day. Schwarz+ 2026: the SIZ-to-CIZ switch changed 9.6% of monthly returns by at least 1 bp (mean absolute difference 22 bp). CRSP (WRDS CIZ webinar): over 1926-2024, the mean absolute SIZ-vs-CIZ monthly return difference is 0.03% across 5,154,097 observations. Missing delisting-return imputations: -30% for codes 400-591 (Schwarz+ 2026; S5 applies -30% to every missing delisting return) and -55% for performance-related NASDAQ delistings (Shumway & Warther 1999). S10: a 453-stock panel with 8 mid-sample delistings, but drawn from a fixed current list, so still survivorship-biased."
  pitfalls: "(a) A current constituent list with a point-in-time liquidity filter is still survivorship-biased: S10 says so of its own 453-stock list, and S4's universe is conditioned on presence through 2024. (b) S12 sets eligibility from t-1 data but excludes stocks that delist within the next 5 trading days, a forward-looking filter on exactly our horizon (see forward_looking_panel_filter). (c) Compounding a legacy DLRET into a CIZ DlyRet, or joining dsedelist/msedelist, double counts: in CIZ the delisting return sits on its own, later-dated row. (d) Splicing SIZ (data through December 2024) with CIZ changes returns. (e) Treating a missing delisting return as 0, or dropping the row, omits large negative returns (Shumway 1997; Shumway & Warther 1999), and CRSP does not impute them. (f) Price filters on back-adjusted prices use future split factors (S2 uses point-in-time adjustment factors). (g) S5 does not say whether its price and size filters use lagged values, so do not copy it as a point-in-time rule. (h) Brown+ 1992, Elton+ 1996, Shumway 1997 and Shumway & Warther 1999 were read at abstract level; the -30% value and the 400-591 range come from Schwarz+ 2026. (i) CRSP's release lag for 2026 data was not checked: confirm the frozen snapshot covers June 2026, the last target days of the locked window. (j) One -30% delisting day adds 0.3^2/5 = 0.018 to that stock's diagonal entry of Sigma* (our arithmetic), so delisting handling can move per-event losses. (k) How CIZ dates the return after a multi-day halt was not verified; spot-check halted names before freezing."
