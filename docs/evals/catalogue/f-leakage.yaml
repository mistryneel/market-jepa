- id: "llm_cutoff_leakage"
  name: "Knowledge-cutoff leakage in LLM-derived event inputs"
  category: "leakage_test"
  section: "F"
  status: "widely_used"
  status_note: "Widely used: post-cutoff evaluation and point-in-time language models appear in four 2024-2026 peer-reviewed finance or NLP papers (Glasserman & Lin 2024, Lopez-Lira & Tang 2026, He+ 2026, Drinkall+ 2024) and two seed preprints (S8, S9). It applies only if event inputs pass through a language model or text encoder (CANDIDATES.md open question 8). Priority unchanged (should)."
  priority: "should"
  plain_english: "If any event input passes through a language model, that model may already know from its training text what happened after the forecast date, and so look prescient. Use models trained only on earlier text, or purely numeric inputs, and report results separately for events after the model's training cutoff."
  formula: '\mathcal M\not\subseteq\mathcal I_t\ (\text{leakage});\qquad \operatorname{Cov}\big(\hat\mu(X_t;\mathcal I),\varepsilon_{t+1}\big)\neq0\ (\text{lookahead bias});\qquad \text{clean}_k(e)=\mathbb 1\{\iota(o_e)-\iota(\tilde c_k)\ge5\},\ \ \tilde c_k=\text{last trading day on or before }c_k,\ o_e=\text{origin date};\qquad G_e=L_e^{\rm no\,text}-L_e^{\rm text},\ \ \Delta^{\rm clean}=\operatorname{mean}_{e:\,\text{clean}_k(e)=1}G_e,\ \ \Delta^{\rm in}=\operatorname{mean}_{e:\,\text{clean}_k(e)=0}G_e'
  computable_form: '(L1) Component registry: for each text or LLM component k, record the model id, exact snapshot or checkpoint hash, documented training-data cutoff c_k, the source of that statement, decoding settings (temperature 0 with a pinned snapshot, as in Lopez-Lira & Tang 2026), and any fine-tuning data with its date range; an undocumented cutoff is bounded by the release date (our rule). (L2) Primary-analysis assertion (G7): every text component k used in the primary H2 analysis is clean at every origin where it is used, i.e. its documented data end c_k lies at least 5 trading days before that origin, or a per-origin vintage k(e) satisfies the same bound (the ''real-time'' vintage of He+ 2026); a component we fine-tune also obeys the per-fit cut-off of walk_forward; a violation fails the run. (L3) Split reporting: report the text-input gain G_e and the H2 effect separately for clean and in-window origins, each with its month-cluster bootstrap interval; similar results do not prove the absence of bias (Sarkar & Vafa 2024). (L4) Numeric-only control: rerun H2 with text features removed, keeping numeric surprises, and report the difference. (L5) Generative components only: direct-leakage probe (Sarkar & Vafa 2024): from text dated before each event, sample generations and count those containing strings or facts that did not exist at that date; expect zero. Failure looks like an L2 violation or a text gain that appears only on in-window events.'
  conventions: "(1) Default design: no language model; event inputs are numeric (calendar, surprises, nowcast errors). (2) If text is used: point-in-time models (TiMaGPT, yearly 2011-2022, Drinkall+ 2024; ChronoBERT/ChronoGPT, yearly 1999-2024, He+ 2026), choosing for each event the latest vintage whose cutoff precedes it. (3) The trigger is training data extending past 1 Jan 2022, the start of the test window: such a component is in-window for some test events. (4) Fine-tuning data obey the same cutoff (S8's fine-tuning set overlapped its own test period). (5) Masking entity names or dates is a secondary check only (Glasserman & Lin 2024), because models re-identify masked firms (Sarkar & Vafa 2024). (6) Instructions not to use future knowledge are not a control (Sarkar & Vafa 2024)."
  inputs: ["Component registry: model ids, snapshots, documented cutoffs, fine-tuning data ranges", "Event calendar (pit_event_calendar) for per-event cutoff flags", "Per-event NLL with and without text inputs", "For generative components: pre-event prompts and a pre-registered list of post-date strings or facts"]
  guards_against: "Memorised post-cutoff narratives passing for forecasting skill in text- or LLM-derived event features, which would inflate H2."
  typical_values: "S8 (GPT-4o agents, NASDAQ-100 pool, Q2-Q3 2021 vs Q3-Q4 2024): Sharpe decays of 51.48%-62.23% and total-return decays of 50.18%-71.85% after the cutoff; on 2,000 questions about Jan 2022-Jun 2023 market facts, GPT-4o, Claude-Sonnet-3.7 and Grok-3 reach 85.37%-92.94% average weighted accuracy across the four question categories. S9 (5 US tech stocks, Apr-Sep 2021 vs Jul-Dec 2024): alpha decay -17.23, -15.25 and -21.77 pp for Llama 3.1 8B, Llama 3.1 70B and DeepSeek 3.2, versus +0.31 to +1.30 pp for point-in-time models, but quant baselines with no memory range from -10.78 to +9.94 pp. Sarkar & Vafa 2024 (Llama-2-70B): 6.8% of 2020 risk predictions from Sep-Nov 2019 earnings calls mention COVID-19; 70-80% accuracy on close House races; 70% of masked firms identified; inferred year correlates 0.79 with the true year; telling the model not to use future information cut COVID mentions only from 12.2% to 6.8%. He+ 2026: real-time ChronoGPT vintages give Sharpe ratios statistically indistinguishable from Llama 3.1 (p = 0.315 and 0.547)."
  pitfalls: "(a) Pre/post-cutoff comparisons confound leakage with regime change (S8 and S9 compare 2021 with 2024), and S9's null range from memory-free baselines is wide. (b) Vendor cutoffs can overlap the test window: S9 notes that DeepSeek 3.2's July 2024 cutoff overlaps its post-cutoff window, and Lopez-Lira & Tang 2026 flag Llama-2's September 2022 cutoff. (c) Masking does not de-identify (70% of masked firms re-identified). (d) Selecting the training corpus on later survival also leaks (Sarkar & Vafa 2024). (e) Splitting by cutoff costs power: for a component with a June 2024 cutoff, 50 of the 89 test-window events are in-window (our count from the calendar). (f) Point-in-time models are small (TiMaGPT is GPT-2-small, 117M parameters), so cleanliness may cost encoder quality. (g) Glasserman & Lin 2024 found anonymised headlines did better in-sample (a distraction effect), so masking can move results either way."
  used_by:
    - ref: "Sarkar & Vafa 2024"
      title: "Lookahead bias in pretrained language models"
      authors: "Sarkar, S. K., & Vafa, K."
      year: 2024
      venue: "SSRN Working Paper No. 4754678 (first version 11 March 2024; working copy dated 28 June 2024)"
      url: "https://doi.org/10.2139/ssrn.4754678"
      peer_reviewed: false
      source_type: "working_paper"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Defines leakage and lookahead bias (non-zero covariance between forecast and error) and gives one-sided tests: post-date strings, placebo years and natural experiments."
