      authors: "Shi, Fu, Chen, Zhao, Xu, Zhang, Li"
      year: 2025
      venue: "AAAI-26, Proc. AAAI 40(30):25366–25373; arXiv:2508.02739"
      url: "https://arxiv.org/abs/2508.02739"
