- id: "pretraining_overlap_audit"
  name: "Pretraining-corpus overlap audit (foundation-model baselines and our encoder)"
  category: "leakage_test"
  section: "F"
  status: "emerging"
  status_note: "Emerging: Meyer+ 2025 (preprint) document pretraining/test overlap and recommend a global model-aware cutoff; S5 audits public TSFM corpora and pretrains point-in-time. After review the scope covers PE, H1, H2 and H3, because our own encoder's pretraining could overlap 2022 events. Priority unchanged (must)."
  priority: "must"
  plain_english: "List what data every pretrained model saw and when that data ends. Public time-series foundation models such as Kronos were trained on market data that runs into our test period, so they are scored only on events at least five trading days after their data end, or reported separately; each of our own fits must stop at least five trading days before the first forecast it serves."
  formula: 'T^*=\max_{k\in\mathcal K_{\rm ext}}c_k\ \ (\text{fixed public checkpoints only});\qquad \mathcal E^{\rm clean}_k=\{e:\ \iota(o_e)-\iota(\tilde c_k)\ge5\},\ \ \tilde c_k=\text{last trading day on or before }c_k,\ o_e=\text{origin date (day 0, or day }{-1}\text{ in the secondary design)};\qquad \mathcal E^{\rm clean}=\bigcap_{k\in\mathcal K_{\rm ext}}\mathcal E^{\rm clean}_k=\{e:\ \iota(o_e)-\iota(\tilde T^*)\ge5\};\qquad \iota\big(t^{\rm end}_{{\rm ours},j}\big)\le\iota(s_j)-5\ \text{for every fit }j,\ \ s_j=\text{refit date (walk-forward)},\ t^{\rm end}_{{\rm ours},j}=\text{latest date of any datum read by fit }j'
  computable_form: '(P1) Audit table, one row per pretrained model k (ours and every baseline): name, version or checkpoint hash, documented end c_k of its pretraining and fine-tuning data, markets and asset classes covered (US equities? crypto?), and the source of each statement; an undocumented c_k is bounded by the release date (our rule). (P2) Our encoders, per fit (G6, G7): for every walk_forward fit j (validation-period fits and in-window refits) and every trained arm, compute the latest timestamp actually read by that fit''s loaders (pretraining corpus, labels and normalisation inputs; from the manifest, not the config) and assert it is at least 5 trading days before the refit date s_j, and that fit j scores only origins on or after s_j. In-window refits by the frozen procedure pass P2; any later read fails. Under the G6 fallback (the encoders of all arms frozen at the last pre-2022 fit, only heads refit), the frozen encoders keep that fit''s bound for every later origin and P2 runs on each head refit. If H3 is claimed as transfer, assert that no crypto series appears in any of our pretraining manifests. (P3) For each comparison that includes a public pretrained model k, compute E^clean_k (origins at least 5 trading days after c_k, G7); the comparison is run on E^clean of all external models in it as its primary version, and all-origin results are reported separately. Our walk_forward encoders are clean for every origin by P2. (P4) Contamination positive control (planted_leak_test): append one row dated 4 trading days before s_j to a copy of fit j''s manifest; P2 must fail, and must pass for a row dated 5 trading days before s_j. Failure looks like a model k scored in a primary comparison on an origin less than 5 trading days after c_k, or a manifest date later than its fit''s bound.'
  conventions: "(1) c_k counts temporal overlap even across different assets: Meyer+ 2025 show that a model trained on other stock indices through the COVID crash gains when forecasting the S&P 500 over the same window. (2) Kronos: pretraining data end in June 2024 and include US equities (NASDAQ listed as in-distribution) and crypto (S6), so c_Kronos = 2024-06-30; under G7 it is scored only on origins at least 5 trading days later (the first is the CPI release of 2024-07-11) or reported separately, and its crypto results before July 2024 are in-distribution. (3) Exempting foundation models from time rules, as S1 does, is not allowed. (4) Two kinds of cut-off apply to our model. Design constants (architecture, hyperparameters, the PD-repair epsilon, H1 margins, MDE inputs, the early-stopping rule) use only the 2017-01-01..2021-12-31 validation period, with target windows ending by 2021-12-31 (G8; locked_test_preregistration). Fitted parameters (encoder pretraining, event pathway, covariance heads, normalisation statistics) are re-estimated for every arm at every walk_forward refit s_j on a fixed 2,520-trading-day window whose data end at least 5 trading days before s_j, in-window refits included (G6, G7); this is not overlap, because every origin scored with fit j lies on or after s_j. (5) Reusing a public checkpoint counts as pretraining: S2's JEPA trains on 2018-2022. (6) Where a model's corpus composition is published (S5's Table D.2 covers 12 TSFMs), record whether finance series were included."
  inputs: ["Model cards, papers or repositories stating each baseline's pretraining data and end date", "Our pretraining data-loader manifest (series ids and date ranges)", "Event calendar with d_0 and d_1 (pit_event_calendar)", "Per-event losses for every model"]
  guards_against: "Scoring a model on events it has already seen during pretraining, directly or through correlated series, which inflates foundation-model baselines or our own encoder and can flip H1, H2 or H3 conclusions."
  typical_values: "S6: Kronos pretraining uses more than 12 billion K-line records from about 45 exchanges up to June 2024, including about 2.5 B NASDAQ and 2.1 B NYSE records from 2000 and Binance crypto, and its own tests start in July 2024. Our count from the official calendar: in a comparison that includes Kronos, 16 of 36 FOMC and 23 of 53 CPI test-window events (39 of 89) fall after 2024-06-30. Meyer+ 2025: across 22 TSFMs and 401 datasets, only 6% of datasets were never used in any model's pretraining or fine-tuning; a model pretrained on seven stock indices through December 2020 (S&P 500 held out) won 8 of 10 seeds, with gains of up to about 37% in the COVID window. GIFT-Eval: TimesFM, Chronos and Moirai pretraining data partially overlap its test data, and its leaderboard has carried a 'TestData Leakage' flag since 2025-08-05. S5: 396 Chronos and 264 TimesFM models pretrained from scratch with yearly point-in-time cutoffs. Chen+ 2026 (abstract): post-origin vintages raised US mean squared forecast error in 18 of 20 model-horizon cells."
  pitfalls: "(a) Exposure to future data is an information-set violation even when it does not raise accuracy (Chen+ 2026 find it often lowers it), so audit regardless of the direction of the effect. (b) S1 exempts its frozen TSFMs (Chronos-2, Kronos, TimesFM 3.0) from its preceding-data rule; Kronos's own 'strict temporal separation' does not check the baselines' corpora and does not hold out assets. (c) Documentation is often vague, and a release-date bound can be too early if the model was later updated. (d) Restricting to clean events costs power: with Kronos in a comparison, 50 of 89 test events drop out. (e) Corpora such as Market-1T's span 2008-2025 (S1), so pretraining on them overlaps the whole test window unless truncated. (f) Kronos's crypto volatility results are in-distribution for crypto events before July 2024, so they are not evidence of equity-to-crypto transfer (H3). (g) Tuning the head or the PD-repair epsilon on test-window data is the same leak by another route."
  used_by:
    - ref: "Meyer+ 2025"
      title: "Rethinking Evaluation in the Era of Time Series Foundation Models: (Un)known Information Leakage Challenges"
      authors: "Meyer, Kaltenpoth, Zalipski & Müller"
      year: 2025
      venue: "arXiv:2510.13654 (v3, Feb 2026)"
