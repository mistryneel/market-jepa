- id: "planted_leak_test"
  name: "Planted-leak positive control with a future-perturbation negative control"
  category: "leakage_test"
  section: "F"
  status: "emerging"
  status_note: "Emerging. S10 (preprint) uses a planted look-ahead oracle to show that deflation does not catch leakage. We found no peer-reviewed finance source that prescribes the test (a search result, not a proof). The closest peer-reviewed precedent is a deliberately contaminated LLM used as a positive control (Oren+ 2024); a 2026 preprint plants leaks in backtesting pipelines and supplies the future-perturbation oracle (Fonseca 2026). The pass/fail criteria are our design. Priority unchanged (should)."
  priority: "should"
  plain_english: "Deliberately give a copy of the pipeline a known cheat, such as tomorrow's returns hidden among the event inputs, and check that the automatic audits flag it and that the cheating model's loss collapses. Also check the reverse: scrambling everything that happens after the forecast time must leave honest forecasts unchanged."
  formula: 'x^{\rm leak}_{i,e}\in\Big\{\,r_{i,t_0+1},\ \tfrac15\sum_{d=1}^{5}r_{i,t_0+d}^{2}\Big\};\qquad \Delta_{\rm leak}=\bar L(M)-\bar L(M_{\rm leak}),\quad \Delta_{\rm plug}=\bar L(M)-\bar L(\hat\Sigma^{\rm plug});\quad \hat\Sigma^{\rm plug}_e=\tfrac15 r_{t_0+1}r_{t_0+1}^{\top}+\tfrac45\hat\Sigma_e\ \text{(next-day leak)}\ \text{or}\ D_e^{1/2}\hat R_e D_e^{1/2},\ D_e=\mathrm{diag}(\Sigma^*_e)\ \text{(variance leak)};\quad \text{potent iff }\Delta_{\rm leak}\ge\kappa\,\Delta_{\rm plug};\qquad \max_e\frac{\|\hat\Sigma_e(\mathcal D)-\hat\Sigma_e(\tilde{\mathcal D}_{>\tau_e})\|_F}{\|\hat\Sigma_e(\mathcal D)\|_F}\le\epsilon_{\rm tol}\ \text{(negative control)}'
  computable_form: 'Run on the 2017-01-01..2021-12-31 validation period only (G8), with the walk_forward fits that serve it; the locked test window is never touched. (P1) Build M_leak = production model plus one planted per-stock event feature, in two variants: the next-day return r_{i,t0+1} (the S10 analogue) and the realized variance over days 1-5. (P2) True time stamps: the planted rows carry their real available_at (close of day 1 or day 5); event_input_availability must raise on 100% of forecasts that use them. (P3) Forged time stamps (available_at set to tau_e): the future-perturbation check (replace every datum available after tau_e, recompute) must report changed forecasts for M_leak. (P4) Potency: train M_leak with the audit bypassed; it must reach Delta_leak >= kappa * Delta_plug on validation events (kappa = 0.5, pre-registered), otherwise the control is invalid and must be strengthened. (P5) Negative control: for every honest model and baseline, the same perturbation leaves all forecasts unchanged within epsilon_tol = 1e-10 relative (fixed weights); any change reveals a leak in honest code. (P6) Pretraining variant: append one row dated 4 trading days before s_j to a copy of fit j''s pretraining manifest; pretraining_overlap_audit P2 must fail (and pass for a row dated 5 trading days before s_j). (P7) Record, without acting on it, the primary statistical test of M_leak against the best honest model: it is expected to ''certify'' the leak, as S10''s oracle passed DSR. Pass = P2, P3, P5 and P6 caught as specified and P4 potent.'
  conventions: "(1) The perturbation in P3 and P5 replaces every value with available_at > tau_e (prices, returns, event features, macro vintages) by a seeded random permutation across dates, separately for each event; perturb everything after tau_e, not a sample (weaker differential variants missed many planted leaks in Fonseca 2026). (2) Inference-level invariance uses fixed trained weights and deterministic kernels; a training-level variant retrains a reduced model with post-T_train data perturbed and compares fitted statistics and weights within a stated tolerance. (3) The plug-in references are our derivation: for the next-day leak, the oracle knows day 1 and uses the honest forecast for days 2-5; for the variance leak, it rescales the honest correlation forecast to the true realized variances; apply the common PD repair if any D_e entry is 0. (4) M_leak results are excluded from model selection and from the trial-ledger count (S10 excluded its oracle from its ledger) and are reported in an appendix. (5) The leak code path sits behind a flag that the production manifest must show as off. (6) kappa, epsilon_tol and the planted variants are pre-registered. L-bar is the mean per-asset NLL over validation events."
  inputs: ["Validation (pre-2022) events and data", "Production model and all baselines with fixed seeds", "Realized returns for days 1-5 (to build the planted features and Sigma*)", "Audit code from event_input_availability, lookahead_revisions and pretraining_overlap_audit", "The honest model's forecasts (for the plug-in references)"]
  guards_against: "Audits that look rigorous but cannot detect a real leak, silent look-ahead in honest code paths (the negative control), and over-trust in statistical tests, which certify leaked models."
  typical_values: "S10: a tomorrow's-return oracle reached design Sharpe 34.7, evaluation Sharpe 51.5 and DSR 1.00 (453-stock point-in-time top-200; design 2017-2021, evaluation 2022-2025). Oren+ 2024: benchmark copies injected 1, 10, 50 or 100 times (about 19.2M of 20.2B pretraining tokens) into a 1.4B model gave p-values near zero at 10 or more duplications, while single copies could not be reliably detected. Fonseca 2026: across 53 backtesting pipelines (33 planted leaks, 20 clean), a sound static checker missed 0 of 33 leaks but falsely rejected 15 of 20 clean pipelines, a differential two-run detector missed 18 of 33, and a window-tiling detector missed all 33. Meyer+ 2025: a deliberately constructed temporal-overlap leak won 8 of 10 seeds with gains of up to about 37%."
  pitfalls: "(a) A weak planted leak that the model ignores proves nothing, hence the potency criterion P4. (b) Running the control on test-window data unlocks the test set. (c) Statistical tests and deflation pass leaked models (S10), and Kaufman+ 2012 offer only heuristics such as implausibly good performance, so detection must be structural. (d) False alarms are costly too: Fonseca 2026's static checker rejected 15 of 20 clean pipelines, so measure the false-alarm rate on honest models (P5). (e) GPU nondeterminism makes exact invariance fail spuriously; use deterministic kernels or a stated tolerance. (f) A leak in pretraining or in fitted statistics is invisible to an inference-only perturbation; P6 and the training-level variant cover it."
  used_by:
