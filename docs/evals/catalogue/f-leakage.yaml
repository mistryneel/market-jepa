- id: "event_input_availability"
  name: "Event-input availability: each event feature carries an available-at time checked against the forecast origin"
  category: "leakage_test"
  section: "F"
  status: "our_design"
  status_note: "Our design, added after the adversarial review. Precedents: Kaufman+ 2012's time-stamp legitimacy tags, S10's publication-delay audit, and the USMPD event windows. Priority unchanged (must)."
  priority: "must"
  plain_english: "Every piece of event information given to the model (the CPI figure, the Fed's rate surprise, an earnings result) is tagged with the moment it became public, and the data loader refuses any input that became public after the moment the forecast is made."
  formula: '\text{legal}(x,e)=\mathbb 1\{t^{\rm avail}(x)\le\tau_e\};\quad \tau_e=\text{close of day }0\ (\text{primary})\ \text{or close of day }{-1}\ (\text{secondary});\quad t^{\rm avail}:\ \text{CPI actual}=t^{\rm rel}_e\ (08{:}30\ \text{ET}),\ \text{statement surprise}=t^{\rm stmt}_e+20\,\text{min},\ \text{monetary-event surprise}=t^{\rm PC}_e+60\,\text{min},\ \text{JK update}=\text{end of the post-announcement window actually used }(t^{\rm stmt}_e+25\,\text{min unless widened; a widened window can extend up to }24\,\text{h, and a value whose window end is unknown is illegal at }\tau_e),\ \text{earnings}=t^{\rm ann};\ \ t^{\rm avail}(x):=\mathrm{close}+1\,\mathrm{s}\ \text{for a release (earnings or macro) time-stamped exactly at a session close, while market data stamped at the close stay legal at that close};\qquad V=\sum_e\sum_{x\in X_e}\big(1-\text{legal}(x,e)\big)\overset{!}{=}0'
  computable_form: '(V1) Schema: each event-feature row is (event_id, stock_id or ALL, feature, value, available_at_utc, source, vintage_id, rule_id), where rule_id names the availability rule applied. (V2) Loader assertion: for each forecast compute V over its inputs; V > 0 raises an error, and the row is rejected, never silently dropped or repaired (as in S10''s audit). (V3) Origin-specific feature sets: under the close-of-day -1 origin, CPI actuals, FOMC surprises, day-0 earnings and any day-0 market data must be absent; assert the model''s input tensor is unchanged when every row with available_at > tau_e is replaced by random values (the future-perturbation check of Fonseca 2026). (V4) Per-event log: tau_e, the latest available_at among inputs, and the slack tau_e minus that time. (V5) Overlap rule: for CPI-FOMC pairs with overlapping windows, the later event''s realized values never enter the earlier event''s forecast; only its scheduled date may. Failure looks like V > 0, a changed tensor in V3, or a later event''s realized value inside an earlier event''s inputs.'
  conventions: "(1) Origins: primary tau_e = close of day 0 (16:00 ET on a regular session); secondary tau_e = close of day -1. Early-close sessions need an exchange calendar (not verified in our evidence). (2) available_at is the information time, but only for values reproducible at that time with parameters fixed beforehand: USMPD raw window changes (e.g. the MP1, ED/SOFR and UST2Y columns) are available at the end of their window. USMPD surprises are first principal components scaled over the whole sample (Acosta+ 2025) and the JK update's pc1 is a principal component too (JK shocks); before using either as an input, refit loadings and scale at each walk_forward refit on that fit's training events (G6; our inference). (3) Windows (Acosta+ 2025; USMPD): statement -10 to +20 min; press conference -10 to +60 min from its start; monetary event from statement -10 min to press conference +60 min, about 100 minutes, ending near 15:30 ET for a 14:00 statement. The JK update uses medians over [t+15, t+25) minus (t-15, t-5] minutes, but widens a window to at least 3 observations and up to 24 h when quotes are sparse (otherwise the value is missing), so its availability time is the end of the window actually used. Record that end per value; where it cannot be established, treat the JK value as illegal at the close-of-day-0 origin and use USMPD raw window changes instead (our rule). Take the press-conference start from USMPD's Press Conferences sheet. (4) CPI: the actual is available at 08:30 ET on the release date (BLS CPI schedule). No free consensus series exists; if the Cleveland Fed nowcast is used as a proxy, use the vintage published before the release (it updates around 10:00 ET each business day), i.e. the day -1 vintage, which is legal at both origins. (5) Earnings: actual announcement timestamp; a before-open release has day 0 = that session, a release stamped at or after the close has day 0 = the next session, so such a release on an FOMC/CPI day 0 is not legal for that event's 16:00 ET origin. A release (earnings or macro) time-stamped exactly at a session close gets available_at = close + 1 s, while market data stamped at the close stay legal at that close (our rule, matching the strict day-0 rule of event_timing_origin). (6) Calendar features (event type, scheduled date and time) are legal at both origins if taken from the schedule known at tau_e (pit_event_calendar). (7) With the close-of-day-0 origin the day-0 move is not scored (targets are days 1-5); report day 0 separately (event_timing_origin). (8) v = 0 arms (G9): every event-derived input (event type, time to and since the event, surprise and consensus features, event text) is the fixed null token in pretraining and fine-tuning; generic calendar features (day of week, month) stay in every arm."
  inputs: ["Event calendar with release timestamps (pit_event_calendar)", "USMPD.xlsx sheets (Statements, Press Conferences, Monetary Events) with date_time in ET", "Jarocinski-Karadi update CSV, if used", "BLS CPI first-release values", "Cleveland Fed nowcast vintages with publication times, if used", "Earnings announcement timestamps with before-open / after-close flags", "Origin timestamps for the primary and secondary designs"]
  guards_against: "Feeding the model information published after the forecast was made: most often realized surprises with an ex-ante (day -1) origin, after-close releases on day 0, and later events' outcomes inside overlapping windows."
  typical_values: "Availability times in the evidence: CPI at 08:30 ET for all 53 test-window releases (BLS CPI schedule); FOMC statements at 14:00 ET for all 36 scheduled test-window decisions (FOMC calendar statement pages); USMPD statement window -10/+20 min, press-conference window -10/+60 min, monetary-event window about 100 min; JK update window ends at t+25 min; Cleveland Fed nowcast updated around 10:00 ET each business day; every FOMC meeting since 2019 has had a press conference (USMPD). For scale, S10's planted look-ahead feature reached an evaluation Sharpe of 51.5 with DSR 1.00."
  pitfalls: "(a) With the close-of-day -1 origin, realized surprises (USMPD/JK, the 2-year yield change, CPI actual minus consensus) can only stratify results, never be inputs. (b) Dataset publication dates are later than information times (USMPD is updated after each meeting): using the publication date is needlessly conservative, while using values rescaled later is a leak. (c) Daylight saving: 14:00 ET is 18:00 or 19:00 UTC depending on the date. (d) On 2024-06-12 CPI (08:30) and FOMC (14:00) came the same day: both are legal at the close-of-day-0 origin, but daily data cannot separate them. (e) 19 CPI-FOMC pairs fall within 7 calendar days: a CPI released on day +1 to +5 of an FOMC event is not available at that FOMC origin. (f) The November 2025 CPI release omits 1-month changes where October 2025 data are missing (BLS 2025 lapse), so a month-on-month surprise is undefined there; pre-register a fallback such as flagging it missing. (g) Targets are close-to-close returns starting from the day-0 close, so inputs stamped at or before tau_e satisfy Kaufman+ 2012's rule, while anything computed from day-1 prices, including the day-1 open, does not."
