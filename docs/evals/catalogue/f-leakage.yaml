- id: "pit_event_calendar"
  name: "Point-in-time event calendar: actual FOMC and CPI release dates and times, with moves and cancellations"
  category: "dataset"
  section: "F"
  status: "reference"
  status_note: "A data source, not a method (candidate list: data). Built from official Fed and BLS pages opened on 2026-11-12; the counts below were recomputed from that extract. Priority unchanged (must)."
  priority: "must"
  plain_english: "A table of every scheduled Fed rate decision and every CPI release, with the exact date and clock time each one actually happened, taken from official archives. It records the CPI releases that were moved or cancelled during the 2025 and 2026 government funding lapses, so event windows land on the right days."
  formula: 'd_0(e)=\min\{d\in\mathcal T:\ \mathrm{close}_d>t^{\rm rel}_e\}\ \ (\text{strict: a release time-stamped exactly at a session close belongs to the next session});\qquad d_k(e)=\mathcal T\big[\iota(d_0(e))+k\big],\ k\in\{-2,-1,1,\dots,5\}\ (\text{trading-day offsets on one pinned NYSE calendar with early closes and special closures, e.g. 2025-01-09});\qquad \text{pair}(e,e'')\iff|\mathrm{date}(e)-\mathrm{date}(e'')|\le7\ \text{calendar days}'
  computable_form: 'Assertions on the frozen calendar file; any failure blocks unlocking the test set. (C1) 36 scheduled FOMC decisions and 53 CPI releases have release dates in 2022-01-01..2026-06-30; first/last FOMC 2022-01-26 / 2026-06-17, first/last CPI 2022-01-12 / 2026-06-10. (C2) Every FOMC statement time is 14:00 ET and every CPI time 08:30 ET; each row stores its ET offset (EST/EDT) and the UTC time. (C3) The notation vote of 2025-08-22 (10:00 ET, no rate decision) is present with scheduled = false and excluded from the event set. (C4) Lapse-affected CPI rows: reference month 2025-09 released 2025-10-24 (moved from 2025-10-15); reference month 2025-10 absent (cancelled; was due 2025-11-13); reference month 2025-11 released 2025-12-18 (moved from 2025-12-10); reference month 2025-12 released 2026-01-13 (unchanged); reference month 2026-01 released 2026-02-13 (moved from 2026-02-11 by the 2026 lapse); no CPI release falls in calendar November 2025. (C5) The November 2024 decision is on Thursday 2024-11-07. (C6) 19 CPI-FOMC pairs lie within 7 calendar days, including the same-day pair 2024-06-12; each pair has a pair_id. (C7) After the window, up to 2026-11-12: 3 FOMC (2026-07-29, 09-16, 10-28) and 5 CPI (2026-07-14, 08-12, 09-11, 10-14, 11-10). (C8) Every row has a source URL, and the weekday computed from its date matches the weekday printed on the source page.'
  conventions: "(1) Event set: scheduled FOMC rate decisions (statement day = decision day) and CPI releases; unscheduled actions and notation votes are flagged and excluded from the primary set. (2) Dates come from archived official pages, never from the current schedule or a fixed rule: BLS per-year schedule pages /schedule/YYYY/home.htm (2000-2025; a PDF covers 1957-2000), the 2026 page, the lapse notice and the CPI news-release archive (file names cpi_MMDDYYYY); Fed statement press releases ('For release at 2:00 p.m.') and fomccalendars.htm (2021-2027). (3) Times are in ET with an explicit EST/EDT flag and also stored in UTC. (4) Day 0 is the first trading session whose close is strictly after the release time (formula; the rule of event_timing_origin), so CPI at 08:30 and FOMC at 14:00 both have day 0 = the release date, and a release time-stamped exactly at a close belongs to the next session; target days are the next 5 trading days from the pinned exchange calendar. (5) Pairs within 7 calendar days are flagged (G2): of the 19 in the locked window, 10 share trading days in their day 1-5 windows (all five on 2024-06-12) and in the other 9, exactly 7 calendar days apart, the earlier event's day 5 is the later event's day 0. Windows sharing trading days are handled by event-level inference and month-cluster resampling; the 2024-06-12 CPI and FOMC share one origin (88 distinct origins). (6) Pre-2022 events (secondary analysis): FOMC dates and times from USMPD's Statements sheet (from 4 Feb 1994, with SEP and Unscheduled flags), CPI from BLS archived schedules. (7) Calendar features used as model inputs must reflect the schedule known at the origin (event_input_availability); store each moved release's original and revised dates."
  inputs: ["Fed statement press releases (federalreserve.gov/newsevents/pressreleases/monetaryYYYYMMDDa.htm)", "FOMC calendars page (fomccalendars.htm)", "BLS per-year schedule pages, the 2025 lapse notice, the September 2025 reschedule notice and the CPI news-release archive", "USMPD.xlsx (pre-2022 FOMC times with Unscheduled and SEP flags)", "Exchange trading calendar (not verified in our evidence)"]
  guards_against: "Misplaced event windows from rule-based or current-schedule dates (moved or cancelled CPI releases in 2025-2026, a Thursday FOMC decision, a non-rate notation vote), and look-ahead from using a schedule that was not known at the origin."
  typical_values: "Locked test window (1 Jan 2022-30 Jun 2026; FOMC calendar, BLS CPI schedule, BLS 2025 lapse): 36 scheduled FOMC decisions, 53 CPI releases, 1 FOMC notation vote (2025-08-22), and 19 CPI-FOMC pairs within 7 calendar days, one on the same day (2024-06-12). Calendar-year CPI counts: 11 releases in 2025 and 11 in 2026 through 10 Nov. BLS collected no CPI data from 1 Oct to 12 Nov 2025 (BLS 2025 lapse). From 1 Jul to 12 Nov 2026: 3 FOMC decisions and 5 CPI releases. USMPD Statements sheet: 280 rows, 4 Feb 1994 to 28 Oct 2026. Next events after the access date: FOMC 8-9 Dec 2026 and CPI 10 Dec 2026."
  pitfalls: "(a) The current BLS schedule page lists only October 2026 to November 2027 releases, so historical dates must come from archived pages. (b) The Fed's 2022 and 2023 historical pages returned 404 on the access date; fomccalendars.htm carried 2021-2027, and it gives no release times, so take them from each statement. (c) Rules such as 'second Wednesday' fail: the September 2025 CPI moved to Friday 24 Oct 2025, the January 2026 CPI to Friday 13 Feb 2026, and the October 2025 CPI was never published. (d) Before its move the November 2025 CPI would have fallen on the 2025-12-10 FOMC day; after it the gap is 8 days and the pair is excluded, so near-pair lists depend on the post-move calendar. (e) Borderline 8-day cases (e.g. CPI 2022-09-13 / FOMC 2022-09-21) fall outside the 7-day rule; pre-register the threshold. (f) Daily data cannot separate the 2024-06-12 CPI (08:30) and FOMC (14:00) effects. (g) The extract was read through a summarising fetch tool; the calendar agent cross-checked weekdays, but rebuild the file independently from the official pages before freezing it."
