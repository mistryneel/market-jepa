- id: "leakage_checklist"
  name: "Leakage taxonomy and model-info sheet, filled in and machine-checked"
  category: "protocol"
  section: "F"
  status: "canonical"
  status_note: "Canonical: Kaufman+ 2012 give the formal definition of leakage and the time-stamp and time-cut avoidance recipe (KDD 2011 version read); Kapoor & Narayanan 2023 give the 8-type taxonomy and the model info sheet. The finance-specific rows and the link of every row to an automated check are our design. Priority unchanged (should)."
  priority: "should"
  plain_english: "A filled-in form, published with the paper, that lists each known kind of data leakage, says how our pipeline prevents it, and points to the automated check that proves it, so reviewers can audit the controls instead of trusting them."
  formula: 'x\ \text{legitimate for}\ y\iff t_{\rm obs}(x)\le t(y)-\delta\ (\delta>0);\qquad \text{learn on }\{s:\ t_{\rm obs}(s)\le\tau\},\ \text{evaluate only targets with } t(y)>\tau'
  computable_form: 'A versioned sheet generated in CI from the check results. Rows (Kapoor & Narayanan 2023 types mapped to our checks): L1.1 no test set: locked window 2022-01-01..2026-06-30 (locked_test_preregistration). L1.2 preprocessing on train and test together: per-fit fitted-objects audit (lookahead_revisions R4). L1.3 feature selection on train and test together: all selection on the 2017-2021 validation period (G8), with a trial ledger (trial_ledger). L1.4 duplicates across train and test: data dated less than 5 trading days before a fit''s refit date in its corpus, or a public checkpoint scored on origins less than 5 trading days after its data end (pretraining_overlap_audit; G6, G7). L2 illegitimate features: event_input_availability, lookahead_revisions R1-R3, llm_cutoff_leakage. L3.1 temporal leakage: walk_forward, lookahead_revisions. L3.2 train/test dependence: purge of overlapping 5-day labels and an embargo of at least 5 trading days (purged_cv_embargo). L3.3 sampling bias in the test set: pit_universe_survivorship, forward_looking_panel_filter, pit_event_calendar. Validation row: planted_leak_test. Arnott+ 2019 rows: every trial logged, transformations fixed in advance, no iteration on the hold-out, realistic treatment of data revisions. Each row holds claim, mechanism, check id, artifact (log path and hash) and status (pass, fail, or n/a with a reason). Gate: the test set is unlocked only when every row is pass or a justified n/a.'
  conventions: "(1) The sheet is generated from the same commit that produces the results and carries its hash. (2) n/a needs a one-line reason (e.g. 'no text encoder used' for llm_cutoff_leakage). (3) Legitimacy is judged at the forecast origin tau_e; delta > 0 holds because targets start after the day-0 close. (4) Kapoor & Narayanan's L3.2 remedy (block cross-validation) is extended with purge and embargo, which their taxonomy does not cover. (5) The sheet is frozen with the pre-registration and updated only with dated, logged amendments."
  inputs: ["Check results and logs from every section-F check and the section-E protocols", "Commit hash and data manifests", "Pre-registration document"]
  guards_against: "Undocumented or partial leakage controls and reviewers' inability to verify them; the sheet itself does not detect leakage."
  typical_values: "Kapoor & Narayanan 2023: leakage affected 294 papers across 17 fields (published count; 329 in the preprint), sorted into 8 types; in their civil-war case study, complex ML's advantage over logistic regression disappeared once the errors were fixed. Kaufman+ 2012 cite the INFORMS 2010 financial-forecasting challenge, whose results contradicted market-efficiency evidence, as a leakage case (no figure copied)."
  pitfalls: "(a) A checklist without executable checks is box-ticking: every row must point to a check that can fail. (b) The taxonomy is generic; it does not address overlapping multi-day labels or the purge/embargo gap around the split. (c) Kaufman+ 2012 offer only detection heuristics and no positive control, so pair the sheet with planted_leak_test. (d) Filling the sheet after seeing test results defeats it; freeze it with the pre-registration."
  used_by:
    - ref: "Kapoor & Narayanan 2023"
      title: "Leakage and the reproducibility crisis in machine-learning-based science"
      authors: "Kapoor, S., & Narayanan, A."
