- id: "forward_looking_panel_filter"
  name: "No forward-looking completeness filter on the 5-day target panel"
  category: "leakage_test"
  section: "F"
  status: "our_design"
  status_note: "Our design. Precedents: De Nard+ 2021 and Ledoit & Wolf 2017 apply a complete-future-returns filter and say it is not feasible in real time; S12 excludes stocks that delist within its 5-day target horizon. No source prescribes the rule below. Priority unchanged (must)."
  priority: "must"
  plain_english: "When we score a forecast for the five days after an event, we must not drop stocks because they stopped trading or were delisted during those five days, since that uses the future to choose the sample. They stay in with their delisting return; any filter that cannot be avoided is applied identically to every model, and the number of stocks it removes is reported."
  formula: '\mathcal N_e=\{i\in\mathcal U_{m(e)}:\ i\ \text{has a regular trading row (DlyDelFlg = N) with a valid price on day } t_0\}\ \ (\text{admissible: a function of }\mathcal I_{t_0});\qquad \mathcal N^{\rm fwd}_e=\{i\in\mathcal N_e:\ r_{i,t_0+d}\ \text{observed for } d=1,\dots,5\}\ \ (\text{inadmissible as primary});\qquad A_e=1-|\mathcal N^{\rm fwd}_e|/|\mathcal N_e|;\qquad \Sigma^*_e=\tfrac15\sum_{d=1}^{5}r_{t_0+d}\,r_{t_0+d}^{\top}\ \text{on }\mathcal N_e,\ \ r_{i,t_0+d}:=0\ \text{after delisting and on halted days}'
  computable_form: '(F1) Admissibility: the panel function takes (event, data view) and must return the same set on the full database and on a view truncated at the origin tau_e; any difference means it reads post-origin data. (F2) Identity across models: for every event, every model''s forecast is indexed by exactly N_e in the same order (assert equal PERMNO vectors); the scoring code refuses mismatched sets. (F3) Sigma*_e and realized GMV variance are computed on N_e with the zero-after-delisting and halt rules of pit_universe_survivorship; assert no NaN. (F4) Attrition report: per event, |N_e|, the number of delistings and halted days inside days 1-5, and A_e; pooled totals. (F5) Sensitivity: recompute the primary paired NLL difference and its month-cluster bootstrap CI on N^fwd_e and report the change. Failure looks like an F1 or F2 mismatch, or a primary result computed on N^fwd.'
  conventions: "(1) Only filters measurable at the origin are allowed: membership of U_m (formed at tau_m with the price, 1,260-day history and one-share-class rules of pit_universe_survivorship, G10) and a regular trading row with a valid price on the origin day t0. Any condition on returns, prices, trading or survival after t0 is forbidden (G11). One pre-registered exception: the per-stock earnings exclusion of G4 at H1 origins (and the earnings-free sensitivities of earnings_event_handling) removes stocks whose own earnings announcement falls in [t0, t0+h]; it selects on announcement dates, never on returns or survival, is applied after every model has forecast the full N_e, is identical for every model, and is scored with principal submatrices of the same repaired forecasts. (2) The same N_e and order apply to every model in a comparison. Because every member of U_m has a return on at least 1,229 of the 1,260 trading days ending at tau_m, every estimator lookback is defined; residual missing look-back days are set to 0 for every model alike before estimation, followed by the common PD repair; no model may drop a member of N_e or impute it any other way. (3) A stock delisting inside the window stays in: its delisting return enters on its CIZ delisting row and later target days are 0 (pit_universe_survivorship). (4) Halted or missing days: r = 0 on the missing day, flagged; the resumption-day return carries the move. (5) Per-asset loss normalisation uses n_e = |N_e| (|S| after the H1 earnings exclusion). (6) GMV weights are formed at the origin on N_e (on the earnings-reduced set at H1 origins), and realized variance w' Sigma*_e w includes delisted names. (7) A forward-complete panel (e.g. for an intraday realized-covariance variant) is only a labelled secondary analysis applied identically to all models, with A_e reported. (8) Origins: e indexes every scored origin (event or H1), t0 is its origin day and h its number of target days. The formula is written for the primary origin (t0 = day 0, targets t0+1..t0+5, h = 5); at the secondary origin t0 = day -1, the targets are t0+1..t0+6 with divisor 6 and U_m comes from the month of day -1; at an H1 origin t0 is the origin's own day (h = 5), after which the per-stock earnings exclusion of G4 is applied."
  inputs: ["U_m and daily CIZ returns including delisting rows (pit_universe_survivorship)", "Forecast origins tau_e and day indices t0..t0+5 (pit_event_calendar)", "Each model's forecast for event e, indexed by PERMNO"]
  guards_against: "Look-ahead selection on survival and data availability over the forecast window, which removes the stocks most likely to move violently and understates realized risk; and scoring different models on different sets of stocks."
  typical_values: "No source reports the attrition these filters cause. Filters found in the evidence: De Nard+ 2021 require a complete 21-day return future and an almost complete 1,260-day history (at most 2.5% missing, set to zero), and call the forward restriction 'not a feasible one in real life but is commonly applied'; Ledoit & Wolf 2017 draw N in {30, 50, 100, 250, 500} from the 500 largest stocks with complete past-250 and next-21-day returns, a look-ahead filter they acknowledge; S12 excludes stocks that delist within the next 5 trading days; S3 keeps delisted stocks but requires complete, finite target windows."
  pitfalls: "(a) S12 justifies its exclusion by the rule that issuers give at least 10 days' notice before filing Form 25; that covers announced voluntary delistings, but negative-reason delistings are generally surprises (Shumway 1997), so the rule still looks ahead. (b) De Nard+ 2021 and Ledoit & Wolf 2017 use the filter for 21-day portfolio selection; copied to event windows it removes exactly the stressed names. (c) Requiring complete windows for an intraday realized-covariance proxy brings the filter back. (d) Dropping names per model (e.g. where a baseline's look-back is incomplete) breaks the pairing of losses. (e) Selecting data on survival to a later date induces look-ahead even when every datum predates the forecast (Sarkar & Vafa 2024)."
