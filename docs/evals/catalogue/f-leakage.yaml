- id: "lookahead_revisions"
  name: "Look-ahead in features, timestamps and data revisions"
  category: "leakage_test"
  section: "F"
  status: "canonical"
  status_note: "Canonical: Croushore & Stark 2001 introduced real-time vintage data and warn that comparisons on current-vintage data can mislead; Kaufman+ 2012 give the formal no-time-machine definition of leakage (KDD 2011 version read). Banz & Breen 1986 (abstract only) document look-ahead in accounting databases. The audit steps are our operationalisation. Priority unchanged (must)."
  priority: "must"
  plain_english: "Every number fed to a model must be the value that was actually known at the forecast time: the first published figure rather than a later revision, stamped with the moment it became known, and scaled with statistics computed from training data only."
  formula: 'x\ \text{legitimate for}\ y\iff t_{\rm obs}(x)\le t(y)-\delta,\ \delta>0;\qquad x^{\rm rt}(t;\tau)=X\big(t,v^*(\tau)\big),\ \ v^*(\tau)=\max\{v:\ v\le\tau\};\qquad \mathrm{rev}_{a,b}(t)=\log\frac{X(t,a)}{X(t,b)};\qquad z_{i,t}=\frac{x_{i,t}-\hat\mu_{\rm train}}{\hat\sigma_{\rm train}},\ \ \hat\theta_{\rm train}=f\big(\{x_s:\ s\le T_{\rm train}\}\big)'
  computable_form: '(R1) Timestamp audit: every raw table carries available_at (UTC); for each forecast with origin tau_e, assert that the latest available_at among its inputs is <= tau_e (the loader check shared with event_input_availability). (R2) Truncation invariance: recompute every feature for origin tau_e from a database view truncated at tau_e and assert equality with the production feature tensor (exact for deterministic code, otherwise relative tolerance 1e-12). (R3) Vintage audit: each macro value used at tau_e equals the ALFRED/FRED value with realtime_start <= date(tau_e) <= realtime_end, and its release time (pit_event_calendar) is <= tau_e. (R4) Fitted-objects audit (G6, G7): every fitted object (normalisation means and SDs, PCA loadings, surprise scalings, shrinkage targets, encoder, pathway and head weights) records the fit j that produced it, its refit date s_j and the last date of any datum it read, labels included; assert that date is at least 5 trading days before s_j and that the object is used only at origins served by fit j (s_j <= origin < s_{j+1}). Design constants (the PD-repair epsilon, hyperparameters, H1 margins, stratification thresholds, MDE inputs) record their source data; assert they come only from the 2017-01-01..2021-12-31 validation period, with target windows ending by 2021-12-31 (G8). Then multiply every value dated after each bound by 10, refit, and assert the stored objects are unchanged. (R5) Corporate actions and fundamentals: price filters use unadjusted prices as of tau_e; fundamentals and earnings fields are as reported and dated by announcement time. Failure looks like any R1-R5 mismatch.'
  conventions: "(1) Store all timestamps in UTC, converting from ET with the date's daylight-saving offset; stamp bars at the end of their interval and carry quotes forward (S1). (2) CPI: unadjusted CPI-U and CPI-W are final when issued, while seasonally adjusted indexes can be revised for up to 5 years and seasonal factors are re-estimated annually (BLS CPI FAQ); use unadjusted values or seasonally adjusted values as first published, never the current vintage (Croushore & Stark 2001 make the same point). (3) ALFRED stores values as published levels, rounded, so percent changes recomputed from them can differ from the release; take published percent changes from the release when the feature is a change. ALFRED vintages are dated by day, so combine them with the release clock time; to get values as known on date D set realtime_start = realtime_end = D (inference from the closed real-time interval). (4) Normalisation statistics are re-estimated at every walk_forward refit from that fit's training window only (G6), so T_train in the formula is the data end of the fit serving the origin, at least 5 trading days before its refit date; S1 and S2 likewise use training data only. (5) Fundamentals enter as reported with a conservative lag; the French Data Library uses December t-1 market equity and fiscal-year t-1 book equity only from July of year t. (6) Every datum read by a fit, labels included, ends at least 5 trading days before its refit date, so training labels never overlap the targets of the origins it serves (G6, G7; purged_cv_embargo). (7) Text timestamps map to the first session strictly after publication (S16); S2 shifts GDELT times by -16 h so that 16:00 ET on t-1 to 15:59 ET on t maps to market date t."
  inputs: ["available_at (UTC) for every row of every raw table", "ALFRED/FRED vintages stored as (series, observation_date, value, realtime_start, realtime_end)", "BLS CPI first-release values with release times from pit_event_calendar", "Training-window end T_train, embargo length, first test origin", "Fit windows of every fitted statistic and hyperparameter", "Unadjusted prices and point-in-time adjustment factors; as-reported fundamentals with announcement timestamps"]
  guards_against: "Revised data that were not known at the time, mis-stamped features (end-of-day values used earlier, ET/UTC slips), full-sample normalisation or scaling, and fundamentals used before release, any of which can make a model look prescient."
  typical_values: "S10: a planted look-ahead feature (tomorrow's return) reached design Sharpe 34.7, evaluation Sharpe 51.5 and DSR 1.00 (453-stock point-in-time top-200; design 2017-2021, evaluation 2022-2025), so statistical deflation does not detect look-ahead. BLS CPI FAQ: seasonally adjusted CPI can be revised for up to 5 years after release; unadjusted CPI-U and CPI-W are final when issued. Croushore & Stark 2001: revisions are largest at benchmark revisions, and for simple models real-time and current-vintage RMSEs were similar while the forecasts themselves differed systematically (no single figure copied)."
  pitfalls: "(a) USMPD surprises are scaled first principal components, with the scale set to a 1 pp average effect on the daily 1-year Treasury yield change over the sample (Acosta+ 2025), and the JK update's pc1 is a principal component of five futures changes (JK shocks); estimated on the whole sample, loadings and scale use post-origin data. Use raw window changes, or refit loadings and scale on training events only (our inference). (b) Eurodollar futures give way to SOFR futures in 2022 in both USMPD and the JK update, a break at the start of the test window for features built from them. (c) The October 2025 CPI index was never published, and the November 2025 release (18 Dec 2025) omits 1-month changes where October data are missing (BLS 2025 lapse). (d) Seasonally adjusted CPI downloaded today differs from what was published. (e) S4 states no Compustat reporting lag; Banz & Breen 1986 show (abstract) that COMPUSTAT-based results suffer look-ahead and ex-post-selection bias. (f) Daylight-saving or time-zone slips move CPI (08:30 ET) or FOMC (14:00 ET) across an origin. (g) Statistics do not catch these errors (S10), so the checks must be structural. (h) ALFRED notes that some early vintages are no longer available from the original source and were checked against third parties."
