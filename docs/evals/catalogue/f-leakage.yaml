      year: 2024
      venue: "arXiv:2410.10393 (v1 14 Oct 2024; v2 11 Nov 2024); no peer-reviewed venue per OpenAlex"
      url: "https://huggingface.co/spaces/Salesforce/GIFT-Eval"
