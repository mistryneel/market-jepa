    notes: "Represent every raw table with columns (key, value, available_at_utc, vintage_id) and build features through one function features(view, tau); run R2 by calling it on view.truncate(tau). Fetch ALFRED vintages through the FRED API real-time parameters and cache each response with its request. Wrap scalers, PCA and other fitted transforms in objects that record fit_start and fit_end and refuse to fit on rows dated after T_train. Unit test with a synthetic revised series whose current vintage differs from its first release: the pipeline must return the first release."
  adoption_cost: "medium"
  verified: true
