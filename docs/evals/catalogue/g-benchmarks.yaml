  plain_english: "A popular leaderboard for general forecasting models over 23 datasets. Its only finance data are M4 economic series, so it cannot test our claims, but it flags models whose pretraining saw the test data, a disclosure we should copy."
  formula: '\mathrm{wQL}[a]=\frac{2\sum_t\Lambda_a(\hat q_t(a),y_t)}{\sum_t|y_t|},\ \Lambda_a(q,y)=(a-\mathbb 1\{y<q\})(y-q);\quad \mathrm{CRPS}\approx\frac19\sum_{a\in\{0.1,\dots,0.9\}}\mathrm{wQL}[a];\quad \text{score}=\frac{\text{metric}_{\text{model}}}{\text{metric}_{\text{Seasonal Naive}}}'
  conventions: "Point forecasts scored by MAPE and probabilistic forecasts by CRPS (mean wQL over 9 levels), both divided by Seasonal Naive (gluonts); Rank = average CRPS rank over 97 configurations (datasets × frequencies × short/medium/long horizons). Test split = final 10% of each dataset, non-overlapping rolling windows. Leaderboard columns include MASE_Rank, CRPS_Rank, a 'TestData Leakage' flag (since 2025-08-05) and a 'zero-shot' tag (since 2025-08-25). For us: copy only the disclosure, a per-model flag for pretraining overlap with our test window or asset classes (pretraining_overlap_audit)."
  inputs: ["Documented pretraining cutoffs and corpora of foundation-model baselines", "Our test window and asset classes"]
