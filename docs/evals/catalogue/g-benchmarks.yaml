- id: "look_ahead_bench"
  name: "Look-Ahead-Bench (LLM look-ahead bias as trading-performance decay)"
  category: "benchmark"
  section: "G"
  status: "emerging"
  status_note: "Emerging: introduced by S9 (Jan 2026 preprint, single author, a proof of concept); a protocol plus code, not a dataset. Relevant only if event inputs pass through an LLM or text encoder (CANDIDATES.md open question 8). Its point alpha-decay metric is in the candidate list's dropped table; this entry keeps the pre/post-cutoff design with paired inference. Priority nice unchanged."
  priority: "nice"
  plain_english: "A small test of whether language-model trading agents only look good on periods they may have memorised, comparing excess returns in a 2021 window (inside training data) with a 2024 window (after). We need its idea only if our event inputs come from a language model."
  formula: '\alpha_P=R_{\mathrm{LLM},P}-R_{\mathrm{B\&H},P};\quad \alpha_{\mathrm{Decay}}=\alpha_{P2}-\alpha_{P1}'
  computable_form: 'G^{w}=\frac{1}{|E_w|}\sum_{e\in E_w}\big(L^{\mathrm{no\,text}}_e-L^{\mathrm{text}}_e\big),\ w\in\{\mathrm{pre},\mathrm{post}\};\quad \Delta G=G^{\mathrm{post}}-G^{\mathrm{pre}}\quad(\text{our adaptation; }L=\text{per-asset NLL})'
  conventions: "S9: α in percentage points of period return, not annualised; B&H = equal allocation of the five stocks at the start, never rebalanced; P1 = 2021-04-01..2021-09-30 (B&H +25.32%), P2 = 2024-07-01..2024-12-31 (B&H +24.75%); AAPL, MSFT, GOOGL, NVDA, TSLA; monthly target weights from the AI Hedge Fund agent framework, normalised, fractional shares; no costs or risk-free rate; single runs; negative decay read as look-ahead, with no threshold. R_LLM is not formally defined. Six quant baselines set the no-memorisation range. Our adaptation (our design): e indexes pooled event origins (each origin counted once); E_post holds the origins at least 5 trading days after the text model's documented training-data cutoff and E_pre the others (llm_cutoff_leakage); the no-text arm is the same model retrained end to end with the same data, seeds and budget, its text-derived inputs replaced by the fixed null token in pretraining and fine-tuning and its numeric event inputs kept; G^w > 0 favours the text inputs and ΔG < 0 flags possible memorisation; 95% percentile intervals from the paired month-cluster bootstrap (clusters = calendar month of day 0, B = 10,000), resampling months separately within E_pre and E_post; the result is descriptive. The same split applied to a contrast without text (numeric-only arm vs the no-event-input arm) shows how much of ΔG is regime change. This diagnostic never admits a text model to the primary analysis on origins its training data cover: every component's training data must end at least 5 trading days before each origin it serves (llm_cutoff_leakage)."
  inputs: ["Per-origin losses with and without text-derived event inputs", "The text model's documented training-data cutoff"]
  guards_against: "H2 gains that come from an LLM recalling post-2022 outcomes rather than from information available at the forecast origin."
  typical_values: "S9 (five US tech stocks; P1 Apr-Sep 2021 vs P2 Jul-Dec 2024; single runs), alpha decay in pp: Llama 3.1 8B -17.23, Llama 3.1 70B -15.25, DeepSeek 3.2 -21.77; Pitinf-Small +0.31, Medium +0.85, Large +1.30; baselines Buy & Hold 0.00, Equal Weight -2.78, Momentum -2.21, Mean Reversion -10.78, MA Crossover +9.94, Random Noise -10.30."
  pitfalls: "(1) Non-memorising baselines span -10.78 to +9.94 pp, so LLM decays of -15 to -22 pp are not clearly outside the null; no test is run. (2) Two windows confound look-ahead with regime change. (3) Pitinf models are proprietary and undocumented. (4) DeepSeek 3.2's July 2024 cutoff overlaps the start of P2. (5) lookaheadbench repo shows no licence; the backtest fork's README says MIT with no LICENSE file. (6) Not peer-reviewed."
  used_by:
    - ref: "S9"
      title: "Look-Ahead-Bench: a Standardized Benchmark of Look-ahead Bias in Point-in-Time LLMs for Finance"
      authors: "Benhenda"
      year: 2026
      venue: "arXiv:2601.13770; HAL"
      url: "https://arxiv.org/abs/2601.13770"
      peer_reviewed: false
      source_type: "preprint"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Introduces the dual-period protocol, the alpha and alpha-decay metrics and the quant and LLM baselines."
  relevance:
    H1: "none"
    H2: "medium"
    H3: "none"
    H4: "none"
    primary_endpoint: false
    why: "Applies only if FOMC/CPI text passes through an LLM or text encoder; then H2's gain must be shown not to come from memorised post-2022 narratives."
  implementation:
    libraries: ["numpy", "pandas"]
    notes: "Implement inside llm_cutoff_leakage: split pooled origins into E_post (at least 5 trading days after the cutoff) and E_pre (the rest); compute per-origin paired gains L^no text − L^text; 95% percentile intervals for G_pre, G_post and ΔG from a month-cluster bootstrap with months resampled within each period (B = 10,000); never report a single point difference. Skip if no text model is used."
  adoption_cost: "low"
  verified: true
  related: ["llm_cutoff_leakage", "pretraining_overlap_audit", "event_input_availability", "block_bootstrap"]
  access: "github.com/benstaf/lookaheadbench (front-end-like) and github.com/benstaf/aihedgefund_lookaheadbench (backtest); no dataset or leaderboard released."
  licence: "None shown for lookaheadbench; fork README states MIT without a LICENSE file."
  size: "5 tickers, two 6-month windows, single runs."
  cost: "Code free; data via a Financial Datasets API key (these five tickers free without one); Pitinf models proprietary."
  years: "2021-04 to 2021-09 and 2024-07 to 2024-12."
  frequency: "Monthly rebalancing."
  assets: "AAPL, MSFT, GOOGL, NVDA, TSLA."
  used_by_papers: "S9 only, in our sources."
