- id: "public_risk_benchmark_gap"
  name: "Public multivariate covariance-forecasting benchmark (none found)"
  category: "benchmark"
  section: "G"
  status: "gap"
  status_note: "Gap: 18 searches on 2026-11-12 (web, Hugging Face, GitHub, Papers with Code) found no benchmark with all four parts in conventions. The search is not exhaustive, so the claim is 'none found', not 'none exists' (reviews audit_EFG#7, completeness#21). Priority should as in the candidate list."
  priority: "should"
  plain_english: "There is no public leaderboard where models forecast a full covariance matrix of stock returns under fixed rules, so our main result cannot be checked against a shared benchmark. We must define our own protocol, and releasing it could fill the gap."
  formula: null
  conventions: "A benchmark counts only with all four parts: (i) a multivariate return covariance or correlation forecasting task; (ii) public data; (iii) a fixed protocol with splits and a loss; (iv) a leaderboard. Closest items: VOLARE (realized-covariance data; no splits, metrics or leaderboard; reports the univariate Oxford-Man library discontinued in mid-2022); M6 (rank probabilities and portfolio IR; only the organisers' risk model was compared with realised volatility); Johansson+ 2023 (predictors plus log-likelihood-regret code, cvxgrp/cov_pred_finance; no shared dataset or leaderboard); Kaggle Optiver RV (univariate 10-minute volatility; competition-only data). A release of ours (our design) must fix everything this catalogue pre-registers: monthly point-in-time universe membership (identifiers only; pit_universe_survivorship); the frozen FOMC/CPI calendar (36 decisions and 53 releases in 2022-01-01..2026-06-30, giving 88 pooled origins because CPI and FOMC share the 2024-06-12 origin; pit_event_calendar); origins and targets (primary: close of day 0 with Σ* = (1/5) Σ_{d=1..5} r_{t+d} r_{t+d}′, uncentred; secondary: close of day −1 over days 0–5; close-to-close returns including overnight moves, delisting returns on the delisting day and 0 for the rest of the window, halted days 0 and flagged; realized_covariance_target); the per-asset NLL with the shared PD repair and the failure rule (stein_loss); the refit calendar (walk_forward) and the 2017-2021 tuning period (locked_test_preregistration); baseline configs and seeds; the deciding test (block_bootstrap); and per-origin loss tables."
  inputs: ["Search log of 18 queries and closest-item list (G_bench record, 2026-11-12)", "Our pre-registered protocol components"]
  guards_against: "Claiming state of the art on a benchmark that does not exist, and comparing our loss levels with papers that used bespoke panels, horizons and losses."
  typical_values: "No comparable values reported in the sources read."
  pitfalls: "(1) Search is not exhaustive and vendor risk-model bias tests (e.g. Axioma, Barra) are not public benchmarks; write 'we found none'. (2) Covariance papers use incompatible bespoke panels (S4: 239 S&P 500 stocks, 252-day horizon; S11: 14 ETFs, 20 days; S12: top-1,000 US stocks, 5-day GMV variance; S13: 50 S&P 500 stocks; Johansson+ 2023: one day ahead), so never compare absolute loss levels across them. (3) Redistribution limits: CRSP returns are licensed; VIX needs Cboe's written consent; Binance-derived data must stay CC BY-NC-SA 4.0. Ship code, dates and identifiers. (4) Freeze any released protocol before the test window is unlocked."
