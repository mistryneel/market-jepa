  conventions: "PERMNO/PERMCO identifiers persist through mergers and name changes. CIZ tables on WRDS: daily stkDlySecurityData (DSF_V2), monthly stkMthSecurityData (MSF_V2), stkDelists. Delisting returns sit inside the main series as a separate, later-dated row: the last trading day keeps its own DlyRet (DlyDelFlg = 'N'), and a following row flagged DlyDelFlg = 'Y' carries the delisting return (fixture: Lehman, PERMNO 80599: 2008-09-17 DlyRet = -0.566667, flag N; 2008-09-18 DlyDelFlg = 'Y', DlyPrcFlg = 'DP', DlyRet = -0.6, equal to legacy DLRET; legacy DLSTDT 2008-09-17, NEXTDT and DLPDT 2008-09-18). Locate the delisting return by the flag, never by joining stkDelists' delisting date: the flag-Y row's date is the delisting day on which the return enters Σ*, and later target days get r = 0 (edge cases in pit_universe_survivorship). Monthly rows use MthRetFlg = 'DE'. Never also merge legacy dsedelist/msedelist (double counting). MthRet compounds daily returns with dividends reinvested on ex-dates. CRSP does not impute missing delisting returns and requires the delisting payment date within about 30 days; imputation is ours and pre-registered in pit_universe_survivorship (Schwarz+ 2026 apply -30% to missing performance-related legacy codes 400-591). Eligibility is fixed there too: common shares (legacy share codes 10/11; CIZ share-type fields to be mapped) on NYSE, AMEX or NASDAQ, price > $5 at the prior month end, top 500 by prior-month average daily dollar volume, one share class per issuer (PERMCO; the most liquid in the prior month), and a 1,260-trading-day return history with at most 2.5% missing (missing days set to 0). Freeze and report format, extraction date and checksums."
  inputs: ["CIZ daily security data via WRDS (DlyRet, DlyPrc, DlyVol, DlyDelFlg, shares)", "stkDelists", "Share-type and exchange fields", "Institutional CRSP/WRDS licence"]
  guards_against: "Survivorship and delisting bias, double-counted delisting returns after the CIZ switch, and irreproducible panels from unfrozen snapshots."
  typical_values: "S5 (CRSP common stocks, NYSE/AMEX/NASDAQ, price >= $5, out-of-sample 2001-2023): 18,144,743 stock-days, 10,171 securities. Schwarz+ 2026: the SIZ-to-CIZ switch changed 9.6% of monthly returns by at least 1 bp (mean absolute difference 22 bp). CRSP: more than 36,000 active and inactive securities, over 100 years of history."
  pitfalls: "(1) Licensed to academic institutions, government agencies and practitioners; release PERMNOs, dates and code only. (2) Never mix CIZ and SIZ within the panel. (3) Delisting imputation is our choice: log each one and run a no-imputation sensitivity. (4) The 2026 release lag is unverified; check it before fixing the test-window end (30 Jun 2026). (5) CIZ field names come from a WRDS webinar (14 May 2025) because the format guide rendered only its title. (6) Classic CRSP covariance backtests require complete future returns when forming the universe (Ledoit & Wolf 2017; Engle+ 2019), a look-ahead filter we must not copy (forward_looking_panel_filter)."
