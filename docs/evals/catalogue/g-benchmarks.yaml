- id: "market_1t"
  name: "Market-1T dataset and evaluation protocol"
  category: "benchmark"
  section: "G"
  status: "emerging"
  status_note: "Emerging: introduced by S1 (NeurIPS 2026, peer-reviewed); S17 cites it without using it. No covariance, event or crypto task, so it is a protocol precedent for H1, not a benchmark for our endpoint. Priority should as in the candidate list."
  priority: "should"
  plain_english: "A very large collection of one-second US stock quotes and trades (2008-2025) with a standard recipe for testing learned market representations. Only an 18-month sample is free and there is no covariance task, so we borrow its protocol ideas, not its scores."
  formula: '\mathrm{IC}_t=\mathrm{Spearman}\Big(\hat r_{\cdot,t},\ \frac{\mathrm{VWAP}_{\cdot}(t+900,\,t+960)}{\mathrm{VWAP}_{\cdot}(t,\,t+60)}-1\Big);\quad \overline{\mathrm{IC}}=\frac1M\sum_{m=1}^{M}\frac{1}{|\mathcal T_m|}\sum_{t\in\mathcal T_m}\mathrm{IC}_t;\quad d_m=\frac{1}{|R_m|}\sum_{r\in R_m}\big(\mathrm{IC}_r-\mathrm{IC}^{\mathrm{floor}}_m\big),\ \mathrm{SE}=\frac{s_d}{\sqrt M}'
  conventions: "Data: 1 Hz SIP NBBO and trade aggregates for all US-traded equities, 11 features; timestamps mark the end of each second; quotes carried forward; targets start at or after the input view ends. Universe rebuilt monthly from month m-1 data: common stock, average VWAP > $5, average daily dollar volume >= $20M, active in > 20% of regular-hours seconds (about 700 names). Protocol: the same 32 random months for every method; each month's model trained only on the preceding six months (foundation models exempt); 5 separate tuning months; ridge probe on frozen embeddings; rank IC at 15 minutes (t in seconds; VWAP over [a, b)) for VWAP return, change in 60-s realized volatility and change in quoted spread, averaged within month then across months; SE from per-month differences against an untrained Random ViT (ddof = 1, months independent). Code: Spearman = Pearson of ranks over finite pairs; skip cross-sections with < 20 assets."
  inputs: ["1 Hz SIP quote and trade aggregates", "Point-in-time monthly universe from month m-1 data", "Frozen embeddings and a ridge probe", "15-minute return, volatility-change and spread-change targets"]
  guards_against: "Single-period evaluation (month explains 97.2-99.9% of metric variance in S1), look-ahead in universe construction, and crediting pretraining for what an untrained encoder with a fitted probe already achieves."
  typical_values: "S1 (arXiv v2, the version read), rank IC at 15 minutes, mean over 32 months (return / vol change / spread change). Table 2: Supervised Multihead 0.0311 / 0.0941 / 0.2455; Random ViT 0.0170 / 0.0694 / 0.1692; I-JEPA 0.0103 / 0.0256 / 0.0646. Table 4, vol change only: HAR-RV 0.0639; GARCH(1,1) 0.0468. Seed-by-month variance decomposition: month explains 97.2%, 98.9% and 99.9% of variation for the three targets."
  pitfalls: "(1) Only the Jul 2019-Dec 2020 sample is public, tagged 'derived-market-data' with no licence text; the full rebuild needs a paid Massive plan; nothing public covers 2022-2026. (2) The paper says 2008-2025 but the code samples training-end months 2008-01..2023-12. (3) The tfwm README reported a pooling bug and tables being rebuilt (2026-09-14); check before quoting latent results. (4) Classical baselines go through a ridge probe on normalised inputs, which may handicap them. (5) Foundation models are exempt from the preceding-data rule, so their pretraining may overlap evaluation months (our inference). (6) A 15-minute rank IC ignores calibration and co-movement, so it cannot replace a covariance endpoint. (7) The universe is a threshold rule, not a top-500 rank."
  used_by:
    - ref: "S1"
      title: "Towards Financial World Modeling"
      authors: "Merchant, Guthrie, Mahns, Balestriero, Levy"
      year: 2026
      venue: "NeurIPS 2026 (poster); arXiv:2610.09048"
      url: "https://arxiv.org/abs/2610.09048"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Introduces the dataset, the point-in-time universe and the 32-month probe protocol, and reports all its results on them."
    - ref: "S17"
      title: "Causal-axis JEPAs on prediction-market strike ladders: a negative result and the diagnostics that failed to predict it"
      authors: "Physical Reasoning"
      year: 2026
      venue: "GitHub repository, 2026"
      url: "https://github.com/physicalreasoning/causal-jepa"
      peer_reviewed: false
      source_type: "code_repository"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Cites Market-1T (1 Hz US equities, 2008-2025) as related work without using it."
  relevance:
    H1: "medium"
    H2: "low"
    H3: "none"
    H4: "none"
    primary_endpoint: false
    why: "A protocol precedent for H1 (point-in-time universe, paired per-period errors, untrained-encoder floor, many regimes); no covariance, event or crypto task."
  implementation:
    libraries: ["numpy", "pandas", "scipy"]
    notes: "Do not report Market-1T scores as evidence for our endpoints. Borrow three ideas, not S1's settings: (1) build each month's universe only from month m−1 data (our rule is the top-500 universe of pit_universe_survivorship, not S1's thresholds); (2) paired per-period contrasts against an untrained-encoder floor (untrained_encoder_floor), computed as gain = floor loss − candidate loss and tested with our month-cluster bootstrap (block_bootstrap) instead of S1's iid-month SE; (3) evaluation over many periods (regime_reporting). Do not copy S1's six-month training windows, its tuning months or its exemption of foundation models from the preceding-data rule: our fits follow walk_forward, tuning uses only 2017-2021, and fixed-weight foundation models are scored only on origins at least 5 trading days after their documented pretraining-data end, or reported separately (pretraining_overlap_audit). If the public sample is used for pretraining checks, record its revision and note it ends 2020-12-31."
  adoption_cost: "medium"
  verified: true
  related: ["untrained_encoder_floor", "walk_forward", "pit_universe_survivorship", "regime_reporting", "linear_probe", "pretraining_overlap_audit"]
  access: "Hugging Face sample (fin-ai-lab/Market-1T-1Hz-2019H2-2020-sparse, -dense, -daystore; login, no gating stated); full data rebuilt with MIT code (github.com/fin-ai-lab/market-1t) from Massive flat files; the paper says a hosted open version is being prepared."
  licence: "Code MIT; datasets tagged 'derived-market-data' with no licence text."
  size: "'Nearly one trillion' 1-second aggregates; sample 376 days, 230,025 ticker-days (28.8 GB sparse, 23.5 GB dense, 27.1 GB daystore)."
  cost: "Sample free; full rebuild needs a paid Massive flat-file plan."
  years: "2008-2025 per the paper (code evaluates 2008-2023); sample 2019-07-01 to 2020-12-31."
  frequency: "1 Hz."
  assets: "All US-traded equities; about 700-stock benchmark universe."
  used_by_papers: "S1 (introduces); cited by S17."
  fit_for_us: "Protocol precedent for H1 only; no public data in our test window."
- id: "volare"
  name: "VOLARE realized-measure archive"
  category: "dataset"
  section: "G"
  status: "reference"
  status_note: "Reference (data source; '— (data)' after review audit_EFG#16). Estimator definitions re-read on 2026-11-12 from the arXiv HTML v1 (characters 0-100,000 of 170,463; recorded under registry 'VOLARE'); data terms still not stated. Priority nice unchanged."
  priority: "nice"
  plain_english: "An open archive of daily realized volatility and covariance measures from intraday prices for some US stocks (from 2015), currencies and futures. It can cross-check our intraday realized-covariance code on overlapping stocks, but it is not a forecasting benchmark."
  formula: 'rv=\sum_{i=1}^{m}r_i^2,\ r_i=\ln(p_i/p_{i-1});\quad \mathbf{rc}=\sum_{k=1}^{m}\mathbf r_k\mathbf r_k'';\quad bc_{i,j}=\frac{\mu_1^{-2}}{4}\sum_{k=2}^{m}\big(|r_{i,k-1}+r_{j,k-1}|\,|r_{i,k}+r_{j,k}|-|r_{i,k-1}-r_{j,k-1}|\,|r_{i,k}-r_{j,k}|\big),\ \mu_1=\sqrt{2/\pi};\quad \mathbf{rs}^{++}+\mathbf{rs}^{--}+\mathbf{rs}^{+-}+\mathbf{rs}^{-+}=\mathbf{rc}'
  conventions: "Log returns; multivariate measures on a 1-minute previous-tick grid (last trade at or before each grid point); univariate from 1- or 5-minute returns; realized kernel from 1-second returns; semicovariances from signed returns r⁺ = r ⊙ 1{r > 0}, r⁻ = r ⊙ 1{r ≤ 0}. Stock session 9:30-16:05 ET, observations after 13:00 dropped on early closes; '_ss' estimators average five one-minute-shifted grids; Brownlees-Gallo price filter (k = 60, δ = 0.1, γ = 0.06). Vendor Kibot; daily Parquet files by asset class, symbol and date. Overnight returns are not mentioned in the part read, so treat rc as intraday (our reading). Our use (our design): cross-check only the intraday sensitivity variant of realized_covariance_target on covered names with the same session, grid and synchronisation; the primary daily close-to-close Σ* is not comparable."
  inputs: ["VOLARE daily rc files for overlapping US stocks", "Our 1-minute prices for the same names and days"]
  guards_against: "Undetected errors in our intraday realized-covariance code (synchronisation, session hours, scaling) on overlapping names."
  typical_values: "No comparable values reported in the sources read."
  pitfalls: "(1) Data terms, registration and cost not stated (CC BY 4.0 covers only the paper); do not redistribute derived data until confirmed. (2) Intraday log-return measures differ from our daily simple-return Σ* by construction. (3) US coverage small and unconfirmed (40 symbols in the outlier table), so it cannot replace a 500-stock target. (4) End date not stated (outlier summary to 2026-01-30). (5) HAR and MEM tools but no splits, loss or leaderboard."
  used_by:
    - ref: "VOLARE"
      title: "VOLARE - VOLatility Archive for Realized Estimates"
      authors: "Cipollini, Cruciani, Gallo, Insana, Otranto, Spagnolo"
      year: 2026
      venue: "arXiv:2602.19732"
      url: "https://arxiv.org/abs/2602.19732"
      peer_reviewed: false
      source_type: "preprint"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Defines the archive, its coverage (stocks from 2015-01-02, FX from 2009-09-25, futures from 2009-09-28) and the rv, rc, bipower and semicovariance estimators."
  relevance:
