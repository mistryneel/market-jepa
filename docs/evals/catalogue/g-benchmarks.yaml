- id: "fev_bench"
  name: "fev-bench (skill score, win rate and paired bootstrap aggregation)"
  category: "benchmark"
  section: "G"
  status: "reference"
  status_note: "Reference ('— (benchmark)'). Formulas re-read on 2026-11-12 from the arXiv HTML v5 of 4 Nov 2026 (characters 0-100,000 of 130,955; recorded under registry 'fev-bench'; equation numbers from v5). Relevant to the primary endpoint only through reporting rules that relative_skill_reporting adopts. Priority nice unchanged."
  priority: "nice"
  plain_english: "A 100-task forecasting benchmark with careful rules for summarising many comparisons: skill relative to a naive forecast, win rates that count ties as half, and paired bootstrap intervals. We borrow its reporting rules, not its data."
  formula: 'W_j=\frac{1}{R(M-1)}\sum_{r}\sum_{k\neq j}\big[\mathbb 1(E_{rj}<E_{rk})+\tfrac12\mathbb 1(E_{rj}=E_{rk})\big];\ W_{jk}=\frac1R\sum_r\big[\mathbb 1(E_{rj}<E_{rk})+\tfrac12\mathbb 1(E_{rj}=E_{rk})\big];\ S_j=1-\exp\Big(\frac1R\sum_r\log\mathrm{clip}\big(\tfrac{E_{rj}}{E_{r\beta}};10^{-2},100\big)\Big);\ S_{jk}=1-\exp\Big(\frac1R\sum_r\log\mathrm{clip}\big(\tfrac{E_{rj}}{E_{rk}};10^{-2},100\big)\Big);\ \rho_q(y,\hat y)=2\max\{q(y-\hat y),(1-q)(\hat y-y)\}'
  conventions: "E_{rj} = error of model j on task r (lower is better); R tasks, M models; β = Seasonal Naive; S > 0 means better than the reference; within the clip bounds the geometric mean makes rankings invariant to the reference. Paired bootstrap: B = 1000 resamples of tasks with replacement, 95% percentile intervals, for W_jk (H0: 0.5) and S_jk (H0: 0). Failed model-task pairs take the Seasonal Naive error; leaked pretrained-model results are replaced by Chronos-Bolt (Base) scores. Per-task errors: MASE and scaled quantile loss (SQL, ρ_q over Q = {0.1..0.9}) divided by the in-sample seasonal error a_{n,d} = (1/(T-m)) Σ_{t>m} |y_t - y_{t-m}|. Our mapping (our design): tasks → forecast origins (post-event: the 88 pooled event origins of the locked window, the 2024-06-12 CPI–FOMC origin counted once, or the 36 FOMC or 53 CPI events within one type; H1: the ordinary-day origins); E → per-origin loss; j = candidate and k = reference, so W_jk > 0.5 and S_jk > 0 favour the candidate, as the gain Δ = L_ref − L_cand > 0 does; 95% percentile intervals come from the paired month-cluster draws of block_bootstrap (clusters = calendar month of day 0, or of the origin date for ordinary days; B = 10,000) instead of iid task resampling and are descriptive, while the deciding test stays the one-sided bound on the mean gain; no imputation or substitution: a candidate failure voids the candidate's claim for that contrast and a reference failure drops that origin from that contrast only, with counts reported (stein_loss), and foundation models with pretraining overlap follow pretraining_overlap_audit; ratio skills only for strictly positive losses (Frobenius, MSE, GMV variance), never for the per-asset NLL, which can be negative."
  inputs: ["Per-task errors for all models on identical tasks (for us: per-origin losses on the same forecast origins, or per-event losses within one event type)", "Reference-model errors on the same origins"]
  guards_against: "Rankings driven by a few huge errors (geometric mean with clipping), inconsistent tie counting, and uncertainty statements that ignore pairing."
  typical_values: "No comparable values reported in the sources read."
  pitfalls: "(1) Skill needs strictly positive errors; NLL and QLIKE can be negative, so use paired differences for the primary endpoint. (2) Imputing failures hides failure rates; we report non-PD failures separately (stein_loss). (3) Its bootstrap treats tasks as exchangeable; our events share months, so resample month clusters. (4) No equities or crypto (econ = FRED-MD/QD, GVAR, tourism and similar). (5) Venue per arXiv comments only."
  used_by:
    - ref: "fev-bench"
      title: "fev-bench: A Realistic Benchmark for Time Series Forecasting"
      authors: "Shchur, O., Ansari, A. F., Turkmen, C., Stella, L., Erickson, N., Guerron, P., Bohlke-Schneider, M., & Wang, Y."
      year: 2025
      venue: "arXiv:2509.26468 (v5, 4 Nov 2026; NeurIPS 2026 Evaluations & Datasets Track per arXiv comments)"
      url: "https://arxiv.org/abs/2509.26468"
      peer_reviewed: false
      source_type: "preprint"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Defines the win rate (Eq. 3), skill score (Eq. 4), their pairwise forms (Eqs. 5-6), the paired task bootstrap and the failure imputation rule; equation numbers from arXiv v5 (4 Nov 2026)."
