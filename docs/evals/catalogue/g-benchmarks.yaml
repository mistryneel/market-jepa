- id: "m6_competition"
  name: "M6 forecasting competition"
  category: "benchmark"
  section: "G"
  status: "reference"
  status_note: "Reference ('— (benchmark)'). Scoring definitions read on 2026-11-12 from the arXiv preprint (new source 'M6 preprint'; ar5iv, first ~100k of 192k characters); the IJF 2025 version (registry 'M6') was not read and may differ. Priority nice unchanged; secondary return task only."
  priority: "nice"
  plain_english: "A live 2022-23 competition in which teams forecast how 100 assets would rank over each coming four weeks and picked portfolios. It is the closest public precedent for scoring rank forecasts as probabilities; no covariance forecasts were scored."
  formula: 'RPS_{i,T}=\frac15\sum_{j=1}^{5}\Big(\sum_{k=1}^{j}q_{i,T,k}-\sum_{k=1}^{j}f_{i,T,k}\Big)^2;\ RPS_T=\frac{1}{100}\sum_{i=1}^{100}RPS_{i,T};\ RPS_{T_1:T_2}=\frac{1}{100(T_2-T_1+1)}\sum_{T=T_1}^{T_2}\sum_{i=1}^{100}RPS_{i,T};\quad RET_t=\sum_{i=1}^{N}w_i\Big(\frac{S_{i,t}}{S_{i,t-1}}-1\Big),\ ret_t=\ln(1+RET_t),\ ret_{t_1:t_2}=\sum_{t=t_1}^{t_2}ret_t,\ sdp=\sqrt{\frac{1}{T-1}\sum_{t=t_1}^{t_2}\big(ret_t-T^{-1}ret_{t_1:t_2}\big)^2},\ IR=\frac{ret_{t_1:t_2}}{sdp};\quad OR=\frac{\mathrm{rank}(RPS)+\mathrm{rank}(IR)}{2}'
  conventions: "q = realised outcome over 5 quintile ranks of each asset's four-week total return (1 worst, 5 best; 20 assets per quintile), one-hot except at boundary ties, which get the average rank with fractional weights (rank 4.75 gives q = (0, 0, 0, 0.25, 0.75)); f = submitted probabilities summing to 1. Lower RPS is better; 0 is perfect; the naive f = 0.2 scores 0.16 (our enumeration agrees: 0.24, 0.12, 0.08, 0.12, 0.24 for quintiles 1-5). Overall RPS = arithmetic mean of monthly RPS. IR: S = adjusted closes; long or short weights; invalid if Σ|w| > 1 or < 0.25; unallocated share earns zero; benchmark and risk-free rate 0; T = t_2 - t_1 + 1 days; ddof = 1; reported IRs are 'annualized' with no method given. 12 four-week rounds with submission points from 6 Mar 2022 to 8 Jan 2023 (preprint Table 1). Our adaptation: RPS on our universe needs pre-registered horizon, quintile and tie rules."
  inputs: ["Quintile-rank probabilities per asset", "Realised round total returns from adjusted closes", "Portfolio weights and daily adjusted closes for the IR"]
  guards_against: "Scoring rank forecasts on point accuracy alone (RPS rewards calibrated probabilities over all ranks) and comparing investment decisions without a common risk-adjusted score."
  typical_values: "Naive equal-probability forecast (0.2 per quintile): RPS 0.16 (M6; 100 assets; four-week rounds; 2022-23)."
  pitfalls: "(1) Not a covariance benchmark: only the organisers' risk model (HEXP volatility plus hierarchical factor/BEKK covariance) was compared with realised 20-day volatility. (2) No fixed public dataset (prices from Yahoo; factor weights on request). (3) IR annualisation unstated. (4) Dates differ slightly between the preprint's Section 2.3 and Table 1, and the IJF version may differ."
