    libraries: ["numpy", "pandas", "Alphalens"]
    notes: "1) Build X_t per date from point-in-time data, or take it from factor_risk_models. 2) Per date compute the projection with the pseudo-inverse and the FN rank IC; log rank(X_t) and skipped dates. 3) Feed the per-date series to icir, newey_west_t and block_bootstrap exactly as for rank_ic. 4) Unit tests: with X = intercept only the FN rank IC equals RankIC; a forecast equal to one style column gives an FN rank IC near 0; the forecast-only value never exceeds the two-sided value in absolute size; duplicating a column of X does not change the result."
  adoption_cost: "medium"
  verified: true
  related: ["rank_ic", "icir", "factor_risk_models", "long_short_decile", "lookahead_revisions"]
- id: "deflated_sharpe"
  name: "Deflated Sharpe ratio (with the probabilistic Sharpe ratio)"
  category: "stat_test"
  section: "B"
  status: "canonical"
  status_note: "Kept canonical: Bailey & López de Prado 2014 (DSR) and 2012 (PSR) are the originals. It does not detect leakage: S10's planted look-ahead oracle passed with DSR 1.00."
  priority: "nice"
  plain_english: "The probability that a strategy's true Sharpe ratio is above zero after allowing for how many strategies were tried, how short the test was and how fat-tailed the returns are. A value above 0.95 is the usual pass mark."
  formula: '\widehat{PSR}(SR^{*})=Z\Big[\frac{(\widehat{SR}-SR^{*})\sqrt{T-1}}{\sqrt{1-\hat\gamma_3\widehat{SR}+\frac{\hat\gamma_4-1}{4}\widehat{SR}^2}}\Big],\qquad \widehat{SR}_0=\sqrt{V[\{\widehat{SR}_n\}]}\Big((1-\gamma)Z^{-1}\Big[1-\frac{1}{N}\Big]+\gamma\,Z^{-1}\Big[1-\frac{1}{N}e^{-1}\Big]\Big),\qquad \widehat{DSR}=\widehat{PSR}(\widehat{SR}_0),\qquad \hat N=\bar\rho+(1-\bar\rho)M,\ \ \bar\rho=\frac{2\sum_{i=1}^{M}\sum_{j=i+1}^{M}\rho_{i,j}}{M(M-1)},\qquad \mathrm{MinTRL}=1+\Big[1-\hat\gamma_3\widehat{SR}+\frac{\hat\gamma_4-1}{4}\widehat{SR}^2\Big]\Big(\frac{Z_\alpha}{\widehat{SR}-SR^{*}}\Big)^2'
  computable_form: 'From the paper''s appendix snippet: emc = 0.5772156649; maxZ = (1 - emc) * ss.norm.ppf(1 - 1./N) + emc * ss.norm.ppf(1 - 1./(N * np.e)); SR0 = sqrt(V) * maxZ; DSR = Phi((SR - SR0) * sqrt(T - 1) / sqrt(1 - g3 * SR + (g4 - 1) / 4 * SR**2)), where Phi is the standard normal CDF and SR, V and SR0 are in per-observation (daily) units.'
  conventions: "Units: every Sharpe ratio, the cross-trial variance V and SR_0 are per observation at the return frequency (daily), never annualised (Bailey & López de Prado 2012 and 2014). T is the number of daily returns of the evaluated strategy; γ̂3 is the sample skewness and γ̂4 the raw kurtosis (normal = 3), not excess kurtosis. γ ≈ 0.5772 is the Euler–Mascheroni constant, Z the standard normal CDF and e Euler's number. Null: true SR = 0 for the DSR; the PSR can take any benchmark SR*. N is the number of independent trials and V the variance (ddof = 1, our choice; the paper does not state it) of the trials' daily Sharpe ratios, both taken from the trial ledger (trial_ledger); planted demonstration arms are excluded from the ledger (S10). For M correlated trials use N̂ = ρ̄ + (1 − ρ̄)M from the average pairwise correlation of the trials' return series (Appendix A.3); the authors warn this is unreliable when M exceeds T. N = 1: SR_0 is undefined (Z^{-1}(0) = −∞), although S10 says the DSR then collapses to the PSR; report PSR(0) for a single pre-registered strategy (our convention). Where: compute the DSR for the configuration selected on the pre-2022 validation period (2017-01-01 to 2021-12-31, G8), using that period's walk-forward returns and its trial ledger; on the locked window there is one pre-registered strategy, so report PSR(0) and, if several variants are shown, a DSR over them (descriptive, G5). Decision: DSR ≥ 0.95 passes (S10's certification level; the papers compare with 0.95). Report SR, SR_0, N (or N̂), V, T, γ̂3, γ̂4 and DSR together, plus MinTRL for SR* = 0 at α = 5%. The Mertens-form variance assumes serially uncorrelated returns; report the first-order autocorrelation."
  inputs: ["Daily (net) returns of the selected strategy over the evaluation sample", "Trial ledger: the daily Sharpe ratio of every configuration tried (for V and N) and, optionally, their return series (for ρ̄ and N̂)", "Benchmark SR* for the PSR (default 0) and α for MinTRL"]
  guards_against: "Reporting the best Sharpe ratio from many backtested variants as if it were the only one tried, especially with short samples and fat-tailed returns."
  typical_values: "Bailey & López de Prado 2014 worked example: N = 100 trials, V = 1/2 (annualised), T = 1,250 daily returns, skewness −3, kurtosis 10 and annualised SR 2.5 give SR_0 ≈ 0.1132 (daily, 250 days a year) and DSR ≈ 0.9004 < 0.95; the DSR reaches 0.9505 at N = 46, or at N = 88 with normal returns. Bailey & López de Prado 2012: a monthly SR of 0.458 over two years (1.59 annualised) gives PSR(0) = 0.982 under normality and 0.913 with skewness −2.448 and kurtosis 10.164. S10 (US equity panel, design 2017–2021, evaluation 2022–2025): planted look-ahead oracle DSR 1.00 (evaluation SR 51.5); equal-weight buy-and-hold 0.99; random floor 0.46; an LLM agent's best strategy over a 102-trial ledger 0.86; five agent seeds with 18 trials each 0.15–0.29. S16 (blog): DSR 0.76–0.95 on a survivorship-selected 82-name universe, gone on the survivorship-free panel."
  pitfalls: "(1) Annualised inputs are wrong: SR, V and SR_0 must share the daily frequency. (2) Using excess instead of raw kurtosis lowers the term under the square root by 0.75·SR², which pushes the DSR up whenever SR exceeds SR_0 (our derivation). (3) N must count every trial actually run (trial_ledger); an under-counted N inflates the DSR, and correlated trials need N̂. (4) N = 1 makes SR_0 undefined; use the PSR. (5) The DSR does not detect leakage: S10's planted oracle passed at 1.00, and S16's survivorship-selected universe gave a DSR of 0.95 that vanished on a survivorship-free panel. (6) The formula assumes serially uncorrelated returns; overlapping cohorts can induce autocorrelation. (7) The DSR asks whether the best trial is significant, not whether it beats a baseline; use the paired Sharpe comparison in net_sharpe for that. (8) Computing the DSR on test data that informed the search double-counts."
  used_by:
    - ref: "Bailey & López de Prado 2014"
      title: "The deflated Sharpe ratio: Correcting for selection bias, backtest overfitting, and non-normality"
      authors: "Bailey, D. H. & Lopez de Prado, M."
      year: 2014
      venue: "The Journal of Portfolio Management, 40(5), 94-107"
      url: "https://doi.org/10.3905/jpm.2014.40.5.094"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      version_read: "author copy of 31 Jul 2014 ('forthcoming') read; JPM typeset version not read"
      accessed: "2026-11-12"
      how_used: "original definition: the DSR is the PSR evaluated at the expected maximum Sharpe ratio of N independent trials, with an effective-N heuristic and a worked example."
    - ref: "Bailey & López de Prado 2012"
      title: "The Sharpe ratio efficient frontier"
      authors: "Bailey, D. H. & Lopez de Prado, M."
      year: 2012
      venue: "Journal of Risk, 15(2), 3-44"
      url: "https://doi.org/10.21314/JOR.2012.255"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "original definition of the probabilistic Sharpe ratio (non-normal returns, raw kurtosis, per-period units) and of the minimum track-record length."
    - ref: "S10"
      title: "What survives honest evaluation? Leakage-safe, search-aware assessment of LLM-driven trading strategy discovery"
      authors: "Gençay"
      year: 2026
      venue: "arXiv:2608.27734"
      url: "https://arxiv.org/abs/2608.27734"
      peer_reviewed: false
      source_type: "preprint"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Deflates every reported strategy by its own trial-ledger N and Sharpe dispersion, certifies at DSR ≥ 0.95, and shows a planted look-ahead oracle passing with DSR 1.00."
    - ref: "S16"
      title: "Does JEPA Find Alpha? Self-Supervised Joint-Embedding Predictive Architectures on Financial Markets"
      authors: "Vine"
      year: 2026
      venue: "Self-published blog, June 2026"
      url: "https://bryanvine.github.io/jepa-trader/"
      peer_reviewed: false
      source_type: "blog"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Self-published blog: requires deflating every Sharpe ratio for the configurations tried and reports DSRs that disappeared on a survivorship-free universe."
  relevance:
    H1: "none"
    H2: "none"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Needed only if a Sharpe ratio from the secondary return task or a crypto transfer strategy is reported after a search; it plays no role in the covariance tests."
  implementation:
    libraries: ["numpy", "scipy"]
    notes: "1) Pull N, the trials' daily Sharpe ratios and, if available, their return series from the trial ledger. 2) Compute SR_0 with the appendix formula and the DSR with daily SR, T, γ̂3 and raw γ̂4. 3) Report the full input set and MinTRL. 4) Unit tests: reproduce the paper's example (SR_0 ≈ 0.1132 and DSR ≈ 0.900 with N = 100, V = 1/(2·250), T = 1,250, γ3 = −3, γ4 = 10, SR = 2.5/√250) and the 2012 PSR example (0.982 and 0.913); check that the DSR falls as N rises."
  adoption_cost: "low"
  verified: true
  related: ["net_sharpe", "trial_ledger", "pbo_cscv", "planted_leak_test", "multiple_testing", "pit_universe_survivorship"]
- id: "r2_oos"
  name: "Out-of-sample R² of return forecasts against a stated benchmark forecast"
  category: "return_metric"
  section: "B"
  status: "canonical"
  status_note: "Kept canonical. Campbell & Thompson 2008 is cited as the original out-of-sample R² (historical-mean benchmark), as in the candidate list; we did not search for earlier uses. Gu+ 2020 argue for and use a zero-forecast benchmark for individual stocks, which S5 follows."
  priority: "nice"
  plain_english: "How much smaller the model's squared return-forecast errors are than those of a simple benchmark forecast (zero, or the stock's past average return). Positive means the model beats the benchmark; negative means it does worse."
  formula: 'R^2_{\mathrm{oos},0}=1-\frac{\sum_{(i,t)\in\mathcal T}\big(y_{i,t}-\hat y_{i,t}\big)^2}{\sum_{(i,t)\in\mathcal T}y_{i,t}^2},\qquad R^2_{OS}=1-\frac{\sum_{t}(r_t-\hat r_t)^2}{\sum_{t}(r_t-\bar r_t)^2},\ \ \bar r_t=\text{historical mean through }t-1,\qquad d_t=\frac{1}{N_t}\sum_{i\in U_t}\Big[\big(e^{\mathrm{ref}}_{i,t}\big)^2-\big(e^{\mathrm{cand}}_{i,t}\big)^2\Big]\ \ (\text{gain: }d_t>0\text{ favours the candidate}),\qquad \bar f_t=\frac{1}{N_t}\sum_{i\in U_t}2\,y_{i,t}\,\hat y_{i,t}\ \ \text{(Clark–West adjusted MSPE difference vs the zero forecast)}'
  computable_form: 'Pooled: r2 = 1 - ((y - yhat)**2).sum() / (y**2).sum() over all (i, t) in the origin set; by year: the same within each calendar year, then the mean of the yearly values (S5''s scheme, secondary). Historical-mean variant: replace y**2 by (y - ybar_hist)**2, where ybar_hist[i, t] is the mean of stock i''s h-day excess returns whose windows end on or before t, over the trailing 2,520 trading days (G6). Paired comparison: d_t = mean over names of (e_ref**2 - e_cand**2) per date (a gain); paired month-cluster bootstrap of mean(d_t) with B = 10,000; check: Gu+ 2020''s modified DM t of mean(d_t) with newey_west_t''s variance. Test of R² > 0: f_t = mean over names of 2 * y * yhat per date, then a one-sided t of mean(f_t) (H_A: mean > 0) with newey_west_t''s variance (its overlapping-target case on daily origins with h > 1).'
  conventions: "Forecast: a return forecast in return units over the same h-day window as y (rank_ic's target); a score that is only a ranking cannot be scored. Target: the h-day simple excess return y_{i,t} = Π_d(1 + r_{i,t+d}) − Π_d(1 + rf_{t+d}) (our convention; Gu+ 2020 and S5 use excess returns), built from the same daily returns as rank_ic's target: the delisting return on the delisting day and 0 afterwards, trading halts 0 and flagged, and no forward-looking completeness filter (G11). No winsorisation in the headline; S5 winsorises daily returns to [−1, 1], which we report as a sensitivity. Benchmark (pre-registered): the zero forecast is the headline, as in Gu+ 2020 and S5 for individual stocks; the historical mean (Campbell & Thompson 2008) is secondary, computed per stock as the mean of its past h-day excess returns whose windows end at or before the origin, over the trailing m = 2,520 trading days (G6's window; Campbell & Thompson's expanding mean is a sensitivity); with fewer than 252 daily observations use the universe mean (our convention; under G10's 1,260-day eligibility rule this can only happen for crypto pairs). Never use the evaluated test-set mean (S17's probe R² does). Pooling: all stock–origin pairs in the origin set with equal weight (Gu+ 2020); secondary, compute per calendar year and average the years (S5). Origin sets as in rank_ic; overlapping h-day windows on daily origins affect inference, not the point estimate. Orientation: higher is better; report in percent to 2 dp. Comparing two models (descriptive, G5): d_t is the per-date gain, the reference model's squared error minus the candidate's averaged over names, so d_t > 0 favours the candidate (G1); the interval is the paired month-cluster bootstrap of d̄ (block_bootstrap; B = 10,000; cluster = calendar month of the origin date, or of day 0 for event origins; G3), and the candidate is supported iff the one-sided 95% percentile lower bound is above 0; Gu+ 2020's modified DM t on d_t is a check, with newey_west_t's overlapping-target variance on daily origins with h > 1. Testing R² > 0 against the zero or historical-mean benchmark: Clark & West 2007's MSPE-adjusted statistic on per-date means, which for the zero benchmark reduces to f = 2y·ŷ (our derivation from their eq. 4.1, numbered as in NBER TWP 326), one-sided (H_A: mean f > 0) at 5% with normal critical values and newey_west_t's overlapping-target variance on daily origins with h > 1. Clark–West derive it for nested linear models, so for a neural model it is an approximation (our caveat)."
  inputs: ["ŷ_{i,t}: return forecast in return units for the h-day window", "y_{i,t}: realised h-day excess return (with delisting returns) and the daily risk-free series", "Benchmark choice and, for the historical-mean variant, each stock's return history up to the origin"]
  guards_against: "Relying only on scale-free rankings: R² penalises forecasts with the wrong level or scale, which IC ignores, and a stated benchmark stops weak models looking good against a noisy historical mean."
  typical_values: "S5 (US, next-day excess returns, zero benchmark, pooled within each year 2001–2023 and then averaged, in %): CatBoost −0.03 (512-day context; large caps −0.28, small caps 0.60); averaged over context windows OLS-Huber −0.47 and CatBoost −0.10; zero-shot Chronos-small −1.27 (best zero-shot TSFM), Chronos-large −1.37, TimesFM 2 −2.80; fine-tuned Chronos-large about +0.46 to +0.48, yet its long–short Sharpe is 0.07; zero-shot Toto −114.18. Gu+ 2020: benchmarking against historical-mean stock returns would raise every method's monthly R² by roughly 3 percentage points."
  pitfalls: "(1) The benchmark changes conclusions: zero (Gu+ 2020, S5) vs the historical mean (Campbell & Thompson 2008); Gu+ 2020 report a difference of about 3 percentage points at monthly frequency. (2) A test-set mean as the benchmark (S17's probe R²) is a forecast no one could have made in advance. (3) Daily stock R² is tiny and often negative; a negative R² with a positive IC is common when the forecast's scale is wrong. (4) R² and economic value can disagree (S5: fine-tuned Chronos-large R² about +0.47% but Sharpe 0.07). (5) Pooled R² is dominated by high-variance names and days (event days, delistings); report by year as well. (6) Winsorising targets changes R²; pre-register one rule. (7) Raw DM tests of nested comparisons are undersized; use the Clark–West adjustment for claims that the model beats the benchmark. (8) Small R² values can matter economically: Campbell & Thompson compare R² with the squared per-period Sharpe ratio, a mapping derived for market timing, not for cross-sectional books."
  used_by:
    - ref: "Campbell & Thompson 2008"
      title: "Predicting excess stock returns out of sample: Can anything beat the historical average?"
      authors: "Campbell, J. Y. & Thompson, S. B."
      year: 2008
      venue: "The Review of Financial Studies, 21(4), 1509-1531"
      url: "https://doi.org/10.1093/rfs/hhm055"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "original definition: out-of-sample R² of a predictive regression against the recursively estimated historical-mean forecast, with a utility-based reading of small R² values."
    - ref: "Gu+ 2020"
