- id: "long_short_decile"
  name: "Long–short decile spread (top minus bottom decile of the forecast)"
  category: "return_metric"
  section: "B"
  status: "widely_used"
  status_note: "Confirmed 'widely used' (provisional in the candidate list): 2023–2026 users are S5 (2025, equal-weighted deciles rebalanced daily) and He+ 2026 (JFE, equal-weighted daily decile high-minus-low), and S1 (NeurIPS 2026) offers decile selection in its harness. Gu+ 2020 is the reference design. S3 uses top-30/bottom-30 batches, not deciles (review audit_BCD#7); it is cited only for its overlapping-batch accounting."
  priority: "nice"
  plain_english: "On each forecast date, buy the 10% of stocks the model likes most and sell short the 10% it likes least, in equal dollar amounts, and record what that bet earns over the forecast window. It turns a ranking into a return."
  formula: 'k_{i,t}=\Big\lceil\frac{10\,p_{i,t}}{N_t}\Big\rceil,\quad D_{k,t}=\{i\in U_t:k_{i,t}=k\};\qquad R^{(k)}_t=\sum_{i\in D_{k,t}}w^{(k)}_{i,t}\,y_{i,t},\quad w^{(k)}_{i,t}=\frac{1}{|D_{k,t}|}\ \text{(equal) or }\ \frac{\mathrm{ME}_{i,t}}{\sum_{j\in D_{k,t}}\mathrm{ME}_{j,t}}\ \text{(value)};\qquad R^{LS}_t=R^{(10)}_t-R^{(1)}_t,\quad \overline{R}^{LS}=\frac{1}{|\mathcal T|}\sum_{t\in\mathcal T}R^{LS}_t;\qquad \text{tradable book: }\ w^{(c)}_i=\frac{\mathbb 1[i\in D_{10,c}]}{h\,|D_{10,c}|}-\frac{\mathbb 1[i\in D_{1,c}]}{h\,|D_{1,c}|},\ \ r^{P}_d=\sum_i w^{+}_{i,d-1}r_{i,d},\ \ \tilde w_{i,d}=\frac{w^{+}_{i,d-1}(1+r_{i,d})}{1+r^{P}_d},\ \ w^{+}_d=\tilde w_d-\tilde w^{(c_{\mathrm{exp}})}_d+w^{(c_{\mathrm{new}})}'
  computable_form: 'Paper version, per origin t: sort U_t by forecast ascending with ties broken by stock id; position p = 1..N_t; decile k = ceil(10 p / N_t); spread = mean of y over decile 10 minus mean of y over decile 1 (equal weights), plus the value-weighted analogue and all ten decile means. Tradable book, per trading day d: (i) r^P_d from yesterday''s post-trade weights and today''s returns; (ii) drift every cohort''s weights by (1 + r_i)/(1 + r^P_d); (iii) close the cohort opened h days ago, open the new cohort at ±1/(h·|D|) per name, and net the trades by name; (iv) pass r^P_d, the traded amount Σ_i|w^+_{i,d} − w̃_{i,d}| and the short gross exposure to net_sharpe, turnover and max_drawdown.'
  conventions: "Sorting: per origin over U_t (as in rank_ic), deciles by the position rule above (decile 10 = highest forecast); require N_t ≥ 100 (at least 10 names per decile), otherwise use quintiles and say so (our rule); break ties by stock id. Weights: equal weights are the headline (S5, He+ 2026); value weights by market equity at the origin close are a robustness check (Gu+ 2020's main specification). Capital base: R^LS is per $1 long and $1 short, i.e. the decile-10 return minus the decile-1 return (Gu+ 2020); Qlib's long–short return is a different quantity (pitfall 1). Holding window: y_{i,t} as in rank_ic (close of t to close of t+h, total return; the delisting return on the delisting day, after which the position is cash; halted days 0 and flagged; G11). Two versions. Paper version (ranking quality): formed at the close of t, as S5 and He+ 2026 do; report the mean spread per holding period, both legs and all ten decile means (monotonicity). Tradable version (input to net_sharpe, turnover, max_drawdown and any economic claim): one-day execution lag, i.e. weights set at the close of t+1 from the origin-t forecast, matching Qlib's default label alignment; next-open entry is a sensitivity. Overlap for h > 1: h staggered cohorts, each opened with 1/h of NAV per leg and held h days without rebalancing (buy-and-hold within the cohort), following S3's batches; S3 does not net trades across batches, whereas we net them by name (our convention; report S3's unnetted version as a conservative check). For h = 1 this is the daily-rebalanced decile book of S5 and He+ 2026. The first h−1 days hold fewer cohorts and are included, as in S3. Weights are fractions of NAV; cash earns zero and no risk-free rate is subtracted (zero-net-investment book). Paired comparisons (descriptive, G5): the spread gain ΔR^LS_t = R^LS_{cand,t} − R^LS_{ref,t}, positive favouring the candidate (G1); on any origin set, the paired month-cluster bootstrap of the mean gain (block_bootstrap; B = 10,000; cluster = calendar month of the origin date, or of day 0 for event origins; G3), and the candidate is supported iff the one-sided 95% percentile lower bound is above 0. Event origins: one h-day paper spread per origin (88 distinct origins for the 89 events, because CPI and FOMC share 2024-06-12; G2). Daily series: per-origin h-day spreads from daily origins overlap, so t-statistics of their means use newey_west_t's overlapping-target variance (the larger of the truncated window at lag h − 1 and the Bartlett estimator with m = max(h−1, ⌊4(T/100)^{2/9}⌋)); the daily tradable return series has no target overlap and uses the Bartlett estimator with m = ⌊4(T/100)^{2/9}⌋. Annualising a daily series: mean × 252 for US equities (S5's printed values imply 252), mean × 365 for crypto (our convention). Spreads here are gross of costs; costs enter in net_sharpe."
  inputs: ["ŝ_{i,t} and y_{i,t} as in rank_ic; daily returns r_{i,d} for the tradable book", "Point-in-time universe U_t and market equity at each origin close (for value weights)", "h, execution lag (paper: 0; tradable: 1 day) and the minimum number of names per date (100)"]
  guards_against: "Reporting a correlation with no economic size, and judging a ranking only by its middle: the spread and the ten decile means show whether the extremes, where trading happens, are ranked well."
  typical_values: "S5 (US CRSP universe, equal-weighted deciles rebalanced daily, gross of costs, 2001–2023, mean of yearly values): CatBoost long–short 46.50% a year, SD 6.85%, Sharpe 6.79, 18.45 bp a day (252-day context); 47.25% and Sharpe 6.46 (512-day context); zero-shot Chronos-large 20.17% (Sharpe 2.92); fine-tuned Chronos-large 0.23% (Sharpe 0.07). Gu+ 2020 (US, monthly, NBER working paper): NN4 decile spread about 2.3% a month (27.1% a year), monthly volatility 5.8% (20.1% annualised), Sharpe 1.35. He+ 2026, S1 and Qlib give no decile-spread values in the records read."
  pitfalls: "(1) Qlib's calc_long_short_return returns (r_long − r_short)/2 from the top and bottom 20% of names (quantile default 0.2): half a quintile spread, not a decile spread. (2) Paper timing (formation at the close the signal uses) overstates what can be traded; any economic claim needs the tradable version and the costs of net_sharpe. (3) Equal-weighted spreads lean on the smallest names in the universe; within about 500 liquid stocks this matters less, but report value weights too. (4) Per-origin h-day spreads from daily origins overlap, so their naive t is too large. (5) Short-leg sign conventions vary: in S5's tables long–short is about long + short, so the short leg is shown as the return from shorting. (6) Dropping names that delist inside the holding window inflates the spread; keep them with the delisting return. (7) Large gross spreads can vanish after costs: every S5 long–short Sharpe turns negative at 20 bp or more. (8) On FOMC/CPI origins the decile spread mostly sorts market beta; read it beside factor_neutral_ic (our note). (9) Small cross-sections (crypto) leave too few names per decile; switch to quintiles and say so."
  used_by:
    - ref: "Gu+ 2020"
      title: "Empirical asset pricing via machine learning"
      authors: "Gu, S., Kelly, B. & Xiu, D."
