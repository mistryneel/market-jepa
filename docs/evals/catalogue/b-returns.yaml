      authors: "Gu, S., Kelly, B. & Xiu, D."
      year: 2020
      venue: "The Review of Financial Studies, 33(5), 2223-2273"
      url: "https://doi.org/10.1093/rfs/hhaa009"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "NBER WP 25398 (Dec 2018, rev. Sept 2019) read; RFS version not read"
      accessed: "2026-11-12"
      how_used: "Pools squared errors over all stock–months in the test sample against a zero forecast (no demeaning) and compares models with a modified DM test on cross-sectional mean error differences."
