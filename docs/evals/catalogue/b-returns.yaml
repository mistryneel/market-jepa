- id: "icir"
  name: "IC information ratio: ICIR and Rank ICIR (mean over standard deviation of the per-date IC)"
  category: "return_metric"
  section: "B"
  status: "widely_used"
  status_note: "Upgraded from 'widely used (prov.)'. Besides FinTSB (2026), two peer-reviewed papers opened for this entry report ICIR as the IC normalised by its standard deviation: Zhao+ 2023 (DoubleAdapt, KDD 2023) states the mean IC as numerator, and Li+ 2024 (MASTER, AAAI 2024) does not name it. The fundamental-law references (Grinold; Grinold and Kahn) are deliberately not cited for ICIR, following review audit_BCD#6 and completeness#29: the verification records warn against attributing the ICIR estimator to them."
  priority: "should"
  plain_english: "The average daily IC divided by how much the daily IC varies from day to day. It shows whether the model ranks stocks well consistently or only on a few dates."
  formula: '\mathrm{ICIR}=\frac{\overline{\mathrm{IC}}}{s_{\mathrm{IC}}},\qquad s_{\mathrm{IC}}=\sqrt{\frac{1}{|\mathcal T|-1}\sum_{t\in\mathcal T}\big(\mathrm{IC}_t-\overline{\mathrm{IC}}\big)^2},\qquad \mathrm{RankICIR}=\frac{\overline{\mathrm{RankIC}}}{s_{\mathrm{RankIC}}},\qquad t_{\mathrm{iid}}=\mathrm{ICIR}\,\sqrt{|\mathcal T|}'
  computable_form: 'Qlib SigAnaRecord (qlib/workflow/record_temp.py): ic, ric = calc_ic(pred, label); metrics = {''IC'': ic.mean(), ''ICIR'': ic.mean() / ic.std(), ''Rank IC'': ric.mean(), ''Rank ICIR'': ric.mean() / ric.std()}. pandas std uses ddof = 1 by default.'
  conventions: "Computed on exactly the per-date IC_t and RankIC_t series of rank_ic: the same origin set, target window, minimum-names rule and exclusions. Standard deviation with ddof = 1 (the pandas default that Qlib relies on; the ddof is a pandas fact, not Qlib text). Not annualised: Qlib's ICIR is unannualised even though the same record annualises its long–short metrics with ann_scaler = 252, and neither Li+ 2024 (MASTER) nor Zhao+ 2023 (DoubleAdapt) annualises. Never multiply by √252 or √238. Always report the origin frequency and |T| next to the value (daily origins, non-overlapping origins every h days, or the 88 pooled event origins, G2): ICIR depends on how often IC is sampled, so values at different frequencies are not comparable. Relation to a t-statistic (our derivation): ICIR·√|T| is the iid t-statistic of the mean IC with ddof = 1; it is valid only if IC_t is serially uncorrelated, so on daily origins with h > 1 report the Newey–West t from newey_west_t (its overlapping-target variance) for significance, never ICIR·√T. Undefined if |T| < 2 or s_IC = 0. Uncertainty (descriptive, G5): a month-cluster bootstrap percentile interval as in block_bootstrap (G3): resample calendar months with replacement, B = 10,000, cluster = calendar month of the origin date (for event origins the month of day 0, also at the day −1 origin), recompute mean and SD in each replicate, and use the same draws for paired models; a paired difference is reported as the gain RankICIR_cand − RankICIR_ref, positive favouring the candidate (G1). Headline: Rank ICIR, matching rank_ic. Orientation: higher is better; report to 2–3 dp."
  inputs: ["Per-date IC_t and RankIC_t series from rank_ic", "Origin-frequency label: daily, non-overlapping every h days, or event origins", "|T|: number of valid dates"]
  guards_against: "A high mean IC that comes from a few dates (for example a handful of announcement days), and confusing a ratio of IC moments with a portfolio information ratio."
  typical_values: "All are China A-share benchmarks with daily origins, not annualised. Qlib (CSI300, label from the close of t+1 to the close of t+2, test 2017-01-01 to 2020-08-01, mean of 20 seeds): LightGBM on Alpha158 ICIR 0.3660 and Rank ICIR 0.3877; DoubleEnsemble 0.4223 and 0.4117. Li+ 2024 (MASTER) (5-day label, test Q3 2020–Q4 2022, 5 runs): CSI300 ICIR 0.42 and RankICIR 0.49 (XGBoost 0.37 and 0.36); CSI800 0.40 and 0.48 (the Transformer baseline has ICIR 0.43). Zhao+ 2023 (DoubleAdapt) (next-day label, test Jan 2017–Jul 2020, GRU backbone, 10 runs): CSI300 ICIR 0.5497 and RankICIR 0.5110 (rolling retraining 0.5105 and 0.4856); CSI500 0.6652 and 0.6445. No US-equity, 5-day-target or event-origin ICIR values were found in the sources read."
  pitfalls: "(1) ICIR is a ratio of IC moments, not a portfolio information ratio; Qlib's own risk_analysis 'information_ratio' is mean/std × √N of portfolio excess returns, a different quantity, so name them separately. (2) Annualising ICIR is wrong and makes it look like a Sharpe ratio. (3) Values from daily origins with overlapping 5-day targets, from non-overlapping origins and from event origins cannot be compared. (4) FinTSB describes its IC as Spearman, so its 'ICIR' may be a rank ICIR; check before comparing. (5) Li+ 2024 (MASTER) defines ICIR only as IC normalised by its standard deviation; the numerator is presumably the mean. (6) Dates with tiny cross-sectional return dispersion give erratic IC_t and depress ICIR. (7) Small cross-sections (crypto, H3) add sampling noise to every IC_t and lower ICIR mechanically (our note). (8) With only 88 event dates the standard deviation is itself noisy; report the bootstrap interval, not just the point value."
