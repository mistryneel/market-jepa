- id: "newey_west_t"
  name: "Newey–West HAC standard errors and t-statistics with a pre-specified lag rule"
  category: "stat_test"
  section: "B"
  status: "canonical"
  status_note: "Kept canonical (original: Newey & West 1987) and kept in section B as in the candidate list, although the same estimator also serves the E-section Diebold–Mariano and Giacomini–White sensitivity analyses. Newey & West 1994 supplies the lag-selection rules."
  priority: "should"
  plain_english: "A t-statistic for the average of a time series, such as daily IC, daily long–short returns or daily loss differences, whose standard error is widened to allow for neighbouring observations being correlated, as happens when 5-day return windows overlap."
  formula: '\hat\sigma_j=\frac{1}{T}\sum_{t=j+1}^{T}(x_t-\bar x)(x_{t-j}-\bar x),\qquad \hat S_{\mathrm{Bart}}=\hat\sigma_0+2\sum_{j=1}^{m}\Big(1-\frac{j}{m+1}\Big)\hat\sigma_j,\quad m=\max\big(h-1,\ \lfloor 4(T/100)^{2/9}\rfloor\big),\qquad \hat S_{\mathrm{trunc}}=\hat\sigma_0+2\sum_{j=1}^{h-1}\hat\sigma_j,\qquad \hat S=\begin{cases}\max\big(\hat S_{\mathrm{trunc}},\hat S_{\mathrm{Bart}}\big)&\text{daily origins with overlapping }h\text{-day targets and }\hat S_{\mathrm{trunc}}>0\\ \hat S_{\mathrm{Bart}}&\text{otherwise}\end{cases},\qquad t_{\mathrm{NW}}=\frac{\bar x}{\sqrt{\hat S/T}};\qquad \text{matrix form (NW 1987, eq. 5, numbered as in NBER TWP 55): }\ \hat S_T=\hat\Omega_0+\sum_{j=1}^{m}w(j,m)\big[\hat\Omega_j+\hat\Omega_j''\big],\ w(j,m)=1-\frac{j}{m+1},\ \hat\Omega_j=\frac{1}{T}\sum_{t=j+1}^{T}\hat h_t\hat h_{t-j}'';\qquad \text{NW 1994 automatic (Bartlett; read in NBER TWP 144): }\ n=\lfloor 4(T/100)^{2/9}\rfloor,\ \hat s^{(1)}=2\sum_{j=1}^{n}j\,\hat\sigma_j,\ \hat s^{(0)}=\hat\sigma_0+2\sum_{j=1}^{n}\hat\sigma_j,\ \hat\gamma=1.1447\big[(\hat s^{(1)}/\hat s^{(0)})^2\big]^{1/3},\ \hat m=\lfloor\hat\gamma\,T^{1/3}\rfloor'
  computable_form: 'Scalar mean: xc = x - x.mean(); sig[j] = (xc[j:] @ xc[:T-j]) / T for j = 0..max(h-1, m). Bartlett (case b): S_bart = sig[0] + 2 * sum_{j=1..m} (1 - j/(m+1)) * sig[j], with m = max(h-1, floor(4*(T/100)**(2/9))). Overlapping h-day targets on daily origins (case a): S_trunc = sig[0] + 2 * sum_{j=1..h-1} sig[j]; S = max(S_trunc, S_bart), or S_bart if S_trunc <= 0 (logged). Other series: S = S_bart. se = sqrt(S / T); t = x.mean() / se. Cross-check S_bart with statsmodels.stats.sandwich_covariance.cov_hac on an intercept-only OLS results object with nlags = m and Bartlett weights (weights_bartlett), with its small-sample correction switched off (use_correction=False) to match the divisor-T formula; cross-check S_trunc against cov_hac with a uniform weights function (weights_uniform) and nlags = h - 1, correction off.'
  conventions: "Series: x_t is a scalar series in time order, e.g. per-date IC_t or RankIC_t (rank_ic), daily long–short returns (long_short_decile), per-date cross-sectional means of loss differences (as in Gu+ 2020's modified DM test) or per-date Fama–MacBeth slopes. Centring: autocovariances of the demeaned series with divisor T and no small-sample correction (NW 1987 and 1994 as written; R sandwich's NeweyWest has adjust = FALSE by default, while statsmodels cov_hac applies a correction by default, so switch it off). Kernel and lag (pre-registered), two cases. (a) Daily-origin series whose known dependence is the overlap of h-day targets (IC_t and RankIC_t, per-origin h-day long–short spreads, per-origin loss differences with h = 5): variance Ŝ = max(Ŝ_trunc, Ŝ_Bart), where Ŝ_trunc = σ̂_0 + 2Σ_{j=1}^{h−1} σ̂_j is the truncated (rectangular) window at lag h − 1, consistent under (h−1)-dependence (DM 1995's k − 1 truncation; NW 1994's TWP notes that a truncated estimator at the known MA order is used when the autocovariances vanish beyond it), and Ŝ_Bart is the Bartlett estimator of case (b); if Ŝ_trunc ≤ 0 use Ŝ_Bart and log it. Bartlett weights alone do not cover the overlap, because 1 − j/(m+1) shrinks the lag-1..4 autocovariances: in our simulation of a pure 5-day overlap (T = 1,130, 20,000 draws) Bartlett with m = 6 gave 91.2% coverage of nominal 95% intervals and 7.6% size for a nominal 5% one-sided test, Bartlett with m = 4 gave 89.4% and 9.0%, and the truncated window 94.9% and 5.1% (also 93.7–94.2% when the daily components carry AR(1) persistence 0.2–0.5, against 89.7–90.4% for Bartlett). (b) All other series, and the Bartlett term in (a): Bartlett, w_j = 1 − j/(m+1), positive semi-definite by construction (NW 1987), with m = max(h−1, ⌊4(T/100)^{2/9}⌋) (h = 1 for series without target overlap, e.g. daily tradable returns); the second term is statsmodels' fixed default, which NW 1994 use only as the preliminary parameter of their automatic method; for the locked window (about 1,130 trading days) it is 6 (our arithmetic). No prewhitening in the primary (R sandwich prewhitens by default; turn it off when cross-checking). Sensitivity: the NW 1994 automatic Bartlett bandwidth (constant 1.1447, preliminary n = ⌊4(T/100)^{2/9}⌋, no prewhitening) and, for loss differences, ceil(T^{1/3}) lags as in Patton & Sheppard 2009. Event-indexed series (one loss or IC per origin, ordered by day-0 date: 88 pooled origins for the 89 events, G2): the windows mostly do not overlap, so the DM-HLN primary uses lag 0 with a t(n−1) reference and this estimator with lag 1 is the check, because 10 of the 19 CPI–FOMC near pairs share trading days (our inference, as in diebold_mariano). Giacomini–White tests of τ-step forecasts use a HAC with τ−1 lags whose weights tend to 1 (GW 2006, read in its 2003 working paper), i.e. the truncated window of case (a), not Bartlett weights 1 − j/τ. Reference distribution: N(0,1) for daily series; t(T−1) when T < 100 (our convention, mirroring the t(n−1) reference of the HLN-corrected DM test in diebold_mariano). Sidedness: two-sided unless a one-sided claim is pre-registered; for a paired contrast x_t is a gain (reference loss minus candidate loss, or candidate score minus reference score), so the one-sided claim that the candidate is better is H_A: E[x] > 0 (G1). Report the mean, the standard error, t, m, T, which variance was used (truncated or Bartlett), Ŝ_trunc and Ŝ_Bart, and the correction flags. Overlap check: also report the iid t on non-overlapping origins every h days (S16). Hurdle: after a search, read t against a stricter bar (Harvey+ 2016 argue for t > 3.0, which S16 adopts)."
  inputs: ["x_t: the scalar series whose mean is tested, in time order", "h: target horizon in trading days (the overlap length) and T: series length", "Kernel, lag rule, prewhitening and small-sample flags (pre-registered)"]
  guards_against: "Overstated significance when observations overlap (5-day targets on daily origins) or are serially correlated, in which case the naive t-statistic is too large."
  typical_values: "Lag rules in the sources: ⌊4(T/100)^{2/9}⌋ (statsmodels' fixed default and NW 1994's preliminary bandwidth) gives 3 at T = 54 months or 90 events, 4 at T = 100 and 6 at T = 1,000 daily observations (arithmetic in our verification notes); Patton & Sheppard 2009 use ceil(T^{1/3}) lags in DMW tests; Diebold & Mariano 1995 truncate a rectangular window at k−1 for k-step forecasts; NW 1994's Bartlett constant is 1.1447. Significance hurdle: Harvey+ 2016 argue a new factor needs t > 3.0, and S16 adopts t > 3. S16's non-overlapping t for 15-minute cross-sectional IC: ridge +0.038 with t 6.7, cross-sectional JEPA +0.027 with t 5.6; only the 15-minute horizon was robustly significant."
  pitfalls: "(1) Software defaults differ: statsmodels cov_hac uses a fixed ⌊4(T/100)^{2/9}⌋ lag with a small-sample correction, while R sandwich's NeweyWest uses the NW 1994 automatic bandwidth with VAR(1) prewhitening and no adjustment; state kernel, lag, prewhitening and correction. (2) ⌊4(T/100)^{2/9}⌋ is NW 1994's preliminary parameter, not their recommended final lag. (3) NW 1987 gives only a growth rate for m (slower than T^{1/4}), not a numeric rule. (4) With overlapping h-day targets, a lag below h−1 understates the variance, and so does the Bartlett kernel at lag h−1 or a little above, because its weights shrink the overlap autocovariances (our simulation: about 91% coverage of nominal 95% intervals at m = 6 and T ≈ 1,130); use the truncated window at h − 1 (DM 1995's k − 1 rule) or the larger of the two variances. (5) Long lags on short series (event series, T = 88 origins) make the variance noisy and the test size-distorted; prefer the bootstrap there (block_bootstrap). (6) DM's rectangular window can give a negative variance (they set it to zero and reject), while the Bartlett kernel cannot; we fall back to Bartlett and log it instead of rejecting. (7) Plain Fama–MacBeth standard errors treat per-period slopes as serially uncorrelated; with overlapping 5-day targets apply NW to the slope series (a verification note, not from the 1973 paper). (8) No HAC choice fixes the non-standard null distribution of nested comparisons or of models estimated once on a fixed window; see nested_model_tests."
