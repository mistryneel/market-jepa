- id: "net_sharpe"
  name: "After-cost (net) Sharpe ratio with a transaction-cost sweep"
  category: "return_metric"
  section: "B"
  status: "widely_used"
  status_note: "Kept from the candidate list. 2023–2026 users: S5 (cost sweep at 0, 20 and 40 bp), S3 (net Sharpe at 5 bp), S1 (Sharpe across execution-quality levels), S10 (explicit cost model), S12 (after-cost GMV Sharpe), Lopez-Lira & Tang 2026 (5, 10 and 20 bp round trip) and He+ 2026 (annualised decile Sharpe with Ledoit–Wolf tests). Sharpe 1994 is cited as the original definition."
  priority: "should"
  plain_english: "The strategy's average daily profit after trading costs, divided by how much that daily profit varies, scaled to a year. It is reported for a range of assumed trading costs so readers can see where any edge disappears."
  formula: 'r^{\mathrm{net}}_d=r^{P}_d-c\,\mathrm{TO}_d-\frac{b}{K}\,G^{\mathrm{short}}_{d-1},\qquad \widehat{SR}=\frac{\overline{r^{\mathrm{net}}}}{s(r^{\mathrm{net}})},\quad s^2=\frac{1}{n-1}\sum_{d=1}^{n}\big(r^{\mathrm{net}}_d-\overline{r^{\mathrm{net}}}\big)^2,\qquad \widehat{SR}_{\mathrm{ann}}=\sqrt{K}\,\widehat{SR},\qquad c^{*}=\frac{\overline{r^{P}}-\overline{(b/K)\,G^{\mathrm{short}}}}{\overline{\mathrm{TO}}},\qquad \hat\sigma_{\widehat{SR}}=\sqrt{\frac{1-\hat\gamma_3\widehat{SR}+\frac{\hat\gamma_4-1}{4}\widehat{SR}^2}{n-1}},\quad \hat\sigma_{\widehat{SR}_{\mathrm{ann}}}\approx\sqrt{K}\,\hat\sigma_{\widehat{SR}}'
  computable_form: 'r_net = r_gross - c * TO - (b / K) * G_short_lag; sr = r_net.mean() / r_net.std(ddof=1); sr_ann = sqrt(K) * sr; loop c over {0, 2.5, 5, 10, 20} bp per side; c_star = (r_gross.mean() - ((b / K) * G_short_lag).mean()) / TO.mean(); se = sqrt((1 - g3 * sr + (g4 - 1) / 4 * sr**2) / (n - 1)) at the daily frequency; robust interval from arch.bootstrap.StationaryBootstrap with the block length from arch.bootstrap.optimal_block_length.'
  conventions: "Return series: the tradable daily book from long_short_decile (one-day execution lag, h cohorts), or a long-only/GMV portfolio for H1 secondary reporting; never paper-timed or mid-price returns (S16's rule). Period: one trading day; n is the number of daily net returns in the locked window, including the build-up and the final liquidation day. Annualisation: K = 252 for US equities (S3; S1 code default; Qlib SigAnaRecord's ann_scaler); K = 365 for crypto in H3 (our convention, on the UTC days of transfer_protocol). Never use Qlib risk_analysis's daily default of 238 (a China A-share calendar). Standard deviation with ddof = 1 (Sharpe 1994, eq. 5). Benchmark: a zero-net-investment long–short book subtracts nothing (S1 code, S3); a long-only or GMV portfolio uses returns minus the daily risk-free rate (Sharpe 1994's differential return). Costs: TO_d is the two-sided, drift-adjusted fraction of NAV traded at the close of d (turnover) and c is the cost per unit traded per side, so a round trip costs 2c. Charge the initial build and the final liquidation (S3). Sweep c ∈ {0, 2.5, 5, 10, 20} bp per side, i.e. 0–40 bp per round trip, which spans S3's 5 bp per side, Lopez-Lira & Tang 2026's 5/10/20 bp round trip and S5's fixed 20 and 40 bp (side unstated); the headline is 5 bp per side, fixed in advance. Report the break-even cost c* in bp per side (our derivation: the c at which the mean net return is zero). Borrow: b = 0 in the main sweep and 50 bp a year on short gross exposure G^short as a sensitivity (S10's borrow rate). Market impact is not modelled (S10's square-root impact coefficient is not given); say so. Statistic: the full-sample Sharpe ratio over the window, not an average of yearly Sharpe ratios (which S5 reports), plus a by-year table. Uncertainty: the Mertens-form standard error above (Bailey & López de Prado 2012; γ̂3 sample skewness, γ̂4 raw kurtosis with normal = 3), computed at the daily frequency and scaled by √K, which assumes serially uncorrelated returns; report the first-order autocorrelation of r^net and, as the robust interval, a stationary-bootstrap percentile interval with the expected block length rule of block_bootstrap (Politis–White with the 2009 correction; G3). Comparing two strategies on the same days (descriptive, G5): report the gain ΔSR = SR_cand − SR_ref, positive favouring the candidate (G1), and test it with Ledoit & Wolf 2008 (HAC with a prewhitened QS kernel, or the studentised circular block bootstrap with a calibrated block size); one-sided (H_A: ΔSR > 0) only when that claim was pre-registered, otherwise two-sided. Any Sharpe ratio reported after a search also needs deflated_sharpe."
  inputs: ["Daily gross returns r^P_d of the tradable book (long_short_decile) or of a GMV/long-only portfolio", "Daily two-sided turnover TO_d and short gross exposure G^short_{d−1} (turnover)", "Cost grid c (bp per side), borrow rate b, annualisation constant K and, for long-only books, the daily risk-free rate"]
  guards_against: "Treating a gross, mid-price or paper-timed backtest as an economic result: in the seeds, costs and backtest choices moved Sharpe ratios far more than the model did (S1, S5)."
  typical_values: "S5 (US, equal-weighted decile long–short, daily, 2001–2023, mean of yearly values): CatBoost Sharpe 6.79 at 0 bp, −3.90 at 20 bp, −14.46 at 40 bp and −3.69 under mixed size-based costs (252-day context); benchmark averages about 6.44, −3.62 and −13.59; every long–short strategy is negative at 20 bp or more. S3 (top-30/bottom-30 batches, 21-day horizon, 5 bp per side, Jan 2024–Jun 2026, mean ± SD of 3 runs): US Stock-JEPA net Sharpe 1.24±0.20 (FactorVAE 1.03±0.66); China 1.50±0.28. S1 (Table 7): the rebalance choice alone moved annualised Sharpe by 2.3 across harnesses at EFQ 0% and by 24.7 at EFQ 100%, and the correlation between a method's IC and its mean Sharpe fell from +0.92 to +0.46. S12 (long-only GMV, top 1,000 US stocks, 2000–2024, with broker commissions, fees and financing): NN 1.058, AO 0.942, DCC 0.930, QIS 0.848. Gu+ 2020 (NN4 monthly decile spread, NBER working paper): Sharpe 1.35. S16 (blog): news long–short non-overlapping Sharpe +0.16 at 4 bp."
  pitfalls: "(1) Annualisation constants differ: 252 (S3, S1 code, Qlib SigAnaRecord), 238 (Qlib risk_analysis daily default), mean × 12 and volatility × √12 on monthly data (Gu+ 2020), and a geometric annual return with 252 in FinTSB; state K. (2) Scaling by √K assumes no serial correlation (Sharpe 1994, eq. 10); Lo 2002 (abstract) reports that serial correlation can overstate annual Sharpe ratios by up to 65% and that monthly ratios generally cannot be annualised by √12. (3) Averaging yearly Sharpe ratios (S5) does not give the full-sample Sharpe. (4) Cost units: S5 does not say per side or round trip; always state both. (5) Backtest-harness choices dominate (S1): pre-register selection, weighting, rebalancing and execution before unlocking the test set. (6) Plugging an annualised Sharpe into (1 + SR²/2)/T_years, the form in S1's code, overstates the standard error for daily data; compute it at the daily frequency and scale by √K (Bailey & López de Prado 2012, eq. 5; our derivation). (7) Selection: the best of many configurations needs deflated_sharpe, and deflation does not catch leakage (S10's planted oracle). (8) Long-only books need the risk-free rate subtracted; zero-net books do not. (9) Borrow fees and market impact are outside the main sweep; for high-turnover strategies the break-even cost c* is the more robust summary. (10) Novy-Marx & Velikov 2016: strategies with more than about 50% one-sided monthly turnover rarely survive costs."
