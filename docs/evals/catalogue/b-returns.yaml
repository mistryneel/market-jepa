- id: "factor_neutral_ic"
  name: "Factor-neutralised rank IC (partial rank correlation after removing sector and style exposures)"
  category: "return_metric"
  section: "B"
  status: "our_design"
  status_note: "Kept 'our design' from the candidate list (the review proposed this instead of 'unclear'). No academic source defining a factor-neutralised IC was found in verification; the practitioner precedents neutralise one side only (Numerai FNC: the forecast; Alphalens group_adjust: returns by group), and Ding & Martin 2017 (abstract only) supplies the factor-model framing."
  priority: "nice"
  plain_english: "The rank IC computed after stripping out what sector membership and well-known stock traits (size, beta, momentum, recent reversal, volatility) already explain, so a model gets no credit for simply favouring, say, high-beta stocks before a market rally."
  formula: 'M_t=I_{N_t}-X_tX_t^{+},\qquad u_t=\mathrm{rk}_t(\hat s_{\cdot,t}),\ \ v_t=\mathrm{rk}_t(y_{\cdot,t}),\qquad \mathrm{FNRankIC}_t=\frac{u_t''M_tv_t}{\sqrt{u_t''M_tu_t}\,\sqrt{v_t''M_tv_t}},\qquad \text{forecast-only variant: }\ \mathrm{corr}\big(M_tu_t,\,v_t\big)=\frac{u_t''M_tv_t}{\sqrt{u_t''M_tu_t}\;\lVert v_t-\bar v_t\mathbf 1\rVert}'
  computable_form: 'Per date: u = rank(pred); v = rank(label) (average ranks); P = X @ np.linalg.pinv(X); ru = u - P @ u; rv = v - P @ v; fn = (ru @ rv) / sqrt((ru @ ru) * (rv @ rv)). Numerai''s FNC applies the same projection to the forecast only: sub -= f.dot(np.linalg.pinv(f).dot(sub)), then takes a rank correlation with the target via np.corrcoef.'
  conventions: "Our design, to be pre-registered. Order: rank first (average ranks), then residualise both ranked vectors on X_t by OLS, then correlate the residuals; with an intercept in X_t this is a partial rank correlation given X_t (our derivation). Because M_t is symmetric and idempotent the numerator u′Mv is the same whether one or both sides are neutralised; neutralising only the forecast changes the denominator and gives a value no larger in absolute size (our derivation). X_t: an intercept plus point-in-time sector dummies (sectors with fewer than 10 names merged) and five styles measured at or before the origin close: log market equity; market beta from the 252 daily returns ending at t against the value-weighted universe return (at least 126 observations); momentum, the return from t−252 to t−21 trading days; short-term reversal, the return from t−5 to t; and 63-day realised volatility. Winsorise each style at its cross-sectional 1st and 99th percentiles, then z-score; set a missing style to 0 and flag it; drop names without a sector. If the project builds a fundamental industry-plus-style risk model (factor_risk_models), use its exposures instead, so that 'neutral' means the same as in the H1 baseline. Weights: equal-weighted OLS is the headline; capitalisation-weighted least squares is a sensitivity. Rank deficiency: use the pseudo-inverse and log rank(X_t); skip a date if N_t − rank(X_t) < 20 or a residual vector is constant. Target, horizon, origin sets, averaging and inference are those of rank_ic; report the mean FN rank IC, the mean RankIC on the same dates and their ratio, plus the Pearson variant on raw values. Industry-only check: Alphalens factor_information_coefficient with group_adjust=True (Spearman IC on group-demeaned returns) and with by_group=True."
  inputs: ["ŝ_{i,t}, y_{i,t} and U_t as in rank_ic", "Point-in-time sector labels at t", "Market equity and trailing daily returns of each stock and of the value-weighted universe up to the close of t (for beta, momentum, reversal and volatility)"]
  guards_against: "Crediting a model for exposure to known factors, especially on FOMC/CPI days, when the common market move makes a raw rank IC largely a bet on beta."
  typical_values: "No comparable values reported in the sources read."
  pitfalls: "(1) There is no standard definition: forecast-only (Numerai FNC), returns-only by group (Alphalens group_adjust) and both-sided (ours) give different numbers; name the variant. (2) Over-neutralising removes genuine skill when X contains signals the model legitimately uses (e.g. reversal); pre-register X and never tune it on test data. (3) Exposures must be point-in-time; sector labels or betas estimated with later data leak information. (4) Rank-then-residualise and residualise-then-rank differ; fix the order (we rank first). (5) An intercept plus a full set of sector dummies is collinear; use the pseudo-inverse. (6) Thin sectors give unstable residuals; merge them. (7) In small cross-sections (crypto) the regressors use up degrees of freedom; apply the N_t − rank(X_t) rule. (8) A large drop from RankIC to the FN rank IC is informative, not a failure; report both."
  used_by:
    - ref: "Numerai FNC docs"
      title: "Feature Neutral Correlation (scoring)"
      authors: "Numerai"
      year: null
      venue: "Numerai documentation"
      url: "https://docs.numer.ai/numerai-tournament/scoring/feature-neutral-correlation"
      peer_reviewed: false
      source_type: "documentation"
      read_depth: "full"
      accessed: "2026-11-12"
      how_used: "Neutralises the forecast to the feature matrix by a least-squares projection with a pseudo-inverse and scores the rank correlation of the result with the target (forecast side only)."
    - ref: "Alphalens docs"
      title: "factor_information_coefficient (group_adjust, by_group)"
      authors: "Quantopian (Alphalens)"
      year: null
      venue: "Alphalens documentation"
      url: "https://quantopian.github.io/alphalens/alphalens.html"
      peer_reviewed: false
      source_type: "documentation"
      read_depth: "full"
      accessed: "2026-11-12"
      how_used: "factor_information_coefficient with group_adjust demeans forward returns within groups before the Spearman IC, and by_group computes the IC within each group (returns side only, no style regression)."
    - ref: "Ding & Martin 2017"
      title: "The fundamental law of active management: Redux"
      authors: "Ding, Z. & Martin, R.D."
      year: 2017
      venue: "Journal of Empirical Finance, 43, 91–114"
      url: "https://ideas.repec.org/a/eee/empfin/v43y2017icp91-114.html"
