    why: "It supplies the HAC variance in the pre-registered sensitivity analyses of the primary NLL comparison (DM-HLN lag check, Giacomini–White on rolling refits) and for every daily-origin series with overlapping 5-day targets (H1 ordinary days, IC series, H4 lead–lag tests), while the primary test itself is the month-cluster bootstrap."
  implementation:
    libraries: ["numpy", "statsmodels", "linearmodels"]
    notes: "1) Implement the scalar estimator directly with a weights argument (truncated or Bartlett) and use it everywhere; store m, T, which variance was used, both variances and the flags with each t. 2) Cross-check on the same series against statsmodels cov_hac (Bartlett: nlags = m, weights_bartlett; truncated: nlags = h − 1, weights_uniform; correction off); agreement to about 1e-10. 3) Lag functions: truncated window at h − 1 for overlapping-target daily series, combined as max(truncated, Bartlett); Bartlett m = max(h−1, floor(4·(T/100)^(2/9))) for every series; the NW 1994 automatic bandwidth is a sensitivity. 4) Fama–MacBeth: compute per-date slopes, then apply the same estimator to the slope series; linearmodels FamaMacBeth with a kernel covariance is a cross-check. 5) Unit tests: m = 0 returns the iid variance with divisor T; the Bartlett variance is never negative; on simulated sums of 5 iid daily terms (a pure 5-day overlap) with T = 1,130 and 10,000 draws, nominal 95% intervals from the case-(a) variance cover between 93.5% and 96.5% (our simulation: 94.7–94.9%), Bartlett alone with m = 6 covers about 91% (91.0–91.2%) and iid about 62% (61.7%); the test fails if case (a) falls outside the band."
