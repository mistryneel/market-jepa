      authors: "Rahimikia, Ni, Wang"
      year: 2025
      venue: "arXiv:2511.18578; SSRN"
      url: "https://arxiv.org/abs/2511.18578"
      peer_reviewed: false
      source_type: "preprint"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Uses the zero-forecast R²_OOS on daily excess returns, pooled within each year and averaged over 2001–2023, as its headline accuracy metric."
    - ref: "Clark & West 2007"
      title: "Approximately normal tests for equal predictive accuracy in nested models"
      authors: "Clark, T.E. & West, K.D."
      year: 2007
      venue: "Journal of Econometrics, 138(1), 291–311"
      url: "https://doi.org/10.1016/j.jeconom.2006.05.023"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "NBER TWP 326 read"
      accessed: "2026-11-12"
      how_used: "MSPE-adjusted statistic for nested squared-error comparisons, tested one-sided with normal critical values, which we apply to test R² > 0 against the benchmark."
    - ref: "S17"
      title: "Causal-axis JEPAs on prediction-market strike ladders: a negative result and the diagnostics that failed to predict it"
      authors: "Physical Reasoning"
      year: 2026
      venue: "GitHub repository, 2026"
      url: "https://github.com/physicalreasoning/causal-jepa"
      peer_reviewed: false
      source_type: "code_repository"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Scores probe R² with the mean of the evaluated test targets in the denominator, the benchmark convention this entry rules out for return forecasts."
  relevance:
    H1: "none"
    H2: "low"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "A calibration-sensitive complement to rank IC for the secondary return task; it is not used for the covariance endpoint."
  implementation:
    libraries: ["numpy", "pandas", "statsmodels"]
    notes: "1) Assemble (date, id, y, model forecast, benchmark forecasts) for the origin set. 2) Compute pooled and by-year R² for each benchmark. 3) Per date compute the gain d_t for model pairs (reference minus candidate squared error) and f_t = mean(2·y·ŷ) for the R² > 0 test; the paired month-cluster bootstrap of mean(d_t) (B = 10,000) gives the interval, and newey_west_t's overlapping-target variance on daily origins gives the DM-type and Clark–West t-statistics. 4) Unit tests: ŷ = 0 gives R²_0 = 0; ŷ = y gives 1; multiplying ŷ by a large factor makes R² negative while IC is unchanged; the historical-mean benchmark uses no data after t and no more than the trailing 2,520 trading days."
  adoption_cost: "low"
  verified: true
  related: ["rank_ic", "newey_west_t", "diebold_mariano", "nested_model_tests", "block_bootstrap", "net_sharpe"]
