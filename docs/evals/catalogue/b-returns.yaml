- id: "turnover"
  name: "Portfolio turnover (two-sided, drift-adjusted)"
  category: "return_metric"
  section: "B"
  status: "widely_used"
  status_note: "Kept from the candidate list. The definition follows Gu+ 2020 (drift-adjusted, both sides), as the review asked (completeness#28); 2023–2026 users are S3, S11 and S12. DeMiguel+ 2009 is cited at metadata level only and its formula was not verified."
  priority: "should"
  plain_english: "The fraction of the portfolio's value that must be traded at each rebalance, after allowing for price moves that have already shifted the old weights. Higher turnover means higher trading costs."
  formula: 'r^{P}_t=\sum_j w^{+}_{j,t-1}r_{j,t},\qquad \tilde w_{i,t}=\frac{w^{+}_{i,t-1}(1+r_{i,t})}{1+r^{P}_t},\qquad \mathrm{TO}_t=\sum_i\big|w^{+}_{i,t}-\tilde w_{i,t}\big|,\qquad \overline{\mathrm{TO}}=\frac{1}{|\mathcal R|}\sum_{t\in\mathcal R}\mathrm{TO}_t;\qquad \text{Gu et al.: }\ \frac{1}{T}\sum_{t=1}^{T}\sum_i\Big|w_{i,t+1}-\frac{w_{i,t}(1+r_{i,t+1})}{\sum_j w_{j,t}(1+r_{j,t+1})}\Big|;\qquad \mathrm{TO}^{\text{one-sided}}_t=\tfrac12\,\mathrm{TO}_t\ \text{(fully invested long-only)}'
  computable_form: 'Between rebalances compound daily: w_drift = w_prev * (1 + r) / (1 + (w_prev * r).sum()); at a rebalance TO = abs(w_new - w_drift).sum() over the union of names (a missing name has weight 0); average over rebalance dates excluding the initial build.'
  conventions: "Weights are fractions of NAV after trading at the rebalance close: long positive, short negative, cash implicit and earning zero. For a fully invested long-only portfolio Σ_j w_j(1 + r_j) = 1 + r^P, so the formula is exactly Gu+ 2020's. For a zero-net long–short book Σ_j w_j = 0, so Gu+ 2020's denominator would collapse to r^P; we divide by NAV growth 1 + r^P instead (our derivation). Two-sided: buys and sells both count (Gu+ 2020; S11's L1 norm); one-sided turnover (Novy-Marx & Velikov 2016) is half of it for a fully invested long-only portfolio, and S3's TO_d = A_d/(2V_{d−1}) is also half of ours. Drift adjustment is mandatory: compare new targets with drifted pre-trade weights, never with the previous targets (S11, S12). Trades are netted by name across cohorts (long_short_decile). Averaging: over rebalance dates, excluding the initial build; the build and the final liquidation are still charged in net_sharpe. Delisting: the position becomes cash at the delisting return and is not counted as traded. Names leaving the universe are sold at the next rebalance and counted. Units and frequency: report per rebalance and annualised (per-rebalance mean × rebalances per year: × 252 for daily, × 252/5 for 5-day rebalancing) and say which. Portfolios: (a) the tradable return book from long_short_decile; (b) for H1, unconstrained and long-only GMV portfolios from each covariance forecast on the full point-in-time universe at each rebalance (no per-stock earnings exclusion; our convention), rebalanced every 5 trading days across the locked window (S12's frequency) with the phase fixed in advance, and turnover summarised separately for rebalance dates that are H1 ordinary-day origins (G4's calendar rule) and for all other rebalance dates."
  inputs: ["Post-trade weight vectors w^+_t at each rebalance (fractions of NAV)", "Daily returns r_{i,t} between rebalances (for drift)", "Rebalance calendar and the delisting and universe-exit events"]
  guards_against: "Signals or covariance forecasts that look good only because they trade far more than the baselines, and turnover figures that ignore price drift or mix one- and two-sided conventions."
  typical_values: "S11 (14 iShares ETFs, long-only GMV, drift-adjusted L1 per rebalance, daily rebalancing, full test): CAB 0.0788, EWMA 0.0794, LW 0.0980, DCC 0.1164, PCA 0.1973, 1/N 0.0057; weekly CAB 0.0484; monthly CCC 0.0148. S12 (per 5-day rebalance): long-only top 1,000 US stocks 2000–2024, NN 57%, DCC 54%, MLE 25%, QIS 23%, AO 18%; long–short with n = 300, NN 112%, QIS 44%, AO 16%. Gu+ 2020: about 110–130% a month for neural-network decile spreads. Novy-Marx & Velikov 2016: strategies above about 50% one-sided monthly turnover rarely survive costs."
  pitfalls: "(1) One- vs two-sided: a factor of 2 separates Novy-Marx & Velikov 2016 and S3 from Gu+ 2020 and S11; state which. (2) Without drift adjustment, turnover is wrong even when the target does not change. (3) Gu+ 2020's denominator assumes a fully invested book; for zero-net long–short books use NAV growth. (4) S3 does not net opposing trades across batches, which raises measured turnover relative to a netted book. (5) Per-rebalance and annualised figures differ by the rebalance frequency (S12 reports per 5-day rebalance, S11 per rebalance, Gu+ 2020 per month). (6) Long-only GMV trades much less than unconstrained GMV (S12, Table 1, n = 300, per 5-day rebalance: AO 10% long-only vs 16% long–short; NN 47% vs 112%; its top-1,000 long-only backtest in typical_values gives NN 57% and AO 18%), so compare like with like and state n. (7) Including the initial build in the average inflates turnover in short windows. (8) Lower turnover does not make a better risk forecast; read it beside realised variance (gmv_realized_variance)."
