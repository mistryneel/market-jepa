# Evaluation catalogue for the market world model paper, section B: Return and cross-sectional forecast evaluation (10 of 125 entries).
# The catalogue is one file per section of the brief, a-risk.yaml to g-benchmarks.yaml in docs/evals/catalogue/,
# because the repository rejects committed files of 1 MB or more. Concatenate the files in name order for the
# full list; ids are unique across files.
# Generated 2026-11-12 from verified research records; every used_by source was opened on 2026-11-12.
# Defaults approved 2026-11-25: entries follow docs/evals/README.md ("Adopted defaults"); questions still open are in docs/evals/PROGRESS.md.
# Schema: the brief's schema plus the extensions documented in docs/evals/README.md ("Schema extensions"):
#   section (A-G), priority (must/should/nice/drop), status_note, computable_form, conventions, related,
#   status values our_design/reference/gap, categories baseline/dataset,
#   used_by[].ref/source_type/read_depth/version_read/accessed, benchmark fields used_by_papers/fit_for_us.
# Sources are listed in docs/evals/references.md (same labels as used_by[].ref).
- id: "rank_ic"
  name: "Cross-sectional information coefficient per date: Pearson IC and Spearman rank IC"
  category: "return_metric"
  section: "B"
  status: "widely_used"
  status_note: "Status and priority kept from the candidate list. Priority stays must because the brief pre-specifies rank IC as the return metric (review completeness#35). Credible 2023–2026 users in our space: S1 (NeurIPS 2026), S3 (2026 preprint), FinTSB (2026), Li+ 2024 (MASTER, AAAI 2024) and Zhao+ 2023 (DoubleAdapt, KDD 2023); the last two were opened for this entry. The computational definition follows Qlib's calc_ic."
  priority: "must"
  plain_english: "On each forecast date, measure how closely the model's ordering of the roughly 500 stocks matches the ordering of their realised returns over the next few days, then average that score over dates. A value of 1 is a perfect ranking and 0 is no skill."
  formula: '\mathrm{IC}_t=\frac{\sum_{i\in U_t}(\hat s_{i,t}-\bar s_t)(y_{i,t}-\bar y_t)}{\sqrt{\sum_{i\in U_t}(\hat s_{i,t}-\bar s_t)^2}\,\sqrt{\sum_{i\in U_t}(y_{i,t}-\bar y_t)^2}},\qquad \mathrm{RankIC}_t=\mathrm{IC}_t\big(\mathrm{rk}_t(\hat s_{\cdot,t}),\,\mathrm{rk}_t(y_{\cdot,t})\big),\qquad y_{i,t}=\prod_{d=1}^{h}(1+r_{i,t+d})-1,\qquad \overline{\mathrm{IC}}=\frac{1}{|\mathcal T|}\sum_{t\in\mathcal T}\mathrm{IC}_t,\qquad \Delta_t=\mathrm{RankIC}^{\mathrm{cand}}_t-\mathrm{RankIC}^{\mathrm{ref}}_t\ \ (\text{gain: }\Delta_t>0\text{ favours the candidate})'
  computable_form: 'Qlib calc_ic (qlib/contrib/eva/alpha.py), per date: ic = df.groupby(''datetime'').apply(lambda g: g[''pred''].corr(g[''label''])); ric = df.groupby(''datetime'').apply(lambda g: g[''pred''].corr(g[''label''], method=''spearman'')). Headline = ric.mean() over valid dates; secondary = ic.mean(). Spearman = Pearson correlation of average ranks (S3''s definition; S1''s code). Paired comparison: Delta_t = ric_cand - ric_ref on the common dates, after restricting both models to the same names on each date; Delta_t is a gain (positive favours the candidate, the model claimed to rank better).'
  conventions: "Symbols: U_t is the point-in-time universe at origin t (pit_universe_survivorship; fixed at the origin and identical for every model, G10) restricted to names with a finite forecast; s̄_t and ȳ_t are means over U_t; rk_t gives ranks within date t with ties averaged (S3). Cross-section: one correlation per origin date over U_t (Qlib groups by date; S1 computes one per decision time). Never pool (i,t) pairs across dates, as S6 does. Target: y_{i,t} is the simple total return from the close of t to the close of t+h, compounding daily returns that include dividends and overnight moves. A name that delists inside the window gets its delisting return on the delisting day and 0 afterwards (proceeds held in cash); a missing non-delisting daily return (trading halt) is set to 0 and flagged in the data log; no name is dropped because of anything that happens after the origin (G11; forward_looking_panel_filter). Horizon (pre-registered): h = 5, i.e. days 1–5 to match the primary endpoint, is the headline; h = 1 is secondary. Event origins: t is the close of announcement day 0 (target days 1–5); the secondary origin is the close of day −1 with target days 0–5 (h = 6). Invariances (our derivation): within a date, subtracting the same risk-free return from every y_{i,t} or applying any increasing affine map to ŝ leaves IC_t unchanged, and any increasing map of ŝ leaves RankIC_t unchanged, so raw and excess returns give the same values. Minimum cross-section: skip a date with fewer than 20 valid pairs (S1 code, min_assets = 20) or with a constant forecast or target (S3); log the number of skipped dates and the median N_t. Averaging: equal weight per valid date (Qlib, S3, Zhao+ 2023 (DoubleAdapt)); S1 averages within each month and then over months, so state the scheme used. Origin sets, pre-registered and reported separately: (a) every trading day of the locked window (2022-01-01 to 2026-06-30) whose whole target window ends by 2026-06-30 (our convention, so the window stays closed); (b) FOMC and CPI event origins: 36 + 53 = 89 events on 88 distinct origins, because the 2024-06-12 CPI and FOMC share one origin, which counts once in pooled analyses and appears in both per-type analyses (36 FOMC, 53 CPI; G2); (c) H1 ordinary-day origins (G4): trading days t of the locked window with no FOMC or CPI day 0 in {t−1, …, t+5}, with every stock whose own earnings announcement falls in [t, t+5] dropped from that origin's cross-section for every model. Orientation: higher is better; report decimals to 4 dp (S3 reports ×100). Report Pearson IC and RankIC; RankIC is the headline. Paired comparisons: a candidate (the model claimed to rank better) against a reference, on each date over the names with finite forecasts from both; Δ_t = RankIC^cand_t − RankIC^ref_t is a gain, so Δ > 0 favours the candidate (G1). Inference (descriptive under G5, except where surprise_leads_vol uses a per-date rank IC as an H4 measure, which then belongs to H4's Benjamini–Hochberg family at 10%): (i) a paired comparison on any origin set uses the paired month-cluster bootstrap of Δ̄ (block_bootstrap; B = 10,000; cluster = calendar month of the origin date, and for event origins the month of day 0, also at the day −1 origin; G3), and the candidate is supported iff the one-sided 95% percentile lower bound of Δ̄ (the 5th percentile of the B bootstrap means) is above 0 (G1); (ii) on daily origins with h > 1 the IC_t and Δ_t series overlap, so the t-statistic of a mean (one model's mean RankIC, or Δ̄ as a check on (i), with H_A: mean > 0 for a one-sided claim) uses newey_west_t's overlapping-target variance (the larger of the truncated window at lag h − 1 and the Bartlett estimator with m = max(h−1, ⌊4(T/100)^{2/9}⌋)); also report, as a check, the iid t on non-overlapping origins every h days (S16's approach). Report training-seed spread separately from date-to-date uncertainty (seed_vs_period). Crypto (H3): same definition over the point-in-time crypto universe of transfer_protocol on UTC days (our convention)."
  inputs: ["ŝ_{i,t}: model score or return forecast for stock i at origin t (any increasing transform is allowed for RankIC)", "r_{i,t+d}: daily total returns (dividends, overnight moves, delisting returns) for d = 1..h", "U_t: point-in-time universe membership at t, including names that later delist", "Origin set: all test-window trading days, FOMC/CPI day-0 (or day −1) origins, or H1 ordinary days", "h (default 5) and the minimum number of names per date (default 20)"]
  guards_against: "Judging a return model by a backtest whose construction choices move results more than the model does (S1), and pooled correlations across dates that reward predicting market-wide moves rather than ranking stocks within a date (S6)."
  typical_values: "S1 (Market-1T benchmark universe of about 700 US names; 15-minute VWAP return; ridge probe; mean over 32 evaluation months): rank IC 0.0311 supervised multihead, 0.0272 supervised return head, 0.0232 TimesFM 3.0 (frozen), 0.0204 best LeJEPA arm (time warping), 0.0170 untrained random ViT. S3 (21-day log return, test Jan 2024–Jun 2026, ×100, mean ± SD of 3 runs): US_ALL Stock-JEPA IC 11.67±0.79 and RankIC 12.96±0.48, FactorVAE IC 12.85±0.59 and RankIC 11.18±2.28; CN_ALL Stock-JEPA RankIC 11.22±0.24. Qlib (CSI300, label from the close of t+1 to the close of t+2, test 2017-01-01 to 2020-08-01, mean of 20 seeds): LightGBM on Alpha158 IC 0.0448 and Rank IC 0.0469; DoubleEnsemble 0.0521 and 0.0502. Li+ 2024 (MASTER) (5-day label, test Q3 2020–Q4 2022, 5 runs): CSI300 IC 0.064 and RankIC 0.076 (XGBoost 0.051 and 0.050); CSI800 0.052 and 0.066. Zhao+ 2023 (DoubleAdapt) (next-day label, test Jan 2017–Jul 2020, GRU backbone, 10 runs): CSI300 IC 0.0687 and RankIC 0.0621 (rolling retraining 0.0629 and 0.0581). S16 (blog; 449-name US panel, 15-minute horizon, per-timestamp Spearman, non-overlapping t): ridge +0.038 (t 6.7), cross-sectional JEPA +0.027 (t 5.6). Not comparable: S6's pooled return IC/RankIC (Kronos-large 0.0702/0.0675, averaged over asset groups)."
  pitfalls: "(1) Pooling: S6 computes IC/RankIC over all samples of an asset class (and, for price series, along the forecast path), so its numbers are not cross-sectional ICs. (2) Naming: Alphalens calls a per-period Spearman correlation 'IC' and FinTSB's page describes its IC as Spearman, while Qlib, Li+ 2024 (MASTER) and Zhao+ 2023 (DoubleAdapt) use Pearson for IC and Spearman for Rank IC; always label which. (3) Label alignment: Qlib's default label runs from the close of t+1 to the close of t+2, a one-day execution lag that our y_{i,t} does not have; state the window when comparing numbers. (4) Overlap: daily origins with h = 5 make IC_t autocorrelated, so mean/SD × √T overstates significance. (5) Survivorship: dropping names that delist inside the window raises IC; keep them with their delisting return. (6) Event days: on FOMC/CPI origins the common market reaction dominates the 5-day cross-section, so RankIC partly rewards ranking market beta; report factor_neutral_ic beside it (our note). (7) IC is not economic value: in S1's harness the mean within-harness correlation between IC and Sharpe was +0.52 at zero execution cost and +0.29 when the full quoted spread is paid. (8) Pearson IC is sensitive to a few extreme returns (delistings, event-day jumps); keep RankIC as the headline. (9) Small cross-sections (crypto in H3, filtered event subsets) make IC_t noisy; enforce the minimum-names rule. (10) Magnitudes depend on horizon and universe (about 0.03 for S1's 15-minute returns vs about 0.13 for S3's 21-day RankIC), so compare only like with like."
