- id: "max_drawdown"
  name: "Maximum drawdown of a strategy's cumulative value"
  category: "return_metric"
  section: "B"
  status: "widely_used"
  status_note: "Kept from the candidate list. 2023–2026 users: S3 (with a formula), S5, S12, S8 and FinTSB; Gu+ 2020 gives the log-return form. Magdon-Ismail+ 2004 was read at abstract level, with its formulas taken from co-author Pratap's 2004 thesis."
  priority: "nice"
  plain_english: "The largest fall in the strategy's account value from a previous high to a later low during the test period, in percent."
  formula: 'V_0=1,\ \ V_d=\prod_{u=1}^{d}\big(1+r^{\mathrm{net}}_u\big),\qquad \mathrm{MDD}=\max_{0\le d\le D}\Big(1-\frac{V_d}{\max_{0\le u\le d}V_u}\Big);\qquad \mathrm{MDD}^{\log}=\max_{0\le t_1\le t_2\le D}\big(Y_{t_1}-Y_{t_2}\big),\ \ Y_t=\log V_t,\qquad \mathrm{MDD}=1-e^{-\mathrm{MDD}^{\log}};\qquad E\big[\mathrm{MDD}^{\log}\mid\mu=0\big]=\sigma\sqrt{\pi T/2}\approx1.2533\,\sigma\sqrt{T}'
  computable_form: 'V = [1.0] followed by (1 + r_net).cumprod(); dd = 1 - V / V.cummax(); MDD = dd.max(). Qlib risk_analysis equivalents: ''product'' mode (cumulative_curve / cumulative_curve.cummax() - 1).min() and ''sum'' mode (r.cumsum() - r.cumsum().cummax()).min(); neither prepends the starting value.'
  conventions: "Series: daily net returns of the tradable book (long_short_decile, net_sharpe), one MDD per cost level; the headline is the pre-registered central cost (5 bp per side). Value path: compounded NAV with V_0 = 1 prepended, so a loss on the first day counts (S3 includes d = 0). Sign: reported as a positive fraction, lower is better; S3 reports the same quantity as a negative number and Gu+ 2020 a positive log drawdown. Report MDD (percent of peak) and MDD^log (Gu+ 2020), which are linked by MDD = 1 − exp(−MDD^log) (our derivation). Window: the whole locked test window including the build-up (S3), plus MDD by calendar year (S12) and the worst single day (S5's 'Max DD (1-day)'). Scale reference (descriptive; our use of Magdon-Ismail+ 2004): MDD^log/(σ̂_d·√D), where σ̂_d is the daily standard deviation of log NAV changes and D the number of days, compared with √(π/2) ≈ 1.2533 for a driftless Brownian motion; positive drift lowers the expectation and negative drift raises it. Never use Qlib's 'sum' mode (additive cumulative returns) as the headline. Daily closing values only, so intraday drawdowns are not seen. No significance test is attached (single path)."
  inputs: ["Daily net returns r^net_d of the strategy at the chosen cost level", "Calendar for the by-year breakdown", "Daily standard deviation of log NAV changes and D for the scale reference"]
  guards_against: "Hiding a strategy's worst losing stretch behind a good average, and comparing drawdowns computed under different conventions."
  typical_values: "S3 (daily NAV, 5 bp per side, Jan 2024–Jun 2026, mean ± SD of 3 runs, reported negative): US Stock-JEPA −40.12±13.12%, FactorVAE −66.13±16.26%; China Stock-JEPA −31.09±2.30%. S5 (US equal-weighted decile long–short, no costs, mean of yearly values): CatBoost 13.62% (252-day context); 14.34% with worst single day 4.93% (512-day context). Qlib (CSI300 TopK-dropout backtest, excess return over the index; cost treatment of the quoted row not recorded): LightGBM on Alpha158 −0.1038, DoubleEnsemble −0.0920. S8 (single-asset LLM trading agent FactFin, Jul 2024–Jun 2025): 11.57% (AAPL) to 31.54% (TSLA). Reference: for a driftless Brownian motion E[MDD] ≈ 1.2533·σ·√T (Magdon-Ismail+ 2004, via Pratap's thesis)."
  pitfalls: "(1) Conventions differ: log drawdown (Gu+ 2020), percent of the NAV peak (S3; Qlib 'product'), additive cumulative returns (Qlib 'sum', its default mode), averages of yearly values (S5) and unstated formulas (S5, S8, S12). (2) Qlib's cummax starts at the first day, so a first-day loss from the initial capital is missed; prepend V_0 = 1 (our reading of the code). (3) MDD grows with horizon and volatility (like √T at zero drift), so compare only over the same window and at similar volatility; leverage scales it. (4) It is a single-path statistic with no standard error, and one episode can set it. (5) Gross and net drawdowns differ; state the cost level. (6) Overlapping cohorts smooth the NAV path compared with a book rebalanced once every h days."
  used_by:
    - ref: "Magdon-Ismail+ 2004"
      title: "On the maximum drawdown of a Brownian motion"
      authors: "Magdon-Ismail, M., Atiya, A. F., Pratap, A. & Abu-Mostafa, Y. S."
      year: 2004
      venue: "Journal of Applied Probability, 41(1), 147-161"
      url: "https://doi.org/10.1239/jap/1077134674"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "abstract_only"
      accessed: "2026-11-12"
      how_used: "Abstract read: derives the distribution and expectation of the maximum drawdown of a Brownian motion with drift, σ√(πT/2) at zero drift (formulas from co-author Pratap's 2004 thesis), which we use to normalise MDD by volatility and horizon."
