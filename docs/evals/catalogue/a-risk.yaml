- id: "qlike_univariate"
  name: "QLIKE on per-stock and fixed-portfolio variances"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Original not established; earliest defining source in our registry cited (G14). Patton 2011 (read as the 2006 UTS working paper) defines QLIKE in the form used here (eq. 6) and proves its robustness, but it presents MSE and QLIKE as already widely used volatility losses, and no earlier source of the Gaussian quasi-likelihood loss was opened. Fewer than two 2023–2026 users are cited, so the entry stays canonical under the G14 exception. Priority and section unchanged."
  priority: "should"
  plain_english: "For each stock, and for a few fixed portfolios, compares the predicted variance with the realized variance over the next five days using a likelihood-based score; lower is better. Summed over stocks it is exactly the volatility part of the primary matrix loss, so it shows whether a model's gains come from volatility levels or from co-movement."
  formula: '\mathrm{QLIKE}(s,h)=\log h+\frac{s}{h}\quad(\text{Patton 2011 eq. 6, 2006 working-paper numbering; } s=\text{realized variance proxy},\ h=\text{forecast});\qquad \text{normalised form } (b=-2):\ \frac{s}{h}-\log\frac{s}{h}-1'
  computable_form: 'h_{i,e}=[\hat\Sigma_{m,e}]_{ii},\ s_{i,e}=[\Sigma^*_e]_{ii}=\frac15\sum_{d=1}^{5}r_{i,e,d}^2,\ \ Q_{m,e}=\frac1{n_e}\sum_{i\in U_e}\Big(\log h_{i,e}+\frac{s_{i,e}}{h_{i,e}}\Big);\quad \text{portfolio } p:\ h_{p}=w_p^{\top}\hat\Sigma_{m,e}w_p,\ s_{p}=\frac15\sum_{d=1}^{5}(w_p^{\top}r_{e,d})^2,\ Q_{p,m,e}=\log h_p+\frac{s_p}{h_p};\quad \text{decomposition: } n_eL_{m,e}=n_eQ_{m,e}+\Big[\log\det\hat R+\mathrm{tr}\big(\hat R^{-1}E^*\big)-\mathrm{tr}\,E^*\Big],\ \hat D=\mathrm{diag}(\hat\Sigma)^{1/2},\ \hat R=\hat D^{-1}\hat\Sigma\hat D^{-1},\ E^*=\hat D^{-1}\Sigma^*\hat D^{-1}'
  conventions: "Notation: s = realized (proxy) variance, h = forecast variance. Score the un-normalised form log h + s/h; the normalised form adds −log s and is +∞ when a stock's realized 5-day second moment is zero ([Patton & Sheppard 2009] fn. 12: normalisation can be ill-defined when the proxy can be zero, and proxy-only terms can be dropped without affecting robustness). Per stock: s_i = [Σ*]_ii from the same target as stein_loss (uncentred, divisor 5, simple total returns with overnight gaps and delisting returns); h_i = [Σ̂]_ii of the same PD-repaired forecast scored by stein_loss, on the same per-day scale. Origin score: equal-weighted mean over the n_e stocks of the origin's asset set (S_t at H1 origins, G4). Pairing and inference: Δ = Q_ref − Q_cand per origin (G1; positive favours the candidate), pooled over the 88 origins (G2) with the paired month-cluster bootstrap and its one-sided 95% percentile lower bound (G3); descriptive, not part of any confirmatory family (G5). Portfolios: the fixed-weight members of the shared set 𝒫 of risk_calibration_ratio (EW, VW, RLS_1..RLS_10), formed at the origin from origin-time information and also used by bias_statistic and mincer_zarnowitz; never weights computed from one model's Σ̂ (optimised portfolios belong to gmv_realized_variance). Units: a change of units adds the same constant to every model, so paired differences are unit-free, and each stock's term is invariant to that stock's scale. Parameterisation: QLIKE is b = −2 in [Patton 2011] and [Patton & Sheppard 2009] but b = 0 in [Gneiting 2011]. Decomposition (our derivation from [Engle 2002] eqs. 27–29, checked numerically): n·L_stein = Σ_i QLIKE_i + [log det R̂ + tr(R̂⁻¹E*) − tr E*]; report the volatility part and the remainder (co-movement error given the model's own volatilities) separately for every model and origin."
  inputs: ["Σ̂_{m,e} after the shared PD repair (its diagonal, and w_p′Σ̂w_p for each fixed portfolio)", "R_e or Σ*_e from realized_covariance_target (diagonal and portfolio realized second moments)", "Pre-registered fixed-weight portfolio set with weights formed at the origin"]
  guards_against: "Attributing a matrix-loss gain to better co-movement when it comes from better volatility levels, or the reverse; non-robust univariate checks such as MAE or losses on volatilities; dominance by high-volatility stocks (QLIKE differences are scale-free per stock)."
  typical_values: "No comparable 5-day per-stock QLIKE levels reported in the sources read. Patton & Sheppard 2009 (2007 WP simulations): QLIKE had the highest DMW power of the robust family in three of four panels. Patton 2011 (IBM application, read in the 2006 WP): QLIKE was the only loss that found a significant difference between the forecasts compared."
  pitfalls: "(1) Per-stock QLIKE ignores co-movement, and a few fixed portfolios cannot identify a covariance matrix: [Patton & Sheppard 2009] suggest testing at least K(K+1)/2 portfolios, which is 125,250 at n = 500, so portfolio QLIKE is only a partial check. (2) Asymmetric: against the true variance the normalised loss is 0.307 at h = 0.5σ², 0.072 at h = 1.5σ² and 0.193 at h = 2σ² (our arithmetic; the first two match [Laurent+ 2013] App. B per asset), so understatement costs about four times more than an overstatement of the same additive size (±50% of the variance) but about 1.6 times more than an overstatement by the same factor (0.5× vs 2×). (3) Zero realized variance (a halted or untraded stock over days 1–5) makes the normalised form infinite; the un-normalised form reduces to log h, bounded below only because the PD repair floors the forecast. (4) The proxy must match the forecast's horizon and scale: no one-day proxy for a 5-day forecast, no volatilities in place of variances. (5) The remainder in the decomposition is not a clean correlation loss: it depends on the forecast's volatilities through E*. (6) Use simple returns for portfolios; log returns do not aggregate across stocks. (7) Do not substitute an R² from regressing log realized on log forecast variance; it is not robust ([Hansen & Lunde 2006], as summarised by [Patton 2011])."
  used_by:
    - ref: "Patton 2011"
      title: "Volatility forecast comparison using imperfect volatility proxies"
      authors: "Patton, A.J."
      year: 2011
      venue: "Journal of Econometrics, 160(1), 246-256"
      url: "https://doi.org/10.1016/j.jeconom.2010.03.034"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "2006 UTS working paper read"
      accessed: "2026-11-12"
      how_used: "Defining source used here, not the first use (the paper presents MSE and QLIKE as already widely used volatility losses and cites earlier evaluations with such losses, e.g. Pagan & Schwert 1990 and Hansen & Lunde 2005): QLIKE L = log h + σ̂²/h (eq. 6), proven the only robust loss depending only on σ̂²/h (Prop. 3), with DMW tests needing only E[h^{2/e+δ}] and E[σ̂^{4+δ}] (Prop. 5); numbering from the 2006 working paper."
