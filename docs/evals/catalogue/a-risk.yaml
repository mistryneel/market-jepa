    notes: "1) For each (model, seed, origin) use only the forecast after the shared repair of stein_loss (symmetrise, eigenvalue floor; G12) for weights and scoring; record a failure (G13) only if the forecast has a non-finite entry or the float64 Cholesky of the repaired matrix fails; never test raw symmetry. For H1, index the repaired full matrix by S_t. 2) GMV_u: solve Σ̂x = 1 with the Cholesky factor (never form Σ̂⁻¹), w = x/1′x; assert |1′w − 1| < 1e-10 and w′Σ̂w ≈ 1/1′x (relative 1e-8). 3) GMV_lo: convex QP min w′Σ̂w s.t. 1′w = 1, w ≥ 0; check KKT ((Σ̂w)_i equals a common λ on the support and is ≥ λ off it, relative tolerance 1e-6). 4) p_d = w′r_{t+d}, d = 1..h, with delisting returns and zeros after delisting; count zero-filled entries. 5) V = mean(p_d²); V̂ = w′Σ̂w (also stored for risk_calibration_ratio). 6) Δ_GMV,t = log V_t(ref) − log V_t(cand) for each named contrast (G1); if any model's V_t < 1e-14, drop that origin for all models and log it (a data check, not a G13 failure). 7) Aggregate by event type, origin type and year; paired month-cluster bootstrap (block_bootstrap, G3) with the one-sided 95% percentile lower bound. 8) Store gross leverage, effective N and the floored-eigenvalue share. Unit tests: V equals the mean squared daily portfolio return and L_V(Σ̂, Σ*, 1); w(cΣ̂) = w(Σ̂); with Σ̂ = Σ and Gaussian returns, mean V ≈ 1/(1′Σ⁻¹1); a PD forecast with relative asymmetry 1e-7 is scored, not failed; swapping reference and candidate negates Δ_GMV."
