    notes: "Keep an allow-list of ranking losses in the evaluation config and refuse to rank models with a loss that is not on it; non-admissible metrics go only into descriptive tables. Implement the Monte-Carlo admissibility test as a unit test: n ≈ 50, a 3-factor Σ_t, forecasts {Σ_t, 0.7Σ_t, 1.25Σ_t, a correlation-shrunk Σ_t}, at least 20,000 proxies of 5 Gaussian days; for every pair (j, k) assert |mean_b[L(Σ*_b, H_j) − L(Σ*_b, H_k)] − (L(Σ_t, H_j) − L(Σ_t, H_k))| ≤ 4 Monte-Carlo standard errors for each admissible loss (exact in expectation for any loss affine in Σ* apart from proxy-only terms), and record the size of this bias and any ranking flip for the descriptive metrics. Do not assert rank equality and do not use the pair cΣ_t, (2 − c)Σ_t (e.g. 0.8Σ_t and 1.2Σ_t): squared Frobenius, vech-Euclidean and MSE losses tie them exactly under the truth, so their Monte-Carlo order is a coin flip (25 of 40 seeds in our check). In our scalar check (5-day Gaussian proxy) Bures–Wasserstein ranked a 0.9σ² forecast ahead of the true σ² (expected loss 0.0947 vs 0.0970) while MSE kept the truth first (0.4005 vs 0.4106); checked in a scratch script outside the repository."
