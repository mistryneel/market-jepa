- id: "implied_vol_baseline"
  name: "Implied-volatility-scaled covariance (VIX9D or VIX for equities; DVOL for crypto)"
  category: "baseline"
  section: "A"
  status: "our_design"
  status_note: "Our design, as in the candidate list after review findings audit_A#13 and completeness#7: no peer-reviewed precedent for an implied-vol-scaled covariance was found; S16 (a self-published blog) and Christensen & Prabhala 1998 (abstract only) are motivation. The construction is ours and the VIX9D methodology document was not opened; verified = true here records only that every cited source was opened."
  priority: "should"
  plain_english: "Takes a strong event-blind covariance forecast and rescales its overall level so that the predicted risk of the market portfolio matches what option prices imply. Option markets price scheduled announcements in advance, so this is the natural rival for event inputs."
  formula: 'v^{IV}_t=\Big(\frac{IV_t}{100}\Big)^2\frac{C/365}{N^{td}_t};\quad \kappa_t=\frac{v^{IV}_t}{w_m''\hat\Sigma^{base}_tw_m};\quad \hat\Sigma^{IV}_t=\kappa_t\hat\Sigma^{base}_t;\quad \text{calibrated: }\kappa^{cal}_t=\frac{a+b\,v^{IV}_t}{w_m''\hat\Sigma^{base}_tw_m},\ (a,b)=\arg\min_{a\ge0,\,b>0}\frac{1}{|\mathcal T_j|}\sum_{t\in\mathcal T_j}\Big[\log(a+b\,v^{IV}_t)+\frac{A_t}{a+b\,v^{IV}_t}\Big],\ A_t=w_m''\Sigma^*_tw_m;\quad \text{crypto: }v^{IV}_t=\Big(\frac{\mathrm{DVOL}_t}{100}\Big)^2\frac1{365}\ \text{per calendar day}'
  conventions: "Our design. IV = VIX9D (C = 9 calendar days) primary for the 5-day target; VIX (C = 30) as sensitivity; N^td = number of exchange trading days in the C calendar days after the origin, so the implied variance (which includes weekends) is spread over close-to-close trading-day returns (our convention). w_m = value weights of the origin's asset set at the origin close (an S&P 500 proxy). Σ̂^base = the same event-blind base as event_scaled_baseline: the member of the H1 strong set S with the lowest mean per-asset NLL on the pre-2022 validation close-of-day-0 event origins, chosen once (G4, G8), with its own walk-forward refits (G6). Scaling changes the level only; correlations are unchanged, and the shared repair commutes with positive scaling (our derivation), so the repaired base needs no second repair. Timing (pre-registered): IV_t = the Cboe daily close of the origin day, which may be the 16:15 ET value (VIX is disseminated until 16:15 ET), 15 minutes after the 16:00 equity close; that look-ahead can only favour this baseline, so it is conservative for our claims (our convention); sensitivity: the previous trading day's close, strictly known at the origin. With the close-of-day-0 origin the IV already reflects the announcement; with the close-of-day −1 origin it is ex-ante event pricing (event_input_availability). Variants, both reported: raw (κ_t) and calibrated (κ^cal_t), since implied variance usually exceeds realized. Calibration (our design): (a, b) with a ≥ 0 and b > 0 minimise the market-portfolio QLIKE in the formula (a proxy-robust criterion; qlike_univariate) over the set T_j of FOMC and CPI event origins of the same origin timing whose origin lies in the m = 2,520 trading days before the refit date s_j and whose whole target window ends on or before trading day s_j − 5; (a, b) are re-estimated at every refit of the G6 calendar (G6, G7). VIX9D history starts 2011-01-04, so the early validation refits use fewer origins (log the count); sensitivity: (a, b) frozen at the first locked-window refit (2022-01-03). Comparisons with this baseline are descriptive (G5). Crypto (H3): DVOL is 30-day, annualised on 365 days; Deribit says divide by √365 for a daily move; daily candles only from 2021-03-24. A non-finite forecast or failed Cholesky is a failure (G13)."
  inputs: ["VIX9D/VIX daily series (Cboe) or DVOL (Deribit API)", "event-blind base forecast (shared with event_scaled_baseline)", "universe value weights at the origin", "trading calendar", "realized market-portfolio variance A_t at earlier event origins (calibration)"]
  guards_against: "Crediting event inputs for information that option prices already carried before the announcement."
  typical_values: "S16 (BTC/ETH, Mar 2021–Jun 2026, forward 30-day realized vol): DVOL IC +0.671 vs trailing RV +0.549; joint regression β_DVOL +0.54, β_trail +0.15; implied minus realized averaged +7.7 vol points and implied exceeded realized 70% of the time. Christensen & Prabhala 1998 (abstract): S&P 100 implied volatility forecast future volatility better than past volatility at roughly monthly horizons. Cboe: VIX9D daily history runs from 2011-01-04; DVOL daily candles from 2021-03-24."
  pitfalls: "(1) Implied variance carries a risk premium, so the raw version overstates risk; the calibrated variant is reported beside it. (2) VIX is an index-level, 30-day quantity; our target is a 500-stock 5-day matrix. (3) Cboe changed VIX strike selection effective 10 Feb 2025 and added a series-level filtering section on 25 Aug 2025, inside the test window. (4) Cboe's terms bar redistribution without consent; Deribit's data terms are unverified; ship download scripts, not data. (5) The VIX9D methodology was not opened. (6) The Cboe daily close may be struck after the 16:00 equity close (timing rule in conventions)."
  used_by:
    - ref: "S16"
      title: "Does JEPA Find Alpha? Self-Supervised Joint-Embedding Predictive Architectures on Financial Markets"
      authors: "Vine"
      year: 2026
      venue: "Self-published blog, June 2026"
      url: "https://bryanvine.github.io/jepa-trader/"
      peer_reviewed: false
      source_type: "blog"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Compares DVOL with trailing realized volatility as forecasts of forward 30-day crypto realized volatility."
