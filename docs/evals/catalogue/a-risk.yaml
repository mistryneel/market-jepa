    - ref: "Gneiting 2011"
      title: "Making and Evaluating Point Forecasts"
      authors: "Gneiting, T."
      year: 2011
      venue: "Journal of the American Statistical Association, 106(494), 746–762"
      url: "https://doi.org/10.1198/jasa.2011.r10138"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Places QLIKE in Patton's homogeneous Bregman family of scoring functions consistent for the mean of the proxy (eq. 20, indexed there as b = 0)."
  relevance:
    H1: "medium"
    H2: "medium"
    H3: "medium"
    H4: "low"
    primary_endpoint: false
    why: "It splits the primary loss into volatility and co-movement parts for H1 and H2 and works per coin for H3, but it is not an endpoint itself."
  implementation:
    libraries: ["numpy", "pandas"]
    notes: "Reuse the repaired Σ̂ and R_e from the primary pipeline: h = diag(Σ̂); s = row means of R_e∘R_e over the 5 days; Q = mean(log h + s/h). Compute the remainder as n·L − n·Q and verify it against the direct formula on sample events (agreement to about 1e-10 relative; checked in a scratch script outside the repository). For each pre-registered portfolio p compute h_p = w_p′Σ̂w_p and s_p = mean_d (w_p′r_d)². Store per (model, event, part); same pairing and inference as stein_loss. Unit test: E[QLIKE] is minimised at h = σ² under simulated 5-day proxies."
  adoption_cost: "low"
  verified: true
  related: ["stein_loss", "robust_loss_class", "mse_variance", "risk_calibration_ratio", "bias_statistic", "mincer_zarnowitz", "gmv_realized_variance", "garch_univariate"]
- id: "mse_variance"
  name: "MSE on variance forecasts (per stock and fixed portfolios)"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Original not established; earliest defining source in our registry cited (G14). Patton 2011 (2006 UTS working paper read) gives MSE on variances as eq. 5 and proves it robust (it is the b = 0 member of the robust family up to a factor ½), but MSE on variances was already a standard volatility loss and no earlier source was opened. No 2023–2026 users are cited, so the entry stays canonical under the G14 exception. Priority and section unchanged."
  priority: "nice"
  plain_english: "The squared difference between predicted and realized variance for each stock, averaged; lower is better. It ranks forecasts correctly despite noisy realized variances, but a handful of very volatile stocks or weeks can decide it, so it is reported, not headlined."
  formula: '\mathrm{MSE}(s,h)=(s-h)^2\quad(\text{Patton 2011 eq. 5, 2006 working-paper numbering; } s=\text{realized variance},\ h=\text{forecast; the } b=0 \text{ robust member is } \tfrac12(s-h)^2)'
  computable_form: 'M_{m,e}=\frac1{n_e}\sum_{i\in U_e}\Big([\Sigma^*_e]_{ii}-[\hat\Sigma_{m,e}]_{ii}\Big)^2\times10^{8},\qquad M_{p,m,e}=\Big(w_p^{\top}\Sigma^*_ew_p-w_p^{\top}\hat\Sigma_{m,e}w_p\Big)^2\times10^{8}\quad(\text{decimal returns; }10^{8}\text{ converts to }(\%^2)^2\text{ units})'
  conventions: "Notation: s = realized variance proxy, h = forecast, both per-day averages over days 1–5 from the same Σ* and PD-repaired Σ̂ as stein_loss. Compute on variances, never volatilities: (√s − √h)² fails the Hansen–Lunde condition (its second derivative in s depends on h; our derivation) and its expected minimiser under a 5-day Gaussian proxy is about 0.905σ² rather than σ² (our check). Equal weights over stocks within an origin (S_t at H1 origins, G4) and over the 88 pooled origins (G2); paired differences Δ = M_ref − M_cand per origin (G1; positive favours the candidate); paired month-cluster bootstrap with the one-sided 95% percentile lower bound (G3); descriptive, not part of any confirmatory family (G5). No per-origin division by s or h (that turns it into a proportional error outside the robust class). If an RMSE is displayed, take the square root of the pooled mean; never average per-origin RMSEs. Use the same fixed-weight portfolio set as qlike_univariate (the fixed members of risk_calibration_ratio's 𝒫)."
  inputs: ["Diagonal of Σ̂_{m,e} after the shared PD repair, and w_p′Σ̂w_p for fixed portfolios", "Diagonal of Σ*_e and portfolio realized second moments from realized_covariance_target", "Pre-registered fixed-weight portfolio set"]
  guards_against: "A secondary variance check that is symmetric in over- and under-prediction (unlike QLIKE) while staying proxy-robust; non-robust alternatives such as MAE or errors on volatilities."
  typical_values: "No comparable values reported in the sources read."
  pitfalls: "(1) Dominated by the most volatile stocks and events: terms and their proxy noise grow roughly with σ⁴ (our inference, consistent with [Barndorff-Nielsen & Shephard 2004]'s finding that realized-measure errors scale with volatility); expect 2022 events to dominate a pooled mean. (2) Strong moment conditions: DMW validity needs finite E[h⁴] and E[σ̂⁸] ([Patton 2011] Prop. 5); [Patton & Sheppard 2009] expected fat-tailed returns to make the b ≥ 0 losses perform even worse, and [Patton 2011] notes the concern that a few extreme observations drive squared-error comparisons. (3) Never on volatilities and never averaged as per-event RMSE (see conventions). (4) Symmetric: it does not reflect that understating post-event risk is costlier; read it next to QLIKE. (5) MAE and R² on realized variance, as in [S6]'s volatility evaluation, are not robust substitutes (candidate list, dropped items)."
