- id: "es_backtests"
  name: "Expected-shortfall backtests (Acerbi–Székely Z1/Z2, Du–Escanciano, McNeil–Frey)"
  category: "stat_test"
  section: "A"
  status: "canonical"
  status_note: "Canonical: each test's original paper is cited and was read (Acerbi–Székely full MSCI version; Du–Escanciano and McNeil–Frey working papers). Kept nice-to-have and secondary because a rejection mixes covariance error with the Gaussian tail assumption. Status, priority and section unchanged."
  priority: "nice"
  plain_english: "Checks not just how often losses exceed the VaR threshold but how large those losses are compared with the predicted average tail loss (expected shortfall)."
  formula: '\sigma_{p,t}=\sqrt{w''\hat\Sigma_tw},\ \mathrm{VaR}_{\alpha,t}=-\sigma_{p,t}\Phi^{-1}(\alpha),\ \mathrm{ES}_{\alpha,t}=\sigma_{p,t}\frac{\phi(\Phi^{-1}(\alpha))}{\alpha};\quad I_t=\mathbb 1\{X_t+\mathrm{VaR}_{\alpha,t}<0\};\quad Z_1=\frac{\sum_tX_tI_t/\mathrm{ES}_{\alpha,t}}{N_T}+1,\ Z_2=\sum_{t=1}^{T}\frac{X_tI_t}{T\alpha\,\mathrm{ES}_{\alpha,t}}+1;\quad u_t=\Phi(X_t/\sigma_{p,t}),\ H_t=\frac{(\alpha-u_t)\mathbb 1\{u_t\le\alpha\}}{\alpha},\ t_{ES}=\frac{\sqrt n(\bar H-\alpha/2)}{\sqrt{\alpha(1/3-\alpha/4)}},\ BP_{ES}(m)=n\sum_{j=1}^{m}\hat\rho_j^2\overset{a}{\sim}\chi^2_m;\quad R_t=\frac{(-X_t)-\mathrm{ES}_{\alpha,t}}{\sigma_{p,t}}\ \text{on exception days, test }E[R]=0\text{ vs }>0'
  conventions: "Gaussian zero-mean portfolio forecasts; the VaR/ES closed forms are our derivation for N(0, σ_p²). Sign conventions: Acerbi–Székely use P&L X_t (profit positive) with VaR and ES positive and reject for negative Z; Du–Escanciano use PITs u_t with exceptions u_t ≤ α; McNeil–Frey use losses (positive), so R_t uses −X_t. Levels: ES at α = 0.025 alongside VaR at 0.01, as in the Acerbi–Székely simulations; Du–Escanciano suggest an ES level about twice the VaR level. Z_1 needs N_T > 0. p-values for Z_1/Z_2 by simulating X_t ~ N(0, σ_{p,t}²) independently for each t, M ≥ 10,000 draws (our choice), p = share of simulated Z below the observed Z. The fixed Z_2 thresholds (−0.70 at 5%, −1.8 at 0.01%) hold only for T = 250 and α = 2.5%; recompute by simulation for our T. Du–Escanciano's chi-square limit for BP_ES needs the estimation window to be much longer than the evaluation window (their Case 1); fix m in advance (our suggestion m = 5). McNeil–Frey: one-sided bootstrap test of zero mean of R_t (B ≥ 10,000, our choice). Same portfolios, samples and day-dedup rule as kupiec_pof."
  inputs: ["Σ̂_t per model (after the shared PD repair)", "fixed portfolio weights w", "realized daily returns r_t", "α levels"]
  guards_against: "Forecasts that get the frequency of large losses right but understate their size after announcements."
  typical_values: "Acerbi & Székely 2014, Table 4 (T = 250, α = 2.5%): Z_2 thresholds −0.70 (5%) and −1.8 (0.01%) for Gaussian and Student-t with ν ≥ 10; −0.78 to −0.88 and −3.9 to −5.5 for ν = 3. S12 Table 2 reports the empirical 5% VaR/CVaR of its realized GMV portfolio returns (n = 1,000, long-only, with costs, 2000–2024; the return horizon is not stated, magnitudes suggest daily): NN −1.05%/−1.76%, DCC −1.1%/−1.80%, QIS −1.10%/−1.84% (descriptive tail statistics, not backtests)."
  pitfalls: "(1) A Gaussian tail is wrong for daily stock portfolios, so ES tests may reject a correct covariance; Patton & Sheppard call VaR-type evaluation of variance forecasts non-robust for this reason. (2) About 10 expected 2.5% exceptions in the event sample: very low power. (3) Overlapping windows and correlated portfolios violate the independence the simulated p-values assume. (4) Mixed sign conventions across the three papers are an easy source of errors. (5) Elicitability: ES alone cannot be ranked with a consistent score; for model comparison use comparative_backtest with the joint (VaR, ES) score."
  used_by:
    - ref: "Acerbi & Székely 2014"
      title: "Backtesting expected shortfall"
      authors: "Acerbi, C., & Székely, B."
      year: 2014
      venue: "Risk (magazine), December 2014, Cutting Edge technical article [volume/pages not verified]. Extended version: Acerbi, C. & Székely, B., 'Backtesting Expected Shortfall', MSCI Inc. research paper, 27 October 2014"
      url: "https://www.risk.net/risk-magazine/technical-paper/2381658/back-testing-expected-shortfall"
      peer_reviewed: false
      source_type: "other"
      read_depth: "full_text"
      version_read: "MSCI reprint read"
      accessed: "2026-11-12"
      how_used: "original definition of the Z_1, Z_2 and Z_3 tests with simulated p-values and Z_2 traffic-light thresholds."
    - ref: "Du & Escanciano 2017"
      title: "Backtesting Expected Shortfall: Accounting for Tail Risk"
      authors: "Du, Z., & Escanciano, J. C."
      year: 2017
      venue: "Management Science, 63(4), 940–958"
      url: "https://doi.org/10.1287/mnsc.2015.2342"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "CAEPR Working Paper 2015-001 (11 January 2015) read; Management Science text not opened; equation numbers and the statistic labels t_ES and BP_ES are from the working paper and may differ in print"
      accessed: "2026-11-12"
      how_used: "original definition of the cumulative-violation unconditional (t_ES) and conditional Box–Pierce (BP_ES) backtests (read as CAEPR WP 2015-001; the published article may label the statistics differently)."
