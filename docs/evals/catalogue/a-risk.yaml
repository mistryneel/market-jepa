- id: "frobenius_distance"
  name: "Squared Frobenius distance (and vech-Euclidean variant)"
  category: "risk_metric"
  section: "A"
  status: "widely_used"
  status_note: "Widely used (G14): the first use of the Frobenius loss for covariance estimation or forecasting was not established, and the entry cites at least two credible 2023–2026 users in our space: Johansson+ 2023 (squared Frobenius against the daily r r′ proxy) and S11 (square-rooted Frobenius and vech-Euclidean norms as headline losses), plus the preprint Huang+ 2026. Laurent+ 2013 (eq. 12 and Table 1, CIRANO working-paper numbering) is cited for the ranking-consistency result, not as the first use. The merged seed list also proposed 'widely used'. Priority and section unchanged."
  priority: "should"
  plain_english: "Adds up the squared differences between every entry of the predicted and realized covariance matrices; lower is better. Reviewers expect it, and it stays fair under noisy realized data only in squared form, but it says little about the inverse matrix that portfolio optimisers use."
  formula: 'L_F(\Sigma^*,\hat\Sigma)=\mathrm{Tr}\big[(\Sigma^*-\hat\Sigma)^{\top}(\Sigma^*-\hat\Sigma)\big]=\sum_{i,j}\big(\sigma^*_{ij}-\hat\sigma_{ij}\big)^2,\qquad L_E=\sum_{k=1}^{n(n+1)/2}\big(\mathrm{vech}(\Sigma^*)_k-\mathrm{vech}(\hat\Sigma)_k\big)^2\quad(\text{Laurent+ 2013 eq. 12, Table 1; CIRANO working-paper numbering})'
  computable_form: 'F_{m,e}=\frac{1}{n_e}\big\|\Sigma^*_e-\hat\Sigma_{m,e}\big\|_F^2\times10^{8},\quad \big\|\Sigma^*-\hat\Sigma\big\|_F^2=\|\Sigma^*\|_F^2-\frac25\sum_{d=1}^{5}r_d^{\top}\hat\Sigma r_d+\|\hat\Sigma\|_F^2\ \ (\|\Sigma^*\|_F^2 \text{ cancels in paired differences});\quad L_E=\tfrac12\Big(L_F+\sum_i(\sigma^*_{ii}-\hat\sigma_{ii})^2\Big)\ \text{(vech including the diagonal)}'
  conventions: "Squared distance only. Normalise by n as in [Ledoit & Wolf 2017] eq. 12 and [Ledoit & Wolf 2020] eq. 2.4, i.e. (1/n)‖Σ* − Σ̂‖²_F; [Laurent+ 2012] report L_F per element (÷N²) and L_E per vech element (÷N(N+1)/2). Any constant normalisation preserves rankings; per-origin division by ‖Σ*‖_F or ‖Σ̂‖_F does not (proportional Frobenius is inconsistent per [Laurent+ 2013]). L_F counts each off-diagonal error twice, L_E once; state whether vech includes the diagonal ([S11]'s reported L^F/L^E ratios imply a strict upper triangle). Use decimal daily returns and report ×10^8; score the same PD-repaired Σ̂ and the same Σ* as stein_loss (one forecast per model and origin; 88 pooled origins, G2; S_t at H1 origins, G4). Pairing and inference: Δ = F_ref − F_cand per origin (G1; positive favours the candidate), paired month-cluster bootstrap with the one-sided 95% percentile lower bound (G3); descriptive, not part of any confirmatory family (G5). A singular Σ* is fine: [Laurent+ 2013] show a singular 24-hour proxy for Frobenius, and the forecast-dependent part ‖Σ̂‖²_F − 2tr(Σ̂Σ*) is affine in Σ*, so expected rankings hold for any conditionally unbiased proxy (our inference). A Frobenius distance between forecast and realized correlation matrices is not affine in Σ* (realized correlations divide by realized volatilities) and is descriptive only (our inference)."
  inputs: ["Σ̂_{m,e} after the shared PD repair", "R_e (n_e×5) or Σ*_e from realized_covariance_target", "Fixed normalisation constant 1/n_e and reporting scale 10^8"]
  guards_against: "A reviewer-expected matrix error that, unlike the NLL, weights large covariance entries rather than small eigen-directions; it keeps the robust squared form instead of the non-robust norms common in deep-learning covariance papers."
  typical_values: "S11 Reis+ (14 iShares ETFs; F = 20-day horizon; daily excess returns; test 2021–2023, 753 days; square-rooted Frobenius norm ×10^5, i.e. not the robust squared form): CAB 58.923, DCC 74.716, CCC 75.198, EWMA 75.349, LW 76.514, naive 82.020 (CAB about 21% below DCC by the extraction's arithmetic); at F = 10: CAB 87.317 vs CCC 89.824 and EWMA 90.253. CAB, the Frobenius winner, was not the lowest-variance GMV model (daily rebalancing: naive 0.001991 vs CAB 0.002293). Not comparable to n ≈ 500, 5-day squared distances."
  pitfalls: "(1) Scale dominance: each term and its proxy noise scale roughly with σ_i²σ_j², so differences are driven by the highest-variance names and the most volatile weeks (inference in the verification notes, consistent with [Barndorff-Nielsen & Shephard 2004]); expect 2022 events to dominate. (2) It ignores the inverse: a Frobenius gain need not lower GMV variance ([S11]: ~20% gain, not the lowest GMV variance; [S12] argues Frobenius-optimal cleaning is not GMV-optimal), although [Ledoit & Wolf 2017] show the MV-optimal nonlinear shrinkage coincides with the Frobenius-on-Σ optimum (not Frobenius-on-Σ⁻¹). (3) Square roots and per-origin normalisations break consistency; [Bollerslev+ 2018]'s printed eq. 13 (CREATES working-paper numbering), sqrt(Tr(H − S)), is a typo for the norm, which is itself not consistent. (4) With Σ* = RR′/5 the level is dominated by proxy noise (E‖Σ* − Σ_t‖² is common to all models), so only differences are informative. (5) Do not score raw forecasts for some models and repaired forecasts for others. (6) Vectorise: n² = 250,000 entries per matrix is cheap, Python loops are not."
  used_by:
    - ref: "Laurent+ 2013"
      title: "On loss functions and ranking forecasting performances of multivariate volatility models"
      authors: "Laurent, S., Rombouts, J.V.K. & Violante, F."
      year: 2013
      venue: "Journal of Econometrics, 173(1), 1-10"
      url: "https://doi.org/10.1016/j.jeconom.2012.08.004"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "CIRANO WP 2009s-45 read"
      accessed: "2026-11-12"
      how_used: "Source of the ranking-consistency result, not the first use of the Frobenius loss: defines L_F (eq. 12) and the vech-Euclidean L_E, shows both consistent and their square roots not, and shows a singular 24-hour proxy for Frobenius (CIRANO working-paper numbering)."
    - ref: "Ledoit & Wolf 2017"
      title: "Nonlinear Shrinkage of the Covariance Matrix for Portfolio Selection: Markowitz Meets Goldilocks"
      authors: "Ledoit, O. & Wolf, M."
      year: 2017
      venue: "The Review of Financial Studies, 30(12), 4349–4388"
      url: "https://doi.org/10.1093/rfs/hhx052"
      peer_reviewed: true
      source_type: "peer_reviewed"
