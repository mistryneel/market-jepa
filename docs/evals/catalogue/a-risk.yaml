- id: "kupiec_pof"
  name: "Kupiec proportion-of-failures (unconditional coverage) VaR test with Basel traffic-light zones"
  category: "stat_test"
  section: "A"
  status: "canonical"
  status_note: "Canonical (Kupiec 1995; Basel 1996 for the zones). Kupiec's own text could not be opened (metadata only), so the statistic is taken from Campbell 2005 (opened and text-extracted this session) and the MathWorks documentation (opened this session), which agree. Status, priority and section unchanged from the candidate list."
  priority: "should"
  plain_english: "Turns each covariance forecast into a daily loss threshold (Value-at-Risk) for some fixed portfolios and checks whether the threshold is breached about as often as it should be, e.g. on 1% of days. Too many breaches means the model understated risk."
  formula: 'I_t=\mathbb 1\{X_t<-\mathrm{VaR}_t\},\ x=\sum_{t=1}^{N}I_t,\ \hat p=x/N;\quad LR_{POF}=-2\log\frac{(1-p)^{N-x}p^{x}}{(1-\hat p)^{N-x}\hat p^{\,x}}\overset{a}{\sim}\chi^2_1;\quad z=\frac{x-Np}{\sqrt{Np(1-p)}}\approx N(0,1);\quad \text{yellow from }\min\{k:F_{\mathrm{Bin}(N,p)}(k)\ge0.95\},\ \text{red from }\min\{k:F_{\mathrm{Bin}(N,p)}(k)\ge0.9999\}'
  computable_form: '\mathrm{VaR}_t=-\Phi^{-1}(p)\sqrt{w''\hat\Sigma_t w}\ \ (\text{zero-mean Gaussian portfolio forecast; our convention}),\quad X_t=w''r_t'
  conventions: "p is the VaR tail probability: 0.01 primary, 0.05 secondary. X_t = daily portfolio P&L w′r_t from simple close-to-close total returns (decimal, incl. overnight and delisting returns); VaR_t is a positive loss and an exception is X_t < −VaR_t (our convention; Campbell 2005 eq. 4 counts a hit when X_t ≤ −VaR_t, which differs only on exact ties, and the MathWorks page states no inequality). Forecast scale: Σ̂ is the forecast of the average daily covariance over days 1–5, so each of days 1–5 is scored against the same one-day VaR (our convention). Portfolios: the fixed, model-independent members of the shared set 𝒫 of risk_calibration_ratio (EW, VW, RLS_1..RLS_10), plus each model's own GMV_u as a secondary. Samples: (a) the full daily series of 1-day-ahead forecasts made at every close (needed for clean binomial counts); (b) event days 1–5 (and 0–5 for the secondary origin) of the 88 pooled origins (G2), FOMC and CPI separately and pooled. Where two event windows cover the same day, use the forecast from the most recent origin so each day is counted once (our rule, pre-register it). df = 1, 5% critical value 3.84; report the exact one-sided binomial p-value P(X ≥ x) as well, since N is small. Zero exceptions: use the limit 0·log 0 = 0, giving LR = −2N log(1−p); Campbell 2005 calls the LR undefined there and recommends the Wald z, so report both. Traffic light: the BIS table is for N = 250; for any other N recompute the 95%/99.99% binomial cut-offs at true coverage 1−p (Basel 1996). All results are descriptive (G5)."
  inputs: ["Σ̂_t for each model and origin (after the shared PD repair)", "fixed portfolio weights w (pre-registered set)", "realized daily returns r_t for the scored days", "VaR level p and the event calendar"]
  guards_against: "Covariance forecasts that systematically understate portfolio risk after announcements even when average loss rankings look fine; S14 reports VaR models that meet coverage overall but fail around FOMC."
  typical_values: "Basel 1996 Table 2 (N = 250, 1% VaR, cumulative probability of k or fewer exceptions): 4 → 89.22% (green), 5 → 95.88% (yellow starts), 9 → 99.97%, 10 → 99.99% (red); scaling-factor add-ons 0.40/0.50/0.65/0.75/0.85 for 5–9 and 1.00 for 10+. Campbell 2005: with T = 255 a common threshold is 8 violations (about 3%); the Basel 4- and 10-exception boundaries correspond to POF values of 0.76 (seen about 38% of the time under an accurate model) and 12.95; Kupiec's reported power to detect a 3% VaR reported as a 1% VaR is 65% with one year of data and about 90% with two. Basel 1996 Table 1: a 97%-coverage model passes a 7-or-more rule 37.5% of the time. Our count: about 420 distinct event-days in the locked window give only about 4.2 expected 1% exceptions."
  pitfalls: "(1) Very low power on event windows; treat as a secondary diagnostic. (2) A rejection mixes covariance error with the Gaussian tail assumption: fat tails produce excess 1% exceptions even with a correct Σ̂. (3) The binomial count assumes independent days; overlapping event windows and correlated portfolios break this. (4) Do not use Campbell's summary 3 + 0.2(N − 4) for the yellow-zone multiplier; it does not match the BIS table (verification note). (5) Sign conventions differ across sources (P&L vs loss, VaR positive vs quantile); fix one. (6) S14 was read at abstract level only; its test statistics are unknown."
