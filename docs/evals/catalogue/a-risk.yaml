      venue: "International Economic Review, 39(4), 885-905"
      url: "https://doi.org/10.2307/2527343"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "NBER Working Paper 6023 (April 1997), 'Answering the Critics: Yes, ARCH Models Do Provide Good Volatility Forecasts', pp. 4-8 read from the scanned PDF; International Economic Review text not opened; equation numbers from the working paper"
      accessed: "2026-11-12"
      how_used: "Shows low fit against a squared-return proxy is what a correct model implies (population R² at most 1/3 under Gaussian innovations), so absolute fit levels mislead."
    - ref: "Patton 2011"
      title: "Volatility forecast comparison using imperfect volatility proxies"
      authors: "Patton, A.J."
      year: 2011
      venue: "Journal of Econometrics, 160(1), 246-256"
      url: "https://doi.org/10.1016/j.jeconom.2010.03.034"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "2006 UTS working paper read"
      accessed: "2026-11-12"
      how_used: "Notes that robust losses preserve rankings but their expected level under a proxy exceeds that under the true variance (2006 WP p. 5)."
