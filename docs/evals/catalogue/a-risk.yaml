    why: "Tests whether post-announcement risk failures are predictable in event time, a secondary H2 diagnostic."
  implementation:
    libraries: ["numpy", "scipy", "statsmodels", "pandas"]
    notes: "Build the hit series on the full trading calendar; count n_ij only over adjacent trading days; compute LR_ind and LR_cc with zero-safe logs; for DQ, stack [1, lagged hits, q_t, event dummies], drop the first K rows, compute DQ by least squares and its chi-square(rank X) p-value. Tests: i.i.d. Bernoulli(θ) hits give nominal size; hits forced onto day +1 are detected by DQ but not by LR_ind."
