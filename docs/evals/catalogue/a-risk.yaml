- id: "robust_loss_class"
  name: "Loss robustness to a noisy realized proxy (rule for choosing ranking losses)"
  category: "protocol"
  section: "A"
  status: "canonical"
  status_note: "Canonical: the univariate class is defined by Patton 2011 and the multivariate consistency conditions by Laurent+ 2013; both are cited as original definitions. Status, priority and section unchanged."
  priority: "must"
  plain_english: "Realized variances and covariances are noisy stand-ins for true risk, and some error measures systematically pick the wrong model when scored against a noisy stand-in. This rule admits only losses that, on average, rank forecasts the same way against the stand-in as against the truth."
  formula: '\text{Univariate (proxy } s,\ \text{forecast } h\text{; Patton 2011 Prop. 2): } L\ \text{robust}\iff L(s,h)=\tilde C(h)+B(s)+C(h)(s-h),\ C\ \text{strictly decreasing},\ \tilde C''=C.\quad \text{Homogeneous family (Prop. 4): } L(s,h;b)=\frac{s^{b+2}-h^{b+2}}{(b+1)(b+2)}-\frac{h^{b+1}(s-h)}{b+1}\ (b\notin\{-1,-2\}),\ L(s,h;-1)=h-s+s\log\frac{s}{h},\ L(s,h;-2)=\frac{s}{h}-\log\frac{s}{h}-1\ (\text{QLIKE}),\ L(s,h;0)=\tfrac12(s-h)^2\ (\text{MSE}).\quad \text{Multivariate (proxy } \Sigma^*,\ \text{forecast } H\text{; Laurent+ 2013 Prop. 3): } L(\Sigma^*,H)=\tilde C(H)-\tilde C(\Sigma^*)+C(H)^{\top}\mathrm{vech}(\Sigma^*-H),\ C=\nabla\tilde C,\ \nabla^2\tilde C\prec0;\ \text{sufficient (Prop. 1): } \frac{\partial^2L}{\partial\sigma^*_l\,\partial\sigma^*_m}\ \text{finite and independent of } H.'
  computable_form: '\text{Admissible for ranking: per-asset Gaussian NLL (stein\_loss), QLIKE and MSE on variances (per stock, fixed-weight portfolios), squared Frobenius, vech-Euclidean and fixed-weight Euclidean distances. Descriptive only: MAE and entrywise 1-norms, square-rooted norms, losses on volatilities, log or proportional errors, correlation distance, MZ } R^2 \text{ of log proxy on log forecast, target-inverted Stein, Bures–Wasserstein, eigenvalue ratios. Monte-Carlo admissibility test: } \Sigma^*_b=\tfrac15\sum_{d=1}^{5}r_{b,d}r_{b,d}^{\top},\ r_{b,d}\sim\mathcal N(0,\Sigma_t),\ b=1..B;\ \text{require, for every pair } (j,k):\ \Big|\tfrac1B\sum_{b}\big[L(\Sigma^*_b,H_j)-L(\Sigma^*_b,H_k)\big]-\big[L(\Sigma_t,H_j)-L(\Sigma_t,H_k)\big]\Big|\le4\,\widehat{\mathrm{se}}_{jk}\ \text{(Monte-Carlo s.e. of the mean difference); this holds in expectation exactly for every loss affine in } \Sigma^* \text{ apart from proxy-only terms, and, unlike rank equality, is defined when two forecasts tie under the truth.}'
  conventions: "Notation warning: in this catalogue Σ̂ is the forecast and Σ* the proxy. [Patton 2011] writes σ̂² for the proxy and h for the forecast; [Laurent+ 2013] write Σ̂ for the PROXY and H for the forecast, the opposite of our Σ̂. Translate before copying any formula. Numbering: definition, proposition, footnote and equation numbers of [Patton 2011], [Laurent+ 2013] and [Patton & Sheppard 2009] are from the working papers read (2006 UTS WP, CIRANO WP 2009s-45 and the 2007 WP) and may differ in print. Definition: a loss is robust ([Patton 2011] Def. 1) or consistent ([Laurent+ 2013] Def. 2) if E[L(σ², h₁)] ≷ E[L(σ², h₂)] ⇔ E[L(s, h₁)] ≷ E[L(s, h₂)] for every conditionally unbiased proxy s (E_{t−1}[s_t] = σ²_t). It concerns expected-loss rankings, not outliers ([Patton 2011] fn. 6) and not one-sample rankings. Preconditions to state for our design: the forecast is measurable at the origin, and the proxy is conditionally unbiased for the forecast's own target (same 5-day horizon and per-day scale, uncentred second moments, overnight returns included). [Laurent+ 2013] assume a PD proxy (A3.1) and note realized covariance is PD only when N is below the number of intraday returns; [Patton & Sheppard 2009] define losses on PSD proxies × PD forecasts. Our admissible losses are affine in Σ* apart from proxy-only terms, so robustness carries over to the singular 5-day Σ* (our inference). Parameterisations differ: [Patton 2011] and [Patton & Sheppard 2009] index QLIKE as b = −2 and MSE as b = 0, while [Gneiting 2011] indexes by degree of homogeneity (QLIKE b = 0, MSE b = 2). Proxy-only normalising terms can be dropped without affecting robustness ([Patton & Sheppard 2009] fn. 12, written for the univariate family; applying it to multivariate losses is our extension), but dividing by a proxy- or forecast-dependent scale (e.g. per-origin ‖Σ*‖_F, proportional Frobenius) breaks it. A robust loss's expected level under a proxy exceeds its level under the truth ([Patton 2011] 2006 WP p. 5), so compare levels only against the same proxy. Moment conditions for DMW-type tests ([Patton 2011] Prop. 5): MSE needs E[h⁴] and E[s⁴] finite (E[σ̂⁸] in volatility terms); QLIKE needs only E[h^{2/e+δ}] and E[σ̂^{4+δ}]. Elicitability: the uncentred second moment is a mean of r r′ and is elicited by Bregman losses ([Gneiting 2011] Thm 3.1, multivariate eq. 30; [Banerjee+ 2005]); variance alone is not elicitable, although (mean, variance) is ([Fissler & Ziegel 2016] Cor. 2.16), one reason to target uncentred second moments."
  inputs: ["The candidate loss L(proxy, forecast) as code", "The proxy definition from realized_covariance_target and each model's forecast-target definition (horizon, scale, centring, return type)", "For the admissibility test: a return simulator with known Σ_t (e.g. a 3-factor model)"]
  guards_against: "Headline or secondary losses whose rankings against a noisy 5-day realized covariance can favour the wrong model even in large samples ([Hansen & Lunde 2006]: an inferior model chosen with probability tending to one); metrics common in deep-learning covariance papers (Frobenius or Euclidean norms, MAE) that are not ranking-consistent."
  typical_values: "Andersen & Bollerslev 1998 (NBER WP 6023): for a correctly specified GARCH(1,1), the population R² of squared returns on the forecast is α²/(1 − β² − 2αβ), at most 1/κ and so at most 1/3 under Gaussian innovations, which shows how noisy a one-day proxy is. Patton & Sheppard 2009 (2007 WP simulations): QLIKE had the highest DMW power of the robust family in three of four panels. Laurent+ 2012 (2010 WP; 125 MGARCH models; 10 US stocks; 75% MCS; the robust vech-Euclidean loss): MCS sizes 39/38/74/39 with a 5-minute proxy vs 25/26/60/47 with a 1-minute proxy across the full, dot-com, calm and 2007–08 samples, so proxy accuracy changes discrimination even for a robust loss."
  pitfalls: "(1) Robustness needs the proxy to be conditionally unbiased for the forecast's own target; it fails if a model targets a demeaned, log-return or 5-day-sum covariance while Σ* is the uncentred per-day second moment of simple returns. (2) Square roots break it: the Frobenius and Euclidean norms are not consistent ([Laurent+ 2013] WP p. 18), yet [S11] reports exactly these (eqs. 41–42); [Bollerslev+ 2018]'s printed eq. 13 (CREATES working-paper numbering), sqrt(Tr(H − S)), is a typo; use squared distances. (3) Do not copy [Patton & Sheppard 2009]'s printed eq. 50 branch for b ≠ −1, −2: as printed it is not minimised at H = Σ (verification note); the analogue of univariate eq. 43, (1/((b+1)(b+2)))tr(Σ*^{b+2} − H^{b+2}) − (1/(b+1))tr(H^{b+1}(Σ* − H)), gives ½‖Σ* − H‖²_F at b = 0; the b = −2 branch is correct. (4) The textbook Stein loss inverts the target and is not robust (stein_loss). (5) Robust is not efficient: robust losses differ in power and moment requirements, and with 88 pooled origins (89 events; G2) a robust expected ranking can still flip in sample. (6) Robustness is about ranking, not calibration: a robust loss can rank correctly while every model understates post-event risk; pair it with risk_calibration_ratio. (7) Univariate theory ([Patton 2011]) and multivariate theory ([Laurent+ 2013]) cover these losses only; correlation-based or optimiser-output metrics need their own justification."
