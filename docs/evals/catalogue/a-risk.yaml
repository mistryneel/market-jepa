- id: "factor_risk_models"
  name: "Factor-model covariance: statistical (PCA, POET), characteristic-based (IPCA) and fundamental (industry + style)"
  category: "baseline"
  section: "A"
  status: "canonical"
  status_note: "Canonical (G14): originals Fan+ 2013 for POET (equation numbers from arXiv v2) and Kelly+ 2019 for IPCA (formulas from the NBER working paper), G15. For the fundamental (industry + style) model the original was not established; Barra USE4 2011 is the earliest defining source in our registry cited, read for validation statistics and the eigenfactor and volatility-regime adjustments only, so the fundamental estimation steps are our USE4-like, CRSP-only specification. The USE4-like model is the factor member of the H1 strong set (G4). Must, as in the candidate list."
  priority: "must"
  plain_english: "Explains co-movement of 500 stocks through a handful of common factors (market, industries, styles or statistical components) plus independent stock-specific noise. This is how practitioners' risk models are built."
  formula: '\hat\Sigma=B\hat\Sigma_fB''+\hat\Psi;\quad \text{PCA}_K:\ \hat\Sigma=\sum_{i\le K}\lambda_i\xi_i\xi_i''+\mathrm{diag}(\hat R_K);\quad \text{POET}:\ \hat\Sigma=\sum_{i\le\hat K}\hat\lambda_i\hat\xi_i\hat\xi_i''+\hat R^{\mathcal T}_{\hat K},\ \hat r^{\mathcal T}_{ij}=s_{ij}(\hat r_{ij})\mathbb 1\{|\hat r_{ij}|\ge\tau_{ij}\}\ (i\ne j),\ \tau_{ij}=C\sqrt{\hat\theta_{ij}}\,\omega_T,\ \omega_T=\frac1{\sqrt p}+\sqrt{\frac{\log p}{T}};\quad \text{IPCA}:\ r_{t+1}=Z_t\Gamma_\beta f_{t+1}+\epsilon_{t+1}\ \Rightarrow\ \hat\Sigma_t=Z_t\hat\Gamma_\beta\hat\Sigma_f\hat\Gamma_\beta''Z_t''+\hat\Psi;\quad \text{fundamental}:\ \hat\Sigma_t=X_t\hat F_tX_t''+\hat\Delta_t'
  computable_form: '\hat\Sigma^{-1}=\Psi^{-1}-\Psi^{-1}B(\Sigma_f^{-1}+B''\Psi^{-1}B)^{-1}B''\Psi^{-1},\ \log\det\hat\Sigma=\log\det\Psi+\log\det(I+\Sigma_fB''\Psi^{-1}B)'
  conventions: "Window T = 252 trading days ending at the origin close (as S4's code) for PCA_K and POET, 1,260 as a sensitivity; uncentred daily returns; missing days inside any window are 0 for every model (G10). Forecast: flat per-day forecast for days 1–5 (days 0–5 at the close-of-day −1 origin); when Σ̂_f is an EWMA its one-day forecast is used. Roles: the USE4-like fundamental model is the factor member of the H1 strong set S (G4) and appears in the post-event table; PCA_K is the statistical factor baseline in the post-event table and on ordinary days; POET and IPCA are sensitivities. Tuned settings are chosen on the pre-2022 validation origins and frozen (G8; baseline_tuning_parity). PCA_K: K from {1, …, 20} (our grid); diagonal residual covariance (strict factor model; our choice). POET (Fan+ 2013; equation numbers from arXiv v2, G15): soft thresholding with the adaptive τ_ij (eq. 3.2); K̂ by the Bai–Ng criterion IC1 of eq. 2.14 with M = 20; C from {0.5, 1.0, 1.5, 2.0} (our grid); the C_min rule (eq. 4.1) is reported, and a non-PD result is left to the shared repair (G12). IPCA (Kelly+ 2019; formulas from the NBER working paper, G15): instruments = a constant plus the six CRSP styles below, each ranked cross-sectionally and mapped to [−0.5, 0.5] as in Kelly+ 2019, measured at the close before the return day; Γ_β by alternating least squares (eqs. 6–7), re-estimated at each refit date s_j of the G6 calendar on the daily panel (universe in force each day) of the 2,520 trading days ending at trading day s_j − 5 (G6, G7); K ∈ {4, 5, 6} (our grid); at each origin Σ̂_f = sample covariance of the factors f̂_τ = (Γ̂′Z′_{τ−1}Z_{τ−1}Γ̂)⁻¹Γ̂′Z′_{τ−1}r_τ over the T days ending at the origin and Ψ̂ = diagonal residual variances over the same days (the covariance form is our derivation from the IPCA model). USE4-like fundamental model (our CRSP-only specification; the USE4 estimation steps were not read): exposures known at the close before each return day = Fama–French 49 industry dummies from the point-in-time SIC code in the CRSP security history (an industry with fewer than 5 members in that day's universe is merged into FF49 'Other'; our rule) plus six CRSP styles, namely size (log market equity), beta (252-day regression on the value-weighted universe return), momentum (return from t−252 to t−21), residual volatility (63-day SD of the beta residuals), short-term reversal (21-day return) and liquidity (log 21-day average share turnover), each standardised to cap-weighted mean 0 and equal-weighted SD 1 and winsorised at ±3 (our choice); daily factor returns by WLS cross-sectional regression with √(market equity) weights on the universe in force that day (our choice); F̂ = EWMA of the factor returns over the 1,260 trading days ending at the origin, half-life from {42, 90, 180} days (S4 uses 90 for its own factor covariance); Δ̂ = diagonal EWMA (half-life 42 days) of the squared specific returns over the same days, floored at 10% of their cross-sectional median (our choice); no eigenfactor or volatility-regime adjustment in the primary (USE4 B1–B10 and eqs. 4.3–4.5 as a sensitivity). PCA_K, POET and the fundamental model are recomputed at every origin and have no refit-trained parameters. All variants are PD when Ψ̂ > 0; the shared repair (G12) is still applied, and Woodbury scoring is allowed only when min_i Ψ_ii ≥ ε·tr(Σ̂)/p, which makes the repair a no-op (Weyl's inequality); otherwise the dense repaired path is used. A non-finite forecast or failed Cholesky after repair is a failure (G13): logged, never replaced; as the reference arm it removes that origin from that contrast only, with counts disclosed."
  inputs: ["daily returns over the window", "CRSP point-in-time SIC codes, market equity, volume and shares outstanding (fundamental model and IPCA instruments)", "K, thresholds and half-lives fixed on validation"]
  guards_against: "A reviewer's first question for a quant audience: does the model beat the factor risk models practitioners actually use?"
  typical_values: "S4 Table 7 (2022–2024, 239 stocks, 252-day forward target, unnormalised Stein): PCA 304, Sparse PCA 303, IPCA 309, GKX 309, CD-DFM 302; GMV calibration PCA 0.97, SPCA 1.02, IPCA 0.77; out-of-sample reconstruction R² PCA 0.514, IPCA 0.499. S11 (14 ETFs, F = 20): PCA (95% variance) Frobenius ×10^5 83.154 vs DCC 74.716. Barra USE4 2011: before adjustment, low-volatility eigenfactors had realized volatility about 40% above forecast; optimisation bias σ_pred/σ_true ≈ √(1 − K/T). Kelly+ 2019: four IPCA factors describe average returns better than existing factor models (abstract)."
  pitfalls: "(1) Characteristics must be point-in-time with reporting lags; S4 states none. (2) IPCA or GKX fitted on data that overlap the test window leak. (3) Factor models understate risk of optimised portfolios (USE4 eigenfactor bias). (4) POET's garbled HTML rendering gives a wrong ω_T; use the arXiv form. (5) The USE4 estimation details were not read; label the fundamental model 'USE4-like'. (6) Woodbury scoring bypasses the shared repair unless min Ψ_ii is at or above the floor. (7) FF49 industries with very few universe members make the daily cross-sectional regression singular; merge them (conventions)."
