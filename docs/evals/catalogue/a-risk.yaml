    notes: "Per model, portfolio and sample: compute σ_p = sqrt(w'Σ̂w) by Cholesky, VaR, hits, x, N; LR_POF with xlogy-style handling of zero counts; chi-square(1) p-value; exact binomial tail; Wald z; traffic-light zone from the binomial CDF at the actual N. Unit tests: N = 250 reproduces the Basel Table 2 cumulative probabilities; LR = 0 when x/N = p; simulated Gaussian data with the true Σ give rejection rates near the nominal size."
