- id: "lw_variance_test"
  name: "Test of equal out-of-sample portfolio variance (Ledoit–Wolf)"
  category: "stat_test"
  section: "A"
  status: "canonical"
  status_note: "Original definition: Ledoit & Wolf 2011, a Wilmott magazine article (not peer-reviewed; working paper IEW 516), read in full; Ledoit & Wolf 2017 and Engle+ 2019 use its HACPW version. It replaced the Engle–Colacito test, whose original could be read only at metadata level. The event-design adaptation (calendar-month clusters instead of circular blocks), the one-sided and non-inferiority versions and its role as a sensitivity analysis are our design."
  priority: "should"
  plain_english: "A test of whether two risk models' minimum-variance portfolios really had different realized volatility. It stays valid when returns are fat-tailed and autocorrelated and when the two portfolios move together."
  formula: '\Delta=\log\sigma_1^2-\log\sigma_2^2,\ H_0:\Delta=0;\quad \hat\Delta=f(\hat v)=\log(\hat\gamma_1-\hat\mu_1^2)-\log(\hat\gamma_2-\hat\mu_2^2),\ \hat v=(\hat\mu_1,\hat\mu_2,\hat\gamma_1,\hat\gamma_2)^\top,\ \hat\mu_i=\frac{1}{T}\sum_{t}r_{it},\ \hat\gamma_i=\frac{1}{T}\sum_{t}r_{it}^2;\quad \nabla f(a,b,c,d)=\Big(\frac{-2a}{c-a^2},\frac{2b}{d-b^2},\frac{1}{c-a^2},\frac{-1}{d-b^2}\Big)^\top,\ s(\hat\Delta)=\sqrt{\nabla f(\hat v)^\top\hat\Psi\,\nabla f(\hat v)/T};\quad \hat\Psi=\frac{T}{T-4}\sum_{j=-T+1}^{T-1}k(j/S_T)\,\hat\Gamma_T(j),\ \hat\Gamma_T(j)=\frac{1}{T}\sum_{t=j+1}^{T}\hat y_t\hat y_{t-j}^\top\ (j\ge0),\ \hat y_t=(r_{1t}-\hat\mu_1,\,r_{2t}-\hat\mu_2,\,r_{1t}^2-\hat\gamma_1,\,r_{2t}^2-\hat\gamma_2)^\top;\quad p_{\mathrm{HAC}}=2\Phi(-|\hat\Delta|/s(\hat\Delta));\quad d=\frac{|\hat\Delta|}{s(\hat\Delta)},\ \tilde d^{*,m}=\frac{|\hat\Delta^{*,m}-\hat\Delta|}{s(\hat\Delta^{*,m})},\ PV=\frac{\#\{\tilde d^{*,m}\ge d\}+1}{M+1},\ \hat\Psi^{*}=\frac{1}{l}\sum_{j=1}^{l}\zeta_j\zeta_j^\top,\ \zeta_j=\frac{1}{\sqrt{b}}\sum_{t=1}^{b}y^{*}_{(j-1)b+t},\ l=\lfloor T/b\rfloor'
  computable_form: 'x_{i,e,d}=w_{i,e}^\top r_{t_e+d}\ (i=1,2);\ \hat\Delta=\log\widehat{\mathrm{Var}}(x_1)-\log\widehat{\mathrm{Var}}(x_2)\ \text{over all event-days};\ \hat\Psi_{\mathrm{cl}}=\frac{1}{T}\sum_{c}S_cS_c^\top,\ S_c=\sum_{(e,d)\in c}\hat y_{e,d};\ \text{resample calendar months }c\text{ (both series together) and studentize each resample with its own }\hat\Psi^{*}_{\mathrm{cl}}'
  conventions: "Data: two paired portfolio return series on the same periods, typically each model's GMV_u returns. Orientation (G1): series 1 = reference, series 2 = candidate, so Δ = log σ²_ref − log σ²_cand and Δ > 0 favours the candidate (lower variance). Variances are centred (γ − μ², divisor T) as in LW 2011, unlike the uncentred V of gmv_realized_variance; with daily data the difference is negligible but must be stated. Sidedness: LW 2011 is two-sided (symmetric |t| bootstrap). For directional claims, H_A: Δ > 0, use p = 1 − Φ(Δ̂/s(Δ̂)) for the HAC version and, for the bootstrap version, p* = (1 + #{t*_m ≥ t})/(M + 1) with t = Δ̂/s(Δ̂) and t*_m = (Δ̂*_m − Δ̂)/s(Δ̂*_m). One-sided 95% studentized-bootstrap lower bound (our adaptation): LB = Δ̂ − q*_{0.95} × s(Δ̂), where q*_{0.95} is the 0.95 quantile of t*_m over resamples; superiority iff LB > 0, and H1 non-inferiority iff LB > −δ_GMV with δ_GMV = log(1.05) (G4), equivalently (Δ̂ + δ_GMV)/s(Δ̂) > q*_{0.95}. Do not use the mirror image Δ̂ + q*_{0.05} × s(Δ̂): it equals LB only when the t* distribution is symmetric, and its error changes sign when the two series are swapped. HAC: LW use the QS kernel with Andrews (1991) automatic bandwidth ('HAC') or the prewhitened QS kernel with the Andrews–Monahan (1992) bandwidth ('HACPW'), times T/(T − 4); the kernel and bandwidth formulas are not transcribed in our sources. Bootstrap: circular block bootstrap with block size b chosen by LW 2008 Algorithm 3.1 (fit a semi-parametric model, a VAR with bootstrapped residuals or a bivariate GARCH for daily data; simulate K ≥ 1,000 series; pick the b from a grid, {1, 2, 4, 6, 8, 10} for T = 120, whose interval coverage is closest to 1 − α). LW used M = 499 resamples; we use M = 9,999 (our choice). Application A (H1): concatenate each model's daily GMV_u returns from non-overlapping 5-day holding windows at the G4 ordinary origins (in date order keep an origin only if it is at least 5 trading days after the last kept one; constant weights w_t within a window, rebalanced daily as in gmv_realized_variance) in time order, T = 5 × number of windows, and run HACPW and the circular block bootstrap as in LW 2011. Application B (H2 events): the series are the h daily returns per event origin of the 88 pooled origins (G2); resample calendar months of day 0 (G3) instead of circular blocks and studentize with the cluster estimator Ψ̂_cl in both the original and resampled data (our adaptation). This pooled variance ratio weights high-volatility events more than the per-origin log-ratio pooling of gmv_realized_variance and answers a different question, so it is a sensitivity analysis and adds no confirmatory family (G5). Origins, universe, returns, failures and the PD repair are as in gmv_realized_variance."
  inputs: ["Paired daily return series of the two portfolios being compared (same days), ordered (reference, candidate) per G1, e.g. GMV_u of a strong baseline and of our H1 arm", "For Application B: event-origin id and the calendar month of day 0 of every event-day", "Block size b or the semi-parametric calibration model (Application A)", "Number of resamples M, α, and the non-inferiority margin δ_GMV = log(1.05) (G4) where relevant"]
  guards_against: "Invalid equal-variance tests: LW 2011 show the classical F-test is invalid when the two strategies are correlated, heavy-tailed or serially dependent. It also guards against claiming a GMV improvement from point estimates alone."
  typical_values: "No comparable test statistics or p-values in the sources read. Design context only: in LW 2011's simulations (T = 120, M = 499) the HAC version is liberal while the studentized time-series bootstrap holds size; LW 2017 applied HACPW to 10,080 daily out-of-sample returns and Engle+ 2019 to 7,560."
  pitfalls: "(1) HAC is liberal at T = 120 in LW's simulations; prefer the bootstrap for our roughly 440 event-days (88 origins × 5 days), and note that LW 2017 used HACPW only because T = 10,080 (their fn. 14). (2) The working-paper version misprints Θ̂ = σ̂_i/σ̂_n without squares; the Wilmott article is correct (variances). (3) Crossref lists the title with 'Performances'; the printed title is 'Performance'. (4) Testing every pair inflates errors: LW 2017 tested only one pair to avoid 55 comparisons; pre-register the pairs (H1: our H1 arm vs each member of S; H2: the contrasts of gmv_realized_variance); as a sensitivity analysis the test adds no confirmatory family (G5), and the H1 decision stays the intersection–union rule of G4. (5) Circular blocks assume a contiguous stationary series; event-days are not contiguous, so use month clusters (Application B). (6) arch.bootstrap.optimal_block_length implements a Politis–White block length that differs from the paper and is not LW's calibrated choice; if used as a shortcut, state it as a deviation. (7) It tests equal pooled variance, not the mean per-origin log ratio; do not mix their p-values. (8) Engle & Colacito 2006's DM-type test on squared portfolio returns is the historical alternative, but it was read only at metadata level and is not encoded here."
  used_by:
    - ref: "Ledoit & Wolf 2011"
      title: "Robust Performance Hypothesis Testing With the Variance"
      authors: "Ledoit, O. & Wolf, M."
      year: 2011
      venue: "Wilmott, 2011(55), 86–89 (September 2011)"
      url: "https://doi.org/10.1002/wilm.10036"
      peer_reviewed: false
      source_type: "other"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Original definition: tests H0: log σ₁² − log σ₂² = 0 for paired strategy returns by HAC (QS or prewhitened QS kernel) or by the studentized circular block bootstrap with calibrated block size, aimed at comparing GMV implementations."
    - ref: "Ledoit & Wolf 2008"
      title: "Robust performance hypothesis testing with the Sharpe ratio"
      authors: "Ledoit, O. & Wolf, M."
      year: 2008
      venue: "Journal of Empirical Finance, 15(5), 850–859"
      url: "https://doi.org/10.1016/j.jempfin.2008.03.002"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Supplies the machinery LW 2011 reuses: delta-method standard error, HAC Ψ̂ with a T/(T − 4) correction, the studentized circular block bootstrap, the p-value formula and block-size calibration (Algorithm 3.1)."
    - ref: "Ledoit & Wolf 2017"
      title: "Nonlinear Shrinkage of the Covariance Matrix for Portfolio Selection: Markowitz Meets Goldilocks"
      authors: "Ledoit, O. & Wolf, M."
      year: 2017
      venue: "The Review of Financial Studies, 30(12), 4349–4388"
      url: "https://doi.org/10.1093/rfs/hhx052"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Reports two-sided HACPW p-values for equal GMV out-of-sample SD between linear and nonlinear shrinkage over 10,080 daily returns, noting the bootstrap is preferred in small samples."
    - ref: "Engle+ 2019"
      title: "Large Dynamic Covariance Matrices"
      authors: "Engle, R. F., Ledoit, O. & Wolf, M."
      year: 2019
      venue: "Journal of Business & Economic Statistics, 37(2), 363–375"
      url: "https://doi.org/10.1080/07350015.2017.1345683"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Reports two-sided HACPW p-values for equal GMV SD between DCC-NL and DCC-S over 7,560 daily returns."
  relevance:
    H1: "medium"
    H2: "low"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Formal test behind GMV comparisons, used as a sensitivity analysis to the month-cluster bootstrap of per-origin log ratios."
  implementation:
    libraries: ["numpy", "scipy", "arch"]
    notes: "1) Order the series (reference, candidate) (G1); compute v̂, Δ̂ = f(v̂) and ∇f(v̂). 2) Build ŷ_t and Ψ̂: implement the kernel-weighted sum of autocovariances Γ̂_T(j) directly in numpy, taking the QS kernel and Andrews / Andrews–Monahan bandwidth rules from those papers (not in our registry); a Bartlett kernel with an explicit lag is an acceptable documented deviation. Multiply by T/(T − 4). 3) s(Δ̂) and the HAC p-values (two-sided as in LW 2011; one-sided 1 − Φ(Δ̂/s(Δ̂))). 4) Bootstrap: resample both series jointly (circular blocks of length b with index wrap-around for Application A; calendar months of day 0 for Application B); recompute Δ̂*, Ψ̂* from block or month sums, s(Δ̂*), d̃* and t* = (Δ̂* − Δ̂)/s(Δ̂*); two-sided p-value (#{d̃* ≥ d} + 1)/(M + 1); one-sided p* = (1 + #{t* ≥ t})/(M + 1); LB = Δ̂ − q*_{0.95}s(Δ̂). 5) Report Δ̂, the variance ratio exp(Δ̂), the asymmetric interval exp(Δ̂ ± z* s(Δ̂)) for Θ, LB and p-values. arch.bootstrap.optimal_block_length may give a starting block length (documented deviation). Checks: identical series give Δ̂ = 0; swapping the series flips the sign of Δ̂; rejection rate near 5% on simulated paired series with equal variance and GARCH-type dependence; on a skewed simulated t* distribution LB differs from Δ̂ + q*_{0.05}s(Δ̂)."
  adoption_cost: "medium"
  verified: true
  related: ["gmv_realized_variance", "block_bootstrap", "diebold_mariano", "h1_noninferiority_test", "model_confidence_set", "multiple_testing"]
- id: "min_tracking_error_variance"
  name: "Realized variance of the minimum-tracking-error portfolio vs a value-weighted benchmark"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Original not established; earliest defining source in our registry cited (G14). Chan+ 1999 (Sec. 5) is the earliest source in our registry that compares covariance models by realized minimum-tracking-error volatility, but we did not establish that it is the first use, and no 2023–2026 users are cited, so the entry stays canonical under the G14 exception. Bollerslev+ 2018 also evaluate with minimum-tracking-error portfolios, but their construction was not transcribed. The random-subset design (needed because tracking a benchmark made of the same stocks is trivial without constraints), the hash-based subset draw, the closed-form solution and the log-ratio pooling are our design."
  priority: "should"
  plain_english: "Most quant firms use risk models to stay close to a benchmark. This test gives each model a random half of the stocks, asks it for the portfolio that should track the value-weighted market of all ~500 stocks most closely, and measures how far that portfolio actually strayed over the next days."
  formula: 'c_{i,t}=\frac{\mathrm{ME}_{i,t}}{\sum_{j\in U_t}\mathrm{ME}_{j,t}};\quad \min_{w_S}\ (\tilde w-c_t)^\top\hat\Sigma_t(\tilde w-c_t)\ \text{s.t.}\ \mathbf{1}^\top w_S=1,\ \tilde w_S=w_S,\ \tilde w_{U_t\setminus S}=0;\quad w_S=\hat\Sigma_{SS}^{-1}\big[(\hat\Sigma_t c_t)_S+\eta\mathbf{1}\big],\ \eta=\frac{1-\mathbf{1}^\top\hat\Sigma_{SS}^{-1}(\hat\Sigma_t c_t)_S}{\mathbf{1}^\top\hat\Sigma_{SS}^{-1}\mathbf{1}};\quad a_t=\tilde w-c_t,\ \mathrm{TEV}_t=a_t^\top\Sigma^*_t a_t=\frac{1}{h}\sum_{d=1}^{h}(a_t^\top r_{t+d})^2,\ \widehat{\mathrm{TEV}}_t=a_t^\top\hat\Sigma_t a_t'
  computable_form: '\overline{\mathrm{TEV}}_e=\frac{1}{R}\sum_{q=1}^{R}\mathrm{TEV}_e^{(q)},\quad \Delta_e=\log\overline{\mathrm{TEV}}_e(\mathrm{ref})-\log\overline{\mathrm{TEV}}_e(\mathrm{cand})\ (>0\ \text{favours the candidate; G1}),\quad \text{annualized TE}=\sqrt{252\,\overline{\mathrm{TEV}}}'
  conventions: "Benchmark: c_t = value weights over the origin's full asset set N_t (S_t at H1 origins, G4) from market equity (|price| × shares outstanding, same CIZ snapshot) at the close of origin t (point-in-time). Chan+ 1999 tracked the S&P 500 index; we use the universe's value-weighted portfolio because its weights are available from CRSP (our choice). Investable subset: with S = N_t and no constraints the solution is w = c_t and TEV = 0 for every model (our algebra, checked numerically), so use R = 10 subsets per origin of K = ⌊n_t/2⌋ stocks each: subset q is the K stocks with the smallest first-64-bit values of SHA-256('20220101|TE|q|YYYY-MM-DD|PERMNO') (origin date; big-endian unsigned integer), identical for every model and independent of how the universe is ordered (our design; Chan+ drew 250 stocks per year and repeated the exercise 200 times). The closed form is our derivation (Lagrangian of the equality-constrained quadratic). Variants: unconstrained within S (closed form) is primary; long-only with 0 ≤ w_i ≤ cap (Chan+ used 2%) via a convex QP is secondary. Holding: constant portfolio and benchmark weights over the h days (our convention), so TEV is the mean squared daily active return, uncentred, divisor h, with the same Σ* as the primary endpoint. Pooling (G1): per origin average TEV over the R subsets (same subsets for all models), then Δ_e = log TEV_e(ref) − log TEV_e(cand) for each pre-registered contrast (positive favours the candidate); report the geometric-mean change of the candidate, exp(−Δ̄) − 1. Inference: paired month-cluster bootstrap with the one-sided 95% percentile lower bound (G3); descriptive, not part of any confirmatory family (G5). Origins (H2 day-0 close with h = 5 over the 88 pooled origins; day −1 close with h = 6; H1 ordinary origins of G4), returns, failures, PD repair and units (daily variance; annualized TE √(252 × mean TEV) for display) are as in gmv_realized_variance. Always report the value-weighted portfolio of the subset itself as a naive reference."
  inputs: ["Σ̂_t for every model and origin (after the shared PD repair)", "Daily returns r_{t+1..t+h} for N_t (S_t at H1 origins)", "Market equity of every stock in the origin's asset set at the close of the origin", "Hash seed 20220101, subset size K, number of subsets R, and the cap for the long-only variant", "Pre-registered contrasts (candidate, reference) and the origin list with cluster months (G3)"]
  guards_against: "Models that look alike on GMV, where the dominant market factor drives every model's risk, but mis-estimate benchmark-relative (residual) covariance, which is what quant managers mostly use a risk model for; Chan+ 1999 found sharper differences between models under tracking error than under GMV."
  typical_values: "Chan+ 1999 (random 250 NYSE/AMEX stocks tracking the S&P 500, monthly data, long-only, weights ≤ 2%, 1973–1997): realized annualized tracking error 4.03% (full covariance), 5.12% (1 factor), 4.53% (3 factors), 4.01% (9 factors), 4.97% ('product of standard deviations' model), 4.16% (industry/size); equal-weighted 250 stocks 6.16%; value-weighted 250 stocks 3.04%; value-weighted largest 1,000 stocks 1.38%. Over 200 replications: 3.99% (full covariance), 5.11% (1 factor), 4.54% (3 factors), with a mean 1-vs-3-factor difference of 0.57% (SE 0.01%). In the same study GMV volatility spanned only 12.59%–12.94% across models."
  pitfalls: "(1) Trivial without a subset or binding constraints: TE = 0 for every model. (2) Results depend on K, the constraint set and the benchmark; pre-register all three. (3) Benchmark weights must be measured at the origin; end-of-window weights are look-ahead. (4) In Chan+ 1999 the naive value-weighted portfolio of the same 250 stocks tracked better (3.04%) than every optimized portfolio (4.01%–5.12%) under their long-only, 2%-capped constraints, so optimization can lose to a naive rule; report that reference. (5) Long-only and caps compress differences, as for GMV. (6) Scale-blind like GMV: pair it with risk_calibration_ratio (the active portfolio a_t can be added to the calibration set). (7) Active returns of 500-stock books are small; use float64 throughout and count zero-filled returns. (8) Delisted subset members: delisting return, then cash, as in gmv_realized_variance."
  used_by:
    - ref: "Chan+ 1999"
      title: "On portfolio optimization: Forecasting covariances and choosing the risk model"
      authors: "Chan, L. K. C., Karceski, J., & Lakonishok, J."
      year: 1999
      venue: "Review of Financial Studies, 12(5), 937-974"
      url: "https://doi.org/10.1093/rfs/12.5.937"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Earliest source in our registry; first use not established: minimizes forecast tracking-error volatility against the S&P 500 for random 250-stock sets (weights between 0 and 2%) and compares models by realized annualized tracking error, finding sharper differences than under GMV."
    - ref: "Bollerslev+ 2018"
      title: "Modeling and forecasting (un)reliable realized covariances for more reliable financial decisions"
      authors: "Bollerslev, T., Patton, A.J. & Quaedvlieg, R."
      year: 2018
      venue: "Journal of Econometrics, 207(1), 71-91"
      url: "https://doi.org/10.1016/j.jeconom.2018.05.004"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "CREATES RP 2016-10 read"
      accessed: "2026-11-12"
      how_used: "Evaluates its realized-covariance forecasting models economically with minimum-variance and minimum-tracking-error portfolios (construction details not transcribed in our evidence)."
    - ref: "Ledoit & Wolf 2004b"
      title: "Honey, I Shrunk the Sample Covariance Matrix"
      authors: "Ledoit, O. & Wolf, M."
      year: 2004
      venue: "The Journal of Portfolio Management, 30(4), 110–119"
      url: "https://doi.org/10.3905/jpm.2004.110"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "UPF Economics Working Paper 691 (June 2003) read, including Appendices A-B; Journal of Portfolio Management text not opened; equation numbers from the working paper"
      accessed: "2026-11-12"
      how_used: "Compares covariance estimators by the realized tracking-error SD and information ratio of simulated-signal active portfolios against value-weighted benchmarks of the N largest stocks (N = 30–500), 1983–2002."
    - ref: "Jagannathan & Ma 2003"
      title: "Risk reduction in large portfolios: Why imposing the wrong constraints helps"
      authors: "Jagannathan, R., & Ma, T."
      year: 2003
      venue: "Journal of Finance, 58(4), 1651-1683"
      url: "https://doi.org/10.1111/1540-6261.00580"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "abstract_only"
      accessed: "2026-11-12"
      how_used: "Reports (abstract) that daily data help when the objective is minimizing tracking error."
  relevance:
    H1: "medium"
    H2: "low"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Practitioner-facing H1 check of residual covariance, where GMV discriminates poorly between models."
  implementation:
    libraries: ["numpy", "scipy", "pandas"]
    notes: "1) c_t from market equity at the close of t. 2) For q = 1..R form S by the SHA-256 rule of the conventions (sort the asset set by hash value, take the first K). 3) Unconstrained: Cholesky of Σ̂_SS; u = Σ̂_SS⁻¹(Σ̂c_t)_S and g = Σ̂_SS⁻¹1; η = (1 − 1′u)/(1′g); w_S = u + ηg; embed into an n-vector w̃ with zeros outside S; a = w̃ − c_t. 4) Long-only: convex QP minimizing (w̃ − c)′Σ̂(w̃ − c) subject to 1′w_S = 1 and 0 ≤ w_S ≤ cap. 5) TEV = mean_d (a′r_{t+d})²; predicted a′Σ̂a. 6) Average over the R subsets; Δ_e = log TEV(ref) − log TEV(cand) (G1); month-cluster bootstrap. Checks (our numpy check): the closed form sums to 1 and matches a generic constrained optimizer (weights within 1e-4, objective within 1e-15); with S = N_t it returns c_t exactly; a stock's subset membership does not change when other stocks enter or leave the universe."
  adoption_cost: "medium"
  verified: true
  related: ["gmv_realized_variance", "risk_calibration_ratio", "bias_statistic", "factor_risk_models", "pit_universe_survivorship", "block_bootstrap"]
- id: "risk_calibration_ratio"
  name: "Calibration ratio: realized ÷ predicted portfolio variance"
  category: "risk_metric"
  section: "A"
  status: "widely_used"
  status_note: "Widely used (G14): Engle & Sheppard 2001 (Sec. 6) is the earliest source in our registry that tests realized against predicted variance for minimum-variance, equal- and value-weighted portfolios, but we did not establish that it is the first use; 2023–2026 users in our space are cited (S4 reports ρ_gmv and ρ_erc as headline calibration metrics; Johansson+ 2023 volatility-targets its evaluation portfolios with the predicted covariance and reports their realized volatility). The shared portfolio set, the variance (not volatility) ratio, the arithmetic mean for tests against 1 and log-based comparisons across models are our design, chosen because S4's paper and code disagree on these conventions. Priority and section unchanged."
  priority: "must"
  plain_english: "For a set of test portfolios, divide the risk that actually materialized after the forecast by the risk the model predicted. Values above 1 mean the model understated risk; this is the check that tells whether a model got the post-announcement risk level right."
  formula: '\rho_{p,t}=\frac{w_{p,t}^\top\Sigma^*_t w_{p,t}}{w_{p,t}^\top\hat\Sigma_t w_{p,t}}=\frac{\frac{1}{h}\sum_{d=1}^{h}(w_{p,t}^\top r_{t+d})^2}{w_{p,t}^\top\hat\Sigma_t w_{p,t}},\quad \bar\rho_p=\frac{1}{E}\sum_{e=1}^{E}\rho_{p,e},\quad \mathrm{CE}_p=\lvert\log\bar\rho_p\rvert,\quad \mathbb{E}[\rho_{p,t}\mid\mathcal{F}_t]=\frac{w_{p,t}^\top\Sigma_t w_{p,t}}{w_{p,t}^\top\hat\Sigma_t w_{p,t}}\ \text{for }\mathcal{F}_t\text{-measurable }w_{p,t};\quad \text{Gaussian reference: }h\rho\sim\chi^2_h\Rightarrow\mathbb{E}[\log\rho]=\psi(h/2)-\log(h/2)'
  computable_form: 'A_{p,e}=\frac{1}{h}\sum_{d=1}^{h}(w_{p,e}^\top r_{t_e+d})^2,\ P_{p,e}=w_{p,e}^\top\hat\Sigma_{t_e}w_{p,e},\ \rho_{p,e}=A_{p,e}/P_{p,e};\ \text{report }\bar\rho_p,\ \mathrm{median}_e\,\rho_{p,e},\ \textstyle\sum_e A_{p,e}/\sum_e P_{p,e},\ \mathrm{CE}_p'
  conventions: "Shared portfolio set 𝒫 (pre-registered; used here, by bias_statistic and mincer_zarnowitz, by qlike_univariate, mse_variance and kupiec_pof through its fixed members, and extended in eigenfactor_bias_test); weights are formed at origin t on N_t (on S_t at H1 origins, G4). Optimized, model-dependent members: GMV_u = Σ̂⁻¹1/(1′Σ̂⁻¹1); GMV_lo = long-only GMV. Fixed, model-independent members: EW = 1/n_t; VW = market-equity weights at the close of t (|price| × shares outstanding from the same CIZ snapshot); RLS_k, k = 1..10: z_{k,i} = Φ⁻¹(u_{k,i}), u_{k,i} = (H_{k,i} + 0.5)/2^64, with H_{k,i} the first 8 bytes, read as a big-endian unsigned integer, of SHA-256 of the ASCII string 'seed|k|PERMNO_i' (decimal integers, e.g. '20220101|3|10107'), seed = 20220101 (pre-registered), so a stock's draw does not depend on which other stocks are present; w = 2(z − z̄1)/Σ_i|z_i − z̄| over the origin's asset set (dollar-neutral, gross exposure 2; our design). The ERC portfolio is reported with the same ratio in erc_check, outside the headline set. Ratio: realized over predicted daily variance (Σ̂ = average-daily forecast over the h target days; numerator uncentred, divisor h); ρ > 1 means risk was understated. S4's paper uses this variance ratio with unconstrained GMV, while its code uses σ_real/σ̂ with a demeaned realized SD, long-only GMV and the median across anchors; do not mix these conventions. Aggregation: tests against 1 use the arithmetic mean ρ̄_p, because E[ρ | F_t] = 1 when w′Σ̂w equals the true w′Σ_t w (our derivation); never test the mean log ratio against 0: with Gaussian returns and a constant covariance over the window, hρ ~ χ²_h, so E[log ρ] = ψ(h/2) − log(h/2) = −0.213 for h = 5 and −0.176 for h = 6 even under perfect calibration (our derivation, checked numerically; ψ is the digamma function). Cross-model comparison: CE_p = |log ρ̄_p|; the median ρ and the pooled ratio Σ_e A/Σ_e P (dominated by high-volatility events) are descriptive. Tests against 1: fixed members only, two-sided 95% month-cluster bootstrap interval for ρ̄_p (G3; B = 10,000); optimized members are compared across models only. Calibration contrasts (descriptive under G5; not in any confirmatory family): CE_fixed(M) = (1/12)Σ_{p ∈ {EW, VW, RLS_1..RLS_10}} |log ρ̄_p(M)|; Δ^CE = CE_fixed(ref) − CE_fixed(cand) (G1; positive favours the candidate) for (pre, 1) vs (pre, 0) and (pre, 1) vs (sup, 1) (matched_supervised_comparator), with every ρ̄_p recomputed inside each month-cluster replicate (one shared index matrix); report Δ^CE and its one-sided 95% percentile lower bound. Event-minus-matched-non-event differences (event_vs_nonevent_did) and the H1 statistics on the G4 ordinary origins are descriptive. Breakdowns: FOMC (36), CPI (53) and pooled (88 origins, G2); day-0 origin (h = 5) and day −1 origin (h = 6); optional day profile ρ_d = (w′r_{t+d})²/(w′Σ̂w); by year. Origins, universe, returns, failures and the PD repair as in gmv_realized_variance."
  inputs: ["Σ̂_t for every model and origin (after the shared PD repair)", "Daily returns r_{t+1..t+h} for N_t (S_t at H1 origins)", "Market equity (|price| × shares outstanding) at the close of each origin from the same CIZ snapshot (VW member) and the pre-registered hash seed 20220101 for the RLS members", "Origin list with origin type, event type and cluster month (G3)", "Long-only QP solver for GMV_lo"]
  guards_against: "Systematic under- or over-statement of post-event risk, which scale-blind portfolio losses (GMV variance, MV loss) cannot see and average likelihood losses can hide; S14 (abstract only) reports risk models that meet coverage overall but fail around FOMC announcements."
  typical_values: "S4 Table 7 (239 S&P 500 stocks, 252-day horizon, test 2022–2024; the code computes a median volatility ratio with long-only GMV): ρ_gmv CD-DFM 0.93, LW 0.92, NLS 1.42, PCA 0.97, SPCA 1.02, IPCA 0.77, GKX 0.77; ρ_erc 0.82, 0.73, 1.54, 0.71, 0.73, 0.71, 0.71. Engle & Sheppard 2001 (daily, 1994–1999; SD of forecast-standardized portfolio returns, i.e. the square root of a variance ratio): minimum-variance portfolios of 2 to 100 S&P 500 sector indices, DCC from 1.03 rising to 1.78 and RiskMetrics from 1.09 rising to 35.90; 30 DJIA stocks, DCC 1.09 vs RiskMetrics 2.61; equal- and value-weighted DCC portfolios insignificantly different from 1, while all RiskMetrics ones are rejected at 5% (equal-weighted RiskMetrics 1.04–1.05)."
  pitfalls: "(1) Optimized portfolios understate risk even for an unbiased forecast: El Karoui 2010 (abstract) gives an underestimation factor of roughly 1 − p/n; USE4 eq. 4.2 gives σ_pred/σ_true ≈ √(1 − K/T); Bun+ 2017 eq. 7.19 implies realized/predicted ≈ 1/(1 − q)² for sample-covariance Markowitz portfolios with q = N/T. GMV ratios therefore sit above 1 by estimator-specific amounts; never test them against 1. (2) The mean log ratio is biased below 0 (−0.213 at h = 5) by Jensen's inequality. (3) Heavy tails: the arithmetic mean is driven by a few events; bootstrap by months and also report the median. (4) Models trained only on GMV variance (S12, S13) leave the covariance scale unidentified, so their ratios are meaningless without a separate scale fit on validation data (S13 caveat). (5) S4's paper and code disagree (variance vs volatility ratio, unconstrained vs long-only, mean vs median); state ours. (6) EW and VW are dominated by the market factor; the RLS portfolios probe residual covariance, so read them separately. (7) Good average calibration can hide event-day failure; always split event and ordinary origins. (8) CPI–FOMC windows that share days are dependent; cluster by month. (9) A day −1 origin puts the announcement-day return inside the target (CPI at 08:30 ET before the open, FOMC at 14:00 ET); compare origins separately (event_timing_origin)."
