- id: "stein_loss"
  name: "Stein loss (Gaussian KL), scored through its computable form: per-asset Gaussian NLL / multivariate QLIKE"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Canonical as Stein's loss (James & Stein 1961, read at metadata level only) and, in the forecast-inverted orientation used here, as Laurent+ 2013's 'Stein distance' and Patton & Sheppard 2009's multivariate QLIKE. The candidate list's separate Gaussian-NLL row is merged here as computable_form (review finding completeness#11); loglik_regret stays a separate nice-to-have entry. Primary endpoint under the adopted defaults; status, priority and section unchanged."
  priority: "must"
  plain_english: "Scores how well a predicted covariance matrix of about 500 stocks explains the returns that actually occur over the five trading days after an announcement, using the Gaussian likelihood; lower is better. Five days of returns cannot pin down a 500-stock matrix, so the full Stein loss is infinite for every model, and we score only the part that depends on the forecast. Comparing two models on this part gives exactly their Stein difference whenever Stein is finite. With five-day data it ranks models, on average, as Stein against the true covariance would."
  formula: '\mathrm{Stein}(\hat\Sigma,\Sigma^*)=\mathrm{tr}\big(\Sigma^*\hat\Sigma^{-1}\big)-\log\det\big(\Sigma^*\hat\Sigma^{-1}\big)-n=\underbrace{\big[\log\det\hat\Sigma+\mathrm{tr}(\hat\Sigma^{-1}\Sigma^*)\big]}_{\text{Gaussian NLL / multivariate QLIKE}}-\big[\log\det\Sigma^*+n\big]=2\,\mathrm{KL}\big(\mathcal N(0,\Sigma^*)\,\|\,\mathcal N(0,\hat\Sigma)\big)'
  computable_form: 'L_{m,e}=\frac{1}{n_e}\Big[\log\det\hat\Sigma_{m,e}+\mathrm{tr}\big(\hat\Sigma_{m,e}^{-1}\Sigma^*_e\big)\Big]=\frac{1}{n_e}\Big[2\sum_{i=1}^{n_e}\log C_{ii}+\frac15\big\|C^{-1}R_e\big\|_F^2\Big],\quad \hat\Sigma_{m,e}=CC^{\top},\ R_e=[r_{e,1},\dots,r_{e,5}]\in\mathbb R^{n_e\times5},\ \Sigma^*_e=\tfrac15R_eR_e^{\top};\qquad \Delta_e=L_{\mathrm{ref},e}-L_{\mathrm{cand},e}=\frac{\mathrm{Stein}_{\mathrm{ref},e}-\mathrm{Stein}_{\mathrm{cand},e}}{n_e}\ \text{(wherever Stein is finite; }\Delta_e>0\text{ favours the candidate, G1)};\qquad L=\frac{2}{n}\,\overline{\mathrm{NLL}}-\log2\pi,\ \ \overline{\mathrm{NLL}}=\frac15\sum_{d=1}^{5}\tfrac12\big[n\log2\pi+\log\det\hat\Sigma+r_d^{\top}\hat\Sigma^{-1}r_d\big]'
  conventions: "Notation: Σ̂ = forecast, Σ* = realized proxy (the brief's notation). Orientation: econometric, forecast inverted, as in [Laurent+ 2013] eq. 14 ('Stein distance') and the b = −2 member of [Patton & Sheppard 2009] eq. 50 ('multivariate QLIKE'); both equation numbers are from the working papers read (CIRANO WP 2009s-45; 2007 WP). [Ledoit & Wolf 2018] Def. 2.2 and [Ledoit & Wolf 2022] eq. 2.1 define Stein's loss with the TRUE matrix inverted; [Ledoit & Wolf 2018] Sec. 4.1 calls our orientation 'inverse Stein' (normalised by p, which matches our 1/n). Never switch to the statistics orientation. Normalisation: divide by n_e = |N_e|, the scored asset set of forward_looking_panel_filter (members of the G10 universe for the origin's month with a valid price on the origin day), identical for every model; [S4] reports unnormalised totals. Target: Σ*_e = (1/5)Σ_{d=1..5} r_{e,d} r_{e,d}′, uncentred, divisor 5, daily close-to-close simple total returns in decimals including the overnight gap, dividends and delisting returns (realized_covariance_target; G11). rank(Σ*) ≤ 5, so log det Σ* = −∞ and full Stein = +∞ for every PD forecast: never compute log det Σ* or full Stein on 5-day targets. Forecast object: Σ̂ is the forecast of the AVERAGE DAILY covariance over days 1–5, using information up to the close of day 0; a model that outputs a 5-day cumulative covariance must divide it by 5. Primary origin: close of announcement day 0, target = the next five exchange trading days (days 1–5). Secondary origin: close of day −1, target days 0–5 with Σ* = (1/6)Σ_{d=0..5} r r′ on the same per-day scale, scored against each model's forecast of the average daily covariance over days 0–5 (event_timing_origin). H1: the same formula at the ordinary-day origins of G4 (trading days t of the locked window with no FOMC/CPI day 0 in {t−1, …, t+5}), target days t+1..t+5, on the asset set S_t = N_t minus the stocks with their own earnings announcement in [t, t+5] (G4; announcement timing per earnings_event_handling), identical for all models; score the principal submatrix of the already repaired full forecast (no second repair), n = |S_t|. Sign (G1): every paired contrast is Δ = L_ref − L_cand (reference minus candidate), so Δ > 0 favours the candidate. Identity: Stein = n·L − (log det Σ* + n), so Δ_e = (Stein_ref − Stein_cand)/n wherever Stein is finite. Invariance (our derivation, checked numerically): for given matrices L(cΣ̂, cΣ*) = L(Σ̂, Σ*) + log c, and per-asset rescaling (DΣ̂D, DΣ*D) adds the same constant to every model, so for forecasts that the PD repair leaves unchanged Δ_e depends on neither return units nor stock scale. The repair is equivariant to a common change of units (its floor scales with the trace) but not to per-asset rescaling, so for floored forecasts Δ_e does depend on stock scale: apply the repair and score in decimal daily-return units only, never on volatility-standardised returns (review check with 40 assets and one rank-deficient forecast: standardising each stock's returns changed the paired difference from 0.47 to 6.24, while a common unit change left it unchanged). Robustness: for fixed Σ̂ ≻ 0, L is affine in Σ*; if Σ̂ uses only information at the origin and E[Σ*|F_t] equals the forecast's own target (same horizon and per-day scale, uncentred, overnight included), then E[L|F_t] = L(Σ̂, Σ_t), uniquely minimised at Σ̂ = Σ_t, so expected-loss rankings match those under the true covariance whatever the rank of Σ*. [Laurent+ 2013] prove consistency only for PD proxies (A3.1), [Patton & Sheppard 2009] admit PSD proxies such as r r′; the singular case is our inference. PD repair (G12; identical for every model, seed and origin type, including ours): S = (Σ̂ + Σ̂′)/2; f = ε·tr(S)/n, computed before flooring; eigendecompose S = UΛU′ in float64 and return U max(Λ, f) U′. ε comes from the grid {1e-4, 3e-4, 1e-3, 3e-3, 1e-2}: for each grid value tune EWMA's λ on the validation period 2017-01-01 to 2021-12-31 (G8; ewma_riskmetrics, baseline_tuning_parity), then choose the ε whose tuned EWMA has the lowest mean validation per-asset NLL (ties to the larger ε, our tie-break); one ε for every model, frozen before unlocking. Log the share of floored eigenvalues per model and origin, and report the primary contrast at the neighbouring grid values as a sensitivity. Failures (G13): a forecast with a non-finite entry, or whose float64 Cholesky fails after the repair (a non-positive trace gives a non-positive floor and fails here), in any seed, is a failure of that model at that origin and is never replaced or imputed. A failure of the candidate arm at any test origin voids its one-sided claim for that contrast (reported); an origin where only the reference fails is removed from that contrast only; failure counts are disclosed per model and event type. Aggregation: L per (model, seed, origin), averaged over the arm's seeds (seed_vs_period). The pooled unit is the event origin (G2): the locked window's 36 FOMC and 53 CPI events give 88 distinct origins, because the 2024-06-12 CPI (08:30 ET) and FOMC (14:00 ET) releases share one origin, one forecast per model and one Σ*; that origin counts once in pooled statistics and appears in both per-type analyses (FOMC 36, CPI 53); the same holds at the secondary origin. Pooled endpoint Δ̄ = equal-weighted mean of Δ_e over the 88 origins; they fall in 53 calendar months, 35 with two origins and 18 with one, none in November 2025. Primary inference (G1, G3, G5): the H2 primary contrast, candidate (pre, 1) vs reference (pre, 0), the v = 0 arm of G9 (matched_supervised_comparator), is one pre-registered test without multiplicity adjustment: paired month-cluster bootstrap (block_bootstrap; cluster = calendar month of day 0, B = 10,000); support the candidate iff the one-sided 95% percentile lower bound LB of the bootstrap distribution of Δ̄ is > 0. Sensitivities: DM-HLN (t = Δ̄/se_HAC, H_A: mean > 0), GW for the nested contrast on the fixed-length rolling refits of G6 (nested_model_tests), and the stationary bootstrap of G3. Numerics: float64; Cholesky Σ̂ = CC′; log det Σ̂ = 2Σ_i log C_ii; tr(Σ̂⁻¹Σ*) = (1/h)‖C⁻¹R‖²_F by a triangular solve (h = 5 primary, 6 secondary); never form Σ̂⁻¹ explicitly or call np.linalg.det (underflows at n ≈ 500); np.linalg.slogdet is acceptable. Sanity value: for Σ̂ = Σ_t, E[L] = (1/n) log det Σ_t + 1 (our derivation)."
  inputs: ["Σ̂_{m,e}: model m's n_e×n_e forecast of the average daily covariance over days 1–5, made at the close of day 0 (secondary: over days 0–5, made at the close of day −1), before the shared PD repair; one per seed", "R_e: n_e×5 matrix (n_e×6 at the secondary origin) of daily close-to-close simple total returns (decimal) for the target days, including overnight gaps, dividends and delisting returns (from realized_covariance_target)", "N_e: the origin's scored asset set (forward_looking_panel_filter; universe rule G10), identical for every model; at H1 origins S_t (G4)", "Event calendar (day 0 per FOMC/CPI event; 88 pooled origins, G2) and exchange trading calendar", "ε: eigenvalue-floor constant chosen once from the G12 grid on the 2017–2021 validation period (G8, G12)", "For H1: the ordinary-day origins and per-stock earnings exclusions of G4 (h1_noninferiority_test, earnings_event_handling)"]
  guards_against: "Forecasts that get each stock's volatility right but misstate correlations or the low-risk directions that portfolio optimisers lean on (the loss weights each forecast eigen-direction by the inverse of its predicted variance); rankings distorted by a noisy realized proxy (the loss is in the robust class); infinite or undefined scores from a rank-deficient 5-day realized covariance; dependence on return units (paired differences are invariant to a common unit change) and, while no eigenvalue is floored, on per-stock scale."
  typical_values: "S4 Table 7 (CD-DFM paper; out-of-sample 2022–2024; 239 S&P 500 stocks; Δ = 252-day forward uncentred realized second moment of daily log returns; full Stein, not divided by n; mean over daily anchors): CD-DFM 302 (5-seed mean), Sparse PCA 303, PCA 304, IPCA 309, GKX 309, NLS 322, Ledoit–Wolf 521; about 1.26 (CD-DFM) and 2.18 (LW) per asset by the extraction's arithmetic. These are finite only because Δ = 252 > n = 239 and are not comparable to our 5-day, n ≈ 500 endpoint, where full Stein is +∞ and only per-asset NLL differences are reported. Laurent+ 2013 (2009 WP, App. B, bivariate example): Stein loss 0.613 for a forecast at half the true covariance vs 0.144 at 1.5 times it (0.307 vs 0.072 per asset). Laurent+ 2012 (2010 WP; 125 MGARCH models; 10 US stocks; one-day forecasts; 5-minute realized covariance proxy; 75% MCS): MCS sizes under Stein 10 (full 1999–2008 sample), 2 (dot-com), 12 (calm), 26 (2007–08 crisis) vs 39, 38, 74 and 39 under the vech-Euclidean loss."
  pitfalls: "(1) +∞ with 5-day targets: rank(Σ*) ≤ 5 (≤ 390 with 5-minute bars, 395 with overnight returns) < n ≈ 500, so full Stein is +∞ for every PD forecast; [S4]'s finite values rely on Δ = 252 > n = 239. (2) Orientation trap: the statistics orientation of [Ledoit & Wolf 2018] and [Ledoit & Wolf 2022] needs Σ*⁻¹, is non-linear in the proxy and so not ranking-robust ([Laurent+ 2013] Prop. 3); under a noisy unbiased proxy its optimum (E[Σ*⁻¹|F_t])⁻¹ lies below Σ_t, so it rewards understating risk (review derivation); [Ledoit & Wolf 2022] warn against losses that invert the population covariance when p > n. (3) With singular Σ*, paired L differences estimate differences in expected Stein loss against the conditional covariance, not realized Stein differences; say so in the paper. (4) The smallest forecast eigenvalues dominate: tr(Σ̂⁻¹Σ*) = Σ_k û_k′Σ*û_k/λ̂_k. Raw naive, short-window sample and EWMA forecasts (λ = 0.94 uses about 75 effective returns per [RiskMetrics 1996]) are singular or near-singular at n ≈ 500; in the internal review simulation (n = 500, i.i.d. returns; not a published source) raw EWMA scored about 1.1e12 per asset vs −8.19 for the true covariance. The shared repair therefore largely sets these baselines' scores: choose ε once (G12) and report sensitivity to ε. (5) No silent fallbacks: [S4]'s code adds 1e-8·I and returns the Frobenius distance when Cholesky fails or the determinant sign is ≤ 0; [Bollerslev+ 2018] (fn. 16, CREATES working-paper numbering) replace non-PD HARQ forecasts with the estimation-window average realized covariance. (6) Scale mismatch: a 5-day cumulative forecast scored against the per-day Σ* costs about log 5 − 0.8 ≈ 0.81 per asset in expectation (our arithmetic, confirmed by simulation); check mean diag(Σ̂) against mean diag(Σ*) on validation. (7) Asymmetry: for a forecast c·Σ the expected excess loss per asset is log c + 1/c − 1, so understatement costs more than overstatement of the same size: 0.307 at 0.5× vs 0.072 at 1.5× (equal ±50% changes in variance, about 4 times as much) but 0.307 vs 0.193 at 0.5× vs 2× (equal factors, about 1.6 times); a model that inflates post-event risk loses less than one that understates it by the same factor (our arithmetic). (8) Levels are not comparable across papers, horizons, universes or event types: proxy noise raises expected levels while preserving robust rankings ([Patton 2011] 2006 WP p. 5); report paired differences (relative_skill_reporting). (9) Near-duplicate assets (two share classes of one firm, or two near-identical stocks) make every forecast ill-conditioned and amplify small tracking differences; the universe rule is fixed in advance by G10 (one share class per issuer, the most liquid in the prior month; pit_universe_survivorship), and as a robustness check the smaller-cap stock of any pair with correlation above 0.95 is dropped, as [De Nard+ 2021] do ([Engle+ 2019] drop the lower-volume stock instead). (10) Every model must output a forecast for every universe member, including short-history names, by its own pre-registered rule; never score models on different asset sets. (11) Per-origin differences are heavy-tailed and events share dates (G2): 19 CPI–FOMC pairs fall within 7 calendar days; in 10 the day 1–5 windows share trading days (all five on 12 Jun 2024, one origin), and in the other 9, exactly 7 days apart, the earlier window ends on the later announcement day [FOMC calendar] [BLS CPI schedule]; infer at the origin level with month clusters (G3), never per stock."
