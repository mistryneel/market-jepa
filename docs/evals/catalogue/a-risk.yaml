      title: "Supervisory framework for the use of 'backtesting' in conjunction with the internal models approach to market risk capital requirements"
      authors: "Basle Committee on Banking Supervision"
      year: 1996
      venue: "Basel: Bank for International Settlements, January 1996 (BCBS Standards; status: superseded)"
      url: "https://www.bis.org/publ/bcbs22.htm"
      peer_reviewed: false
