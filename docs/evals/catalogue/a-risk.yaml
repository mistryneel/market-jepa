- id: "relative_skill_reporting"
  name: "Report paired differences or skill relative to a stated baseline (not absolute loss levels)"
  category: "protocol"
  section: "A"
  status: "widely_used"
  status_note: "Widely used: peer-reviewed 2023–2026 users in our space are S1 Market-1T (per-month paired differences against a random-encoder floor), S11 Reis+ (gain stated relative to the best benchmark) and Johansson+ 2023 (regret relative to an in-sample oracle and quarters won against DCC-GARCH); the preprints GIFT-Eval, fev-bench and S5 Rahimikia+ normalise by a naive baseline. Priority and section unchanged."
  priority: "should"
  plain_english: "Noisy realized data inflates every model's loss, so raw loss numbers mean little on their own; we always report how much a model beats a named baseline on the same events. For the main likelihood loss this is a difference; for losses that are always positive it can also be a percentage improvement."
  formula: '\Delta_{e}=L_{\mathrm{ref},e}-L_{\mathrm{cand},e},\ \ \bar\Delta=\frac1E\sum_{e}\Delta_{e}\ (>0\Rightarrow\text{candidate better; G1}),\ E=88\ \text{pooled origins (G2)};\quad S^{\mathrm{ratio}}_{\mathrm{cand}}=1-\frac{\sum_eL_{\mathrm{cand},e}}{\sum_eL_{\mathrm{ref},e}};\quad S^{\mathrm{geo}}_{\mathrm{cand}}=1-\exp\Big(\frac1E\sum_{e}\log\mathrm{clip}\Big(\frac{L_{\mathrm{cand},e}}{L_{\mathrm{ref},e}},0.01,100\Big)\Big)\ (\text{fev-bench});\quad R^2_{OOS}=1-\frac{\sum_{i,t}(y_{i,t}-\hat y_{i,t})^2}{\sum_{i,t}y_{i,t}^2}\ (\text{S5, zero-forecast benchmark});\ \text{ratio forms for strictly positive losses only}'
  computable_form: '\text{Primary: } \bar\Delta \text{ in per-asset NLL units and } g=\bar\Delta/2 \text{ nats of average Gaussian log-likelihood gained by the candidate per asset-day (from } L=\tfrac2n\overline{\mathrm{NLL}}-\log2\pi;\ \text{our derivation)};\quad \text{win rate}=\frac1E\sum_e\Big(\mathbb 1[\Delta_e>0]+\tfrac12\mathbb 1[\Delta_e=0]\Big);\quad \text{GMV variance: }\bar\Delta_{\mathrm{GMV}}=\frac1E\sum_e\big(\log V_{\mathrm{ref},e}-\log V_{\mathrm{cand},e}\big);\quad \text{Frobenius, MSE, BW: } \bar\Delta,\ S^{\mathrm{ratio}},\ S^{\mathrm{geo}}'
  conventions: "Name the reference baselines before unlocking the test set: (i) EWMA RiskMetrics with λ = 0.94 and the shared PD repair as a fixed cheap reference (on our per-day scale the RiskMetrics 5-day forecast 5·Σ_{t+1|t} becomes Σ_{t+1|t}); (ii) the strongest event-blind baseline on the 2017–2021 validation period (G8); plus the pre-registered H1 and H2 contrasts (G4, G5). All comparisons use identical origins, assets and targets. Sign (G1): every paired contrast is Δ = L_ref − L_cand, so Δ > 0 favours the candidate; the ratio skills are oriented the same way (positive = candidate better). Use differences, never ratios, for losses that can be negative or are on a log scale (per-asset NLL, QLIKE). For strictly positive losses report both the ratio of sums (dominated by high-volatility events) and the geometric skill (each origin weighted equally; [fev-bench] clips ratios to [0.01, 100]) and say which is which. The pooled unit is the event origin: 88 pooled origins, 36 FOMC and 53 CPI (G2). Formal inference uses per-origin Δ with the paired month-cluster bootstrap and its one-sided 95% percentile lower bound (G3; block_bootstrap), with DM-HLN and GW as sensitivities (diebold_mariano, nested_model_tests), never the ratio skill. Also report the win rate (ties as half, as [fev-bench] does) by event type, year and volatility regime. Show absolute levels only next to the baseline's level on the same origins; never compare them with other papers. Relation to [Johansson+ 2023]: the candidate's per-day average log-likelihood minus the reference's equals (n/2)·Δ (our derivation)."
  inputs: ["Per-origin losses L_{m,e} for every model on identical origins (88 pooled, G2), assets and targets", "Pre-registered reference baselines and contrasts (candidate, reference; G1, G4, G5)", "Origin metadata (event type, date, cluster month, volatility regime) for stratified reporting"]
  guards_against: "Over-reading absolute loss levels that proxy noise inflates ([Patton 2011]) and that vary with event volatility; cross-paper comparisons of incomparable levels; hiding a weak result behind a weak or unstated baseline."
  typical_values: "S11 Reis+ (14 ETFs; F = 20; 2021–2023): CAB's mean distances about 20% below the best benchmark (DCC), yet CAB was not the lowest-variance GMV model. Johansson+ 2023 (one-day-ahead; 49 industry portfolios, the 25 largest S&P 500 stocks, 5 Fama–French factors): CM-IEWMA had lower average regret than DCC-GARCH in 87%, 71% and 51% of quarters respectively. S5 Rahimikia+ (US stocks; next-day excess returns; 2001–2023; zero-forecast benchmark): R²_OOS −0.03% for CatBoost and −1.27% for the best zero-shot TSFM at a 512-day context. Andersen & Bollerslev 1998: a correct GARCH(1,1) explains at most 1/3 of squared-return variation under Gaussian innovations."
  pitfalls: "(1) A weak reference inflates skill: [S5] argues a historical-mean benchmark makes weak models look good and uses a zero forecast; the reference changes conclusions, so fix it in advance. (2) Ratios of NLL or QLIKE values are meaningless (they can be negative and are on a log scale). (3) Ratio of sums and mean of ratios answer different questions; state which. (4) Failures follow G13 (stein_loss): an origin where only the reference fails is removed from that contrast and counted; any failure of the candidate voids its one-sided claim, and its skill is then reported as descriptive only. (5) Do not test on the ratio skill; test paired per-origin differences with the month-cluster bootstrap (G3), because shared event dates and overlapping windows break independence. (6) Use per-asset losses so origins with slightly different n_e weigh equally. (7) Levels without paired inference cannot establish a ranking: [S4] reports only levels, with Stein gaps among its factor models of 302–309 and no significance tests."
  used_by:
    - ref: "Andersen & Bollerslev 1998"
      title: "Answering the skeptics: Yes, standard volatility models do provide accurate forecasts"
      authors: "Andersen, T.G. & Bollerslev, T."
