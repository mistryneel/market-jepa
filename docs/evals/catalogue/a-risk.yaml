- id: "garch_univariate"
  name: "Univariate GARCH family (GARCH(1,1), GJR/threshold GARCH) and the GARCH-CCC covariance"
  category: "baseline"
  section: "A"
  status: "canonical"
  status_note: "Canonical (G14; Bollerslev 1986 read from the author's scan; Glosten+ 1993 read at abstract level only, so the GJR term is given in its standard practice form). Implementation details from the arch documentation; the analytic GJR condition was checked in arch's source during review (new_sources#2). Status, priority and section unchanged."
  priority: "should"
  plain_english: "Models each stock's variance as reacting to yesterday's surprise and decaying back to a long-run level; the GJR version lets bad news raise volatility more than good news. Paired with a fixed correlation matrix it gives a simple full covariance forecast."
  formula: 'r_{i,t}=\sqrt{h_{i,t}}\,z_{i,t}\ (\text{zero mean});\quad h_t=\omega+\alpha r_{t-1}^2+\beta h_{t-1};\quad h_t=\omega+(\alpha+\gamma\mathbb 1\{r_{t-1}<0\})r_{t-1}^2+\beta h_{t-1}\ (\text{GJR});\quad \bar h=\frac{\omega}{1-\alpha-\beta},\ h_{t+r|t}=\bar h+(\alpha+\beta)^{r-1}(h_{t+1}-\bar h)\ (\text{GJR with symmetric }z:\ \alpha\to\alpha+\gamma/2);\quad \hat v_i=\frac1h\sum_{r=1}^{h}h_{i,t+r|t};\quad \hat\Sigma^{\mathrm{CCC}}=\frac1h\sum_{r=1}^{h}D_{t+r|t}\,C\,D_{t+r|t},\ D_{t+r|t}=\mathrm{diag}(h_{i,t+r|t}^{1/2}),\ C=\mathrm{diag}(\tilde C)^{-1/2}\tilde C\,\mathrm{diag}(\tilde C)^{-1/2};\quad h=5\ (6\text{ at the close-of-day }-1\text{ origin})'
  conventions: "Per stock, zero mean (arch mean='Zero'), so h forecasts the uncentred second moment that Σ* targets (a constant-mean fit, arch's default, forecasts the variance around μ̂ and would need μ̂² added back); returns scaled by 100 for the optimiser and forecasts divided by 100²; Gaussian QML primary, Student-t sensitivity; GARCH(1,1) primary, GJR(1,1) sensitivity. Stationarity iff α + β < 1 (Bollerslev 1986 Thm 1); Bollerslev's (p, q) order convention (p = lagged variances, q = ARCH lags) is the reverse of arch's (p = ARCH lags, q = lagged variances), so check. GJR multi-step: with symmetric innovations the persistence is α + γ/2 + β and h̄ = ω/(1 − α − γ/2 − β) (our derivation); arch's analytic forecast for o = 1 and power = 2 uses the same weight 1/2 (implementation). Window and refits: T = 1,250 trading days (the dcc_family window, since the same fits supply D there; 1,000 days as a sensitivity); parameters are re-estimated at each refit date s_j of the G6 calendar from returns up to trading day s_j − 5 (G6, G7), as specified in dcc_family, and between refits h_{i,t} is filtered daily through each origin's close with that refit's parameters. Non-convergence (convergence flag ≠ 0) or α + β ≥ 0.999 (α + γ/2 + β for GJR): the pre-registered fallback α = 0.05, β = 0.90, γ = 0 (S1's code fallback), ω = 0.05 × the stock's mean squared return over the window, applied equally and logged per refit, never silent. Forecast: v̂_i = mean of h_{i,t+r|t} over r = 1..h, h = 5 at the close-of-day-0 origin and 6 at the close-of-day −1 origin. CCC: C̃ = QIS (nonlinear_shrinkage) of the uncentred covariance of the standardised residuals over the T trading days ending at the origin (the sample version is near-singular at p ≈ 500), renormalised to unit diagonal (Engle+ 2019 Sec. 3.5; QIS output is not a correlation matrix, and without this step diag(Σ̂^CCC)_i = v̂_iC̃_ii instead of v̂_i); Σ̂^CCC is exactly dcc_family's DCC-NL with a = b = 0, the diagonal-plus-correlation baseline. Missing days inside any window are 0 (G10). Shared PD repair (G12); a non-finite forecast or failed Cholesky after repair is a failure (G13)."
  inputs: ["daily returns per stock over the window", "distribution choice", "correlation estimate for CCC"]
  guards_against: "Foundation-model claims that ignore the classical volatility benchmark; in S6, GARCH beat every Kronos size on NASDAQ volatility."
  typical_values: "S6 (realized-volatility task, averaged over markets and frequencies): GARCH MAE 0.0405 and R² 0.2323 vs Kronos-large 0.0370 and 0.2624; on NASDAQ GARCH was best on both (MAE 0.1259, R² 0.2271 vs Kronos-base 0.1407, 0.0961). S1: GARCH(1,1) rank IC 0.0468 on 15-minute volatility change vs HAR-RV 0.0639. S11 (14 ETFs, F = 20): CCC-GARCH(1,1) Frobenius ×10^5 75.198 vs DCC 74.716."
  pitfalls: "(1) Order conventions differ. (2) Engle & Sheppard 2001 print the multi-step sum from i = 1 (likely a typo). (3) arch's docs say TARCH models have no closed-form forecasts beyond one step, but the example under that heading uses power=2.0; in arch's source the analytic multi-step error is raised only when power ≠ 2 (e.g. the absolute-value TARCH, power = 1), so the GJR form used here (o = 1, default power = 2.0) forecasts analytically, with the asymmetric term weighted by 1/2 exactly as in our α + γ/2 + β recursion. (4) Glosten+ 1993's original model is richer (monthly data, seasonal dummies, interest rate); the practice form is a simplification. (5) With the close-of-day-0 origin, the announcement-day shock enters h_{t+1}; with the day −1 origin it does not. (6) arch's default mean='Constant' and the ×100 scaling: without mean='Zero' and the division by 100² the forecast targets the wrong object or scale (a forecast 10^4 too large costs about 9.2 nats per asset)."
  used_by:
    - ref: "Bollerslev 1986"
      title: "Generalized autoregressive conditional heteroskedasticity"
      authors: "Bollerslev, T."
      year: 1986
      venue: "Journal of Econometrics, 31(3), 307-327"
      url: "https://doi.org/10.1016/0304-4076(86)90063-1"
