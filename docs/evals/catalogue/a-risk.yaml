- id: "rie_cleaning"
  name: "Rotation-invariant cleaning: RMT eigenvalue clipping, average oracle, and learned GMV-trained cleaners"
  category: "baseline"
  section: "A"
  status: "widely_used"
  status_note: "Upgraded from 'widely used (prov.)' to widely_used (G14): three peer-reviewed 2026 papers in our space use rotation-invariant cleaners (S11 RMT clipping, S12 average oracle and a learned cleaner, S13 learned eigenvalue shrinkage on LW eigenvectors). Bun+ 2017 was read as arXiv v1, so its equation numbers are from that version (G15). Priority nice, unchanged."
  priority: "nice"
  plain_english: "Keeps the directions of the historical correlation matrix but replaces their noisy variances with cleaned values: by discarding what random-matrix theory says is noise, by using averages learned from past data, or by a neural network trained to minimise portfolio risk."
  formula: 'C=\sum_k\lambda_ku_ku_k'',\ q=p/T;\quad \lambda_+=(1+\sqrt q)^2,\ \lambda^{clip}_k=\begin{cases}\lambda_k&\lambda_k>\lambda_+\\ \bar\lambda_{bulk}&\text{otherwise}\end{cases},\ \bar\lambda_{bulk}=\mathrm{mean}\{\lambda_j\le\lambda_+\};\quad \text{AO: }\hat\xi_k=\frac1J\sum_{j=1}^{J}R^2_{out}(t_j,u_k),\ R^2_{out}(t,w)=\frac1{T_{out}}\sum_{\tau=t+1}^{t+T_{out}}\Big(\sum_iw_iY_{i\tau}\Big)^2;\quad \hat\Xi=\sum_k\hat\xi_ku_ku_k'',\ \hat\Sigma=\hat D\hat\Xi\hat D'
  conventions: "Work on the correlation matrix of the window (T = 1,260 trading days ending at the origin close, the history every member has, G10; q ≈ 0.4) and rescale by sample volatilities D̂ (S12 projects every estimator this way); uncentred; missing days are 0 (G10). Clipping: λ_+ is the Marčenko–Pastur upper edge for a null correlation matrix (standard result; the edge formula was not transcribed in our verification notes); replacing the bulk by its mean preserves the trace; renormalise to unit diagonal. Notation: Bun+ 2017 use q = N/T, S11 writes q = T/N. Average oracle (Bun+ 2017 eq. 8.15; equation numbers from arXiv v1, G15; Y = volatility-normalised returns): eigenvalues indexed by rank k, estimated as the average out-of-sample variance of the k-th sample eigenvector over calibration windows. S12 calibrates once on 1990–2000 and holds them fixed; we re-estimate them at each refit date s_j of the G6 calendar (our adaptation): consecutive non-overlapping T_out = 60-day blocks, each preceded by its own 1,260-day estimation window, all inside the 2,520 trading days before s_j and ending on or before trading day s_j − 5 (G6, G7), on the universe in force at each block start. Learned cleaners (S12, S13) output eigenvalues or precision matrices trained on GMV variance, which leaves the overall scale unidentified: compare them on GMV only, or fit one scale on pre-2022 validation before scoring NLL or calibration (our suggestion); use them only if the authors' code is available, otherwise omit them. Flat per-day forecast for days 1–5 (days 0–5 at the close-of-day −1 origin). Not a member of the H1 strong set (G4). Shared PD repair (G12); a non-finite forecast or failed Cholesky after repair is a failure (G13)."
  inputs: ["daily returns over the window", "calibration windows for the average oracle", "trained cleaner weights (optional)"]
  guards_against: "Missing portfolio-aware competitors that are known to be strong on realized GMV variance."
  typical_values: "Bun+ 2017 (N = 500 most liquid stocks in the US, Japan and Europe; T = 1,000; T_out = 60): the regularised RIE gave the lowest out-of-sample Markowitz risk in all cases but one. S11 (14 ETFs, F = 20): RMT clipping Frobenius ×10^5 82.915 vs DCC 74.716; long-only GMV variance 0.002647. S12 Table 1 (n = 300, long-short, 5-day variance): NN 0.0149, QIS 0.0151, power mapping 0.0158, AO 0.0184; long-only turnover AO 10% vs NN 47%; Table 2 (n = 1,000, long-only, costs): AO 5-day realized variance (V5) printed as 9.7% vs NN 9.0% (units not stated and inconsistent with the Table 1 scale; compare only within the table), Sharpe 0.942. S13: its network had lower rolling 40-day risk than LW in 72.1% of 261 measurements (N = 50, n = 100)."
  pitfalls: "(1) q notation differs between sources. (2) The MP edge assumes i.i.d. returns; fat tails and volatility clustering blur it. (3) Learned cleaners cannot be scored on NLL or calibration without a separate scale. (4) Sample eigenvectors are kept (S12 lists this as a limitation). (5) S12 prints the oracle overlap with the square inside the sum, probably a typo."
  used_by:
