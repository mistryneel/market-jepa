      authors: "Bongiorno, Manolakis, Mantegna"
      year: 2026
      venue: "J. Finance and Data Science 12:100179 (2026); arXiv:2507.01918"
      url: "https://www.sciencedirect.com/science/article/pii/S2405918826000048"
