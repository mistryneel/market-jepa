    notes: "Clipping and AO from the formulas on the correlation matrix; re-estimate the AO eigenvalues at each refit as in the conventions; for learned cleaners use the authors' setups only if code is available, otherwise omit. Tests: clipping preserves the trace; AO on simulated i.i.d. data approaches the true eigenvalues; no AO calibration block ends after s_j − 5."
