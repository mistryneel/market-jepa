      title: "Improved estimation of the covariance matrix of stock returns with an application to portfolio selection"
      authors: "Ledoit, O. & Wolf, M."
      year: 2003
      venue: "Journal of Empirical Finance, 10(5), 603–621"
      url: "https://doi.org/10.1016/S0927-5398(03)00007-0"
      peer_reviewed: true
      source_type: "peer_reviewed"
