      title: "An extension of Kakutani's theorem on infinite product measures to the tensor product of semifinite w*-algebras"
      authors: "Bures, D."
      year: 1969
      venue: "Transactions of the American Mathematical Society, 135, 199-212"
      url: "https://doi.org/10.1090/S0002-9947-1969-0236719-2"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "metadata_only"
      accessed: "2026-11-12"
      how_used: "Standard attribution for the Bures metric (text not opened; metadata only)."
