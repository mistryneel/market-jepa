- id: "loglik_regret"
  name: "Log-likelihood regret against the period's realized covariance"
  category: "risk_metric"
  section: "A"
  status: "emerging"
  status_note: "Emerging: introduced for covariance predictors by Johansson+ 2023 (peer-reviewed, open code). Our derivation shows it equals ½ × Stein against the period's empirical covariance for a forecast held fixed over the period, so it is +∞ whenever the period has fewer days than assets; kept as a nice-to-have level diagnostic for small portfolio sets only, with PE removed from its scope (review finding endpoint_math#1). Priority and section unchanged."
  priority: "nice"
  plain_english: "Measures how far a model's average log-likelihood falls short of the best constant covariance chosen with hindsight for the same period. With 500 stocks and short windows that hindsight benchmark does not exist, so we use it only on a handful of sector or factor portfolios."
  formula: '\mathrm{Regret}=\bar\ell(\Sigma^{\mathrm{emp}})-\frac1T\sum_{t=1}^{T}\ell_t(\hat\Sigma_t),\quad \ell_t(\hat\Sigma_t)=\tfrac12\big(-n\log2\pi-\log\det\hat\Sigma_t-r_t^{\top}\hat\Sigma_t^{-1}r_t\big),\quad \Sigma^{\mathrm{emp}}=\frac1T\sum_{t=1}^{T}r_tr_t^{\top},\quad \bar\ell(\Sigma^{\mathrm{emp}})=\tfrac12\big(-n(\log2\pi+1)-\log\det\Sigma^{\mathrm{emp}}\big)\quad(\text{Johansson+ 2023, Sec. 4.3})'
  computable_form: '\text{Fixed forecast: } \mathrm{Regret}=\tfrac12\big[\log\det\hat\Sigma+\mathrm{tr}(\hat\Sigma^{-1}\Sigma^{\mathrm{emp}})-\log\det\Sigma^{\mathrm{emp}}-n\big]=\tfrac12\,\mathrm{Stein}(\hat\Sigma,\Sigma^{\mathrm{emp}});\ \text{time-varying: } \tfrac12\Big[\frac1T\sum_t\big(\log\det\hat\Sigma_t+r_t^{\top}\hat\Sigma_t^{-1}r_t\big)-\log\det\Sigma^{\mathrm{emp}}-n\Big]\ (\text{our derivation, checked numerically});\ \text{computed only on } x_t=W^{\top}r_t\ (k\ll T \text{ portfolios}) \text{ with forecasts } W^{\top}\hat\Sigma_tW'
  conventions: "[Johansson+ 2023] setting: one-day-ahead forecasts, zero-mean returns, regret per calendar quarter; regret can occasionally be negative when forecasts vary over time. Σ^emp must be PD, i.e. T ≥ k with linearly independent returns (the zero-mean 1/T form loses no rank to demeaning). At n ≈ 500 neither a 5-day window nor a quarter (~63 days) qualifies, so apply it to a small pre-registered portfolio set W (e.g. 11 GICS-sector value-weighted portfolios, weights set at each kept origin from origin-time market equity on that origin's asset set S_t, G4; our design) over calendar quarters of the G4 ordinary-day origins. Score each day once: within a quarter take ordinary origins in date order and keep an origin only if it is at least 5 trading days after the last kept one, so the kept origins' days 1–5 are disjoint; each kept origin scores its own days 1–5 with its per-day 5-day forecast, and the sum over t runs over these T = 5 × (number of kept origins) distinct days; if T < k, skip the quarter and log it. Σ^emp is the zero-mean (1/T)Σ x_t x_t′ over those days, not a demeaned ddof-1 covariance. Log-determinants by Cholesky or slogdet. Paired regret differences on the same portfolio returns equal paired differences of the period-average Gaussian NLL −(1/T)Σ_t ℓ_t, which already contains the ½ (as stein_loss's NLL̄ does; log det Σ^emp cancels): in the G1 orientation Regret(ref) − Regret(cand) = (k/2)·Δ, with Δ = L_ref − L_cand the per-portfolio NLL difference on the k portfolios; equivalently, half the paired differences of the period mean of log det Σ̂^W_t + x_t′(Σ̂^W_t)⁻¹x_t with Σ̂^W_t = W′Σ̂_tW. So regret adds no ranking information beyond the NLL; it is a level diagnostic (distance to an in-sample oracle)."
  inputs: ["Pre-registered low-dimensional portfolio weights W (k ≪ T)", "Daily portfolio returns x_t = W′r_t over each period", "Each model's per-day forecast mapped to W′Σ̂_tW", "Period definition (calendar quarter)"]
  guards_against: "Reading absolute likelihoods without a scale: regret measures the gap to an in-sample oracle, giving a level that is comparable across quarters for the same portfolio set."
  typical_values: "Johansson+ 2023 (one-day-ahead; 49 industry portfolios 1969–2022, the 25 largest S&P 500 stocks 2010–2022, 5 Fama–French factors 1963–2022; quarterly regret): CM-IEWMA had lower average regret than DCC-GARCH in 87%, 71% and 51% of quarters for industry, stock and factor data. Not comparable to our 5-day forecasts or to n ≈ 500."
  pitfalls: "(1) +∞ or undefined whenever T ≤ n: every 5-day event window and every calendar quarter at n ≈ 500; never use it on the full universe or as a primary endpoint. (2) The oracle is in-sample (prescient), so regret is not a forecast benchmark and can be negative for time-varying forecasts. (3) Code pitfalls in cvxgrp/cov_pred_finance: experiment_utils.log_likelihood takes the log of np.linalg.det, which underflows to −∞ for large daily covariance matrices; the notebook's PRESCIENT benchmark uses np.cov (demeaned, ddof = 1) rather than the paper's zero-mean 1/T; log_likelihood_sequential appears to return None. (4) The portfolio set drives the value; pre-register W and keep it identical for all models. (5) Horizon mismatch: Johansson's predictors are one-day-ahead, ours are 5-day averages; state how days are scored."
  used_by:
    - ref: "Johansson+ 2023"
      title: "A simple method for predicting covariance matrices of financial returns"
      authors: "Johansson, K., Ogut, M. G., Pelger, M., Schmelzer, T., & Boyd, S."
      year: 2023
      venue: "Foundations and Trends in Econometrics, 12(4), 324-407"
      url: "https://doi.org/10.1561/0800000047"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      version_read: "arXiv version read; publisher page blocked"
      accessed: "2026-11-12"
      how_used: "Introduces quarterly log-likelihood regret against the per-quarter empirical covariance (Sec. 4.3), reports its distribution for IEWMA, CM-IEWMA and DCC-GARCH, and implements the metric in cvxgrp/cov_pred_finance."
  relevance:
    H1: "low"
    H2: "none"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "An optional level diagnostic for H1 on small portfolio sets; it ranks models exactly like the NLL, so it adds no evidence for H2."
  implementation:
    libraries: ["numpy", "pandas", "cvxgrp/cov_pred_finance"]
    notes: "Do not reuse cvxgrp's metric code without replacing det with slogdet or Cholesky and np.cov with the zero-mean 1/T estimator. Compute per quarter for the pre-registered portfolio set. Unit tests: for a constant forecast, regret = ½·Stein(Σ̂, Σ^emp) exactly and is ≥ 0 (Σ^emp maximises the average zero-mean Gaussian log-likelihood among constant covariances); the empirical log-likelihood formula matches a direct average (both checked in a scratch script outside the repository)."
  adoption_cost: "low"
  verified: true
  related: ["stein_loss", "relative_skill_reporting", "iterated_ewma"]
- id: "gmv_realized_variance"
  name: "Realized variance of the global-minimum-variance (GMV) portfolio"
  category: "risk_metric"
  section: "A"
  status: "widely_used"
  status_note: "Widely used (G14): the first use of realized GMV variance as a covariance-forecast criterion was not established. Chan+ 1999 is the earliest source in our registry; Engle & Colacito 2006, usually cited as the origin of portfolio-variance losses, was read at metadata level only and, by secondary accounts, uses mean-variance portfolios with a risk-free asset rather than the fully invested GMV. Credible 2023–2026 users in our space are cited (Johansson+ 2023, S11, S12, S13). Per-origin log-ratio pooling, constant weights over the window and the earnings-free asset set for H1 (G4) are our design. Priority and section unchanged."
  priority: "must"
  plain_english: "Build the lowest-risk fully invested portfolio that each model's forecast implies, hold it for the days after the forecast, and measure how much it actually moved. A better covariance forecast should produce a portfolio that really is less risky."
  formula: 'w_t=\frac{\hat\Sigma_t^{-1}\mathbf{1}}{\mathbf{1}^\top\hat\Sigma_t^{-1}\mathbf{1}},\quad w_t^{\mathrm{LO}}=\arg\min_{w}\,w^\top\hat\Sigma_t w\ \text{s.t.}\ \mathbf{1}^\top w=1,\ w\ge 0,\quad \Sigma^*_t=\frac{1}{h}\sum_{d=1}^{h}r_{t+d}r_{t+d}^\top,\quad V_t(\hat\Sigma_t)=w_t^\top\Sigma^*_t w_t=\frac{1}{h}\sum_{d=1}^{h}\big(w_t^\top r_{t+d}\big)^2=\frac{\mathbf{1}^\top\hat\Sigma_t^{-1}\Sigma^*_t\hat\Sigma_t^{-1}\mathbf{1}}{(\mathbf{1}^\top\hat\Sigma_t^{-1}\mathbf{1})^2},\quad \Delta_{\mathrm{GMV},t}=\log V_t(\hat\Sigma^{\mathrm{ref}}_t)-\log V_t(\hat\Sigma^{\mathrm{cand}}_t)\ (>0\ \text{favours the candidate; G1}),\quad \bar\Delta_{\mathrm{GMV}}=\frac{1}{E}\sum_{t}\Delta_{\mathrm{GMV},t}'
  computable_form: '\hat\Sigma_t=LL^\top,\ x=L^{-\top}L^{-1}\mathbf{1},\ w_t=\frac{x}{\mathbf{1}^\top x},\ \hat V_t=w_t^\top\hat\Sigma_t w_t=\frac{1}{\mathbf{1}^\top x},\ V_t=\frac{1}{h}\sum_{d=1}^{h}(w_t^\top r_{t+d})^2,\ \text{report }\bar\Delta_{\mathrm{GMV}},\ \exp(-\bar\Delta_{\mathrm{GMV}})-1\ \text{(geometric-mean change of the candidate''s }V\text{) and }\sqrt{252\,\overline{V}}'
  conventions: "Origins and horizon: weights come from Σ̂_t at the origin t only. H2 primary: t = close of day 0, target days 1–5 (h = 5); secondary: t = close of day −1, target days 0–5 (h = 6). Events sharing an origin are one observation (G2): the 36 FOMC and 53 CPI events give 88 pooled origins (2024-06-12 once), and the per-type analyses use 36 and 53 with that origin in both. H1: the ordinary-day origins of G4, i.e. trading days t of the locked window with no FOMC/CPI day 0 in {t−1, …, t+5}, target days t+1..t+5 (h = 5). At each H1 origin the stocks with their own earnings announcement in [t, t+5] are dropped for all models (G4; announcement timing per earnings_event_handling), and GMV weights are formed from the principal submatrix of the already repaired Σ̂_t on the remaining set S_t (the forecast's own marginal; no refit, no second repair), so both H1 co-primaries are scored on the same stocks. Forecast: the model's forecast of the average daily covariance over the h target days on N_t (forward_looking_panel_filter; universe G10), after the shared PD repair of stein_loss (G12). Failures (G13): a forecast with a non-finite entry or a failed float64 Cholesky after the repair is a failure, never replaced; a candidate failure at any test origin voids that candidate's one-sided claim for the contrast (reported), and an origin where only the reference fails is removed from that contrast only, with counts. Returns: daily simple close-to-close returns including overnight; the delisting return on its delisting day and 0 afterwards (cash); halts 0 and flagged; no forward-looking completeness filter (G11; realized_covariance_target). Simple returns make w′r the exact portfolio return. Σ* is uncentred with divisor h, identical to the primary endpoint's. Holding: constant weights over the window (rebalanced daily back to w_t), so V_t is exactly w′Σ*w; LW 2017 and Engle+ 2019 hold shares fixed within the month, run only as a sensitivity. Variants: GMV_u (fully invested, shorts allowed) is primary; GMV_lo (long-only, no cap) is always reported alongside; a 2% cap as in Chan+ 1999 is optional. Units: daily variance of decimal returns; display annualized volatility √(252 × mean V) (Engle+ 2019 annualize with 252, LW 2017 with 250). Sign and pooling (G1): Δ_GMV,t = log V_t(ref) − log V_t(cand) on the same asset set and days, positive when the candidate's portfolio had lower realized variance; multi-seed arms enter with log V averaged over their seeds (seed_vs_period); report Δ̄_GMV and the geometric-mean change of the candidate's V, exp(−Δ̄_GMV) − 1, by event type (FOMC, CPI, pooled), origin type and year; never average raw V across origins. Inference (G3): paired month-cluster bootstrap of Δ_GMV keeping all arms together, B = 10,000; cluster = calendar month of day 0 for event origins (also at the day −1 origin) and of the origin date for H1 origins; decide with the one-sided 95% percentile lower bound LB. H1 co-primary (G4): for each k in S = {DCC-NL, QIS nonlinear shrinkage, fundamental industry+style factor model, EWMA with λ tuned on validation (G8)}, Δ_GMV,k,t = log V_t(k) − log V_t(ours), ours = the H1 arm (pre, 0) of matched_supervised_comparator; non-inferior to k iff LB_95(Δ̄_GMV,k) > −δ_GMV with δ_GMV = log(1.05) (a 5% realized-variance tolerance); H1 needs this and the NLL co-primary against every k (intersection–union, each one-sided at 5%, no multiplicity adjustment; h1_noninferiority_test), with one bootstrap index matrix shared by both co-primaries. H2 contrasts (descriptive under G5): candidate (pre, 1) vs reference (pre, 0), and (pre, 1) vs (sup, 1); post-event table of (pre, 1) vs each section-A baseline. Sensitivities: lw_variance_test, DM-HLN on Δ_GMV (t = Δ̄/se_HAC, H_A: mean > 0) and the stationary bootstrap of G3. Properties (our algebra, checked numerically): V is invariant to the forecast's scale, since w(cΣ̂) = w(Σ̂), and homogeneous of degree 1 in Σ*; V equals L_V(Σ̂, Σ*, m) of Engle+ 2019 eq. 4.1 with m = 1; V is linear in Σ*, so E[V_t | F_t] = w_t′Σ_t w_t whenever E[Σ*_t | F_t] = Σ_t, and expected-V rankings match true-covariance rankings whatever the rank of Σ*."
  inputs: ["Σ̂_t for every model, seed and origin: n_t × n_t symmetric forecast of the average daily covariance over the h target days, after the shared PD repair (stein_loss, G12)", "Daily simple returns r_{t+1..t+h} for every stock in N_t (close-to-close including overnight; delisting return on its delisting day, 0 afterwards; halts 0 and flagged; G11)", "N_t at each origin (forward_looking_panel_filter; universe G10); for H1, each stock's earnings announcement dates (G4; earnings_event_handling)", "Origin list with origin type (H2 day-0 close, H2 day −1 close, H1 ordinary), event type (FOMC, CPI) and cluster month (G3)", "Pre-registered contrasts (candidate, reference) and the H1 margin δ_GMV = log(1.05) (G4)", "A convex QP solver for the long-only variant"]
  guards_against: "Covariance forecasts that score well on matrix losses but build riskier portfolios; errors in the low-variance directions that optimizers exploit; reliance on a single statistical loss (S4 and S11 rank models differently under matrix and portfolio metrics, and S12 argues a Frobenius optimum is not a GMV optimum)."
  typical_values: "None are comparable to our 5-day, ~500-stock, event-window setting; context given for each. Chan+ 1999 (random 250 NYSE/AMEX stocks, monthly data, long-only GMV capped at 2%, 12-month buy-and-hold, 1973–1997): realized annualized SD 12.59%–12.94% across seven covariance models, vs 15.54% value-weighted and 16.62% equal-weighted. S12 (random 300-stock US baskets, 1,000 backtests started 2000–2019, rebalanced every 5 days, no costs): annualized volatility long-short 10.9% (neural cleaner), 11.1% (QIS), 11.7% (sample) up to 12.1% (average oracle); long-only 13.5% vs 14.2%–14.6% for the others; V5 long-short 0.0149–0.0184 (unitless as printed). S12 (top 1,000 US stocks, long-only, with costs, 2000–2024): 11.9% (neural), 12.4% (DCC), 12.5%–12.6% (shrinkage and sample), 19.5% (market-cap weights). S11 (14 ETFs, 2021–2023, long-only, daily rebalancing; σ² as printed, units unclear): naive lagged 20-day covariance 0.001991 (lowest), DCC-NL 0.002048, DCC 0.002075, CAB 0.002293, 1/N 0.018132. S13 (50 S&P 500 stocks, Jan 2024–Jul 2025): neural shrinkage had lower rolling 40-day GMV risk than Ledoit–Wolf in 72.1% of 261 windows."
  pitfalls: "(1) Scale-blind: halving or doubling every forecast variance leaves V unchanged, so GMV variance cannot show that post-event risk levels are right; always pair it with risk_calibration_ratio. (2) Not scale-free across events: V grows with each event's volatility, so raw averages are dominated by episodes such as the 2022 tightening; use log ratios and report by year (regime_reporting). (3) Constraints compress differences: long-only acts like shrinkage (Jagannathan & Ma 2003, abstract); Chan+ 1999's capped long-only GMV volatilities span only 12.59–12.94% across seven models; in S12 long-only MLE, LS and QIS all sit near 14.2%; LW 2017 found that no-short-sales helps the sample covariance but hurts shrinkage estimators. Constrained GMV therefore confounds covariance quality, and GMV_u is primary. (4) GMV_u loads on the smallest eigenvalues of Σ̂ (through Σ̂⁻¹1), so for near-singular baselines (naive, EWMA) the shared eigenvalue floor largely determines V; report the share of floored eigenvalues per model. (5) Requiring complete returns over the target days is a look-ahead universe filter that LW 2017 and De Nard+ 2021 acknowledge; keep names that delist. (6) Models trained only on GMV variance (S12, S13) leave the covariance scale unidentified; compare them on GMV only (rie_cleaning). (7) Matrix losses and GMV can disagree: in S11 a ~20% Frobenius gain did not give the lowest GMV variance, and the naive 20-day covariance was lowest at daily rebalancing. (8) Seeds use incompatible conventions (S4 code long-only vs paper unconstrained; S11 demeaned with unclear units; S12's V5 units differ between tables), so never compare levels across papers. (9) Each V_e rests on only h squared returns; log V is biased downward by this noise, roughly equally for both models, so the bias largely cancels in ℓ_e but not in log V levels (our note). (10) Degenerate portfolios: S12 reports gross leverage from 2.13 to 5.02 for unconstrained GMV across estimators; report gross leverage Σ|w_i| and effective N = 1/Σw_i² so that a win from an extreme portfolio is visible."
