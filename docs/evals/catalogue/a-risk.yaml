  implementation:
    libraries: ["arch", "numpy", "scipy"]
    notes: "Step 1 (each refit s_j): per stock, arch_model(100·r, mean='Zero', vol='GARCH', p=1, q=1, dist='normal').fit(disp='off') on returns up to trading day s_j − 5 (assert the last estimation date); apply the convergence fallback; store (ω_i, α_i, β_i) by PERMNO and refit. Step 2: standardise ε = r/√h with r and h in the same units; build C̃ (QIS of nonlinear_shrinkage on (1/T)Σεε′ for DCC-NL; (1/T)Σεε′ for DCC) and renormalise it to unit diagonal. Step 3: maximise the 2MSCLE composite likelihood over (a, b) with a bounded optimiser (e.g. scipy.optimize.minimize with L-BFGS-B on a reparametrisation that enforces a, b ≥ 0 and a + b < 1), pairs (i, i + 1) in ascending PERMNO order, each pair using its 2 × 2 block of C. Step 4 (each origin): filter h and Q through the origin close with the refit's parameters, recompute C on the origin's asset set, build R_{t+1}, h_{t+r|t} and E_t[R_{t+r}], average over r = 1..h (h = 5 or 6), divide by 10^4 and apply the shared repair. Tests: with a = b = 0 the forecast equals garch_univariate's GARCH-CCC; E_t[R_{t+r}] has unit diagonal; diag(Σ̂) equals the averaged GARCH variances; the composite likelihood recovers (a, b) on simulated DCC data; mean diag(Σ̂) is on the scale of mean squared returns on validation (catches a 10^4 scale error)."
