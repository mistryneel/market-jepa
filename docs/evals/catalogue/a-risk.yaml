- id: "bures_wasserstein"
  name: "Bures–Wasserstein distance"
  category: "risk_metric"
  section: "A"
  status: "emerging"
  status_note: "Emerging: used as a secondary covariance metric by S4 CD-DFM (2026) and as an error metric by Huang+ 2026 (both preprints); defined for PSD matrices by Bhatia+ 2019; Bures 1969 is the standard attribution (metadata only). No source shows it proxy-robust and our derivation shows it is not, so it stays a descriptive extra. Priority and section unchanged."
  priority: "nice"
  plain_english: "A geometric distance between the predicted and realized covariance matrices, equal to the optimal-transport distance between the two zero-mean Gaussian distributions; lower is better. It stays finite when the realized matrix is singular, but with noisy realized data it favours forecasts that understate risk, so it is only a descriptive extra."
  formula: 'd_{BW}(A,B)=\Big[\mathrm{tr}A+\mathrm{tr}B-2\,\mathrm{tr}\big(A^{1/2}BA^{1/2}\big)^{1/2}\Big]^{1/2}=\min_{U\in\mathcal U(n)}\big\|A^{1/2}-B^{1/2}U\big\|_F=W_2\big(\mathcal N(0,A),\mathcal N(0,B)\big)\quad(\text{Bhatia+ 2019 eq. 1, Thm 1})'
  computable_form: 'A=\hat\Sigma_{m,e}\succ0,\ B=\Sigma^*_e=\tfrac15R_eR_e^{\top}:\quad \mathrm{tr}\big(\hat\Sigma^{1/2}\Sigma^*\hat\Sigma^{1/2}\big)^{1/2}=\sum_{k=1}^{5}\sqrt{\lambda_k\big(\tfrac15R_e^{\top}\hat\Sigma R_e\big)}\ \ (\text{our derivation: nonzero eigenvalues of } GG^{\top} \text{ and } G^{\top}G \text{ coincide, } G=\hat\Sigma^{1/2}R_e/\sqrt5),\qquad d^2_{BW}=\mathrm{tr}\hat\Sigma+\frac15\|R_e\|_F^2-2\sum_{k=1}^{5}\sqrt{\max\big(\lambda_k(\tfrac15R_e^{\top}\hat\Sigma R_e),0\big)},\quad \text{report } \frac{d^2_{BW}}{n_e}\times10^{4}'
  conventions: "Always label whether the distance or its square is reported: [S4]'s paper prints the distance (outer square root) but its code returns the squared distance and does not say which produced Table 7. We score d²_BW per origin, divided by n_e (per asset) and ×10^4 (percent² units from decimal returns), averaged equally over origins (88 pooled origins, G2); d is shown only for display. The metric is symmetric, so argument order does not matter. Score the same PD-repaired Σ̂ and the same Σ* as stein_loss; BW itself needs only PSD inputs ([Bhatia+ 2019]). The 5×5 shortcut is exact (checked numerically against a full matrix square root); clamp tiny negative eigenvalues of the 5×5 matrix at 0. Scale: d² scales linearly with a common rescaling of both matrices, so paired differences depend on units and are dominated by high-variance assets."
  inputs: ["Σ̂_{m,e} after the shared PD repair", "R_e: n_e×5 matrix of daily returns for days 1–5 (Σ* = R_eR_e′/5)"]
  guards_against: "Provides a likelihood-free geometric distance that stays finite for a singular realized covariance and that reviewers from the optimal-transport literature may expect; it does not guard against proxy noise."
  typical_values: "S4 Table 7 (CD-DFM paper; 2022–2024 test; 239 S&P 500 stocks; Δ = 252-day forward realized second moment; daily log-return scale; unnormalised; distance vs squared distance unclear because paper and code disagree): Sparse PCA 0.0261 (best), CD-DFM 0.0262, PCA 0.0265, GKX 0.0277, LW 0.0279, IPCA 0.0288, NLS 0.1197; NLS was second-best on Stein there but worst on Bures. Huang+ 2026 report BW errors only in a figure (12 stocks, monthly). Not comparable to a 5-day, n ≈ 500 setting."
  pitfalls: "(1) Not proxy-robust (our derivation): d²_BW is not affine in Σ* (the cross term tr((Σ̂^{1/2}Σ*Σ̂^{1/2})^{1/2}) is concave in Σ*), so by [Laurent+ 2013] Prop. 3 it is not ranking-consistent. In the scalar case d² = (√h − √s)², i.e. MSE on volatilities; with a 5-day Gaussian proxy its expected-loss minimiser is (E√s)² ≈ 0.905σ², so it rewards understating variance by about 9.5% (confirmed by simulation: a 0.9σ² forecast beats the true σ² in expectation). (2) Paper–code mismatch in [S4] (squared vs not): label what is reported. (3) Scale-dependent like Frobenius: dominated by high-variance assets and volatile events. (4) A full matrix square root of a near-singular forecast is numerically fragile; use the 5×5 shortcut or a symmetric eigendecomposition with clamped eigenvalues ([S4]'s code clamps). (5) Do not use it for model selection, MCS membership or H1 non-inferiority."
  used_by:
    - ref: "Bhatia+ 2019"
      title: "On the Bures-Wasserstein distance between positive definite matrices"
      authors: "Bhatia, R., Jain, T. & Lim, Y."
      year: 2019
      venue: "Expositiones Mathematicae, 37(2), 165-191"
      url: "https://doi.org/10.1016/j.exmath.2018.01.002"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Defines d(A, B) for PSD matrices (eq. 1), proves the Procrustes form (Thm 1) and its equality with the 2-Wasserstein distance between zero-mean Gaussians; no forecasting or finance content."
