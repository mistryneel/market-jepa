- id: "nonlinear_shrinkage"
  name: "Nonlinear shrinkage: analytical NLS (Ledoit–Wolf 2020) and quadratic-inverse shrinkage QIS (Ledoit–Wolf 2022)"
  category: "baseline"
  section: "A"
  status: "canonical"
  status_note: "Canonical (G14; originals Ledoit & Wolf 2020 and 2022, read in published form). QIS is S12's key baseline and NLS is in S4. QIS is the shrinkage member of the H1 strong set (G4). The trace-preserving step comes from the authors' reference code QIS.m (version 01/2024, opened in review), not from the paper's formula as transcribed. Status, priority and section unchanged."
  priority: "must"
  plain_english: "Keeps the directions found in the historical covariance but corrects each of their variances separately, shrinking extreme ones the most. It is the state of the art for estimating a large covariance from a limited history."
  formula: 'S=\sum_{i=1}^{p}\lambda_iu_iu_i'',\ c=p/T;\quad \text{NLS: }h=T^{-1/3},\ h_j=\lambda_jh,\ \tilde f(\lambda_i)=\frac1p\sum_j\frac{3}{4\sqrt5h_j}\Big[1-\frac15\Big(\frac{\lambda_i-\lambda_j}{h_j}\Big)^2\Big]^+,\ \mathcal H(\lambda_i)=\frac1p\sum_j\Big\{-\frac{3(\lambda_i-\lambda_j)}{10\pi h_j^2}+\frac{3}{4\sqrt5\pi h_j}\Big[1-\frac15\Big(\frac{\lambda_i-\lambda_j}{h_j}\Big)^2\Big]\log\Big|\frac{\sqrt5h_j-\lambda_i+\lambda_j}{\sqrt5h_j+\lambda_i-\lambda_j}\Big|\Big\},\ \tilde d_i=\frac{\lambda_i}{[\pi c\lambda_i\tilde f(\lambda_i)]^2+[1-c-\pi c\lambda_i\mathcal H(\lambda_i)]^2},\ \hat\Sigma=\sum_i\tilde d_iu_iu_i'';\quad \text{QIS: }\tilde d_i^{-1}=(1-c)^2\lambda_i^{-1}+2c(1-c)\lambda_i^{-1}\hat\theta(\lambda_i^{-1})+c^2\lambda_i^{-1}\mathcal A^2(\lambda_i^{-1}),\ \hat\theta(x)=\frac1p\sum_j\lambda_j^{-1}\frac{\lambda_j^{-1}-x}{(\lambda_j^{-1}-x)^2+h^2\lambda_j^{-2}},\ \mathcal A^2(x)=\hat\theta(x)^2+\Big[\frac1p\sum_j\lambda_j^{-1}\frac{h\lambda_j^{-1}}{(\lambda_j^{-1}-x)^2+h^2\lambda_j^{-2}}\Big]^2,\ h=\min(c^2,c^{-2})^{0.35}p^{-0.35},\ d_i=\tilde d_i\,\frac{\sum_j\lambda_j}{\sum_j\tilde d_j}\ (\text{trace step of the reference code QIS.m}),\ \hat\Sigma=\sum_id_iu_iu_i''\ \Rightarrow\ \mathrm{tr}\,\hat\Sigma=\mathrm{tr}\,S'
  computable_form: '\hat\Sigma^{(1:5)}_t=\hat\Sigma_t\ \ (\text{flat per-day forecast})'
  conventions: "Notation: the papers write p for dimension and n for sample size; here p = |N_e| assets (the origin's asset set, identical for every model) and T = window length, c = p/T. S = (1/T)Σ r r′, uncentred, over the T trading days ending at the origin close (covShrinkage k = 0); demeaned data would use divisor T − 1 and T − 1 throughout (LW 2020 Remark 2.1). Primary and H1 strong-set member (G4): QIS of the covariance, including the reference code's trace step (formula). Window T from the declared grid {252, 756, 1,260} (our grid; at most the 1,260-day history every member has, G10), chosen on the pre-2022 validation origins by mean per-asset NLL with the frozen ε (G8, G12; baseline_tuning_parity) and then frozen. When T < p the singular case applies: LW 2022 Sec. 5 gives the p − T null eigenvalues d̃ = 1/((c − 1)·mean of the inverse non-null eigenvalues); the rest of that branch was not transcribed from the paper, so port QIS.m's singular branch. Sensitivities: NLS (LW 2020) on the same window; S12's route, QIS of the sample correlation renormalised to unit diagonal and rescaled by sample volatilities. Recomputed at every origin from its own lookback; no trained parameters, so the G6 refit calendar does not apply (walk_forward). Forecast: the estimate is the per-day forecast for days 1–5, and for days 0–5 at the close-of-day −1 origin (our convention). Missing data (G10): any missing day inside the window is set to 0 before estimation, identically for every model; no member is dropped, no window shortened, no pairwise-complete estimation. PD repair (G12; stein_loss) applied to every forecast (normally inactive, QIS output being PD). A non-finite forecast or a failed Cholesky after repair is a failure (G13): logged and never replaced (S4's code silently falls back to linear LW; that is forbidden); as the reference arm it removes that origin from that contrast only, with counts disclosed. LW 2020 advise against NLS when p < 12."
  inputs: ["daily returns over the window ending at the origin", "window length T"]
  guards_against: "Beating only weak shrinkage; at n ≈ 500 a strong model must at least match the best static estimator."
  typical_values: "S4 Table 7 (252-day horizon, n = 239; unnormalised Stein): NLS 322 (second best; CD-DFM 302) but worst Bures 0.1197, top-eigenvalue ratio 5.61 and GMV/ERC calibration 1.42/1.54. S12 Table 1 (n = 300, long-short): QIS 5-day variance 0.0151 vs NN 0.0149, LS 0.0163; annualised vol 11.1%. S12 Table 2 (n = 1,000, long-only with costs, 2000–2024): QIS 5-day realized variance (V5) printed as 9.8% vs NN 9.0% (units not stated and inconsistent with the Table 1 scale, so compare only within the table), annualised vol 12.6%, Sharpe 0.848. LW 2020: about 1,000 times faster than QuEST with similar accuracy, up to p = 10,000. LW 2017: nonlinear shrinkage beat linear significantly in GMV backtests with N up to 500."
  pitfalls: "(1) Notation clash p/n vs our p/T. (2) S4's code falls back to linear LW on singular windows without saying so; forbid silent fallbacks (G13). (3) Static: no volatility timing, so post-event levels are stale. (4) MV/Frobenius optimality is not Stein optimality; S4 shows good Stein but poor calibration. (5) Centring must match the uncentred target. (6) The QIS formula as transcribed from LW 2022 has no trace step, while the reference QIS.m rescales the shrunk eigenvalues to tr(S); without it the eigenvalue sum exceeded tr(S) by 7.4% (p = 200, T = 500) and 5.3% (p = 500, T = 1,260) in a review simulation, a shift of about 0.05–0.07 nats in per-asset log det (our arithmetic), enough to move H1 non-inferiority comparisons."
