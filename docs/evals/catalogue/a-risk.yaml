- id: "erc_check"
  name: "Equal-risk-contribution (ERC) portfolio check"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Kept canonical: Maillard+ 2010 defines the ERC portfolio (read at metadata level; the definition is taken via Ardia+ 2017, which cites it). Using ERC as a covariance-forecast check follows Ardia+ 2017 (simulation) and S4 (ρ_erc). The convex solver (from Johansson+ 2023's risk-parity formulation) and the realized risk-share dispersion computed with Σ* are our design."
  priority: "nice"
  plain_english: "Build the portfolio in which every stock is predicted to contribute the same share of risk, then check whether its realized risk matched the prediction and whether risk was in fact spread evenly. It is a gentle test, because these weights barely depend on the details of the covariance forecast."
  formula: '\%RC_i(w;\Sigma)=\frac{w_i(\Sigma w)_i}{w^\top\Sigma w};\quad \text{ERC: }\%RC_i(w;\hat\Sigma_t)=\frac{1}{n}\ \forall i,\ w>0,\ \mathbf{1}^\top w=1;\quad x^\star=\arg\min_{x>0}\ \tfrac{1}{2}x^\top\hat\Sigma_t x-\frac{1}{n}\sum_{i=1}^{n}\log x_i\ \Rightarrow\ x^\star_i(\hat\Sigma_t x^\star)_i=\frac{1}{n},\quad w^{\mathrm{ERC}}_t=\frac{x^\star}{\mathbf{1}^\top x^\star};\quad \rho^{\mathrm{ERC}}_t=\frac{w^{\mathrm{ERC}\top}_t\Sigma^*_t w^{\mathrm{ERC}}_t}{w^{\mathrm{ERC}\top}_t\hat\Sigma_t w^{\mathrm{ERC}}_t};\quad H^*(x)=\frac{\sum_i x_i^2-1/n}{1-1/n},\ D_t=H^*\big(\%RC(w^{\mathrm{ERC}}_t;\Sigma^*_t)\big)'
  conventions: "Long-only ERC (w > 0, fully invested). For a PD Σ̂ it exists and is unique, because the objective is strictly convex on the positive orthant and its first-order condition gives x_i(Σ̂x)_i = 1/n, hence equal risk shares (our derivation, checked numerically). Solve this convex problem (Johansson+ 2023's risk-parity formulation) rather than S4's fixed-point iteration w ← √(w/(Σ̂w)), which breaks down (square root of a negative number) when some (Σ̂w)_i ≤ 0, as can happen with negative correlations (our numerical check). Convergence criterion: max_i |%RC_i − 1/n| < 1e-8 under Σ̂. Metrics: (1) ρ^ERC, the realized/predicted variance ratio with the conventions of risk_calibration_ratio (arithmetic mean for statements against 1, log-based calibration error for cross-model comparison); (2) D_t, the normalized Herfindahl of realized risk shares (Ardia+ 2017) computed with Σ* (our adaptation; Ardia+ 2017 compute it under the true covariance in simulation). With a noisy rank ≤ h Σ*, realized shares can be negative and D has a positive noise floor even for the true ERC, and D is a ratio of quadratic functions of Σ* (homogeneous of degree 0), not affine in Σ*, so it is not proxy-robust; use D only to compare models on the same origins. ERC weights depend on Σ̂, so treat ρ^ERC as model-dependent: compare across models and report its distance from 1 descriptively. Origins (H2 day-0 close with h = 5; day −1 close with h = 6; H1 ordinary origins), universe, returns, PD repair, pooling and month-cluster inference are as in gmv_realized_variance."
  inputs: ["Σ̂_t for every model and origin (after the shared PD repair)", "Daily returns r_{t+1..t+h} for U_t", "Solver tolerance and maximum iterations", "Origin list with origin type and calendar month"]
  guards_against: "Mis-calibration on a diversified, non-extreme portfolio that GMV's concentrated weights can mask; it also makes our results comparable with S4's ERC calibration ratios."
  typical_values: "S4 Table 7 (239 S&P 500 stocks, 252-day horizon, test 2022–2024; median volatility ratio in code): ρ_erc CD-DFM 0.82, LW 0.73, NLS 1.54, PCA 0.71, SPCA 0.73, IPCA 0.71, GKX 0.71; single-seed ablations 0.72–0.80; zero-shot onboarding 0.853 at a 0% held-out fraction vs 0.839 at 100%. Ardia+ 2017 (simulated DCC truth fitted to 1,500 daily returns; horizons of 1, 5 and 20 days; 100 replications) report ERC and inverse-volatility weights relatively robust and minimum-variance weights highly sensitive to covariance misspecification; no numeric values were transcribed."
  pitfalls: "(1) Weak discriminator by construction: Ardia+ 2017 find ERC weights robust to covariance misspecification, so use GMV and MV losses, not ERC, to rank models. (2) S4's fixed-point solver fails when some (Σ̂w)_i ≤ 0; S4's paper gives no solver, normalization or sign constraint, and its code reports a median volatility ratio. (3) Realized risk shares from a rank ≤ h Σ* are noisy and can be negative, so D is comparative only. (4) In a positively correlated 500-stock universe most ERC risk is market risk, so ρ^ERC mainly checks the market-variance level (our note). (5) Numerics (our implementation note): work in daily-variance units and start the solver at x = 1/√(n × mean diag Σ̂) to keep the log-barrier well scaled."
  used_by:
    - ref: "Maillard+ 2010"
      title: "The Properties of Equally Weighted Risk Contribution Portfolios"
      authors: "Maillard, S., Roncalli, T. & Teïletche, J."
      year: 2010
      venue: "The Journal of Portfolio Management, 36(4), 60–70"
      url: "https://doi.org/10.3905/jpm.2010.36.4.060"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "metadata_only"
      accessed: "2026-11-12"
      how_used: "Original definition of the equally weighted risk contribution portfolio (read at metadata level; the definition is taken via Ardia+ 2017, which cites it)."
    - ref: "Ardia+ 2017"
      title: "The impact of covariance misspecification in risk-based portfolios"
      authors: "Ardia, D., Bolliger, G., Boudt, K. & Gagnon-Fleury, J.-P."
      year: 2017
      venue: "Annals of Operations Research, 254, 1–16"
      url: "https://libra.unine.ch/bitstreams/1935f4d5-ddd8-42c0-b90f-30177699166f/download"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full"
      accessed: "2026-11-12"
      how_used: "Builds ERC, minimum-variance and inverse-volatility portfolios from estimated covariances and evaluates them under the true covariance in simulation, using the normalized Herfindahl of risk contributions for ERC, and finds ERC robust and minimum-variance weights highly sensitive."
    - ref: "S4"
      title: "The Fundamental Structure of Risk: From Characteristics to Covariance"
      authors: "Alouadi, Lehalle"
      year: 2026
      venue: "arXiv:2607.24410; HAL hal-05705032"
      url: "https://arxiv.org/abs/2607.24410"
      peer_reviewed: false
      source_type: "preprint"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Reports the ERC calibration ratio ρ_erc as its second calibration test (Table 7, ablations, onboarding), computed in code with a fixed-point solver and a median volatility ratio."
    - ref: "Johansson+ 2023"
      title: "A simple method for predicting covariance matrices of financial returns"
      authors: "Johansson, K., Ogut, M. G., Pelger, M., Schmelzer, T., & Boyd, S."
      year: 2023
      venue: "Foundations and Trends in Econometrics, 12(4), 324-407"
      url: "https://doi.org/10.1561/0800000047"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      version_read: "arXiv version read; publisher page blocked"
      accessed: "2026-11-12"
      how_used: "Evaluates covariance predictors with a risk-parity portfolio defined by the convex problem min ½x′Σ̂x − Σ_i (1/n) log x_i, w = x*/1′x*."
  relevance:
    H1: "low"
    H2: "low"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Low-priority robustness check of calibration on a diversified portfolio; too insensitive to rank models."
  implementation:
    libraries: ["numpy", "scipy"]
    notes: "1) Minimize f(x) = ½x′Σ̂x − (1/n)Σ log x_i, with gradient Σ̂x − 1/(n x), by a bound-constrained quasi-Newton method (scipy) with x > 0. 2) w = x/1′x; check max |%RC_i − 1/n| < 1e-8 and w > 0. 3) Compute ρ^ERC through the risk_calibration_ratio code path and D_t from %RC(w; Σ*). Our checks: on a one-factor, all-positive-correlation covariance the fixed point and the convex solution agree to 1e-6; on a matrix with some negative (Σ̂w)_i the fixed point fails at its first step, while the convex solve reaches max |%RC − 1/n| ≈ 1e-9."
  adoption_cost: "low"
  verified: true
  related: ["risk_calibration_ratio", "gmv_realized_variance", "bias_statistic"]
- id: "mincer_zarnowitz"
  name: "Mincer–Zarnowitz regression of realized on predicted portfolio variance"
  category: "stat_test"
  section: "A"
  status: "canonical"
  status_note: "Original definition: Mincer & Zarnowitz 1969 (full text). S14 lists MZ 1969 in its references, but its use there is unverified (abstract-only read). The event-dummy interaction, the ratio (weighted least squares) form and the per-portfolio application on the shared set are our design."
  priority: "should"
  plain_english: "Regress the risk that actually materialized on the risk each model predicted. A well-calibrated model gives an intercept of 0 and a slope of 1; adding an event indicator tests whether the model's risk forecasts are biased specifically after announcements."
  formula: 'A=\alpha+\beta P+v,\ H_0:\alpha=0,\ \beta=1;\quad u=A-P,\ M_P=\mathbb{E}(A-P)^2=[\mathbb{E}(u)]^2+(1-\beta)^2\sigma^2(P)+(1-r^2)\sigma^2(A);\quad A_{p,t}=w_{p,t}^\top\Sigma^*_t w_{p,t},\ P_{p,t}=w_{p,t}^\top\hat\Sigma_t w_{p,t};\quad A_{p,t}=\alpha+\beta P_{p,t}+\gamma D_t+\delta D_tP_{p,t}+v_{p,t},\ H_0^{\mathrm{event}}:\gamma=\delta=0;\quad \frac{A_{p,t}}{P_{p,t}}=\beta+\alpha\frac{1}{P_{p,t}}+\gamma\frac{D_t}{P_{p,t}}+\delta D_t+\frac{v_{p,t}}{P_{p,t}}'
  computable_form: '\text{OLS of }A_{p,t}/P_{p,t}\text{ on }(1,\,1/P_{p,t},\,D_t/P_{p,t},\,D_t);\ W=(\hat\theta-\theta_0)^\top\hat V^{-1}(\hat\theta-\theta_0)\ \text{for }\theta=(\beta,\alpha)^\top,\ \theta_0=(1,0)^\top\ \text{(and }\gamma=\delta=0\text{)},\ \hat V\ \text{month-cluster or HAC}'
  conventions: "Per model and per portfolio p in the shared set 𝒫 defined in risk_calibration_ratio (GMV_u, GMV_lo, EW, VW, RLS_1..RLS_10): A_{p,t} is the realized variance w′Σ*w and P_{p,t} the predicted w′Σ̂w, both daily variances over the same h target days (day-0-close origins with h = 5 primary; day −1 close with h = 6 secondary). H1 sample: the ordinary-day origins of G4 (asset set S_t); test α = 0, β = 1. H2 sample: the 88 pooled event origins (G2) plus the G4 ordinary origins, with D_t = 1 for event origins (FOMC and CPI together; a variant uses separate FOMC and CPI dummies, with the 2024-06-12 origin coded 1 in both). The event-dummy interaction is our design and tests H0: γ = δ = 0 (no event-specific bias). For the H2 contrasts compare γ̂ and δ̂ between (pre, 1) and (pre, 0) (matched_supervised_comparator): event inputs should move them toward 0. Estimation: OLS; joint Wald or F test of α = 0 and β = 1 (Mincer & Zarnowitz 1969); if it rejects, test bias and efficiency separately as Mincer & Zarnowitz do, i.e. H0: E(u) = E(A − P) = 0 (mean of the realized-minus-predicted differences, with the same month-cluster or HAC errors) and H0: β = 1 — not α = 0, which differs from E(u) = 0 whenever β ≠ 1, since E(u) = α + (β − 1)E(P). Because Var(A | F_t) grows like P² (for Gaussian returns it is 2(w′Σw)²/h; our derivation), primary inference uses the ratio form (A/P regressed on 1, 1/P, D/P, D), a weighted-least-squares version with the same coefficients (our design; Patton & Sheppard 2009 discuss OLS and GLS versions whose exact weights we did not transcribe); OLS in levels is a sensitivity. Standard errors: month-cluster bootstrap as primary (G3: resample calendar months, of day 0 for event origins and of the origin date for ordinary origins, refit, B = 10,000); Newey–West HAC with lag ≥ h − 1 = 4 on the time-ordered sample as a sensitivity (newey_west_t), because ordinary origins overlap. Test against (0, 1) only for fixed-weight portfolios (EW, VW, RLS); for optimized portfolios compare (α̂, β̂) across models, since optimization bias pushes realized above predicted risk even for good forecasts. All MZ tests are descriptive (G5): report unadjusted Wald p-values and, as a reading aid, Holm-adjusted p-values across the 12 fixed-weight portfolios; none enters a confirmatory family. Universe, returns, failures and the PD repair are as in gmv_realized_variance."
  inputs: ["Long table of (model, portfolio, origin, A, P) from risk_calibration_ratio", "Event dummy D_t (and separate FOMC and CPI dummies), origin type and calendar month", "HAC lag for the sensitivity analysis"]
  guards_against: "Biased (wrong average level) or inefficient (slope different from 1, over- or under-reacting) variance forecasts, and event-specific risk bias after FOMC or CPI that pooled calibration statistics hide."
  typical_values: "Andersen & Bollerslev 1998: for a correctly specified GARCH(1,1) with squared returns as the proxy, the population R² of the regression is bounded by the inverse conditional kurtosis, at most 1/3 under Gaussian innovations, so a low R² is expected even for a correct model. Chan+ 1999: correlation between forecast and realized excess-return covariances at a 36-month horizon of 0.13 (full covariance), 0.14 (1 factor) and 0.20 (3 factors)."
  pitfalls: "(1) Heteroskedastic errors make levels-OLS standard errors wrong and let a few high-volatility events dominate; use the ratio (weighted) form. (2) A low R² is expected with noisy proxies (Andersen & Bollerslev 1998); judge (α, β), not R². Using h squared daily returns rather than one squared h-day return improves precision. (3) Do not run the regression in logs to test α = 0: log realized variance is biased downward (E[log(χ²_h/h)] = −0.213 at h = 5; our derivation). (4) Optimized portfolios deviate from (0, 1) even for good forecasts, typically with realized above predicted risk. (5) Events have higher P, so D_t and D_t P_t are correlated; interpret γ and δ jointly. (6) Overlapping windows and clustered events need month-cluster or HAC errors. (7) S14 lists Mincer & Zarnowitz 1969 in its references, but its use there is unverified; do not cite S14 as a precedent for the event interaction. (8) Models trained only on GMV variance (S12, S13) have an unidentified scale, so their P is not a forecast of the risk level."
  used_by:
    - ref: "Mincer & Zarnowitz 1969"
      title: "The evaluation of economic forecasts"
      authors: "Mincer, J. A., & Zarnowitz, V."
      year: 1969
      venue: "In J. A. Mincer (Ed.), Economic Forecasts and Expectations: Analysis of Forecasting Behavior and Performance (pp. 3-46). National Bureau of Economic Research. ISBN 0-870-14202-X; NBER chapter c1214"
      url: "https://www.nber.org/books-and-chapters/economic-forecasts-and-expectations-analysis-forecasting-behavior-and-performance/evaluation-economic-forecasts"
      peer_reviewed: false
      source_type: "book_chapter"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Original definition: regression of realizations on forecasts with the joint test α = 0, β = 1 and the decomposition of mean squared error into bias, slope and residual components."
