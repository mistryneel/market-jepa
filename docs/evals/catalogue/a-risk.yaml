- id: "comparative_backtest"
  name: "Comparative backtesting with strictly consistent scores and a three-zone decision"
  category: "stat_test"
  section: "A"
  status: "canonical"
  status_note: "Original not established; earliest defining source in our registry cited (G14). Nolde & Ziegel 2017 (arXiv v2 read) state that comparative backtests based on strictly consistent scores, and their three-zone decision, were proposed by Fissler, Ziegel & Gneiting (2016, 'Expected shortfall is jointly elicitable with value at risk – implications for backtesting', Risk Magazine, January, 58–61), which was not opened and is not in our registry; Nolde & Ziegel give the formal statistic, the zones at a fixed size η and the 0-homogeneous scores, and consistent scores come from Fissler & Ziegel 2016 and Gneiting 2011. Under the adopted defaults it is a descriptive reporting frame (G5): the zones are read from the same month-cluster bootstrap draws as block_bootstrap, so for the per-asset NLL the green zone of a pair is exactly the one-sided percentile rule of G1 applied to that pair. Status, priority and section unchanged."
  priority: "nice"
  plain_english: "Instead of asking whether one model passes or fails on its own, asks whether our model scores significantly better, similarly, or significantly worse than each baseline, using a score that cannot be gamed, and labels the result green, yellow or red."
  formula: '\bar\Delta^{\mathrm{NZ}}_n=\frac1n\sum_{t=1}^{n}\big(S(R_t,X_t)-S(R^*_t,X_t)\big),\quad T^{\mathrm{NZ}}=\frac{\bar\Delta^{\mathrm{NZ}}_n}{\hat\sigma_n/\sqrt n};\quad \text{green if }\Phi(T^{\mathrm{NZ}})\le\eta,\ \text{red if }1-\Phi(T^{\mathrm{NZ}})\le\eta,\ \text{else yellow (Nolde \& Ziegel 2017 eq. 2.18, arXiv v2 numbering)};\quad \text{ours (G1): }\Delta_t=S(R^*_t,X_t)-S(R_t,X_t),\ \text{green iff }Q_{0.05}(\bar\Delta^*)>0,\ \text{red iff }Q_{0.95}(\bar\Delta^*)<0;\quad S_{VaR}^{(0)}(r,x)=(1-\alpha-\mathbb 1\{x>r\})\log r+\mathbb 1\{x>r\}\log x;\quad S^{(0)}(r_1,r_2,x)=\mathbb 1\{x>r_1\}\frac{x-r_1}{r_2}+(1-\nu)\Big(\frac{r_1}{r_2}-1+\log r_2\Big)'
  computable_form: 'S(\hat\Sigma,\Sigma^*)=\tfrac1n\big[\log\det\hat\Sigma+\mathrm{tr}(\hat\Sigma^{-1}\Sigma^*)\big]\ \ (\text{per-asset NLL from stein\_loss})'
  conventions: "R_t = our model's forecast (the 'internal model'), R*_t = one baseline (the 'standard'); lower score is better. Sign (G1): Δ_t = S(R*_t, X_t) − S(R_t, X_t) (reference minus candidate), so Δ > 0 favours our model; Nolde & Ziegel's Δ̄_n is internal minus standard, the negative of ours. η fixed in advance (0.05). σ̂_n: Nolde & Ziegel use a HAC estimate (Giacomini–White). Under our defaults the zones are read from the block_bootstrap draws Δ̄*_b of the paired origin-level mean difference (our adaptation; month clusters, B = 10,000, G3): green iff the one-sided 95% percentile lower bound (5th percentile of Δ̄*) is > 0, which is exactly the one-sided rule of G1; red iff the one-sided 95% percentile upper bound (95th percentile of Δ̄*) is < 0; yellow otherwise. T = Δ̄/SE_boot in our orientation, with green iff 1 − Φ(T) ≤ η and red iff Φ(T) ≤ η, is reported only as the normal-approximation analogue of Nolde & Ziegel's rule, since it can disagree with the percentile zones near the boundary when the bootstrap distribution is skewed. Scores: the per-asset NLL for covariance forecasts (the Dawid–Sebastiani score, proper; its differences are invariant to rescaling, the 0-homogeneity Nolde & Ziegel recommend); for portfolio tail forecasts their 0-homogeneous VaR score (eq. 2.20) and joint (VaR, ES) score (eq. 2.24), equation numbers from arXiv v2, with X = loss (positive), r > 0, α near 1 (0.99) and ν = 0.975. Report one zone per baseline, per event type and per score; zones are descriptive (G5) and never replace the pre-registered tests."
  inputs: ["per-period scores of our model and each baseline on identical asset sets and days", "η", "bootstrap or HAC standard errors"]
  guards_against: "Claiming 'better than strong baselines' from pass/fail coverage tests, and ranking models with scores that are not consistent for the forecast functional (e.g. ES alone)."
  typical_values: "No comparable values reported in the sources read. Nolde & Ziegel 2017 found one or two test functions (q = 1 or 2) worked well in conditional calibration tests."
  pitfalls: "(1) Yellow is not evidence that the models match; H1 needs h1_noninferiority_test. (2) ES alone is not elicitable (Gneiting 2011), so use the joint (VaR, ES) score; variance alone is not elicitable either (Fissler & Ziegel 2016), so covariance forecasts are scored through a proper likelihood-type score. (3) Many baselines and scores create multiplicity; the zones are descriptive (G5) and carry no adjustment or confirmatory claim. (4) Scores without 0-homogeneous differences need stronger moment conditions for valid DM-type tests."
  used_by:
    - ref: "Nolde & Ziegel 2017"
      title: "Elicitability and backtesting: Perspectives for banking regulation"
      authors: "Nolde, N., & Ziegel, J. F."
      year: 2017
      venue: "The Annals of Applied Statistics, 11(4), 1833–1874"
      url: "https://doi.org/10.1214/17-AOAS1041"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "arXiv v2 (21 Feb 2017) read; AOAS version not read"
      accessed: "2026-11-12"
      how_used: "Develops the comparative backtests proposed by Fissler, Ziegel & Gneiting (2016, Risk Magazine, January, 58–61; not opened): strictly consistent scores, the DM-type statistic T = Δ̄_n/(σ̂_n/√n) with a HAC (Giacomini–White) variance (eq. 2.18), the green/yellow/red decision at a fixed size η that the authors attribute to Fissler et al. (Sec. 2.3), and a recommendation of 0-homogeneous score differences with the 0-homogeneous VaR (eq. 2.20) and (VaR, ES) (eq. 2.24) scores (arXiv v2 read; equation numbers from that version)."
    - ref: "Fissler & Ziegel 2016"
      title: "Higher order elicitability and Osband's principle"
      authors: "Fissler, T., & Ziegel, J. F."
      year: 2016
      venue: "The Annals of Statistics, 44(4), 1680–1707"
      url: "https://doi.org/10.1214/16-AOS1439"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Characterises the strictly consistent scores for (VaR, ES) (Cor. 5.5) and shows (mean, variance) is 2-elicitable while variance alone is not."
    - ref: "Gneiting 2011"
