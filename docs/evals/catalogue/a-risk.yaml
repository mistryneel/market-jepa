- id: "har_realized"
  name: "HAR realized-variance models: diagonal HAR per stock and the scalar vech-HAR"
  category: "baseline"
  section: "A"
  status: "canonical"
  status_note: "Canonical (G14; Corsi 2009, read at abstract level only; Corsi's exact specification on realized volatility comes from a secondary statement noted in the verification record). The multivariate form is the scalar vech-HAR of Bollerslev+ 2018, eq. 6 of the CREATES RP 2016-10 working paper that was read (G15). Chiriac & Voev 2011 dropped (its core model is VARFIMA; review audit_A#12). The direct 5-day construction is ours. Status, priority and section unchanged."
  priority: "should"
  plain_english: "Predicts each stock's coming variance from its recent daily, weekly and monthly average variance, a simple way to capture slowly fading volatility. Combined with a correlation estimate it gives a full covariance forecast."
  formula: 'v^{(5)}_{i,t}=\frac15\sum_{j=0}^{4}v_{i,t-j},\ v^{(22)}_{i,t}=\frac1{22}\sum_{j=0}^{21}v_{i,t-j};\quad \bar v_{i,t+1:t+5}=\beta_0+\beta_dv_{i,t}+\beta_wv^{(5)}_{i,t}+\beta_mv^{(22)}_{i,t}+e_{i,t};\quad \hat\Sigma^{(1:5)}_t=\hat D_t\hat C_t\hat D_t,\ \hat D_t=\mathrm{diag}(\hat{\bar v}_{i,t}^{1/2});\quad \text{vech-HAR}:\ s_t=\theta_0+\theta_1s_{t-1}+\theta_2s_{t-5|t-1}+\theta_3s_{t-22|t-1}+\epsilon_t,\ s_t=\mathrm{vech}(S_t)'
  conventions: "v_{i,t}: primary = r_{i,t}², the squared daily close-to-close return from the CRSP panel every model uses (G10), so overnight moves are included; a 5-minute realized variance plus the squared overnight return is a labelled sensitivity only if intraday data are licensed. Direct projection on the average variance over the target days: v̄_{i,t+1:t+5} at the close-of-day-0 origin and v̄_{i,t+1:t+6} at the close-of-day −1 origin (our construction; Corsi's HAR is a one-step model, and Corsi's own specification is on realized volatility, i.e. square roots, per a secondary statement). Coefficients pooled across stocks by OLS over (stock, day) rows of the universe in force on each day, re-estimated at each refit date s_j of the G6 calendar (validation and test alike) on the 1,000 most recent training origins (Bollerslev+ 2018 re-estimate daily on 1,000 days; S1 pools GARCH coefficients across assets) whose whole target window ends on or before trading day s_j − 5 (G6, G7 embargo), i.e. origins t ≤ s_j − 10 for the 5-day target and t ≤ s_j − 11 for the 6-day target; assert this in code. Ĉ_t: QIS (nonlinear_shrinkage) of the uncentred sample correlation of the 1,260 trading days ending at the origin (returns divided by their uncentred sample SDs), renormalised to unit diagonal, Ĉ ← diag(Ĉ)^{−1/2}Ĉ diag(Ĉ)^{−1/2} (Engle+ 2019 Sec. 3.5), so that diag(Σ̂) equals the HAR variance forecasts. Missing days inside any window are 0 (G10). Variance forecasts below 10% of the cross-sectional median forecast at that origin are raised to that floor (our value, as for the factor model's specific variances), with counts logged. vech-HAR needs a full realized covariance S_t, which is singular at p ≈ 500 even from 5-minute data (rank ≤ 78 per day); use it only for small portfolio sets (sectors), as Bollerslev+ 2018 did with N = 10 (scalar vech-HAR, eq. 6 of the CREATES working paper, G15). Shared PD repair (G12); never use Bollerslev+ 2018's silent replacement of non-PD forecasts; a non-finite forecast or failed Cholesky after repair is a failure (G13)."
  inputs: ["squared daily returns (primary) or intraday realized variances (sensitivity)", "correlation estimate Ĉ_t (QIS correlation, renormalised)", "refit calendar (G6) and the 1,000-origin training window"]
  guards_against: "Mistaking long-memory volatility persistence for event-driven skill; HAR is the standard persistence comparator for variances and for H4's volatility-jump outcomes."
  typical_values: "S1 (15-minute horizon, rank IC of volatility change, mean over 32 months): HAR-RV 0.0639, GARCH(1,1) 0.0468, supervised volatility encoder 0.0883. Bollerslev+ 2018: one-day vech-HAR(Q) forecasts for N = 10 stocks with a rolling 1,000-day window, judged with QLIKE, Frobenius and a 90% MCS. S2 uses HAR on correlation-geometry levels as a comparator for 21-day transition prediction."
  pitfalls: "(1) Without intraday data, HAR on squared daily returns is weak. (2) Corsi's original was not read; state the volatility-vs-variance choice. (3) Overnight returns must be included to match the close-to-close target. (4) vech-HAR does not scale to 500 assets. (5) Variance HAR on levels can produce negative forecasts; log-HAR needs a bias correction not covered here. (6) A training window that ends at the forecast origin leaks the last targets into the coefficients; apply the G6 embargo. (7) A QIS-shrunk correlation without renormalisation changes every variance."
