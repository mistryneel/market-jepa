- id: "christoffersen_dq"
  name: "Christoffersen independence and conditional-coverage tests; Engle–Manganelli dynamic quantile (DQ) test with event dummies"
  category: "stat_test"
  section: "A"
  status: "canonical"
  status_note: "Canonical (Christoffersen 1998; Engle & Manganelli 2004). Christoffersen's text was read at abstract level only; the statistics come from Campbell 2005 and the MathWorks documentation (both opened this session). Following review finding audit_A#5, the event-time concentration reported by S14 is targeted by the DQ regression with a day-after dummy, not by the Markov test. Status, priority and section unchanged."
  priority: "should"
  plain_english: "Checks whether VaR breaches bunch together on consecutive days, and whether breaches are predictable from information known beforehand, such as being the day after an FOMC announcement. A good risk model's breaches should be unpredictable."
  formula: '\pi_0=\frac{n_{01}}{n_{00}+n_{01}},\ \pi_1=\frac{n_{11}}{n_{10}+n_{11}},\ \pi=\frac{n_{01}+n_{11}}{n_{00}+n_{01}+n_{10}+n_{11}};\quad LR_{ind}=-2\log\frac{(1-\pi)^{n_{00}+n_{10}}\pi^{n_{01}+n_{11}}}{(1-\pi_0)^{n_{00}}\pi_0^{n_{01}}(1-\pi_1)^{n_{10}}\pi_1^{n_{11}}}\overset{a}{\sim}\chi^2_1;\quad LR_{cc}=LR_{POF}+LR_{ind}\overset{a}{\sim}\chi^2_2;\quad \mathrm{Hit}_t=\mathbb 1\{y_t<q_t\}-\theta,\ \mathrm{Hit}_t=\delta_0+\sum_{k=1}^{K}\delta_k\mathrm{Hit}_{t-k}+\delta_{K+1}q_t+\gamma''z_t+u_t,\ \ DQ=\frac{\mathrm{Hit}''X(X''X)^{-1}X''\mathrm{Hit}}{\theta(1-\theta)}\overset{a}{\sim}\chi^2_{\mathrm{rank}(X)}'
  conventions: "n_ij = number of days in state i followed by a day in state j (1 = exception), counted only between consecutive trading days of one contiguous daily series; never chain hits across gaps between event windows (verification note). Preferred design (ours): run both tests on the full daily series of 1-day-ahead portfolio VaRs made at every close, with the same portfolios and VaR construction as kupiec_pof. DQ: θ is the tail probability (0.01 or 0.05); q_t is the θ-quantile itself (negative for the left tail; Engle–Manganelli convention), so Hit = 1−θ on an exception and −θ otherwise. z_t are F_{t−1}-measurable event indicators, known ex ante from the calendar: FOMC day 0, FOMC day +1, CPI day 0, CPI day +1, and days +2..+5 (our design; this is what targets S14's day-after concentration). Fix K in advance (our suggestion K = 4); the constant is always included; df = rank(X). Out-of-sample forecasts only. Zero-count log terms are set to 0; if a series has no exceptions, or only exceptions, LR_ind is not computed (Danielsson's code returns NA, per the verification record). 5% critical values 3.84 (1 df) and 5.99 (2 df)."
  inputs: ["daily hit series per model and portfolio (from kupiec_pof)", "the VaR/quantile forecasts q_t", "event-day indicator columns from the FOMC/CPI calendar", "trading calendar to check contiguity"]
  guards_against: "Risk forecasts that are right on average but fail predictably, for example on the day after FOMC announcements or in clusters of consecutive days."
  typical_values: "Campbell 2005: in one setting the Christoffersen–Pelletier duration test detected an inaccurate VaR 46% of the time against 28% for the Markov test; a joint coverage-plus-independence test loses power when only one property fails. S14 (abstract only): VaR violations occur disproportionately on the day after FOMC announcements (no numbers in the abstract)."
  pitfalls: "(1) The Markov test only sees first-order consecutive-day clustering; it will not detect a day-after-announcement pattern unless exceptions fall on adjacent days. (2) With about 4 expected exceptions in the event sample, π_1 is often undefined; prefer the full daily series. (3) Non-contiguous windows make the Markov alternative meaningless. (4) The DQ null distribution is affected by estimated parameters in sample; use out-of-sample hits. (5) Rejections mix covariance error with the distributional assumption. (6) S14's tests were not seen (abstract only)."
  used_by:
    - ref: "Christoffersen 1998"
      title: "Evaluating Interval Forecasts"
      authors: "Christoffersen, P. F."
      year: 1998
      venue: "International Economic Review, 39(4), 841–862"
      url: "https://doi.org/10.2307/2527341"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "abstract_only"
      accessed: "2026-11-12"
      how_used: "original definition (LR tests of independence against a first-order Markov alternative and of conditional coverage; abstract read)."
