    notes: "At each origin compute the normalised weighted sum over the 550-day window in float64 for every λ in the grid (no recursion and no burn-in from earlier data); store the one-day matrix; apply the shared repair and log the floored-eigenvalue share. Tuning: evaluate the full 5 × 5 grid of λ and ε on the validation origins, log all 25 results in the trial ledger, and write λ̂ and ε to the pre-registration before any other model is tuned. Tests: the weights sum to 1; the result equals the recursion started from 0 at the window start divided by (1 − λ^550); the per-day forecast is identical for the 5- and 6-day targets."
  adoption_cost: "low"
  verified: true
  related: ["iterated_ewma", "naive_persistence", "stein_loss", "baseline_tuning_parity", "relative_skill_reporting", "h1_noninferiority_test"]
- id: "iterated_ewma"
  name: "Iterated EWMA (IEWMA) and combined multiple IEWMA (CM-IEWMA)"
  category: "baseline"
  section: "A"
  status: "emerging"
  status_note: "Emerging: introduced by Johansson+ 2023 (Foundations and Trends in Econometrics; the arXiv version was read in full, so equation numbers are from it, G15), with open code. Only that source uses it among those read, so it is not widely used. Not in the H1 strong set (G4). Status, priority and section unchanged."
  priority: "should"
  plain_english: "Estimates each stock's volatility and the correlations with separate exponentially weighted averages (fast for volatility, slower for correlation), and optionally blends several such predictors with weights that track which worked best recently."
  formula: '\hat\sigma_t=\mathrm{diag}\big(\hat\Sigma^{\mathrm{EWMA}(H^{vol})}_t\big)^{1/2},\ \hat D_t=\mathrm{diag}(\hat\sigma_t),\ \tilde r_t=\hat D_t^{-1}r_t,\ \hat R_t=\mathrm{corr}\big(\mathrm{EWMA}^{(H^{cor})}(\tilde r)\big)_t,\ \hat\Sigma_t=\hat D_t\hat R_t\hat D_t;\quad \text{CM-IEWMA: }(\hat\Sigma^{(k)}_t)^{-1}=\hat L^{(k)}_t\hat L^{(k)\prime}_t,\ \hat L_t=\sum_{k=1}^{K}\pi_k\hat L^{(k)}_t,\ \hat\Sigma_t=(\hat L_t\hat L_t'')^{-1},\ \pi=\arg\max_{\pi\ge0,\mathbf 1''\pi=1}\sum_{j=1}^{N}\Big(\sum_{i}\log\hat L_{t-j,ii}-\tfrac12\|\hat L_{t-j}''r_{t-j}\|_2^2\Big)'
  computable_form: '\hat\Sigma^{(1:5)}_t=\hat\Sigma_{t+1|t}\ \ (\text{flat per-day forecast; our convention})'
  conventions: "Zero-mean daily returns; one-day-ahead predictors in the paper, with no multi-step version, so the per-day forecast for days 1–5 (days 0–5 at the close-of-day −1 origin) is the one-day forecast (our convention). Every EWMA is the normalised form of Johansson+ 2023 eq. 2.1 with half-life H = −log 2/log β, run over the 1,260 trading days ending at the origin close (the history every member has, G10; longer than the paper's 500-day burn-in); missing days inside it are 0 (G10). IEWMA standardises each past return by its own volatility forecast, r̃_τ = D̂_τ⁻¹r_τ, with D̂_τ from the H^vol EWMA of returns before τ (eq. 2.2); the first 63 days of the lookback only warm up the volatility EWMAs, and standardised returns enter the correlation EWMA from day 64 (our choice). CM-IEWMA: K = 5 experts, N = 10 trailing days for the weights, and the fastest expert's diagonal inflated by 5% (as in the paper). The paper's half-life pairs were not transcribed in our notes, so the experts are fixed in advance (our choice): (H^vol, H^cor) = (10, 125), (21, 125), (21, 250), (63, 250), (125, 500) trading days, the first being the fastest; correlation half-lives of at least 125 days keep hundreds of effective observations at p ≈ 500. No further tuning (one declared configuration for baseline_tuning_parity). Weights: at each origin fit π on the 10 most recent days whose returns are known at the origin, each scored with the experts' one-day-ahead prediction made the previous day; the problem is concave in π (log-likelihood of a mixture of Cholesky factors), so solve it with a convex solver. π is part of the forecasting rule and uses data up to the origin only; there are no refit-trained parameters, so the G6 refit calendar does not apply (walk_forward). Shared PD repair (G12); a non-finite forecast or failed Cholesky after repair is a failure (G13), logged and never replaced."
  inputs: ["daily returns over the 1,260 trading days ending at the origin close", "the five fixed expert half-life pairs", "N = 10 and K = 5"]
  guards_against: "Comparing against a single crude EWMA when a cheap, well-tuned EWMA mixture is known to match DCC-GARCH."
  typical_values: "Johansson+ 2023 (one-day forecasts; 49 industry portfolios 1969–2022, the 25 largest S&P 500 stocks 2010–2022, 5 Fama–French factors): CM-IEWMA matches or beats DCC-GARCH on log-likelihood and regret, with lower average regret in 87%, 71% and 51% of quarters for industry, stock and factor data; portfolio metrics are similar."
  pitfalls: "(1) No multi-step aggregation in the source; ours is flat. (2) Tested on at most 49 assets (238 in a factor-model extension), not 500. (3) Code pitfalls: experiment_utils.log_likelihood uses det (underflows at p ≈ 500; use slogdet or Cholesky); the notebook regret uses demeaned np.cov with ddof = 1; log_likelihood_sequential returns None. (4) Weights fitted on 10 days are noisy around events. (5) The expert half-life pairs are ours, not the paper's."
  used_by:
    - ref: "Johansson+ 2023"
      title: "A simple method for predicting covariance matrices of financial returns"
      authors: "Johansson, K., Ogut, M. G., Pelger, M., Schmelzer, T., & Boyd, S."
      year: 2023
      venue: "Foundations and Trends in Econometrics, 12(4), 324-407"
      url: "https://doi.org/10.1561/0800000047"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      version_read: "arXiv version read; publisher page blocked"
      accessed: "2026-11-12"
      how_used: "Introduces IEWMA and CM-IEWMA, evaluates them by Gaussian log-likelihood, regret and portfolio metrics against DCC-GARCH, and releases code (cvxgrp/cov_pred_finance; PyPI cvxcovariance)."
  relevance:
    H1: "medium"
    H2: "medium"
    H3: "medium"
    H4: "none"
    primary_endpoint: false
    why: "Not in the H1 strong set S (G4); a cheap dynamic baseline reported descriptively (G5) on ordinary days, and in the post-event table if implemented (priority should)."
  implementation:
    libraries: ["cvxgrp/cov_pred_finance (cvxcovariance: from_ewmas, from_sigmas)", "numpy", "scipy"]
    notes: "Use the package predictors or reimplement the formulas; replace any det-based log-likelihood by Cholesky; fit π each day on the previous 10 days; apply the shared PD repair. Tests: with K = 1 CM-IEWMA equals IEWMA; for IEWMA, diag(Σ̂_t) equals the H^vol EWMA variances and R̂_t has unit diagonal; on the same window and weights (warm-up set to 0), if the standardisation uses one fixed D for every τ (r̃_τ = D⁻¹r_τ) and H^vol = H^cor, IEWMA equals EWMA exactly. Do not test IEWMA = EWMA with the time-varying D̂_τ of the paper: each past return is standardised by its own D̂_τ, so the two differ (by up to 32.5% entrywise and 0.046 in correlation in the review's 5-asset simulation with drifting volatility)."
  adoption_cost: "medium"
  verified: true
  related: ["ewma_riskmetrics", "loglik_regret", "dcc_family", "stein_loss"]
- id: "dcc_family"
  name: "DCC-GARCH family: DCC-NL for n ≈ 500; CCC and DCC for small-n checks"
  category: "baseline"
  section: "A"
  status: "canonical"
  status_note: "Canonical (G14; originals Engle 2002 and, for DCC-NL, Engle+ 2019, the latter read in its published form; multi-step forecasts from Engle & Sheppard 2001). Engle 2002 equation numbers are from the author copy (revised Jan 2002) and Engle & Sheppard's from NBER WP 8554 (G15). DCC-NL is the dynamic member of the H1 strong set (G4). Must, as in the candidate list (raised after review finding completeness#8). Why-text follows review fixes audit_A#9 and completeness#24."
  priority: "must"
  plain_english: "Models each stock's volatility with GARCH and lets correlations drift over time with their own simple update, pulled toward a long-run correlation that is cleaned by nonlinear shrinkage for large universes."
  formula: 'r_t\mid\mathcal F_{t-1}\sim N(0,H_t),\ H_t=D_tR_tD_t,\ h_{i,t}=\omega_i+\alpha_ir_{i,t-1}^2+\beta_ih_{i,t-1},\ \varepsilon_t=D_t^{-1}r_t;\quad \tilde C=\frac1T\sum_{\tau}\varepsilon_\tau\varepsilon_\tau''\ (\text{DCC})\ \text{or}\ \mathrm{QIS}\Big(\frac1T\sum_{\tau}\varepsilon_\tau\varepsilon_\tau''\Big)\ (\text{DCC-NL}),\ C=\mathrm{diag}(\tilde C)^{-1/2}\tilde C\,\mathrm{diag}(\tilde C)^{-1/2};\quad Q_t=(1-a-b)C+a\varepsilon_{t-1}\varepsilon_{t-1}''+bQ_{t-1},\ R_t=\mathrm{diag}(Q_t)^{-1/2}Q_t\,\mathrm{diag}(Q_t)^{-1/2};\quad E_t[R_{t+r}]=\big(1-(a+b)^{r-1}\big)C+(a+b)^{r-1}R_{t+1},\ h_{i,t+r|t}=\omega_i\sum_{k=0}^{r-2}(\alpha_i+\beta_i)^{k}+(\alpha_i+\beta_i)^{r-1}h_{i,t+1};\quad \hat\Sigma^{(1:h)}_t=\frac1h\sum_{r=1}^{h}D_{t+r|t}E_t[R_{t+r}]D_{t+r|t},\ h=5\ (6\text{ at the close-of-day }-1\text{ origin});\quad (a,b)=\arg\max_{a,b\ge0,\ a+b<1}\sum_{i=1}^{p-1}\ell_{(i,i+1)}(a,b)\ (\text{2MSCLE})'
  conventions: "Variants and roles: DCC-NL (C̃ = QIS of nonlinear_shrinkage applied to the uncentred covariance (1/T)Σεε′ of the standardised residuals; Engle+ 2019 used QuEST) is the dynamic member of the H1 strong set S (G4) and the DCC in the MCS, the post-event table and every test; DCC (C̃ = (1/T)Σεε′, i.e. the uncentred sample correlation after renormalisation) and CCC (a = b = 0, so R_t = C) are small-n checks, except that CCC with the DCC-NL target is garch_univariate's GARCH-CCC. Renormalisation (Engle+ 2019 Sec. 3.5): the diagonal of a sample or shrunk C̃ deviates from one, so C = diag(C̃)^{−1/2}C̃ diag(C̃)^{−1/2} before C enters Q_t, CCC or the multi-step formula (in a review simulation, QIS of a 200 × 200 sample correlation from 500 days had diagonal entries from 0.754 to 1.175). Estimation in three stages (Engle+ 2019 Sec. 2.3): (1) per stock, a zero-mean Gaussian-QML GARCH(1,1) (garch_univariate), arch_model(100·r, mean='Zero', vol='GARCH', p=1, q=1, dist='normal'), with fitted and forecast variances divided by 10^4 so every forecast is in decimal daily units like Σ*; a stock whose fit does not converge (convergence flag ≠ 0) or has α_i + β_i ≥ 0.999 gets garch_univariate's pre-registered fallback (α_i = 0.05, β_i = 0.90, ω_i = 0.05 × its mean squared return over the window), logged per refit; (2) the correlation target from the standardised residuals; (3) scalar (a, b), a, b ≥ 0, a + b < 1, maximising the composite likelihood over contiguous pairs (2MSCLE, the composite likelihood Engle+ 2019 adopt: the sum of the p − 1 bivariate correlation log-likelihoods of pairs (i, i + 1), assets in ascending PERMNO order). The full correlation likelihood L_C = −½Σ(log|R_t| + ε′R_t⁻¹ε − ε′ε) (Engle 2002 eq. 29) costs O(T p³) per evaluation and is used only in small-n checks. Window and refits (G6, G7): T = 1,250 trading days (Engle+ 2019; one declared configuration for baseline_tuning_parity, so garch_univariate's fits can supply D unchanged; T = 1,000 as a sensitivity); G6's m = 2,520 training window governs the trained neural arms, and T ≤ 1,260 keeps every origin-time window inside the history every member has (G10). The GARCH parameters and (a, b) are re-estimated at each refit date s_j of the G6 calendar (first trading day on or after 1 January and 1 July; validation and test alike) from returns up to trading day s_j − 5 only; (a, b) uses the members of the universe in force on day s_j − 5 and their T-day windows ending there; a stock first needed after s_j is fitted on its own returns up to s_j − 5, starting at its first CRSP return if that is later than the window start (at least about 1,100 returns exist for every member served by the refit under the G10 history rule; our arithmetic). At each origin t served by refit j: filter h_{i,τ} daily through the close of t with refit j's parameters; recompute C on the origin's asset set from the standardised residuals of the T trading days ending at t (our adaptation: the universe changes monthly, G10); run the Q recursion from Q = C at the window start through Q_{t+1}. Missing days inside any window are 0 (G10). Use Engle 2002's eq. 21 normalisation diag(Q)^{−1/2}, not the printed eq. 25, and start the multi-step sums at k = 0 (Engle & Sheppard's printed lower limit 1 looks like a typo). The multi-step correlation uses Engle & Sheppard's Approximation 2 (recommended there): E_t[R_{t+r}] = (1 − (a + b)^{r−1})C + (a + b)^{r−1}R_{t+1} is a convex combination of two correlation matrices, hence a valid correlation matrix, only because C has been renormalised. Horizon: Σ̂_t = (1/h)Σ_{r=1}^{h} D_{t+r|t}E_t[R_{t+r}]D_{t+r|t} with h = 5 at the close-of-day-0 origin and h = 6 at the close-of-day −1 origin (our implementation suggestion). Shared PD repair (G12); a non-finite forecast or failed Cholesky after repair is a failure (G13): logged, never replaced; as the reference arm it removes that origin from that contrast only, with counts disclosed."
  inputs: ["daily returns over the estimation window and up to the origin close", "per-stock GARCH parameters and filtered variances", "correlation target estimator (QIS for DCC-NL, sample for DCC)", "refit calendar (G6) and the fixed asset order (ascending PERMNO)"]
  guards_against: "Beating only static estimators: DCC-NL is the documented strong dynamic baseline at large n."
  typical_values: "Engle+ 2019 (CRSP, out-of-sample 1986–2015, N = 100/500/1,000, T = 1,250, unconstrained GMV): DCC-NL had the lowest out-of-sample SD among the DCC variants; significance was tested only against DCC-S (two-sided HACPW), where it was significantly lower. S11 (14 ETFs, 2021–2023): DCC was the best benchmark at F = 20 (vech-Euclidean ×10^5 48.268 vs CAB 38.312); at F = 10 CCC 58.111 and EWMA 58.851 beat DCC 62.210, and CAB was no longer significantly better than CCC, DCC or EWMA; long-only daily GMV variance DCC-NL 0.002048, DCC 0.002075 vs naive 0.001991. S12 Table 2 (n = 1,000, long-only, costs; the DCC variant is not stated): DCC 5-day realized variance (V5) printed as 10% vs NN 9.0% (units not stated and inconsistent with the Table 1 scale; compare only within the table), vol 12.4%, Sharpe 0.930, turnover 54% per rebalance. Laurent+ 2012 (2010 WP, 1-day forecasts): the text names DCC with leverage (EGARCH marginals) the hard-to-beat SPA benchmark among 125 MGARCH models, but the verification record notes Table 9 as extracted shows SPA p-values below 0.10 under Stein in three samples; check the JAE version before relying on it. Engle & Sheppard 2001: DCC under-predicts minimum-variance portfolio variance once N exceeds about 5."
  pitfalls: "(1) Printed normalisation and summation typos (conventions). (2) Under-prediction of optimised-portfolio risk; pair with risk_calibration_ratio. (3) The full correlation likelihood is too expensive at p ≈ 500; use the composite likelihood of Engle+ 2019. (4) Parameters re-estimated every six months (G6) can be stale after regime shifts; only the daily filtering of h and Q adapts between refits. (5) The event day's shock enters only through h and Q at the next step. (6) A sample or shrunk C̃ is not a correlation matrix until renormalised; without that step E_t[R] has a non-unit diagonal and CCC mis-scales every variance. (7) arch's default mean model is 'Constant' and the fit is on returns ×100: use mean='Zero' and divide variances by 10^4, since a forecast 10^4 too large costs log(10^4) ≈ 9.2 nats per asset."
  used_by:
    - ref: "Engle 2002"
      title: "Dynamic conditional correlation: A simple class of multivariate generalized autoregressive conditional heteroskedasticity models"
      authors: "Engle, R."
      year: 2002
      venue: "Journal of Business & Economic Statistics, 20(3), 339-350"
      url: "https://doi.org/10.1198/073500102288618487"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "author copy read"
      accessed: "2026-11-12"
      how_used: "original definition of DCC with two-step likelihood estimation."
    - ref: "Engle+ 2019"
      title: "Large Dynamic Covariance Matrices"
      authors: "Engle, R. F., Ledoit, O. & Wolf, M."
      year: 2019
      venue: "Journal of Business & Economic Statistics, 37(2), 363–375"
      url: "https://doi.org/10.1080/07350015.2017.1345683"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "original definition of DCC-NL (nonlinear-shrinkage correlation target, renormalised to unit diagonal), its three-stage estimation with composite likelihood over contiguous pairs, and its large-N GMV backtest (published version read)."
