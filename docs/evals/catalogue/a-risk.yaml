      authors: "Gneiting, T."
      year: 2011
      venue: "Journal of the American Statistical Association, 106(494), 746–762"
      url: "https://doi.org/10.1198/jasa.2011.r10138"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Shows forecasts must be scored with a loss consistent for the requested functional, gives Patton's homogeneous family including QLIKE, and proves ES is not elicitable."
    - ref: "Gneiting & Raftery 2007"
      title: "Strictly Proper Scoring Rules, Prediction, and Estimation"
      authors: "Gneiting, T., & Raftery, A. E."
      year: 2007
      venue: "Journal of the American Statistical Association, 102(477), 359–378"
      url: "https://doi.org/10.1198/016214506000001437"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Shows the Dawid–Sebastiani score, the negative of our per-asset NLL up to constants, is proper and strictly proper within Gaussian classes."
  relevance:
    H1: "medium"
    H2: "medium"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Gives a regulatory-style, pre-specified way to report each 'better than baseline' comparison; the deciding test stays the month-cluster bootstrap."
  implementation:
    libraries: ["numpy", "scipy", "pandas"]
    notes: "Reuse the long loss table from stein_loss; for each (ours, baseline, score, event type) compute Δ_t = S(baseline) − S(ours) per origin (G1), Δ̄, and the month-cluster bootstrap draws Δ̄*_b with block_bootstrap's index matrix (B = 10,000); green iff the 5th percentile of Δ̄* is > 0, red iff the 95th percentile is < 0, yellow otherwise; also report T = Δ̄/SE_boot and 1 − Φ(T) as the Nolde–Ziegel normal analogue. For tail scores, convert P&L to positive losses first. Unit test: with the same draws, the per-asset NLL green zone coincides with the one-sided G1 rule of block_bootstrap for the same pair."
  adoption_cost: "low"
  verified: true
  related: ["stein_loss", "robust_loss_class", "block_bootstrap", "diebold_mariano", "h1_noninferiority_test", "kupiec_pof", "es_backtests"]
- id: "model_confidence_set"
  name: "Model Confidence Set (Hansen–Lunde–Nason)"
  category: "stat_test"
  section: "A"
  status: "canonical"
  status_note: "Canonical (Hansen+ 2011, read from the author-hosted published PDF). Priority must, as in the candidate list (raised after review finding completeness#9). It supports, but does not replace, the H1 non-inferiority test. Laurent+ 2012 counts come from the 2010 working paper (1-day forecasts)."
  priority: "must"
  plain_english: "Starts with all candidate models and repeatedly removes the one that is significantly worst until the rest cannot be told apart; the survivors are the set that contains the best model with a chosen confidence. It shows whether our model is among the best without picking a single benchmark."
  formula: 'd_{ij,t}=L_{i,t}-L_{j,t};\ H_{0,\mathcal M}:E[d_{ij,t}]=0\ \forall i,j\in\mathcal M;\quad \bar d_{ij}=\frac1n\sum_td_{ij,t},\ \bar d_{i\cdot}=\frac1m\sum_{j\in\mathcal M}\bar d_{ij};\quad t_{ij}=\frac{\bar d_{ij}}{\sqrt{\widehat{\mathrm{var}}(\bar d_{ij})}},\ t_{i\cdot}=\frac{\bar d_{i\cdot}}{\sqrt{\widehat{\mathrm{var}}(\bar d_{i\cdot})}};\quad T_{R}=\max_{i,j\in\mathcal M}|t_{ij}|,\ e_R=\arg\max_i\sup_jt_{ij};\quad T_{\max}=\max_{i\in\mathcal M}t_{i\cdot},\ e_{\max}=\arg\max_it_{i\cdot};\quad \hat p_{e_{\mathcal M_j}}=\max_{i\le j}P_{H_{0,\mathcal M_i}},\ \widehat{\mathcal M}^*_{1-\alpha}=\{i:\hat p_i>\alpha\}'
  conventions: "Algorithm (Hansen+ 2011 Def. 2): start with M = M0; test H_{0,M} at level α; if rejected, remove e_M and repeat; otherwise stop. The null distributions of T_R and T_max and the variances of the mean differences come from the same bootstrap; the last survivor gets p = 1; p-values are made monotone by a running maximum. Loss matrix: rows = origins in date order, columns = models, smaller is better; each arm's loss is its average over its K seeds (seed_vs_period). Units: H1 = the ordinary-day origins and asset sets S_t of G4 (h1_noninferiority_test); H2 = the 88 pooled origins at the close of day 0 (G2), the day −1 origin as a sensitivity. Losses: per-asset NLL (primary) and log realized GMV_u variance (the H1 co-primary). Model sets, fixed before unlocking (our choice): H1, M0 = {(pre, 0), (sup, 0)} ∪ S, with S = {DCC-NL (dcc_family), QIS nonlinear shrinkage (nonlinear_shrinkage), the fundamental industry+style factor model (factor_risk_models), EWMA with tuned λ (ewma_riskmetrics)} (G4); H2, M0 = the four arms (pre, 1), (pre, 0), (sup, 1), (sup, 0) of matched_supervised_comparator ∪ S ∪ {event_scaled_baseline}; sensitivity for both: add ledoit_wolf_linear and naive_persistence variant (a), each in the primary configuration of its own entry. Failures (G13 analogue; our rule): rows where any model in M0 fails are dropped for all models and counted; if the arm whose membership is reported ((pre, 0) for H1, (pre, 1) for H2) fails at any origin, its MCS result is void and reported as such. Levels: α = 0.10 primary (as Bollerslev+ 2018), α = 0.25 sensitivity (as Laurent+ 2012). Method: T_R (method='R') primary, T_max sensitivity. Bootstrap (primary, G3): the paired month-cluster resampler of block_bootstrap (cluster = calendar month of day 0 for event origins, of the origin date for H1 origins), B = 10,000, with the same index matrices as the primary tests; custom code (our adaptation), validated against arch.bootstrap.MCS on a contiguous synthetic series. Sensitivity (G3): arch.bootstrap.MCS(losses, size, reps=10000, block_size=b, method, bootstrap='stationary', seed) on the date-ordered rows, with b = the median over models of the G3 expected block length (Politis–White with the Patton–Politis–White 2009 correction; block_bootstrap documents how arch's optimal_block_length implements it) for each model's loss minus the cross-model mean loss, rounded up; label it, because it treats irregularly spaced origins as consecutive. Role (G4, G5): MCS membership is supporting evidence for H1 and descriptive for H2; it never replaces the pre-registered tests. Report membership, MCS p-values and elimination order."
  inputs: ["Origin × model loss matrix (seed-averaged; models in columns) for each loss and unit", "The fixed model sets M0 for H1 and H2 (conventions)", "α, method, B and the month-cluster index matrices of block_bootstrap; for the sensitivity, the stationary-bootstrap block length b and seed"]
  guards_against: "Declaring one winner from noisy pairwise comparisons, and choosing a single convenient benchmark; supports the H1 claim that our model is among the strong risk models."
  typical_values: "Laurent+ 2012 (2010 WP; 125 MGARCH models; 10 US stocks; 1-day forecasts; 5-minute realized covariance; α = 0.25; 10,000 bootstrap draws): MCS sizes under Stein 10 (full 1999–2008), 2 (dot-com), 12 (calm), 26 (2007–08 crisis) vs 39, 38, 74 and 39 under the vech-Euclidean loss. Hansen+ 2011: block length 2, B = 1,000, n = 250 in simulations; block length 12 in the monthly application. Bollerslev+ 2018: 90% MCS."
  pitfalls: "(1) Membership is not equivalence: a small sample keeps everyone in. (2) Results depend on the candidate set and on the loss; symmetric losses give large, uninformative sets. (3) Assumes stationary, mixing loss differences with finite moments of order above 2; 0-homogeneous losses such as the NLL help. (4) arch's MCS has no default size, uses √T blocks by default and 1,000 reps; set all three. (5) The 'max' rule removes all tied models at once. (6) Pin the arch version; the docs show no version number."
  used_by:
    - ref: "Hansen+ 2011"
      title: "The Model Confidence Set"
      authors: "Hansen, P. R., Lunde, A., & Nason, J. M."
      year: 2011
      venue: "Econometrica, 79(2), 453–497"
      url: "https://doi.org/10.3982/ECTA5771"
      peer_reviewed: true
