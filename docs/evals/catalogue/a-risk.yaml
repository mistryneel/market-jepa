- id: "bias_statistic"
  name: "Bias statistic (SD of standardized returns), rolling bias, MRAD"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Original not established; earliest defining source in our registry cited (G14). Barra USE4 2011 is the definition we could read; the statistic's first publication was not established, and Menchero+ 2012 and Connor+ 2010 could not be confirmed to define it. Engle & Sheppard 2001 report the same quantity with an exact χ² interval. No 2023–2026 users are cited, so the entry stays canonical under the G14 exception. Applying it to 5-day event windows with one standardized return per non-overlapping window, and the RMS variant, are our design."
  priority: "should"
  plain_english: "Divide each test portfolio's return by the volatility the model predicted for it; if the model is right, these standardized returns have a standard deviation of about 1. Values well above 1 mean risk was underpredicted, values well below 1 that it was overpredicted."
  formula: 'b_{p,e}=\frac{R_{p,e}}{\hat\sigma_{p,e}},\ R_{p,e}=\sum_{d=1}^{h}w_{p,e}^\top r_{t_e+d},\ \hat\sigma_{p,e}=\sqrt{h\,w_{p,e}^\top\hat\Sigma_{t_e}w_{p,e}};\quad B_p=\sqrt{\frac{1}{T-1}\sum_{e=1}^{T}(b_{p,e}-\bar b_p)^2},\ \text{band}_{95}=\big[1-\sqrt{2/T},\,1+\sqrt{2/T}\big];\quad B_p^{\tau}=\sqrt{\frac{1}{T_w-1}\sum_{e\in W_\tau}(b_{p,e}-\bar b_p^{\tau})^2},\ \mathrm{MRAD}^{\tau}=\frac{1}{N}\sum_{p=1}^{N}\lvert B_p^{\tau}-1\rvert;\quad \text{exact: }(T-1)B_p^2\sim\chi^2_{T-1}\Rightarrow\Big[\sqrt{\chi^2_{T-1,0.025}/(T-1)},\ \sqrt{\chi^2_{T-1,0.975}/(T-1)}\Big]'
  computable_form: 'B^{\mathrm{RMS}}_p=\sqrt{\frac{1}{T}\sum_{e=1}^{T}b_{p,e}^2}\ \text{(no demeaning; our addition)};\quad \text{share of fixed-weight portfolios with }B_p\in\text{band}_{95}'
  conventions: "Standardized return: one per portfolio per non-overlapping window. R_{p,e} is the h-day sum of the constant-weight portfolio's daily simple returns (our convention; compounding differences are negligible over 5 days), and σ̂_{p,e} = √(h × w′Σ̂w) assumes no serial correlation in daily returns, consistent with Σ̂ being an average-daily forecast. Sample: H2 uses one observation per event origin (day-0 close, h = 5; day −1 close, h = 6 as secondary), with the shared 2024-06-12 origin once (G2); so that windows never overlap, take origins in date order and keep one only if its day 0 is at least h trading days after the day 0 of the last kept origin (our design; report how many were dropped). At the day-0 origin this drops the later origin of the 9 other CPI–FOMC pairs whose day 1–5 windows share trading days, so the pooled H2 sample has T = 79 (88 origins minus 9); per type T = 36 (FOMC) and T = 53 (CPI). At the day −1 origin (days 0–5) the 9 pairs exactly 7 days apart also share a day, the later announcement day (G2), so recount T there. H1 uses non-overlapping 5-day windows from the G4 ordinary origins: in date order, keep an origin only if it is at least 5 trading days after the last kept one. Bias statistic: demeaned SD with divisor T − 1 (USE4 A2). Band: 1 ± √(2/T) under normality and perfect forecasts (USE4 A3). Exact alternative: (T − 1)B² ~ χ²_{T−1} under i.i.d. N(0,1) standardized returns, the interval Engle & Sheppard 2001 use (fn. 16). Our arithmetic: T = 36 gives [0.767, 1.233] (asymptotic [0.764, 1.236]); T = 53 gives [0.808, 1.191] ([0.806, 1.194]); pooled T = 79 gives [0.843, 1.156] ([0.841, 1.159]). Portfolios: the shared set 𝒫 defined in risk_calibration_ratio (GMV_u, GMV_lo, EW, VW, RLS_1..RLS_10); the band applies to the fixed-weight members, and optimized members are compared across models. Rolling: B_p^τ over trailing 12-month windows of the same observations with divisor T_w − 1 and the window mean (USE4 A4 uses 12 monthly observations with divisor 11; whether its mean is the window or full-sample mean is unclear, so we fix the window mean); MRAD^τ averages |B_p^τ − 1| across the N portfolios in 𝒫 (USE4 A6). Also report the RMS version, which matches risk_calibration_ratio on the h-day-sum scale. Inference beyond the band: month-cluster bootstrap interval for B_p (G3; B = 10,000); all bias statistics are descriptive (G5). Origins, universe, returns, failures and the PD repair are as in gmv_realized_variance."
  inputs: ["For each (model, non-overlapping window, portfolio in 𝒫): the weights, w′Σ̂w and the h daily portfolio returns", "List of non-overlapping event origins (after dropping the later origin of overlapping CPI–FOMC pairs) and of non-overlapping ordinary windows", "Calendar month of each window (bootstrap) and window dates (rolling statistics)"]
  guards_against: "Risk forecasts that are systematically too low or too high across many portfolios, using the test MSCI Barra documents for its models, which quant-firm reviewers will expect."
  typical_values: "Barra USE4 2011 (US factor model, monthly data, Jul 1995–May 2011, 191 months): about 95% of B fall in 1 ± √(2/T) under normality and perfect forecasts, but only 86% at kurtosis 5 with T = 120; rolling 12-month bias statistics have 5th/95th percentiles of about 0.66/1.34 under ideal conditions; MRAD is about 0.17 for normal returns with perfect forecasts and about 0.19 at kurtosis 3.5–4; low-volatility eigenfactors showed realized volatility about 40% above forecast before adjustment. Engle & Sheppard 2001 (daily, 1994–1999): SD of forecast-standardized minimum-variance portfolio returns of 1.03–1.78 for DCC and 1.09–35.90 for RiskMetrics across 2–100 S&P 500 sector indices."
  pitfalls: "(1) The band assumes i.i.d. normal standardized returns: coverage falls with kurtosis (86% at kurtosis 5, T = 120) and with dependence, and overlapping event windows make it too narrow; use the band as a reference and the month-cluster bootstrap for inference. (2) Optimized portfolios (GMV) have B > 1 even for good forecasts (optimization bias), so the band applies to fixed-weight portfolios only. (3) Demeaning removes a common mean shock: with few events, a large announcement drift can make B look calibrated while the RMS version is not; report both. (4) In the USE4 PDF the radical signs are graphical and were inferred from the text, and whether the rolling statistic uses the window or full-sample mean is unclear; we fix the window mean. (5) With T = 36 to 79 windows the band is wide (about ±0.24 to ±0.16), so B mainly flags gross failures; the calibration ratio, which uses h squared daily returns per origin, is more precise. (6) Never compute B on overlapping daily-origin windows: T would be inflated about h-fold. (7) GMV-trained cleaners (S12, S13) have an unidentified scale; exclude them or rescale on validation data first."
  used_by:
    - ref: "Barra USE4 2011"
      title: "The Barra US Equity Model (USE4): Methodology Notes"
      authors: "Menchero, J., Orr, D. J. & Wang, J."
      year: 2011
      venue: "MSCI Model Insight, MSCI Research, August 2011"
      url: "https://www.top1000funds.com/wp-content/uploads/2011/09/USE4_Methodology_Notes_August_2011.pdf"
      peer_reviewed: false
      source_type: "technical_report"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Definition used here (Appendix A1–A6) and the earliest source we could read; first publication not established: standardized returns, the bias statistic with its 1 ± √(2/T) band, rolling 12-month bias and MRAD, applied to many portfolios including eigenfactors and optimized portfolios."
    - ref: "Engle & Sheppard 2001"
      title: "Theoretical and empirical properties of dynamic conditional correlation multivariate GARCH"
      authors: "Engle, R. F., & Sheppard, K."
      year: 2001
      venue: "NBER Working Paper No. 8554 (October 2001)"
      url: "https://www.nber.org/papers/w8554"
      peer_reviewed: false
      source_type: "working_paper"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Reports the SD of forecast-standardized returns of minimum-variance, equal- and value-weighted portfolios with an exact χ²_{T−1} interval (Tables 4–5)."
  relevance:
    H1: "medium"
    H2: "medium"
    H3: "low"
    H4: "none"
    primary_endpoint: false
    why: "Industry-standard calibration readout across many portfolios that complements the calibration ratio for both H1 and H2."
  implementation:
    libraries: ["numpy", "scipy", "pandas"]
    notes: "1) Reuse the weights and w′Σ̂w stored by risk_calibration_ratio. 2) For each non-overlapping window compute R = Σ_d w′r_{t+d}, σ̂ = √(h w′Σ̂w) and b = R/σ̂. 3) B_p = sample SD with ddof = 1; B^RMS = √(mean b²). 4) Asymptotic and exact χ² bands (scipy chi-square quantiles). 5) Rolling 12-month B_p^τ (ddof = 1, window mean) and MRAD^τ across portfolios. 6) Month-cluster bootstrap intervals for B_p. Checks: simulated Gaussian returns with Σ̂ = Σ give B ≈ 1 for fixed-weight portfolios with about 95% inside the band; scaling Σ̂ by c scales every b by 1/√c."
  adoption_cost: "low"
  verified: true
  related: ["risk_calibration_ratio", "eigenfactor_bias_test", "mincer_zarnowitz", "factor_risk_models", "block_bootstrap", "regime_reporting"]
- id: "eigenfactor_bias_test"
  name: "Eigenfactor (eigen-portfolio) bias test"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Original not established; earliest defining source in our registry cited (G14). Barra USE4 2011 (read) defines the test (Sec. 4.2) and cites a 2011 MSCI Research Insight precursor (Menchero, Wang & Orr, 'Eigen-Adjusted Covariance Matrices') that we did not open; Menchero+ 2012 (FAJ, abstract only) postdates both. No 2023–2026 users are cited, so the entry stays canonical under the G14 exception. Applying the test to the eigenvectors of a ~500-stock asset-level forecast (USE4 uses the factor covariance), the realized-variance version, the rank-decile bins and the hash-based random alphas are our design, following the A_portfolio verification note's suggestion. Priority and section unchanged."
  priority: "nice"
  plain_english: "Split each model's forecast into its independent risk directions, from the riskiest to the quietest, and check direction by direction whether realized risk matched the prediction. Models usually understate risk in the quietest directions, which are exactly the ones minimum-variance portfolios load on."
  formula: '\hat\Sigma_t=\sum_{k=1}^{n}\lambda_{k,t}u_{k,t}u_{k,t}^\top,\ \lambda_{1,t}\le\dots\le\lambda_{n,t},\ \lVert u_{k,t}\rVert_2=1;\quad q_{k,e}=\frac{u_{k,e}^\top\Sigma^*_e u_{k,e}}{\lambda_{k,e}}=\frac{\frac{1}{h}\sum_{d=1}^{h}(u_{k,e}^\top r_{t_e+d})^2}{\lambda_{k,e}},\quad B^{\mathrm{eig}}_g=\sqrt{\frac{1}{E\,|g|}\sum_{e=1}^{E}\sum_{k\in g}q_{k,e}};\quad b_{k,e}=\frac{\sum_{d=1}^{h}u_{k,e}^\top r_{t_e+d}}{\sqrt{h\,\lambda_{k,e}}}\ (\mathbf{1}^\top u_{k,e}\ge0),\ B_k=\sqrt{\frac{1}{T-1}\sum_{e}(b_{k,e}-\bar b_k)^2};\quad \alpha_j\leftarrow\alpha_j-(c_t^\top\alpha_j)\mathbf{1},\ w_j=\frac{\hat\Sigma_t^{-1}\alpha_j}{\alpha_j^\top\hat\Sigma_t^{-1}\alpha_j},\ \hat\sigma_j^2=\frac{1}{\alpha_j^\top\hat\Sigma_t^{-1}\alpha_j}'
  computable_form: 'Y=U_t^\top R\ (n\times h),\quad q_{k,e}=\frac{\frac{1}{h}\sum_{d}Y_{kd}^2}{\lambda_{k,e}},\quad \text{bin }k\text{ by rank quantile into }g=1,\dots,10\text{ plus the top eigenvector}'
  conventions: "Eigenportfolios are the unit-norm eigenvectors of each model's own Σ̂_t (after the shared PD repair), sorted ascending by eigenvalue (USE4 sorts eigenfactors from low to high volatility). Predicted variance λ_k; realized variance u_k′Σ*u_k, a quadratic form, so rank(Σ*) ≤ h is no obstacle. Groups g: ten contiguous bins of eigen-rank quantiles (bin 1 = lowest-variance 10%), plus the top eigenvector alone (market mode). Primary statistic (our design): B^eig_g, the root-mean realized/predicted variance ratio over origins and eigenvectors in g; 1 means calibrated and above 1 means under-predicted risk. Secondary, USE4-style: per-rank bias statistic B_k from h-day standardized returns, with the sign fixed by 1′u ≥ 0 (first nonzero entry positive if 1′u = 0), demeaned, divisor T − 1, and the band and non-overlap rules of bias_statistic. Optimized random-alpha portfolios (USE4 Sec. 4.2 analogue): J = 100 alpha vectors with entries α_{j,i} = Φ⁻¹((H_{j,i} + 0.5)/2^64), H_{j,i} the first 8 bytes (big-endian unsigned integer) of SHA-256 of 'seed|alpha|j|PERMNO_i' with the seed 20220101 of risk_calibration_ratio, so each stock's alpha is fixed over time and does not depend on which other stocks are present (our design); at each origin centre them to cap-weighted zero with the value weights c_t; w_j = Σ̂⁻¹α_j/(α_j′Σ̂⁻¹α_j) minimizes risk subject to unit alpha exposure, with predicted variance 1/(α_j′Σ̂⁻¹α_j); report their ratios and bias statistics and compare them across models, since they are optimized portfolios. Origins (H2 day-0 close with h = 5 over the 88 pooled origins; day −1 close with h = 6; H1 ordinary origins of G4), Σ*, returns, PD repair and month-cluster inference (G3) are as in risk_calibration_ratio; all results are descriptive (G5). Report one curve per model (B^eig_g against bin) for H2 event origins and for H1 ordinary origins."
  inputs: ["Σ̂_t for every model and origin (after the shared PD repair)", "Daily returns r_{t+1..t+h} for U_t", "Market equity at the origin (to centre the random alphas) and the fixed seed", "Origin list with origin type and calendar month"]
  guards_against: "Under-predicted risk in the low-variance directions that GMV and other optimized portfolios load on (Barra found low-volatility eigenfactors' realized volatility about 40% above forecast before adjustment), and spectrum errors that a single scalar loss hides."
  typical_values: "Barra USE4 2011 (US factor model, monthly, Jul 1995–May 2011): low-volatility eigenfactors had realized volatility about 40% above forecast before the eigen-adjustment, and all 100 optimized random-alpha portfolios fell outside the bias-statistic band before adjustment. Menchero+ 2012 (abstract): the lowest-volatility eigenportfolios are under-predicted most, and the gains from adjusting grow with N/T. No asset-level values for ~500 stocks were found."
  pitfalls: "(1) The shared eigenvalue floor sets the lowest eigenvalues of near-singular forecasts, so the bottom bins then test the floor, not the model; report the share of floored eigenvalues and rerun with floored directions excluded. (2) Eigenvectors differ across models and dates and are unstable when eigenvalues are close; compare rank-bin curves, never individual vectors. (3) Sign ambiguity affects only the USE4-style b; the realized-variance version is sign-free. (4) USE4 tests eigenfactors of a K-factor covariance; at the asset level with n ≈ 500 the low end is much noisier, and each q uses only h squared returns, so binning is essential. (5) The eigen-adjustment (USE4 B1–B10) is a remedy, not part of the test; adopting it changes the model and must be decided before the test set is unlocked. (6) Random-alpha portfolios are optimized, so their ratios exceed 1 even for good forecasts; compare across models."
  used_by:
    - ref: "Menchero+ 2012"
      title: "Improving Risk Forecasts for Optimized Portfolios"
      authors: "Menchero, J., Wang, J. & Orr, D. J."
      year: 2012
      venue: "Financial Analysts Journal, 68(3), 40–50"
      url: "https://doi.org/10.2469/faj.v68.n3.5"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "abstract_only"
      accessed: "2026-11-12"
      how_used: "Peer-reviewed article on eigen-adjusted covariance matrices, read at abstract level only; it postdates the Barra USE4 notes (Aug 2011) and the 2011 MSCI precursor they cite (Menchero, Wang & Orr, 'Eigen-Adjusted Covariance Matrices', not opened), so it is not where the test was first defined. Per the abstract: sample covariance matrices under-predict the risk of the lowest-volatility eigenportfolios most, and adjusting for this lowers the out-of-sample volatility of minimum-volatility portfolios under a fixed alpha constraint, with gains growing with N/T."
    - ref: "Barra USE4 2011"
