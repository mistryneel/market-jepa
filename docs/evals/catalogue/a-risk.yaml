      authors: "Bun, J., Bouchaud, J.-P. & Potters, M."
      year: 2017
      venue: "Physics Reports, 666, 1–109"
      url: "https://doi.org/10.1016/j.physrep.2016.10.005"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "Reviews rotation-invariant estimators and eigenvalue clipping and defines the out-of-sample oracle proxy and risk tests on 500-stock universes (arXiv v1 read)."
    - ref: "S11"
      title: "A Deep Learning Framework for Forecasting Medium-Term Covariance in Multiasset Portfolios"
      authors: "Reis, Serra, Gama"
      year: 2026
      venue: "Journal of Forecasting 45(4):1797–1828 (2026); arXiv:2503.01581"
      url: "https://onlinelibrary.wiley.com/doi/full/10.1002/for.70110"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "full_text"
      accessed: "2026-11-12"
      how_used: "Uses Marčenko–Pastur eigenvalue clipping as a benchmark."
