      title: "The relation between implied and realized volatility"
      authors: "Christensen, B. J., & Prabhala, N. R."
      year: 1998
      venue: "Journal of Financial Economics, 50(2), 125-150"
      url: "https://doi.org/10.1016/S0304-405X(98)00034-8"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "abstract_only"
      accessed: "2026-11-12"
      how_used: "Finds implied volatility forecasts future index volatility better than past volatility (abstract; motivation only)."
