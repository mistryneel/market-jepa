- id: "realized_covariance_target"
  name: "Realized covariance target: conventions for Σ* (daily outer products; intraday variants as sensitivity)"
  category: "protocol"
  section: "A"
  status: "canonical"
  status_note: "Canonical: realized covariation is defined by Barndorff-Nielsen & Shephard 2004. The daily-outer-product construction follows the adopted defaults; the seeds use incompatible conventions (S4, S11, S12, S13), so ours is pre-registered rather than copied. Following review finding completeness#36, daily (primary) and intraday (sensitivity) variants are separated inside this entry. Priority and section unchanged."
  priority: "must"
  plain_english: "Defines exactly what 'what really happened' means for the risk forecast: the average of the stocks' daily return cross-products over the five trading days after the announcement. Every detail (which returns, whether to subtract the mean, what to divide by, overnight moves, dividends, delisted stocks) changes the score, so it is fixed in advance."
  formula: '\Sigma^*_e=\frac15\sum_{d=1}^{5}r_{e,d}\,r_{e,d}^{\top},\ r_{e,d}\in\mathbb R^{n_e},\ \mathrm{rank}(\Sigma^*_e)\le5;\qquad \Sigma^{*(-1)}_e=\frac16\sum_{d=0}^{5}r_{e,d}r_{e,d}^{\top}\ (\text{secondary origin});\qquad \text{intraday variant (Barndorff-Nielsen \& Shephard 2004, eq. 2 of the 2002 working paper): } [y^*_M]_d=\sum_{j=1}^{M}y_{j,d}y_{j,d}^{\top},\ \ \Sigma^{*,\mathrm{HF}}_e=\frac15\sum_{d=1}^{5}\Big(y^{\mathrm{on}}_{d}y^{\mathrm{on}\top}_{d}+[y^*_M]_d\Big)'
  computable_form: '\text{Store } R_e=[r_{e,1},\dots,r_{e,5}]\in\mathbb R^{n_e\times5} \text{ (plus the day-0 and day-}(-1)\text{ columns), not only } \Sigma^*_e=\tfrac15R_eR_e^{\top};\ \text{every A1 loss is computable from } R_e,\ \text{e.g. } \mathrm{tr}(\hat\Sigma^{-1}\Sigma^*_e)=\tfrac15\|C^{-1}R_e\|_F^2,\ w^{\top}\Sigma^*_ew=\tfrac15\|R_e^{\top}w\|^2.'
  conventions: "(1) Day indexing: day 0 is the first trading day whose regular-session close is strictly after the release time (event_timing_origin); CPI (08:30 ET, before the open [BLS CPI schedule]) and FOMC (14:00 ET, during trading [USMPD]) therefore have day 0 = the release date, and the immediate reaction is in day 0's close-to-close return. Days 1–5 are the next five exchange trading days. Primary origin: close of day 0, target days 1–5, divisor 5. Secondary origin: close of day −1, target days 0–5, divisor 6. Keep per-day columns so a day-by-day loss profile can be computed (event_timing_origin). Pooled unit (G2): the 2024-06-12 CPI and FOMC share one origin and one Σ*, stored once, so the locked window has 88 pooled origins. (2) Returns: CRSP CIZ DlyRet, daily close-to-close simple total returns (price change plus dividends, split-adjusted), in decimals; they include the overnight gap by construction. Simple rather than log returns so portfolio returns aggregate linearly and w′Σ*w is the realized portfolio second moment used by gmv_realized_variance. Raw rather than excess returns (daily risk-free rates are two orders of magnitude below daily volatility; our arithmetic); state the choice and keep it. (3) Uncentred, divisor 5 (not 4): Σ* is then conditionally unbiased for the average conditional second moment E_t[r r′] over days 1–5, which is the target every forecast must aim at; the second moment is a mean and so elicited by Bregman/robust losses, whereas variance alone is not ([Fissler & Ziegel 2016]). Demeaning 5 vectors would cut the rank to ≤ 4, strip any common move across the window and, with 1/(F − 1), target a different quantity. (4) Asset set: N_e of forward_looking_panel_filter (members of the G10 universe U_m for the month of the origin day with a regular trading row and a valid price on the origin day), fixed at the origin and identical for all models; n_e = |N_e|; no requirement of complete returns over the target days (G11). At H1 origins the scored set is S_t (G4). (5) Delistings (G11; all data are CIZ; pit_universe_survivorship (4)–(6)): use DlyRet row by row, including the separate later row flagged DlyDelFlg = 'Y' that carries the delisting return, so the delisting return enters on its delisting day; never join legacy DLRET or dsedelist (that double-counts). A missing delisting return is imputed as in pit_universe_survivorship (6): −0.30 (NYSE/AMEX) or −0.55 (NASDAQ) for delisting codes 400–591 and 0 otherwise, each case logged. After the delisting row the remaining target returns are 0 (proceeds in cash) and the stock stays in the matrix; a delisting row dated after the window while the last trading day is inside it follows pit_universe_survivorship (5). (6) Missing returns of a listed stock (halt, no trade) inside the target days: 0 on the missing day, flagged in the data log; the resumption-day DlyRet is used as reported; report flagged stock-days per origin (G11). (7) Freeze and report the data format and snapshot date (CIZ; [Schwarz+ 2026]). (8) Units: decimals; the NLL shifts by a constant under unit changes, Frobenius, MSE and BW scale. (9) Rank arithmetic: daily ≤ 5 (≤ 4 demeaned); 5-minute bars give 78 per 6.5-hour session, 390 over 5 days (395 with overnight returns) < 500; full rank over 5 days needs at least 100 synchronised returns a day (sampling every 3.9 minutes or faster), which for 500 stocks is ill-conditioned and noise-biased (review arithmetic); realized covariance is PD only when the number of assets is below the number of intraday returns ([Laurent+ 2013]). (10) Intraday variant, sensitivity only: realized covariation from synchronised intraday returns ([Barndorff-Nielsen & Shephard 2004]); synchronise asynchronous trades (previous-tick on a 1-minute grid as in [VOLARE], or refresh time); pick a sparse sampling interval from a volatility signature plot to limit microstructure noise ([S15] chose 3 minutes; [Laurent+ 2012] use 5-minute mid-quotes); keep jumps and the announcement move in the target: plain realized covariance (sum of outer products) is the analogue of the daily outer-product target, whereas truncated or bipower covariance estimates only the continuous part, so it is not conditionally unbiased for the close-to-close second moment the forecasts aim at (robust_loss_class precondition; our note); report a jump-robust version (e.g. [VOLARE]'s bipower covariance) only as a descriptive decomposition. [S15]'s truncated spot covariance is a different object (the diffusive covariance just before and after a release, with returns next to the release dropped), so do not copy its jump handling into the target; add each day's overnight-return outer product so the horizon matches close-to-close. (11) Crypto (H3; transfer_protocol, binance_vision): daily returns on 00:00 UTC cut-offs from consecutive 1d closes; day 0 is the UTC date containing the release (CPI 12:30 or 13:30 UTC, FOMC 18:00 or 19:00 UTC, depending on daylight saving); the origin is 00:00 UTC at the end of day 0 and days 1–5 are the next five UTC calendar days (our design)."
  inputs: ["Daily total-return panel, point-in-time (CRSP CIZ DlyRet), frozen snapshot", "Delisting flags (DlyDelFlg) and delisting codes, for the imputation rule of pit_universe_survivorship", "N_e for each origin (forward_looking_panel_filter; universe rule G10), and S_t at H1 origins (G4)", "Event calendar (FOMC 14:00 ET, CPI 08:30 ET release dates and times) and exchange trading calendar", "Optional, for the sensitivity variant: synchronised intraday returns and overnight returns", "For H3: Binance 1d spot klines on 00:00 UTC cut-offs (binance_vision)"]
  guards_against: "An undefined or silently varying endpoint; look-ahead through complete-future filters; survivorship through dropped delistings; forecast and target definitions that do not match, which breaks proxy-robustness; surprises from rank deficiency such as inverting Σ* or taking its log-determinant."
  typical_values: "No comparable values reported in the sources read. Data-version sensitivity: switching CRSP from SIZ to CIZ changed 9.6% of monthly returns by at least 1 bp, with a mean absolute difference of 22 bp (Schwarz+ 2026)."
  pitfalls: "(1) The seeds disagree and must not be copied: [S4] uses uncentred (1/Δ)Σ r r′ of daily log returns with Δ = 252 > n; [S11] a demeaned 1/(F − 1) covariance of daily excess returns over F = 20 days, with ambiguous alignment (trailing eq. 5 vs forward eq. 6); [S12] a 5-day realized covariance of adjusted close-to-close returns with centring unstated; [S13] a centred 1/m covariance of log returns. (2) Forward-looking filters: requiring complete returns over days 1–5 is the look-ahead filter that [De Nard+ 2021] acknowledge is infeasible in real time though common; [S12] also excludes stocks that delist within the next 5 days. Keep delisting names, apply any filter identically to all models, report attrition (forward_looking_panel_filter). (3) Double-counting delisting returns by merging legacy DLRET into CIZ returns. (4) Demeaning cuts the rank to 4 and changes the target; log returns break portfolio aggregation. (5) Even 5-minute data leaves Σ* singular at n ≈ 500, so intraday data does not rescue full Stein. (6) Day 0: with the close-of-day-0 origin the immediate CPI/FOMC reaction is outside the target; with the close-of-day-−1 origin it is inside; report both and the per-day profile. (7) Overlapping events (G2): 19 CPI–FOMC pairs fall within 7 calendar days; in 10 the day 1–5 windows share trading days (all five on 2024-06-12, which is one origin with one Σ*), and in the other 9, exactly 7 days apart, the earlier window ends on the later announcement day, so their day 0–5 (secondary-origin) windows share that day ([FOMC calendar], [BLS CPI schedule]). Shared days then enter two origins; the month-cluster bootstrap absorbs this because each such pair falls inside one calendar month (block_bootstrap), and descriptive pooled sums must disclose it. (8) Unit-test that every return in R_e is dated strictly after the origin; misaligned targets are an easy silent leak."
