- id: "ledoit_wolf_linear"
  name: "Ledoit–Wolf linear shrinkage (identity, constant-correlation and single-index targets)"
  category: "baseline"
  section: "A"
  status: "canonical"
  status_note: "Canonical (G14): Ledoit & Wolf 2004a, the original definition of the identity-target estimator, was read in its published JMVA form. The single-index (LW 2003) and constant-correlation (LW 2004b) originals were read as working papers (UPF Economics WP 586, Nov 2001; WP 691, Jun 2003), so the SI and CC formulas and equation numbers here come from those versions (G15). Used by five seeds (S1, S4, S11, S12, S13). Not a member of the H1 strong set (G4), whose shrinkage member is QIS (nonlinear_shrinkage). Status, priority and section unchanged."
  priority: "must"
  plain_english: "Takes the plain historical covariance of returns and pulls it part of the way toward a simple, stable structure, with the amount chosen from the data. It is the standard cheap covariance baseline."
  formula: 'S=\frac1T\sum_{\tau=t-T+1}^{t}r_\tau r_\tau'',\ \langle A,B\rangle=\mathrm{tr}(AB'')/p,\ m=\langle S,I\rangle,\ d^2=\|S-mI\|^2,\ \bar b^2=\frac1{T^2}\sum_{\tau}\|r_\tau r_\tau''-S\|^2,\ b^2=\min(\bar b^2,d^2);\quad \hat\Sigma=\frac{b^2}{d^2}mI+\Big(1-\frac{b^2}{d^2}\Big)S;\quad \text{CC target: }f_{ii}=s_{ii},\ f_{ij}=\bar r\sqrt{s_{ii}s_{jj}},\ \hat\delta^*=\max\{0,\min\{\hat\kappa/T,1\}\},\ \hat\Sigma=\hat\delta^*F+(1-\hat\delta^*)S;\quad \text{SI target: }F=s_{00}^2bb''+D'
  computable_form: '\hat\Sigma^{(1:5)}_t=\hat\Sigma_t\ \ (\text{flat: the per-day forecast for days 1–5})'
  conventions: "Notation: p = |N_e|, the number of assets in the origin's asset set (identical for every model; forward_looking_panel_filter); T = window length in trading days ending at the origin close. Primary (one declared configuration for baseline_tuning_parity): identity target (LW 2004a) on T = 252 days (as S4's code), with the uncentred S and divisor T, because LW 2004a assumes zero means and Σ* is uncentred: call sklearn LedoitWolf(assume_centered=True) on the raw T × p return window, as S4's code does. S1's code is not a precedent for this: it demeans each asset over its finite observations and zero-fills gaps before calling LedoitWolf(assume_centered=True), i.e. a demeaned S with divisor T. Demeaned data would use divisor T − 1 (LW 2020 Remark 2.1). Sensitivities: T = 1,260; constant-correlation target (LW 2004b working paper: κ̂ = (π̂ − ρ̂)/γ̂, intensity truncated to [0, 1]); single-index target (LW 2003 working paper) with the market factor = the value-weighted return of the origin's asset set on each window day, weights = market equity at the previous close (our choice), and the intensity truncated to [0, 1] (the working paper prints no truncation; our choice, as for CC). Recomputed at every origin from its own lookback; it has no trained parameters, so the G6 refit calendar does not apply (walk_forward). Forecast: the estimate is used unchanged as the per-day forecast for days 1–5, and for days 0–5 at the close-of-day −1 origin (our convention). Missing data (G10): every member of the asset set has at least 1,229 non-missing returns in the 1,260 trading days ending at its formation date; any missing day inside the window (halts) is set to 0 before estimation, identically for every model; dropping a member, shortening one stock's window, pairwise-complete estimation or model-specific imputation is not allowed. PD repair (G12; stein_loss): symmetrise, eigendecompose, floor eigenvalues at ε·tr(Σ̂)/p with the one frozen ε; usually inactive here, since the identity target makes Σ̂ PD whenever the intensity is positive. A non-finite forecast or a failed Cholesky after repair is a failure (G13): it is logged and never replaced; when this model is the reference arm, that origin is removed from that contrast only, with counts disclosed. Letter labels: in our registry 2004a = identity target (JMVA) and 2004b = constant correlation (JPM); the covShrinkage README uses the opposite letters."
  inputs: ["daily returns of the event universe over the window ending at the origin", "shrinkage target choice", "market return (single-index variant)"]
  guards_against: "Claims of improvement over the raw sample covariance only; a model that cannot beat the standard shrinkage estimator is not a strong risk model."
  typical_values: "S4 Table 7 (2022–2024; 239 S&P 500 stocks; 252-day forward target; unnormalised Stein): LW 521 vs NLS 322, PCA 304, CD-DFM 302; GMV calibration 0.92; Bures 0.0279. S11 (14 ETFs, F = 20 days, 2021–2023): LW Frobenius ×10^5 76.514 vs DCC 74.716; long-only daily-rebalanced GMV variance 0.002655 vs naive 0.001991. S12 Table 1 (n = 300, long-short, frictionless): LS 5-day variance 0.0163 vs QIS 0.0151 and NN 0.0149; annualised vol 11.5%; long-only 14.2%. LW 2004a: the oracle PRIAL equals the shrinkage intensity b²/d²."
  pitfalls: "(1) S13's printed Eq. 3 has no [0,1] truncation and mixes centred and uncentred terms; do not copy it. (2) Static estimator: it ignores volatility timing, so its level is stale after events. (3) Linear shrinkage leaves the small eigenvalues too small, which the NLL punishes hard (S4: worst Stein of seven). (4) Centring and divisor must match the uncentred target convention; S1's harness demeans before calling assume_centered=True, so do not copy it. (5) Different letter labels across sources. (6) covShrinkage's covMarket.m uses an equal-weighted market factor, unlike our value-weighted SI sensitivity."
  used_by:
    - ref: "Ledoit & Wolf 2004a"
      title: "A well-conditioned estimator for large-dimensional covariance matrices"
      authors: "Ledoit, O. & Wolf, M."
      year: 2004
      venue: "Journal of Multivariate Analysis, 88(2), 365–411"
      url: "https://doi.org/10.1016/S0047-259X(03)00096-4"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      accessed: "2026-11-12"
      how_used: "original definition of the identity-target estimator with its consistent intensity estimate."
