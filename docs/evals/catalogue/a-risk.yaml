- id: "eigen_spectrum_errors"
  name: "Eigenvalue/spectrum errors and correlation-geometry diagnostics (eigenportfolio realized-to-predicted ratios)"
  category: "risk_metric"
  section: "A"
  status: "emerging"
  status_note: "Emerging: the top-eigenvalue ratio and top-K eigenvalue error are introduced as covariance metrics by S4 CD-DFM (2026); correlation-geometry scalars come from S2 Mahns+ (2026). The rank-robust eigenportfolio ratio and the exact spectral decomposition of the primary loss are our adaptation of Bun+ 2017's out-of-sample eigenvector-portfolio variance (eq. 8.15) and the Barra USE4 eigenfactor idea, needed because S4's eigenvalue metrics break or are biased at rank(Σ*) ≤ 5. Priority and section unchanged."
  priority: "should"
  plain_english: "Checks whether a forecast gets the size of its main risk directions right, such as the market-wide mode, by comparing each predicted 'eigen-portfolio' variance with how much that portfolio actually moved over the next five days. It shows which directions a model under- or over-states after events, which a single loss number hides."
  formula: '\text{S4: } \rho^{\mathrm{top}}=\frac{\lambda_1(\hat\Sigma)}{\lambda_1(\Sigma^*)},\quad \mathrm{Err}_K=\frac1K\sum_{j=1}^{K}\frac{|\lambda_j(\hat\Sigma)-\lambda_j(\Sigma^*)|}{\lambda_j(\Sigma^*)}\ (\text{descending; needs } K\le\mathrm{rank}\,\Sigma^*);\quad \text{S2: } \mathrm{pc1\_share}=\frac{\lambda_1(C)}{\mathrm{tr}\,C},\ \mathrm{eff\_rank}=\exp\Big(-\sum_jp_j\log p_j\Big),\ p_j=\frac{\lambda_j(C)}{\sum_k\lambda_k(C)},\ \mathrm{corr\_mean}=\text{mean off-diagonal of } C'
  computable_form: '\hat\Sigma_{m,e}=\sum_{k=1}^{n_e}\hat\lambda_k\hat u_k\hat u_k^{\top}\ (\hat\lambda_1\ge\dots\ge\hat\lambda_{n_e}),\quad \rho_k=\frac{\hat u_k^{\top}\Sigma^*_e\hat u_k}{\hat\lambda_k}=\frac{\tfrac15\sum_{d=1}^{5}(\hat u_k^{\top}r_{e,d})^2}{\hat\lambda_k},\quad E[\rho_k\mid\mathcal F_t]=\frac{\hat u_k^{\top}\Sigma_t\hat u_k}{\hat\lambda_k}\ (=1 \text{ for a correct forecast});\quad \bar\rho_b=\frac{\sum_e\sum_{k\in B_b}\hat u_k^{\top}\Sigma^*_e\hat u_k}{\sum_e\sum_{k\in B_b}\hat\lambda_k},\ B_1=\{1\},B_2=\{2..5\},B_3=\{6..20\},B_4=\{21..100\},B_5=\{101..n_e\};\quad n_eL_{m,e}=\sum_{k=1}^{n_e}\big(\log\hat\lambda_k+\rho_k\big)\ \text{(exact spectral decomposition of the primary loss)}'
  conventions: "Eigenpairs come from each model's own PD-repaired forecast at the origin, sorted descending (eigenvector sign is irrelevant). Each ρ_k is the realized-to-predicted variance ratio of eigenportfolio û_k, whose weights are fixed at the origin, so it is proxy-unbiased; bins B_1..B_5 are our pre-registered choice. Pool within a bin by a ratio of sums over origins (the 88 pooled origins, G2; overall and by event type), which has expectation 1 for a correct forecast; do not average logs (with 5 Gaussian days E[log(χ²_5/5)] ≈ −0.213, so a perfect forecast would show a geometric-mean ratio of about 0.81). The decomposition n·L = Σ_k(log λ̂_k + ρ_k) is exact (our derivation, checked numerically) and attributes paired stein_loss differences to rank bins. [S4]'s λ_j(Σ*) metrics are computed only when Σ* is full rank (long windows); with the 5-day target they need K ≤ 5 and are biased (pitfalls). [S2]'s geometry scalars (C = correlation matrix): compute them from each forecast's implied correlation matrix and compare descriptively between event and non-event origins, or with realized scalars from windows of at least 21 days as [S2] uses; realized eff_rank is bounded by the window length. Optional: repeat ρ_k on volatility-normalised returns to isolate correlation skill ([Bun+ 2017] Sec. 8.2)."
  inputs: ["Σ̂_{m,e} after the shared PD repair (eigendecomposition)", "R_e: n_e×5 daily returns for days 1–5", "Pre-registered rank bins and event-type labels", "For S4-style metrics only: a full-rank long-window realized matrix (window longer than n)"]
  guards_against: "A scalar loss hiding that a model gets the market mode right but understates low-volatility directions (where minimum-variance portfolios load), or the reverse after events; eigenvalue metrics that silently break or are biased when the realized matrix has rank ≤ 5."
  typical_values: "S4 Table 7 (CD-DFM paper; 2022–2024; 239 stocks; 252-day forward realized second moment): top-eigenvalue ratio CD-DFM 1.64, GKX 1.78, IPCA 1.84, LW 1.91, Sparse PCA 1.96, PCA 1.98, NLS 5.61 (all overstate λ1 against the 252-day target); top-K relative eigenvalue error (K = 11 for CD-DFM) CD-DFM 0.26, IPCA 0.29, GKX 0.35, LW 0.38, Sparse PCA 0.38, PCA 0.49, NLS 0.74. Barra USE4 2011: low-volatility eigenfactors showed realized volatility about 40% above forecast before the eigen-adjustment. S2 Mahns+ (test 2024–2025): a frozen JEPA latent decodes same-day corr_mean, pc1_share and eff_rank with ridge R² 0.415, 0.447 and 0.361 (a probe result, not a forecast error)."
  pitfalls: "(1) [S4]'s λ1(Σ̂)/λ1(Σ*) and top-K error need λ_K(Σ*) > 0, i.e. K ≤ rank(Σ*) ≤ 5 here, and are biased with a 5-day target: λ_max is convex, so E[λ1(Σ*)] ≥ λ1(Σ_t), and the top eigenvalue of a 5-observation matrix also absorbs idiosyncratic variance. In our simulation (n = 200, 3-factor model, 5 Gaussian days; not a published value) a perfect forecast averaged 0.50 on λ1(Σ̂)/λ1(Σ*) but 1.00 on ρ_1. (2) [S4]'s code divides by max(λ1(Σ*), 1e-8); such guards hide rank failure, so fail loudly instead. (3) Individual eigenvectors are unstable when eigenvalues are close; report bins, and single k only for the top few. (4) Bins compare models by rank, not by identical directions (each model has its own eigenvectors); as a sensitivity, evaluate all models in one common basis (e.g. the reference baseline's eigenvectors) using u′Σ̂u and u′Σ*u. (5) Realized eff_rank and pc1_share from short windows are bounded by the window length (eff_rank ≤ 5 at 5 days). (6) Each ρ_k has a heavy right tail at 5 days (about χ²_5/5 for a correct forecast under Gaussian returns); pool by ratio of sums and use month-cluster bootstrap intervals (G3). (7) Diagnostic only: rank models with stein_loss, of which the bin contributions are an exact decomposition."
