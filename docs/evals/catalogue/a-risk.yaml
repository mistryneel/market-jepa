    notes: "Per (model, seed, origin): (1) take R (n×h) and the asset order of N_e from realized_covariance_target; (2) apply the frozen G12 repair (symmetrise; floor eigenvalues at ε·tr(S)/n) and log the floored share; (3) float64 Cholesky; on failure record a G13 failure, never fall back; (4) logdet = 2·Σ log diag(C); Z = C⁻¹R by a triangular solve; L = (logdet + ‖Z‖²_F/h)/n; (5) average L over the arm's seeds and write it to a long table (metric, model, origin, origin type, event types, cluster month, n); form Δ = L_ref − L_cand for each pre-registered contrast (G1); (6) for factor-structured forecasts Σ̂ = BB′ + Ψ the Woodbury identity and determinant lemma ([S4] App. A) give O(nk²) cost, allowed only when min_i Ψ_ii ≥ f = ε·tr(Σ̂)/n (every eigenvalue is then ≥ f and the repair is a no-op); otherwise use the dense repaired path; (7) H1: index the repaired full matrix by S_t and score the principal submatrix. Unit tests: a full-rank toy case (T ≫ n) where Stein = n·L − log det Σ* − n; Δ unchanged by a common unit change; Δ unchanged by per-asset rescaling when no eigenvalue is floored (and changed when the floor binds); E[L] ≈ 1 + log det Σ_t/n for a perfect forecast by simulation; a perturbed forecast loses to Σ_t on average under simulated 5-day proxies; the repair leaves PD inputs whose eigenvalues are all above the floor unchanged; swapping reference and candidate negates Δ; identical asset sets across models; 88 pooled origins with 2024-06-12 once; no NaN or inf. The identities above were checked numerically in a scratch script outside the repository."
