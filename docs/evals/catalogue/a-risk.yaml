- id: "mv_loss"
  name: "Minimum-variance (MV) loss of Engle–Ledoit–Wolf"
  category: "risk_metric"
  section: "A"
  status: "canonical"
  status_note: "Original definition: Engle+ 2019, Definition 1. Only the forecast-dependent first term can be computed with our rank ≤ h realized covariance; dropping the second term is exact for paired differences (our algebra, also stated in the A_portfolio verification note). Log-ratio pooling is our design."
  priority: "should"
  plain_english: "A single number from the Ledoit–Wolf line of work that scores how risky the minimum-variance portfolios built from a forecast turn out, averaged over all possible return views. It rewards getting the shape of the covariance right, not its overall level."
  formula: 'L(\hat\Sigma,\Sigma)=\frac{\mathrm{Tr}(\hat\Sigma^{-1}\Sigma\hat\Sigma^{-1})/n}{[\mathrm{Tr}(\hat\Sigma^{-1})/n]^2}-\frac{1}{\mathrm{Tr}(\Sigma^{-1})/n}\ \ge 0,\quad L=0\iff\hat\Sigma=\gamma\Sigma\ (\gamma>0);\qquad L_V(\hat\Sigma,\Sigma,m)=\frac{m^\top\hat\Sigma^{-1}\Sigma\hat\Sigma^{-1}m}{(m^\top\hat\Sigma^{-1}m)^2}'
  computable_form: 'L^{(1)}(\hat\Sigma_t,\Sigma^*_t)=\frac{\mathrm{Tr}(\hat\Sigma_t^{-1}\Sigma^*_t\hat\Sigma_t^{-1})/n}{[\mathrm{Tr}(\hat\Sigma_t^{-1})/n]^2}=\frac{n\cdot\frac{1}{h}\sum_{d=1}^{h}\lVert\hat\Sigma_t^{-1}r_{t+d}\rVert_2^2}{[\mathrm{Tr}(\hat\Sigma_t^{-1})]^2},\qquad \Delta_e=\log L^{(1)}(\hat\Sigma^{\mathrm{ref}}_e,\Sigma^*_e)-\log L^{(1)}(\hat\Sigma^{\mathrm{cand}}_e,\Sigma^*_e)\ (>0\ \text{favours the candidate; G1})'
  conventions: "Orientation: lower is better; only the forecast is inverted, never Σ*. Normalization: traces divided by n = n_t (the origin's asset-set size), as in Engle+ 2019 Definition 1. The second term −1/[Tr(Σ⁻¹)/n] needs Σ invertible; with Σ* of rank ≤ h ≪ n it is undefined, and since it does not involve the forecast, drop it: paired differences of L⁽¹⁾ equal paired differences of L wherever L is finite (our algebra). Do not substitute a pseudo-inverse or a regularized Σ* into that term. Σ*, origins (H2 day-0 close with h = 5 over the 88 pooled origins; day −1 close with h = 6; H1 ordinary origins of G4), asset sets, returns, failures and the shared PD repair are exactly as in gmv_realized_variance. Scale: L⁽¹⁾ is invariant to the forecast's scale and homogeneous of degree 1 in Σ*, so pool per-origin log ratios Δ_e = log L⁽¹⁾_ref − log L⁽¹⁾_cand (G1; positive favours the candidate) for each pre-registered contrast and report the geometric-mean change of the candidate, exp(−Δ̄) − 1 (our design). Do not report PRIAL (Engle+ 2019 eq. 5.2; Ledoit & Wolf 2020 eq. 5.1): it is defined with the full loss. Units: daily variance. Inference: paired month-cluster bootstrap of Δ_e (G3) with the one-sided 95% percentile lower bound, descriptive, not part of any confirmatory family (G5); DM-HLN as a sensitivity. Relation to GMV: L_V with m = 1 is the realized GMV variance; the MV loss replaces the average of the excess variance over unit-sphere return directions m by a trace ratio (Engle+ 2019 eqs. 4.3–4.6), so it is not the realized variance of any single portfolio."
  inputs: ["Σ̂_t for every model and origin (after the shared PD repair)", "Daily returns r_{t+1..t+h} for the stocks in N_t (S_t at H1 origins), same definition as the primary endpoint", "n_t, origin type and cluster month (G3) for each origin", "Pre-registered contrasts (candidate, reference)"]
  guards_against: "Forecast eigenstructures that produce risky optimized portfolios for return views other than the equal-mean GMV direction (GMV tests only m = 1), and reliance on statistical losses chosen for tractability rather than use (Ledoit & Wolf 2017, 2020 and 2022 argue for application-based losses)."
  typical_values: "No comparable values reported in the sources read."
  pitfalls: "(1) It cannot score the risk level: L = 0 for every Σ̂ proportional to Σ (Engle+ 2019 Theorem 1); pair it with risk_calibration_ratio. (2) The Σ̂⁻² weighting makes it dominated by the smallest eigenvalues, so the shared eigenvalue floor largely sets it for near-singular baselines; report the share of floored eigenvalues. (3) Numerics: never form Σ̂⁻¹; Tr(Σ̂⁻¹) is the squared Frobenius norm of the inverse Cholesky factor, and ‖Σ̂⁻¹r‖² comes from two triangular solves. (4) It grows with event volatility; use log ratios and regime reporting. (5) No seed uses it (S12 and S13 use GMV variance only), so it is a reviewer-facing robustness metric rather than a standard of the ML literature. (6) Ledoit & Wolf 2017 show the nonlinear-shrinkage optimum under the portfolio loss coincides with the Frobenius-on-Σ optimum, while S12 disputes that Frobenius-optimal cleaning is GMV-optimal in practice; do not cite either side as settled."
