      authors: "Engle, R. F., & Manganelli, S."
      year: 2004
      venue: "Journal of Business & Economic Statistics, 22(4), 367–381"
      url: "https://doi.org/10.1198/073500104000000370"
      peer_reviewed: true
      source_type: "peer_reviewed"
      read_depth: "partial_text"
      version_read: "UCSD Department of Economics Discussion Paper 99-20 (1999) read, eqs. 6-11; Journal of Business & Economic Statistics text not opened; equation numbers from the discussion paper"
      accessed: "2026-11-12"
      how_used: "original definition of the DQ test: regress de-meaned hits on lagged hits, the VaR and other lagged regressors and use the Wald statistic (read from the 1999 discussion paper)."
