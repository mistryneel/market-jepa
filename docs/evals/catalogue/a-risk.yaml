- id: "naive_persistence"
  name: "Naive persistence: trailing sample covariance and lagged 5-day realized covariance"
  category: "baseline"
  section: "A"
  status: "widely_used"
  status_note: "Upgraded from 'widely used (prov.)' to widely_used: three peer-reviewed 2026 papers in our space use it (S11 naive and full-sample covariance, S12 MLE sample covariance, S13 sample covariance). Priority must, as in the candidate list. Singular at p ≈ 500 unless the window exceeds p days, so the shared PD repair is part of the baseline (review findings completeness#4, endpoint_math#4)."
  priority: "must"
  plain_english: "Assumes the near future looks like the recent past: the forecast is simply the historical covariance over a recent window, or last week's realized co-movement."
  formula: '\text{(a)}\ \hat\Sigma_t=\frac1{T_w}\sum_{\tau=t-T_w+1}^{t}r_\tau r_\tau'';\quad \text{(b)}\ \hat\Sigma_t=\frac15\sum_{d=0}^{4}r_{t-d}r_{t-d}'',\ \mathrm{rank}\le5;\quad \text{repair: }\hat\Sigma^+=U\max(\Lambda,\varepsilon\bar\lambda)U'',\ \bar\lambda=\mathrm{tr}(\hat\Sigma)/p'
  computable_form: '\hat\Sigma^{(1:5)}_t=\hat\Sigma^+_t'
  conventions: "Uncentred, divisor T_w, same return definition as the target (simple close-to-close total returns incl. overnight, dividends and delistings), so (b) is exactly the target's construction on the days before the origin (our design). Variants pre-registered: (a) with T_w = 1,260 (full rank at p ≈ 500; the history every member has, G10) as the primary NLL comparator, and T_w ∈ {21, 63, 252} as sensitivities; (b) the 'persistence floor' for GMV and calibration: days −4..0 with divisor 5 at the close-of-day-0 origin, and days −6..−1 with divisor 6 at the close-of-day −1 origin, mirroring each origin's target (our choice). The forecast for the target days is the matrix itself (per-day scale). Recomputed at every origin from its own lookback; no trained parameters, so the G6 refit calendar does not apply (walk_forward). Repair: the shared rule (G12: symmetrise, floor eigenvalues at ε times the mean eigenvalue tr(Σ̂)/p, ε frozen once on pre-2022 validation) is applied before both NLL and GMV, so GMV weights use the same repaired matrix (no separate pseudo-inverse). Missing data (G10): every member has at least 1,229 non-missing returns in the 1,260 trading days ending at its formation date; any missing day inside a window (halts) is 0, identically for every model (De Nard+ 2021 likewise allow up to 2.5% missing set to zero); dropping a member, shortening one stock's window, pairwise-complete estimation or model-specific imputation is not allowed. A non-finite forecast or failed Cholesky after repair is a failure (G13): logged, never replaced; as the reference arm it removes that origin from that contrast only, with counts disclosed. Not a member of the H1 strong set (G4)."
  inputs: ["daily returns over the window ending at the origin close", "T_w", "ε"]
  guards_against: "Gains that a plain 'tomorrow looks like last week' forecast already delivers; persistence dominates short-horizon risk."
  typical_values: "S11 (14 ETFs, 2021–2023, long-only GMV variance): naive lagged 20-day covariance lowest at daily rebalancing, 0.001991 vs DCC-NL 0.002048 and CAB 0.002293; full-sample covariance lowest at monthly rebalancing, 0.002461; naive Frobenius ×10^5 82.020 vs DCC 74.716. S12 Table 1 (n = 300, long-short): MLE 5-day variance 0.0168 vs NN 0.0149; long-only vol 14.2%. S2: lag-1 persistence R² 0.97 (RV21) and 0.96 (PC1 share) for market descriptors. S16 (BTC/ETH, Mar 2021–Jun 2026): trailing realized vol IC +0.549 vs DVOL +0.671 for forward 30-day RV."
  pitfalls: "(1) Variant (b) has rank ≤ 5, and windows shorter than p are singular, so their NLL is mostly set by the repair; report the floored share. (2) S11 uses a demeaned 1/(F−1) estimator on 14 ETFs, where n < T; its results do not transfer to p ≈ 500. (3) Complete-history filters look ahead (De Nard+ 2021 call theirs infeasible in real life). (4) Very long windows lag regime changes."
