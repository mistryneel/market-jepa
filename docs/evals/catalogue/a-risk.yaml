- id: "ewma_riskmetrics"
  name: "EWMA / RiskMetrics covariance (RiskMetrics λ = 0.94 and a validation-tuned λ)"
  category: "baseline"
  section: "A"
  status: "canonical"
  status_note: "Canonical (G14; RiskMetrics 1996 technical document, chapter 5 read: original definition). S4 is not a user (it uses EWMA only inside its own factor covariance; review audit_A#11). S11's EWMA is a non-standard variant. The tuned EWMA is a member of the H1 strong set and anchors its NLL margin (G4), and the shared PD-repair ε is chosen on it (G12). Status, priority and section unchanged."
  priority: "must"
  plain_english: "Estimates tomorrow's covariance as a weighted average of past daily return co-movements, with weights that fall by 6% per day, so recent days matter most. It is the classic cheap risk-model baseline."
  formula: '\Sigma_{t+1|t}=\lambda\Sigma_{t|t-1}+(1-\lambda)r_tr_t''\ (\text{RiskMetrics recursion});\quad \hat\Sigma_{t+1|t}=\alpha\sum_{\tau=t-549}^{t}\lambda^{t-\tau}r_\tau r_\tau'',\ \alpha=\frac{1-\lambda}{1-\lambda^{550}}\ (\text{computed form});\quad \Sigma_{t+h|t}=h\,\Sigma_{t+1|t}\ \Rightarrow\ \hat\Sigma^{(1:h)}_t=\hat\Sigma_{t+1|t}\ (h=5;\ h=6\text{ at the close-of-day }-1\text{ origin});\quad \lambda\in\{0.94,0.96,0.97,0.98,0.99\},\ H_{1/2}=\frac{\log0.5}{\log\lambda}'
  conventions: "Zero mean (RiskMetrics sets the mean return to zero); one λ for the whole matrix; returns are the target's daily close-to-close simple returns in decimals. Computation: for every λ, the normalised weighted sum over the 550 trading days ending at the origin close (formula), the finite-sample form of Johansson+ 2023 eq. 2.1 (equation number from the arXiv version, G15) with indices shifted so the forecast uses returns up to the origin close; the recursion started from 0 at the window start equals (1 − λ^550) times it, a relative 0.94^550 ≈ 2e−15 at λ = 0.94 but larger as λ approaches 1 (our arithmetic), so compute the sum. Window: 550 days, the length RiskMetrics uses in production; it lies inside the 1,260-day history every member has, and missing days inside it are 0 (G10). Horizon: RiskMetrics scales the one-day matrix by h, so the per-day forecast for days 1–5 (days 0–5 at the close-of-day −1 origin) equals the one-day forecast. Variants and roles: (a) λ = 0.94, the RiskMetrics default, untuned and reported descriptively; (b) the tuned EWMA, λ̂ from the declared grid {0.94, 0.96, 0.97, 0.98, 0.99} (our grid; half-lives about 11, 17, 23, 34 and 69 trading days, our arithmetic), is the EWMA member of the H1 strong set S and the EWMA in every comparative test, the MCS and the post-event table; it also anchors the H1 margin δ_NLL, half the mean validation NLL gap between it and the best member of S (G4). Tuning order (G8, G12): on the pre-2022 validation origins of baseline_tuning_parity, compute the mean per-asset NLL for every pair of the λ grid and G12's ε grid {1e-4, 3e-4, 1e-3, 3e-3, 1e-2}; the minimising pair gives λ̂ and ε, so ε minimises the validation NLL of the tuned EWMA, as G12 requires; ε is then frozen for every model before any other model is tuned. Recomputed at every origin from its own lookback; no trained parameters, so the G6 refit calendar does not apply (walk_forward). PD: with about 75 effective returns at 0.94 (RiskMetrics) the matrix is near-singular at p ≈ 500, so the shared repair (floor at ε·tr(Σ̂)/p) largely sets its NLL; report the floored share. A non-finite forecast or failed Cholesky after repair is a failure (G13): logged, never replaced; as the reference arm it removes that origin from that contrast only, with counts disclosed. Do not copy S11's variant, which updates from the lagged realized matrix instead of the previous EWMA."
  inputs: ["daily returns of the origin's asset set over the 550 trading days ending at the origin close", "λ (0.94, or λ̂ tuned jointly with ε on validation)"]
  guards_against: "Taking credit for simple volatility persistence: after an announcement, recent large moves already raise EWMA risk."
  typical_values: "RiskMetrics 1996: λ = 0.94 (daily), 0.97 (monthly); about 75 effective returns at 0.94 and 150 at 0.97; 550 daily returns in production. Engle & Sheppard 2001: RiskMetrics (H_t = 0.06 e e′ + 0.94 H_{t−1}) predicted minimum-variance portfolio variance far too small. S11 (14 ETFs, F = 20, non-standard EWMA): Frobenius ×10^5 75.349 vs DCC 74.716 and CAB 58.923; at F = 10 vech-Euclidean 58.851 vs CCC 58.111 and DCC 62.210."
  pitfalls: "(1) Near-singular at p ≈ 500 (review simulation: condition number about 1e15), so its NLL mostly measures the repair. (2) Square-root-of-time scaling treats variances as non-stationary; RiskMetrics itself warns it misleads under mean reversion. (3) Optimised portfolios built on it understate risk badly (Engle & Sheppard 2001). (4) Variants differ (S11), so state the recursion exactly."
