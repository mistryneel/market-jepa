- id: "event_scaled_baseline"
  name: "Event-scaled baseline: strongest event-blind forecast times per-event-type variance multipliers estimated before 2022"
  category: "baseline"
  section: "A"
  status: "our_design"
  status_note: "Our design (review finding completeness#15), grounded in the documented announcement-day volatility uplift. The construction and the NLL-optimal multiplier are our derivations; the cited effect sizes were checked against their sources. verified = true here records only that every cited source was opened. Priority raised from should to must (review finding dod_status#5): it is the only event-aware control among the baselines, so it shows whether event-input gains exceed a calibrated event multiplier."
  priority: "must"
  plain_english: "Takes the best model that ignores events and simply inflates its predicted risk after each type of announcement by a factor learned from past announcements. Event inputs only add value if they beat this simple adjustment."
  formula: 'a_e=\frac1{n_e}\mathrm{tr}\big((\hat\Sigma^{base}_e)^{-1}\Sigma^*_e\big);\quad \hat m_{k,j}=\arg\min_m\sum_{e\in\mathcal E_{k,j}}\Big[\log m+\frac{a_e}{m}\Big]=\frac1{|\mathcal E_{k,j}|}\sum_{e\in\mathcal E_{k,j}}a_e,\ k\in\{\mathrm{FOMC},\mathrm{CPI},0\};\quad \hat\Sigma^{ES}_e=\hat m_{k(e),j}\hat\Sigma^{base}_e\ \big(\max(\hat m_{\mathrm{FOMC},j},\hat m_{\mathrm{CPI},j})\text{ at a shared CPI and FOMC origin}\big);\quad L(m\hat\Sigma)=L(\hat\Sigma)+\log m+\Big(\frac1m-1\Big)a'
  conventions: "Our design and derivation. Multiplier: for event type k the NLL-optimal common multiplier is the mean of a_e over the estimation events of that type, since d/dm[log m + a/m] = 0 at m = a (our derivation). Base: Σ̂^base = the member of the H1 strong set S (G4: DCC-NL, QIS, the USE4-like factor model, the tuned EWMA) with the lowest mean per-asset NLL on the pre-2022 validation close-of-day-0 event origins, chosen once and frozen (G8); its forecasts at every origin, including past estimation origins, come from its own walk-forward run on the G6 calendar, which therefore starts 2,520 trading days before the first validation refit. Types: FOMC and CPI (scheduled; event_timing_origin). At an origin that is day 0 of both (in the locked window only 2024-06-12; G2) apply max(m̂_FOMC, m̂_CPI) (our rule); in estimation such an origin enters both types' samples, as in the per-type analyses (G2). Another event's day 0 inside an origin's target window is not modelled. Estimation (G6, G7): at each refit date s_j, the set E_{k,j} holds the type-k events whose origin lies in the m = 2,520 trading days before s_j and whose whole target window ends on or before trading day s_j − 5; the multipliers serve every origin in [s_j, s_{j+1}). Ordinary-day multiplier m̂_0: the same estimator over the H1 ordinary-day origins (G4 definition and asset sets) in the same window; it is applied at ordinary and matched non-event origins (event_vs_nonevent_did), so the event effect is m̂_k/m̂_0 (report it) and the event multiplier does not absorb the base model's general miscalibration. Origins: the close-of-day-0 origin (target days 1–5) and the close-of-day −1 origin (days 0–5) have separate multipliers, each estimated on origins of its own timing. Report m̂_k per refit with a month-cluster bootstrap interval (G3: clusters = calendar month of day 0). Sensitivities: multipliers frozen at the first locked-window refit (2022-01-03) and held fixed; separate multipliers for the leading eigen-direction (market mode) and the remainder (our design). PD: the shared repair commutes with positive scaling (our derivation), so m̂ times the repaired base is already repaired; a base failure (G13) at an estimation origin drops that origin from m̂ (logged), and at a test origin is a failure of this baseline. Comparisons with this baseline are descriptive (G5)."
  inputs: ["walk-forward base forecasts at event and ordinary origins from 2,520 trading days before the first validation refit onward", "realized targets Σ* for those origins", "FOMC and CPI calendars (event_timing_origin)", "refit calendar (G6)"]
  guards_against: "Attributing to event inputs a gain that a calibrated 'risk is higher after announcements' adjustment already captures."
  typical_values: "Savor & Wilson 2013 (1958–2009; November 2011 working draft read): daily realized market volatility only about 4% higher on scheduled inflation (CPI to January 1971, then PPI), employment and FOMC announcement days (about 8% in variance, our arithmetic). Bernanke & Kuttner 2005 (June 1989–Dec 2002; FEDS 2004-16 version read): equity returns about 10% more volatile on policy event days. Bollerslev, Li & Xue 2018: announcement-time spot-volatility jumps measured over 30-minute windows against the past 22 non-announcement days. These are day-0 effects; the uplift over days 1–5 after a close-of-day-0 origin is not reported in the sources read."
  pitfalls: "(1) Published uplifts concern day 0, not days 1–5. (2) A multiplier fitted on events also corrects the base model's general bias; compare with m̂_0. (3) Same-day CPI and FOMC origins are rare (one in the locked window, G2), so the max rule is barely exercised. (4) The 2022 tightening regime may differ from earlier events; the six-monthly refits (G6) adapt only with a lag. (5) A scalar multiplier leaves correlations unchanged, whereas announcement shocks move co-movement (S15 reports low-rank covariance jumps in rate futures). (6) An estimation event whose target window ends after s_j − 5, or any human choice informed by test-window results, breaks the lock."
  used_by:
    - ref: "Savor & Wilson 2013"
      title: "How Much Do Investors Care About Macroeconomic Risk? Evidence from Scheduled Economic Announcements"
      authors: "Savor, P., & Wilson, M."
